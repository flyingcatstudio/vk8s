          placements.get(placedNode).push({
            workloadId: w.id, workloadName: w.name,
            namespace: w.namespace || "default", kind: w.kind || "Deployment",
            replicaIdx: i,
            cpuReq, memReq, cpuMax, memMax,
            gpuReq: vramMode ? 0 : gpuCountReq,
            vramReq: vramMode ? vramReq : 0,
            gpuModel, vramMode,
          });
        } else {
          // Build per-worker fail reasons. Distinguish selector/taint blocks (workload
          // can never run here) from resource shortages (could run if freed).
          const perNode = [];
          for (const n of workers) {
            const r = remaining.get(n.id);
            if (!r) continue;
            const fails = [];
            const matchesSel = nodeMatchesSelector(n, w.scheduling?.node_selector);
            const acceptsTaint = nodeAcceptsWorkloadTaints(n, w.scheduling?.tolerations);
            if (!matchesSel) {
              fails.push({ dim: "nodeSelector", have: 0, need: 1, unit: "match" });
            }
            if (!acceptsTaint) {
              fails.push({ dim: "taint", have: 0, need: 1, unit: "tolerate" });
            }
            if (matchesSel && acceptsTaint) {
              if (r.cpu < cpuReq) fails.push({ dim: "cpu", have: r.cpu, need: cpuReq, unit: "c" });
              if (r.mem < memReq) fails.push({ dim: "mem", have: r.mem, need: memReq, unit: "GB" });
              if (vramMode) {
                const availVram = gpuModel ? (r.vramByModel.get(gpuModel) || 0) : r.vram;
                if (availVram < vramReq) {
                  fails.push({ dim: gpuModel ? `${gpuModel} VRAM` : "VRAM", have: availVram, need: vramReq, unit: "GB" });
                }
              } else {
                if (r.gpu < gpuCountReq) fails.push({ dim: "gpu", have: r.gpu, need: gpuCountReq, unit: "" });
                if (gpuModel && (r.gpuByModel.get(gpuModel) || 0) < gpuCountReq) {
                  fails.push({ dim: gpuModel, have: r.gpuByModel.get(gpuModel) || 0, need: gpuCountReq, unit: "" });
                }
              }
              if (isDaemonSet && placedByNode.has(n.id)) {
                fails.push({ dim: "DaemonSet-dup", have: 1, need: 0, unit: "" });
              }
            }
            perNode.push({ nodeId: n.id, nodeName: n.name, fails });
          }
          unscheduled.push({
            workloadId: w.id, workloadName: w.name,
            namespace: w.namespace || "default", kind: w.kind || "Deployment",
            replicaIdx: i,
            clusterId: c.id, clusterName: c.name,
            reqs: {
              cpu: cpuReq, mem: memReq,
              gpu: vramMode ? 0 : gpuCountReq,
              vram: vramMode ? vramReq : 0,
              gpuModel, vramMode,
            },
            perNode,
          });
        }
      }

      // ---- Quorum pods (Sentinel / arbiter / etc.) ----
      // Separate from data pods because they're light-weight (typical Sentinel: ~100m CPU,
      // ~128Mi RAM). Anti-affinity still applies — they should spread across nodes/zones too.
      const quorumCount = w.ha?.quorum_count || 0;
      if (quorumCount > 0 && !isDaemonSet) {
        const qCpu = HA_QUORUM_POD_CPU;
        const qMem = HA_QUORUM_POD_MEM_GB;
        for (let qi = 0; qi < quorumCount; qi++) {
          let qPool = eligibleAll;
          if (aa === "spread-by-node") {
            qPool = [...qPool].sort((a, b) =>
              (placedByNode.get(a.id) || 0) - (placedByNode.get(b.id) || 0));
          } else if (aa === "spread-by-zone") {
            const zc = new Map();
            for (const [nid, count] of placedByNode) {
              const node = workers.find(x => x.id === nid);
              const z = zoneOf(node);
              zc.set(z, (zc.get(z) || 0) + count);
            }
            qPool = [...qPool].sort((a, b) =>
              (zc.get(zoneOf(a)) || 0) - (zc.get(zoneOf(b)) || 0));
          }
          let placedNode = null;
          for (const n of qPool) {
            const r = remaining.get(n.id);
            if (!r) continue;
            if (r.cpu < qCpu || r.mem < qMem) continue;
            r.cpu -= qCpu; r.mem -= qMem;
            placedNode = n.id;
            break;
          }
          if (placedNode) {
            placedByNode.set(placedNode, (placedByNode.get(placedNode) || 0) + 1);
            if (!placements.has(placedNode)) placements.set(placedNode, []);
            placements.get(placedNode).push({
              workloadId: w.id, workloadName: w.name + " (quorum)",
              namespace: w.namespace || "default", kind: "Quorum",
              replicaIdx: qi,
              cpuReq: qCpu, memReq: qMem, cpuMax: qCpu, memMax: qMem,
              gpuReq: 0, vramReq: 0, gpuModel: undefined, vramMode: false,
            });
          } else {
            unscheduled.push({
              workloadId: w.id, workloadName: w.name + " (quorum)",
              namespace: w.namespace || "default", kind: "Quorum",
              replicaIdx: qi,
              clusterId: c.id, clusterName: c.name,
              reqs: { cpu: qCpu, mem: qMem, gpu: 0, vram: 0, vramMode: false },
              perNode: [],
            });
          }
        }
      }
    }
  }
  return { placements, unscheduled };
}

//============ Render: Capacity view ============
function renderCapacity() {
  const root = $("#viewBody");
  root.innerHTML = "";
  const p = state.project;
  if (!p) return;
  const clusters = p.clusters || [];
  if (!clusters.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⌘"]),
      el("h2", {}, ["Capacity 뷰"]),
      el("p", {}, ["클러스터에 노드와 워크로드가 있어야 의미 있는 결과가 나옵니다."]),
    ]));
    return;
  }
  const gpuModels = state.catalog.gpuModels;
  const sim = simulateScheduling(p);
  // DaemonSet plans 1 pod per eligible worker, not w.replicas — so derive totals from
  // the simulator's own output instead of summing replicas directly.
  const placedPods = [...sim.placements.values()].reduce((a, arr) => a + arr.length, 0);
  const totalPods = placedPods + sim.unscheduled.length;

  // View-local toggle: per-namespace breakdown vs per-node simulation.
  if (state.ui.capacityNsBreakdown == null) state.ui.capacityNsBreakdown = false;
  const nsMode = state.ui.capacityNsBreakdown;

  // Toolbar with the toggle.
  const toolbar = el("div", {
    style: { display: "flex", alignItems: "center", gap: "12px", marginBottom: "12px", flexWrap: "wrap" },
  });
  toolbar.appendChild(el("span", {
    style: { fontSize: "11px", color: "var(--text2)", letterSpacing: "0.05em", textTransform: "uppercase", fontWeight: 600 },
  }, ["View"]));
  const mkModeTab = (id, label) => el("button", {
    class: "view-tab" + ((id === "ns" ? nsMode : !nsMode) ? " active" : ""),
    style: { padding: "4px 10px", fontSize: "11px" },
    onclick: () => { state.ui.capacityNsBreakdown = (id === "ns"); emit(); },
  }, [label]);
  toolbar.appendChild(mkModeTab("node", "Cluster (scheduling)"));
  toolbar.appendChild(mkModeTab("ns", "Per-namespace (quota)"));
  root.appendChild(toolbar);

  // Top summary
  const summary = el("div", { class: "next-hint" }, [
    el("span", { class: "icon" }, ["⎈"]),
    el("div", { class: "body" }, [
      el("div", { class: "head" }, [
        nsMode ? "Namespace 별 요청 합산 vs ResourceQuota" : "Scheduling simulation (first-fit) ",
        helpIcon("view.capacity"),
      ]),
      el("div", { class: "lead" }, nsMode
        ? [
            `${clusters.length} cluster · ${clusters.reduce((a, c) => a + (c.namespaces || []).length, 0)} namespaces`,
            el("span", { style: { color: "var(--text3)", marginLeft: "10px", fontSize: "11px" } },
              ["ns 옆 'set quota'를 눌러 한도 설정 — 한도 미설정 시 cluster total 대비 비율 표시"]),
          ]
        : [
            `${placedPods}/${totalPods} pods placed`,
            sim.unscheduled.length
              ? el("span", { style: { color: "var(--red)", marginLeft: "10px" } }, [`⊗ ${sim.unscheduled.length} unschedulable`])
              : el("span", { style: { color: "var(--green)", marginLeft: "10px" } }, ["✓ all placed"]),
          ]),
    ]),
  ]);
  root.appendChild(summary);

  for (const c of clusters) {
    root.appendChild(nsMode
      ? renderCapacityNsCluster(c, p, gpuModels)
      : renderCapacityCluster(c, sim, p, gpuModels));
  }
  // Unschedulable card belongs to per-node simulation mode only.
  if (!nsMode && sim.unscheduled.length) {
    root.appendChild(renderUnscheduled(sim.unscheduled));
  }
}

// Per-namespace usage card (used when capacityNsBreakdown toggle is on).
// Aggregates each workload's requested CPU/Memory/GPU × replicas into its namespace bucket,
// and compares to ns.resource_quota when set (otherwise against cluster worker totals).
function renderCapacityNsCluster(c, project, gpuModels) {
  // 1) Aggregate by namespace.
  //    Each cell tracks two end-points of the consumption range:
  //      • `cpu`     = baseline = sum(min_replicas × cpu_request)   — guaranteed at idle
  //      • `cpuMax`  = peak     = sum(max_replicas × cpu_limit)     — absolute worst case
  //    Same convention for mem/vram. GPU is measured as VRAM (GB) only.
  const byNs = new Map();
  for (const w of c.workloads || []) {
    const ns = w.namespace || "default";
    const reqs = w.resources?.requests || {};
    const rMin = replicasMin(w);
    const rMax = replicasMax(w);
    const cur = byNs.get(ns) || {
      name: ns,
      cpu: 0, cpuMax: 0,
      mem: 0, memMax: 0,
      vram: 0, vramMax: 0,
      podsMin: 0, podsMax: 0, wlCount: 0,
    };
    cur.cpu    += (reqs.cpu || 0) * rMin;
    cur.cpuMax += workloadLimit(w, "cpu") * rMax;
    cur.mem    += (reqs.memory_gb || 0) * rMin;
    cur.memMax += workloadLimit(w, "memory_gb") * rMax;
    // VRAM (single dimension — no separate request/limit in K8s GPU model).
    let perPodVram = 0;
    if (reqs.gpu?.vram_gb) {
      perPodVram = reqs.gpu.vram_gb || 0;
    } else if (reqs.gpu?.count && reqs.gpu?.model) {
      perPodVram = (reqs.gpu.count || 0) * (gpuModels[reqs.gpu.model]?.vram_gb || 0);
    }
    cur.vram    += perPodVram * rMin;
    cur.vramMax += perPodVram * rMax;
    cur.podsMin += rMin;
    cur.podsMax += rMax;
    cur.wlCount += 1;
    byNs.set(ns, cur);
  }
  // Include declared namespaces even when empty (so quotas are visible).
  for (const ns of (c.namespaces || [])) {
    if (!byNs.has(ns.name)) {
      byNs.set(ns.name, {
        name: ns.name, cpu: 0, cpuMax: 0, mem: 0, memMax: 0,
        vram: 0, vramMax: 0, podsMin: 0, podsMax: 0, wlCount: 0,
      });
    }
  }

  // 2) Cluster worker totals (used as reference when a quota is missing).
  const workers = (c.node_ids || []).map(id => project.nodes.find(n => n.id === id))
    .filter(n => n && (n.cluster_roles || []).includes("worker"));
  const totCpu  = workers.reduce((a, n) => a + (n.spec?.vcpu || 0), 0);
  const totMem  = workers.reduce((a, n) => a + (n.spec?.memory_gb || 0), 0);
  const totVram = workers.reduce((a, n) => a + (n.spec?.gpu || []).reduce((aa, g) =>
    aa + (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0), 0), 0);

  const card = el("div", { class: "topo-site" });
  card.appendChild(el("div", { class: "topo-site-header" }, [
    el("span", { class: "name" }, [c.name]),
    el("span", {
      class: "kind",
      style: { background: "rgba(167,139,250,.15)", color: "var(--purple)" },
    }, ["cluster"]),
    el("span", { class: "region" }, [
      `${byNs.size} namespaces · ${(c.workloads || []).length} workloads`,
    ]),
  ]));
  card.appendChild(el("div", {
    style: { padding: "8px 14px 0", fontSize: "11px", color: "var(--text2)", fontFamily: "JetBrains Mono" },
  }, [`worker total: ${totCpu}c · ${totMem}GB${totVram ? ` · ${totVram}GB VRAM` : ""}`]));

  // 3) Per-namespace rows (sorted by requested CPU desc).
  const nsList = [...byNs.values()].sort((a, b) => b.cpu - a.cpu || a.name.localeCompare(b.name));
  const wrap = el("div", { style: { padding: "8px 14px 12px" } });
  for (const nsInfo of nsList) {
    const nsDef = (c.namespaces || []).find(x => x.name === nsInfo.name);
    const q = nsDef?.resource_quota || {};
    const hasQuota = ["cpu", "memory_gb", "gpu", "max_pods"].some(k => q[k] != null);

    const row = el("div", {
      style: { padding: "10px 0", borderTop: "1px solid var(--border)" },
    });
    const head = el("div", {
      style: { display: "flex", alignItems: "baseline", gap: "10px", marginBottom: "6px" },
    });
    head.appendChild(el("span", { style: { fontWeight: 600, color: "var(--text)" } }, [nsInfo.name]));
    // Pod count: show min~max range when they differ (HPA / replicas_max set).
    const podsLabel = nsInfo.podsMin === nsInfo.podsMax
      ? `${nsInfo.wlCount}w · ${nsInfo.podsMin}p`
      : `${nsInfo.wlCount}w · ${nsInfo.podsMin}~${nsInfo.podsMax}p`;
    head.appendChild(el("span", {
      style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" },
    }, [podsLabel]));
    if (q.max_pods != null) {
      // Quota check is against peak (max replicas) — worst case must still fit.
      const over = nsInfo.podsMax > q.max_pods;
      head.appendChild(el("span", {
        style: { fontSize: "10px", color: over ? "var(--red)" : "var(--text3)", fontFamily: "JetBrains Mono" },
      }, [`pods ${nsInfo.podsMax}/${q.max_pods}${over ? " ▲" : ""}`]));
    }
    head.appendChild(el("span", { style: { flex: 1 } }, []));
    head.appendChild(el("button", {
      style: {
        fontSize: "10px", color: hasQuota ? "var(--purple)" : "var(--text2)",
        background: hasQuota ? "rgba(167,139,250,.10)" : "var(--surface2)",
        border: "1px solid " + (hasQuota ? "rgba(167,139,250,.25)" : "var(--border)"),
        borderRadius: "4px", padding: "2px 8px", cursor: "pointer", fontFamily: "JetBrains Mono",
      },
      onclick: e => { e.stopPropagation(); openEditNamespace(c.id, nsInfo.name); },
    }, [hasQuota ? "⚙ edit quota" : "+ set quota"]));
    row.appendChild(head);

    const bars = el("div", {
      style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4px 16px" },
    });
    // Each bar shows the consumption range:
    //   underlay (lighter) = max · limit  — absolute peak (HPA scaled-out + bursting)
    //   overlay  (solid)   = min · req    — baseline (always committed)
    // Severity color follows the peak (pctMax) so overflow is visible even when the baseline still fits.
    // CPU
    {
      const limit = q.cpu;
      const denom = limit != null ? limit : totCpu;
      const pctReq = denom > 0 ? (nsInfo.cpu    / denom * 100) : 0;
      const pctMax = denom > 0 ? (nsInfo.cpuMax / denom * 100) : 0;
      const refTxt = limit != null ? `${limit}c quota` : `${totCpu}c cluster`;
      const txt = `${nsInfo.cpu.toFixed(1)} (min·req) · ${nsInfo.cpuMax.toFixed(1)} (max·limit) / ${refTxt}`;
      bars.appendChild(makeBarLineDual("CPU", txt, pctReq, pctMax));
    }
    // Memory
    {
      const limit = q.memory_gb;
      const denom = limit != null ? limit : totMem;
      const pctReq = denom > 0 ? (nsInfo.mem    / denom * 100) : 0;
      const pctMax = denom > 0 ? (nsInfo.memMax / denom * 100) : 0;
      const refTxt = limit != null ? `${limit}GB quota` : `${totMem}GB cluster`;
      const txt = `${nsInfo.mem.toFixed(0)} (min·req) · ${nsInfo.memMax.toFixed(0)} (max·limit) / ${refTxt}`;
      bars.appendChild(makeBarLineDual("Memory", txt, pctReq, pctMax));
    }
    // VRAM — GPU axis. Dual when peak differs from baseline (replicas_max > replicas).
    if (nsInfo.vram > 0 || nsInfo.vramMax > 0) {
      const pctMin = totVram > 0 ? (nsInfo.vram    / totVram * 100) : 0;
      const pctMax = totVram > 0 ? (nsInfo.vramMax / totVram * 100) : 0;
      const txt = (nsInfo.vramMax > nsInfo.vram)
        ? `${nsInfo.vram.toFixed(0)} (min) · ${nsInfo.vramMax.toFixed(0)} (max) GB of ${totVram}GB`
        : `${nsInfo.vram.toFixed(0)}GB of ${totVram}GB`;
      bars.appendChild(makeBarLineDual("VRAM", txt, pctMin, pctMax));
    }
    row.appendChild(bars);
    wrap.appendChild(row);
  }
  card.appendChild(wrap);
  return card;
}

function renderCapacityCluster(c, sim, project, gpuModels) {
  const card = el("div", { class: "topo-site" });
  const allNodes = (c.node_ids || []).map(id => project.nodes.find(n => n.id === id)).filter(Boolean);
  const workers = allNodes.filter(n => (n.cluster_roles || []).includes("worker"));
  const cpOnly = allNodes.filter(n => (n.cluster_roles || []).length > 0 && !(n.cluster_roles || []).includes("worker"));

  card.appendChild(el("div", { class: "topo-site-header" }, [
    el("span", { class: "name" }, [c.name]),
    el("span", {
      class: "kind",
      style: { background: "rgba(167,139,250,.15)", color: "var(--purple)" },
    }, ["cluster"]),
    el("span", { class: "region" }, [
      `${workers.length} worker · ${cpOnly.length} cp-only · ${(c.workloads || []).length} workloads`,
    ]),
  ]));

  // ── Cluster capacity totals (above workloads) ──
  // Sums across all worker nodes. A first-fit simulator tends to stuff everything on the
  // first node and leave others empty, which is misleading for capacity planning. The
  // cluster total view side-steps that artifact: what matters is whether the total demand
  // fits inside the total supply.
  if (workers.length) {
    const totCpu  = workers.reduce((a, n) => a + (n.spec?.vcpu || 0), 0);
    const totMem  = workers.reduce((a, n) => a + (n.spec?.memory_gb || 0), 0);
    const totVram = workers.reduce((a, n) =>
      a + (n.spec?.gpu || []).reduce((aa, g) =>
        aa + (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0), 0), 0);
    const totPsu   = workers.reduce((a, n) => a + (n.spec?.power?.psu_max_w || 0), 0);
    const totPower = workers.reduce((a, n) => a + computeNodePowerW(n, gpuModels), 0);

    let usedCpuReq = 0, usedCpuMax = 0, usedMemReq = 0, usedMemMax = 0, usedVram = 0;
    let placedPods = 0;
    for (const wkr of workers) {
      const placed = sim.placements.get(wkr.id) || [];
      placedPods += placed.length;
      usedCpuReq += placed.reduce((a, p) => a + p.cpuReq, 0);
      usedCpuMax += placed.reduce((a, p) => a + (p.cpuMax != null ? p.cpuMax : p.cpuReq * 2), 0);
      usedMemReq += placed.reduce((a, p) => a + p.memReq, 0);
      usedMemMax += placed.reduce((a, p) => a + (p.memMax != null ? p.memMax : p.memReq * 2), 0);
      usedVram   += placed.reduce((a, p) => {
        if (p.vramMode) return a + (p.vramReq || 0);
        return a + (p.gpuModel ? (gpuModels[p.gpuModel]?.vram_gb || 0) * (p.gpuReq || 0) : 0);
      }, 0);
    }
    const totWorkers = workers.length;

    const capBox = el("div", {
      style: { padding: "10px 14px", borderBottom: "1px solid var(--border)" },
    });
    capBox.appendChild(el("div", {
      style: {
        fontSize: "10px", color: "var(--text2)",
        textTransform: "uppercase", letterSpacing: "0.05em",
        marginBottom: "6px", fontWeight: 600,
      },
    }, [`Cluster capacity — ${totWorkers} worker${totWorkers > 1 ? "s" : ""} · ${placedPods} pods placed`]));
    capBox.appendChild(el("div", {
      style: { fontSize: "11px", color: "var(--text3)", fontFamily: "JetBrains Mono", marginBottom: "8px" },
    }, [`총 ${totCpu}c · ${totMem}GB${totVram ? ` · ${totVram}GB VRAM` : ""}${totPsu ? ` · PSU ${totPsu}W` : ""}`]));

    const capBars = el("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px 16px" } });
    {
      const pctReq = totCpu > 0 ? usedCpuReq / totCpu * 100 : 0;
      const pctMax = totCpu > 0 ? usedCpuMax / totCpu * 100 : 0;
      capBars.appendChild(makeBarLineDual(
        "CPU",
        `${usedCpuReq.toFixed(1)} req · ${usedCpuMax.toFixed(1)} max / ${totCpu}c`,
        pctReq, pctMax));
    }
    {
      const pctReq = totMem > 0 ? usedMemReq / totMem * 100 : 0;
      const pctMax = totMem > 0 ? usedMemMax / totMem * 100 : 0;
      capBars.appendChild(makeBarLineDual(
        "Memory",
        `${usedMemReq.toFixed(0)} req · ${usedMemMax.toFixed(0)} max / ${totMem}GB`,
        pctReq, pctMax));
    }
    if (totVram > 0) {
      capBars.appendChild(makeBarLine("VRAM",
        `${usedVram.toFixed(0)}/${totVram} GB`,
        usedVram / totVram * 100));
    }
    if (totPsu > 0) {
      capBars.appendChild(makeBarLine("PSU",
        `${totPower}/${totPsu} W`,
        totPower / totPsu * 100));
    }
    capBox.appendChild(capBars);
    card.appendChild(capBox);
  }

  // ── Cluster-level workload section ──
  // Workloads are declared against the cluster (K8s model). Each row shows where the
  // simulator placed its replicas (inline), so the per-node breakdown stays attached to
  // the workload entity instead of having its own card stack.
  const wls = c.workloads || [];
  if (wls.length) {
    // Per-workload placement map: workloadId → { nodeName → count }.
    // Built once from the simulator output so each row can inline its placement compactly.
    const placementByWl = new Map();
    for (const [nodeId, arr] of sim.placements) {
      const node = (project.nodes || []).find(x => x.id === nodeId);
      const nodeName = node?.name || nodeId;
      for (const p of arr) {
        if (!placementByWl.has(p.workloadId)) placementByWl.set(p.workloadId, new Map());
        const m = placementByWl.get(p.workloadId);
        m.set(nodeName, (m.get(nodeName) || 0) + 1);
      }
    }

    const wlBox = el("div", {
      style: {
        padding: "10px 14px",
        borderBottom: "1px solid var(--border)",
        background: "var(--surface)",
      },
    });
    wlBox.appendChild(el("div", {
      style: {
        fontSize: "10px", color: "var(--text2)",
        textTransform: "uppercase", letterSpacing: "0.05em",
        marginBottom: "6px", fontWeight: 600,
      },
    }, [`Workloads (declared at cluster — ${wls.length})`]));
    const kindShort = (k) => ({
      Deployment: "Deploy", StatefulSet: "SS", DaemonSet: "DS",
      Job: "Job", CronJob: "Cron",
    }[k] || k || "Deploy");
    for (const w of wls) {
      const rMin = replicasMin(w), rMax = replicasMax(w);
      const repTxt = rMax > rMin ? `× ${rMin}~${rMax}` : `× ${rMin}`;
      const reqs = w.resources?.requests || {};
      const cpu = reqs.cpu || 0, mem = reqs.memory_gb || 0;
      const vramPerPod = reqs.gpu?.vram_gb
        || ((reqs.gpu?.count || 0) * (gpuModels[reqs.gpu?.model]?.vram_gb || 0));
      const detailParts = [];
      if (cpu) detailParts.push(`${(cpu * rMin).toFixed(1)}c`);
      if (mem) detailParts.push(`${(mem * rMin).toFixed(0)}GB`);
      if (vramPerPod) detailParts.push(`${(vramPerPod * rMin).toFixed(0)}GB VRAM`);

      // Inline placement: which node(s) the simulator placed this workload's pods on.
      const pmap = placementByWl.get(w.id);
      const placedHere = pmap ? [...pmap.entries()] : [];
      const placedTotal = placedHere.reduce((a, [, n]) => a + n, 0);
      // Expected pod count factored in DaemonSet semantics (sim already did this).
      const expected = w.kind === "DaemonSet"
        ? eligibleWorkersFor(w, workers).length
        : rMin;
      const placeTxt = placedHere.length
        ? `→ ${placedHere.map(([nm, n]) => `${nm}×${n}`).join(", ")}${placedTotal < expected ? ` · ⊗ ${expected - placedTotal} unscheduled` : ""}`
        : (expected > 0 ? `→ ⊗ ${expected} unscheduled` : "");

      wlBox.appendChild(el("div", {
        style: {
          display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap",
          padding: "3px 0", cursor: "pointer", fontSize: "11px", color: "var(--text2)",
        },
        onclick: () => selectEntity("workload", w.id),
      }, [
        el("span", {}, [`◇ ${w.namespace || "default"}/${w.name}`]),
        el("span", {
          style: { color: "var(--text3)", fontFamily: "JetBrains Mono", fontSize: "10px" },
        }, [` ${repTxt} · ${kindShort(w.kind)}`]),
        el("span", {
          style: {
            color: placedTotal < expected ? "var(--red)" : "var(--text3)",
            fontFamily: "JetBrains Mono", fontSize: "10px", marginLeft: "8px",
          },
        }, [placeTxt]),
        el("span", {
          style: { color: "var(--text3)", marginLeft: "auto", fontFamily: "JetBrains Mono", fontSize: "10px" },
        }, [detailParts.length ? `min req: ${detailParts.join(" · ")}` : ""]),
      ]));
    }
    card.appendChild(wlBox);
  }

  if (!workers.length) {
    card.appendChild(el("div", { class: "topo-empty-site" }, ["worker 노드 없음 — 워크로드 스케줄 불가"]));
    return card;
  }
  // (Per-node breakdown removed: first-fit makes node-level numbers misleading; the
  // cluster-total bars above represent the real capacity question, and per-replica
  // placement is shown inline on each workload row in the WORKLOADS section.)
  return card;
}

function renderCapacityNode(n, sim, gpuModels) {
  const placed = sim.placements.get(n.id) || [];
  const usedCpuReq = placed.reduce((a, p) => a + p.cpuReq, 0);
  const usedCpuMax = placed.reduce((a, p) => a + (p.cpuMax != null ? p.cpuMax : p.cpuReq * 2), 0);
  const usedMemReq = placed.reduce((a, p) => a + p.memReq, 0);
  const usedMemMax = placed.reduce((a, p) => a + (p.memMax != null ? p.memMax : p.memReq * 2), 0);
  // VRAM-only GPU accounting: explicit vram_gb for VRAM-mode workloads, or derived
  // from count × per-card VRAM for legacy count-mode workloads (when model is known).
  const usedVram = placed.reduce((a, p) => {
    if (p.vramMode) return a + (p.vramReq || 0);
    return a + (p.gpuModel ? (gpuModels[p.gpuModel]?.vram_gb || 0) * (p.gpuReq || 0) : 0);
  }, 0);

  const totCpu = n.spec?.vcpu || 0;
  const totMem = n.spec?.memory_gb || 0;
  const gpus = n.spec?.gpu || [];
  const totVram = gpus.reduce((a, g) => a + (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0), 0);
  const psuMax = n.spec?.power?.psu_max_w || 0;
  const power = computeNodePowerW(n, gpuModels);
  const roleStr = (n.cluster_roles || []).map(r => r === "control-plane" ? "cp" : r).join("+") || "no-role";

  const card = el("div", {
    class: "topo-node",
    style: { cursor: "pointer" },
    onclick: () => selectEntity("node", n.id),
  });
  card.appendChild(el("div", { class: "node-name" }, [n.name]));
  card.appendChild(el("div", { class: "node-model" }, [
    `${n.brand} · ${n.model} · ${n.spec?.form_factor || ""} · ${roleStr}`,
  ]));

  const bars = el("div", {
    style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px 16px", marginTop: "10px" },
  });
  // CPU — req (guaranteed) + max (limit, worst-case). Severity color driven by max.
  {
    const pctReq = totCpu > 0 ? usedCpuReq / totCpu * 100 : 0;
    const pctMax = totCpu > 0 ? usedCpuMax / totCpu * 100 : 0;
    const txt = `${usedCpuReq.toFixed(1)} req · ${usedCpuMax.toFixed(1)} max / ${totCpu}c`;
    bars.appendChild(makeBarLineDual("CPU", txt, pctReq, pctMax));
  }
  // Memory — same dual treatment
  {
    const pctReq = totMem > 0 ? usedMemReq / totMem * 100 : 0;
    const pctMax = totMem > 0 ? usedMemMax / totMem * 100 : 0;
    const txt = `${usedMemReq.toFixed(0)} req · ${usedMemMax.toFixed(0)} max / ${totMem}GB`;
    bars.appendChild(makeBarLineDual("Memory", txt, pctReq, pctMax));
  }
  // GPU is tracked by VRAM only — workloads consume VRAM from the node's GPU pool,
  // GPU count is not a scheduling axis (operationally we allocate by VRAM, not card count).
  if (totVram > 0) {
    bars.appendChild(makeBarLine("VRAM", `${usedVram}/${totVram} GB`, usedVram / totVram * 100));
  }
  if (n.source === "onprem" && psuMax > 0) {
    bars.appendChild(makeBarLine("PSU", `${power}/${psuMax} W`, power / psuMax * 100));
  }
  card.appendChild(bars);

  // Pod count summary only — workload list lives at the cluster level (above).
  // Per-workload placement appears inline on each cluster-level workload row.
  if (placed.length) {
    const distinctWls = new Set(placed.map(p => p.workloadId)).size;
    card.appendChild(el("div", {
      style: {
        marginTop: "10px", padding: "6px 10px", background: "var(--bg)", borderRadius: "5px",
        fontSize: "10px", color: "var(--text2)", fontFamily: "JetBrains Mono",
        textAlign: "center",
      },
      title: "워크로드는 cluster 소속. 어떤 워크로드의 어느 replica가 이 노드에 배정됐는지는 위쪽 cluster 워크로드 목록의 placement 표시에서 확인",
    }, [`${placed.length} pods · ${distinctWls} workloads (sim)`]));
  } else {
    card.appendChild(el("div", {
      style: { marginTop: "10px", color: "var(--text3)", fontSize: "11px", fontStyle: "italic", textAlign: "center", padding: "6px" },
    }, ["할당된 pod 없음"]));
  }

  return card;
}

function renderUnscheduled(list) {

    card.appendChild(row);
  }
  return card;
}

//============ Unified node color standard (shared by Architecture & Dependency) ============
// One source of truth so a workload is the same colour on every screen and in exports.
// Two modes (toggled via state.ui.colorBy):
//============ HA topology (stateful workloads: DB / Cache / Queue) ============
// Shared by the workload inspector, the validator, the capacity sim, and the YAML/Helm export
// so every place reads the same operational meaning instead of guessing from `replicas` alone.
//   none             — single instance, no failover
//   primary-replica  — 1 primary + N read replicas (classic Postgres pattern)
//   sentinel         — primary + replicas with a separate quorum (Redis Sentinel, MongoDB ReplicaSet+arbiter)
//   sharded-cluster  — N shards × (primary + replica per shard) (Redis Cluster, MongoDB sharded, Cassandra)
const HA_STATEFUL_CATS = new Set(["DB", "Cache", "Queue"]);
const HA_MODES = [
  { v: "none",            label: "None — 단일 인스턴스 (HA 없음)" },
  { v: "primary-replica", label: "Primary-Replica — 1 primary + N replica (Postgres 류)" },
  { v: "sentinel",        label: "Sentinel — primary + replicas + 별도 quorum (Redis Sentinel)" },
  { v: "sharded-cluster", label: "Sharded Cluster — N shard × (primary+replica) (Redis Cluster, MongoDB)" },
];
const HA_DEFAULTS = {
  "none":             { primaries: 1, replicas_per_primary: 0, quorum_count: 0 },
  "primary-replica":  { primaries: 1, replicas_per_primary: 2, quorum_count: 0 },
  "sentinel":         { primaries: 1, replicas_per_primary: 2, quorum_count: 3 },
  "sharded-cluster":  { primaries: 3, replicas_per_primary: 1, quorum_count: 0 },
};
// Free-text field with these suggestions so reviewers can see at a glance which Operator/Chart
// is intended. Not used by the sim — just documentation that survives export round-trips.
const HA_OPERATORS = [
  "cloudnative-pg", "zalando-postgres-operator", "bitnami-postgresql-ha", "crunchy-data-pgo",
  "bitnami-redis", "ot-container-kit-redis-operator", "spotahome-redis-operator",
  "strimzi-kafka-operator", "bitnami-kafka",
  "mongodb-community-operator",
  "manual",
];
// Quorum pods (Sentinels, etcd-style arbiters) are intentionally light. Defaults match real
// Sentinel/etcd footprint and are used by the capacity sim when `ha.quorum_count > 0`.
const HA_QUORUM_POD_CPU = 0.1;
const HA_QUORUM_POD_MEM_GB = 0.128;
// Compute data-pod count and quorum count for any workload. Returns { data, quorum, total }.
// data = primaries × (1 + replicas_per_primary), quorum = explicit count (independent pods).
function haPodCounts(w) {
  const ha = w?.ha;
  if (!ha || !ha.mode || ha.mode === "none") return { data: w?.replicas ?? 1, quorum: 0, total: w?.replicas ?? 1 };
  const defs = HA_DEFAULTS[ha.mode] || HA_DEFAULTS["none"];
  const pri = ha.primaries ?? defs.primaries;
  const rpp = ha.replicas_per_primary ?? defs.replicas_per_primary;
  const q   = ha.quorum_count ?? defs.quorum_count;
  return { data: pri * (1 + rpp), quorum: q, total: pri * (1 + rpp) + q };
}

//   "category"  → fixed palette keyed on workload.category (API/WAS, DB/Cache, ML merged).
//   "namespace" → deterministic golden-angle HSL keyed on the *normalised* namespace, so the
//                 same namespace is the same colour everywhere and dev-monitoring == monitoring.
const COLOR_CATEGORY = {
  "Frontend": { fill: "#7d3c98", stroke: "#9b59b6" },
  "API/WAS":  { fill: "#1e6091", stroke: "#2980b9" },
  "ML":       { fill: "#922b21", stroke: "#c0392b" },
  "Video":    { fill: "#943126", stroke: "#cd5c5c" },
  "DB/Cache": { fill: "#1f618d", stroke: "#3498db" },
  "Queue":    { fill: "#117a65", stroke: "#1abc9c" },
  "Batch":    { fill: "#1e8449", stroke: "#27ae60" },
  "Other":    { fill: "#5d6d7e", stroke: "#7f8c8d" },
};
// Map a raw workload.category onto a canonical legend key (synonyms collapse to one colour).
const categoryKeyOf = (cat) => {
  if (cat === "API" || cat === "WAS") return "API/WAS";
  if (cat === "DB" || cat === "Cache") return "DB/Cache";
  if (cat === "ML-Inference" || cat === "ML-Training") return "ML";
  return COLOR_CATEGORY[cat] ? cat : "Other";
};
// Environment prefixes/suffixes stripped before classifying a namespace, so dev-monitoring,
// monitoring-prod, stg_logging … all collapse to their base name. Deliberately excludes short
// ambiguous tokens (pre/prd/tst/sbx) that could mangle real namespace names. Editable.
const NS_ENV_AFFIXES = ["dev", "develop", "development", "prod", "production",
  "stg", "stage", "staging", "test", "qa", "uat", "sit", "perf", "demo", "sandbox", "preprod"];
function nsNormalize(ns) {
  let s = String(ns == null || ns === "" ? "default" : ns).toLowerCase().trim();
  for (const e of NS_ENV_AFFIXES) {        // strip one leading "<env>-" / "<env>_"
    for (const sep of ["-", "_"]) {
      const pre = e + sep;
      if (s.startsWith(pre) && s.length > pre.length) { s = s.slice(pre.length); break; }
    }
  }
  for (const e of NS_ENV_AFFIXES) {        // strip one trailing "-<env>" / "_<env>"
    for (const sep of ["-", "_"]) {
      const suf = sep + e;
      if (s.endsWith(suf) && s.length > suf.length) { s = s.slice(0, -suf.length); break; }
    }
  }
  return s || "default";
}
// Deterministic colour for a normalised namespace string (golden-angle hue, fixed L/S so white
// box text stays legible across all hues — including the yellow band).
function nsColor(normNs) {
  let h = 0;
  for (let i = 0; i < normNs.length; i++) h = (h * 31 + normNs.charCodeAt(i)) >>> 0;
  const hue = Math.round((h * 137.508) % 360);
  return { fill: `hsl(${hue} 50% 36%)`, stroke: `hsl(${hue} 60% 56%)` };
}
// The colour + legend key for a workload under the current mode.
function workloadColorClass(w) {
  if ((state.ui.colorBy || "category") === "namespace") {
    const key = nsNormalize(w.namespace);
    return { key, label: key, ...nsColor(key) };
  }
  const key = categoryKeyOf(w.category);
  return { key, label: key, ...COLOR_CATEGORY[key] };
}
// Legend entries for a set of workloads under the current mode: present-only, de-duplicated,
// stable order (category = palette order; namespace = alphabetical). Used for both the on-screen
// chip row and the legend baked into exports, so they always match.
function legendEntriesFor(workloads) {
  const mode = state.ui.colorBy || "category";
  const seen = new Map();
  for (const w of workloads) {
    const c = workloadColorClass(w);
    if (!seen.has(c.key)) seen.set(c.key, c);
  }
  const entries = [...seen.values()];
  if (mode === "category") {
    const order = Object.keys(COLOR_CATEGORY);
    entries.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  } else {
    entries.sort((a, b) => a.label.localeCompare(b.label));
  }
  return entries;
}
// A small "색상: [category | namespace]" segmented toggle for diagram headers. onAfter() runs
// after the mode flips (re-render). Session-only — not persisted to project JSON.

//============ Render: Architecture (switch-bus diagram, Korean style) ============
function renderArchitecture() {
  const root = $("#viewBody");
  root.innerHTML = "";
  const p = state.project;
  if (!p?.clusters?.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⊟"]),
      el("h2", {}, ["Network Architecture"]),
      el("p", {}, ["클러스터·워크로드가 있어야 표시됩니다."]),
    ]));
    return;
  }

  const NS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs = {}, children = []) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v != null) node.setAttribute(k, v);
    }
    for (const c of [].concat(children)) {
      if (c == null) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  };

  // Classification — platform namespaces split into sub-roles so the (관리/Mgmt) row
  // can color-group monitoring vs logging vs gitops vs CI rather than dumping them all
  // into one grey blob. namespace remains the source of truth — these are purely
  // visual sub-groupings (no schema change, no extra field on workloads).
  const PLATFORM_NS_ROLES = [
    { role: "runtime",     label: "Runtime",     color: "#5d6d7e", namespaces: ["kube-system"] },
    { role: "gateway",     label: "Gateway/Mesh",color: "#7d3c98", namespaces: ["ingress-nginx", "istio-system"] },
    { role: "security",    label: "Security",    color: "#922b21", namespaces: ["cert-manager", "external-secrets"] },
    { role: "monitoring",  label: "Monitoring",  color: "#cd5c5c", namespaces: ["monitoring"] },
    { role: "logging",     label: "Logging",     color: "#b87a2e", namespaces: ["logging"] },
    { role: "gitops",      label: "GitOps",      color: "#1e6091", namespaces: ["argocd", "fluxcd", "flux-system"] },
    { role: "ci",          label: "CI",          color: "#0e7c66", namespaces: ["tekton-pipelines", "jenkins", "gitlab", "gitlab-runner", "buildkit", "kaniko"] },
    { role: "registry",    label: "Registry",    color: "#1e8449", namespaces: ["harbor"] },
    { role: "backup",      label: "Backup",      color: "#5a3a00", namespaces: ["velero"] },
  ];
  const PLATFORM_OTHER = { role: "platform-other", label: "Platform", color: "#5d6d7e", namespaces: [] };
  const nsRoleIndex = new Map();
  for (const r of PLATFORM_NS_ROLES) {
    for (const ns of r.namespaces) nsRoleIndex.set(ns, r);
  }
  const platformNs = new Set(nsRoleIndex.keys());
  // Normalise the namespace before role lookup so dev-monitoring / monitoring-prod group under
  // Monitoring, etc. (nsRoleIndex keys are already base names like "monitoring").
  const platformRoleOf = (w) => nsRoleIndex.get(nsNormalize(w.namespace)) || PLATFORM_OTHER;
  const isStateful = w => w.kind === "StatefulSet" || ["DB", "Cache", "Queue"].includes(w.category);
  const isPlatform = w => platformNs.has(nsNormalize(w.namespace));

  // ---- Zone derivation ----
  // Zone = node.labels["topology.kubernetes.io/zone"] || node.site_id
  // Site → zone map: a site's zone = first node-in-site's zone (sites typically host one zone)
  const zoneOfNode = (n) => n?.labels?.["topology.kubernetes.io/zone"] || n?.site_id || null;
  const siteZone = new Map();
  for (const s of (p.sites || [])) {
    let z = null;
    for (const nid of (s.node_ids || [])) {
      const n = (p.nodes || []).find(x => x.id === nid);
      if (n) { z = zoneOfNode(n); if (z) break; }
    }
    if (!z) z = s.id;  // fallback so L4/ext/storage in node-less sites still get a zone
    siteZone.set(s.id, z);
  }
  // Find which site an L4 / ext / storage belongs to
  const siteOfL4 = new Map();
  const siteOfExt = new Map();
  const siteOfStorage = new Map();
  for (const s of (p.sites || [])) {
    for (const lb of (s.l4_balancers || [])) siteOfL4.set(lb.id, s.id);
    for (const ex of (s.external_services || [])) siteOfExt.set(ex.id, s.id);
    for (const st of (s.storages || [])) siteOfStorage.set(st.id, s.id);
  }
  // Per-cluster zone map: cluster.id → ordered Array<zone>
  const clusterZones = new Map();
  for (const c of p.clusters) {
    const seen = new Set();
    const ordered = [];
    for (const nid of (c.node_ids || [])) {
      const n = (p.nodes || []).find(x => x.id === nid);
      const z = zoneOfNode(n);
      if (z && !seen.has(z)) { seen.add(z); ordered.push(z); }
    }
    clusterZones.set(c.id, ordered);
  }
  const groupByZone = state.ui.archGroupByZone !== false;

  // ---- Cluster filter ----
  // Optional single-cluster focus (mirrors the Dependency view's cluster tabs). Blank = all.
  // Reset a stale selection if that cluster was removed.
  if (state.ui.archCluster && !(p.clusters || []).find(c => c.id === state.ui.archCluster)) {
    state.ui.archCluster = "";
  }
  const archClusterId = state.ui.archCluster || "";
  const shownClusters = archClusterId ? (p.clusters || []).filter(c => c.id === archClusterId) : (p.clusters || []);
  const shownClusterIds = new Set(shownClusters.map(c => c.id));
  // Storages/external services referenced by the shown clusters' workloads — used to keep the
  // DB/Storage row focused when a single cluster is selected (else shared infra adds noise).
  const refStorageIds = new Set();
  for (const c of shownClusters) {
    for (const w of (c.workloads || [])) {
      for (const pv of (w.persistent_volumes || [])) {
        if (pv.target_storage_id) refStorageIds.add(pv.target_storage_id);
      }
    }
  }

  // ---- Pre-compute L4 → workload routing (via cluster.ingress_rules.paths) ----
  // Only "compute" (non-platform, non-stateful) workloads become L4 children.
  // childWorkloadIds: set of workload IDs that should NOT appear as siblings.
  // In zone-split mode, each L4's children show this zone's replica share;
  // and we drop the cross-L4 dedup so multi-L4 HA shows web in every zone.
  const l4Children = new Map();
  const childWorkloadIds = new Set();
  for (const s of p.sites || []) {
    for (const lb of (s.l4_balancers || [])) {
      const children = [];
      const seenInThisL4 = new Set();
      const lbZone = siteZone.get(s.id);
      for (const cid of (lb.target_cluster_ids || [])) {
        const c = p.clusters.find(x => x.id === cid);
        if (!c) continue;
        if (archClusterId && !shownClusterIds.has(c.id)) continue;  // single-cluster focus
        const cZones = clusterZones.get(c.id) || [];
        const splitC = groupByZone && cZones.length >= 2;
        for (const r of (c.ingress_rules || [])) {
          for (const path of (r.paths || [])) {
            const w = (c.workloads || []).find(x => x.id === path.workload_id);
            if (!w) continue;
            if (isPlatform(w) || isStateful(w)) continue;
            if (seenInThisL4.has(w.id)) continue;
            // Non-split mode: keep cross-L4 dedup so a workload only shows once.
            if (!splitC && childWorkloadIds.has(w.id)) continue;
            seenInThisL4.add(w.id);
            const entry = { kind: "workload", item: w, cluster: c };
            if (splitC && lbZone && cZones.includes(lbZone)) {
              const zi = cZones.indexOf(lbZone);
              const N = cZones.length;
              const rr = w.replicas ?? 1;
              entry.zoneReplicas = Math.floor(rr / N) + (zi < rr % N ? 1 : 0);
            }
            children.push(entry);
            childWorkloadIds.add(w.id);
          }
        }
      }
      if (children.length) l4Children.set(lb.id, children);
    }
  }

  // ---- Build groups ----
  // Row key: `${tag}` or `${tag}|${zone}` (when split by zone)
  const envRows = new Map(); // rowKey → { tag, zone, items[] }
  const mgmtRow = [];
  const dbRow = [];

  // Ops/Mgmt lane (top): standalone management/bastion/CI-runner *nodes* that sit outside
  // env workload flow. These are surfaced as node-kind items, distinct from namespace-based
  // platform workloads (which still land in the existing mgmtRow).
  const OPS_PURPOSES = new Set(["management", "bastion", "ci-runner"]);
  const opsRow = [];
  for (const n of (p.nodes || [])) {
    if (OPS_PURPOSES.has(n.purpose)) opsRow.push({ kind: "node", item: n });
  }

  const ensureRow = (tag, zone) => {
    const key = zone ? `${tag}|${zone}` : tag;
    if (!envRows.has(key)) envRows.set(key, { tag, zone, items: [] });
    return envRows.get(key);
  };

  for (const c of shownClusters) {
    const tag = c.environment_tag || c.name;
    const zones = clusterZones.get(c.id) || [];
    const splitThisCluster = groupByZone && zones.length >= 2;
    const targetZones = splitThisCluster ? zones : [null]; // null = single unsplit row

    for (const z of targetZones) ensureRow(tag, z);

    // L4 LBs targeting this cluster
    for (const s of p.sites || []) {
      for (const lb of (s.l4_balancers || [])) {
        if (!(lb.target_cluster_ids || []).includes(c.id)) continue;
        if (splitThisCluster) {
          const lbZone = siteZone.get(s.id);
          // L4 belongs to this zone's row if zone matches; else if no match, attach to first zone
          const z = zones.includes(lbZone) ? lbZone : zones[0];
          ensureRow(tag, z).items.push({ kind: "l4", item: lb });
        } else {
          ensureRow(tag, null).items.push({ kind: "l4", item: lb });
        }
      }
    }

    // Workloads
    for (const w of (c.workloads || [])) {
      if (childWorkloadIds.has(w.id)) continue;
      if (isPlatform(w)) {
        mgmtRow.push({ kind: "workload", item: w, cluster: c });
        continue;
      }
      if (isStateful(w)) {
        dbRow.push({ kind: "workload", item: w, cluster: c });
        continue;
      }
      if (splitThisCluster) {
        // Distribute replicas across zones (ceil for first few, floor for rest)
        const N = zones.length;
        const r = w.replicas ?? 1;
        for (let zi = 0; zi < N; zi++) {
          const perZone = Math.floor(r / N) + (zi < r % N ? 1 : 0);
          if (perZone <= 0) continue;
          ensureRow(tag, zones[zi]).items.push({
            kind: "workload", item: w, cluster: c, zoneReplicas: perZone,
          });
        }
      } else {
        ensureRow(tag, null).items.push({ kind: "workload", item: w, cluster: c });
      }
    }
  }

  // External services + storages → DB row (shared across zones — stays unsplit).
  // In single-cluster focus, external services aren't cluster-attributable (site-shared, no
  // per-cluster link), so they're omitted; storages are kept only when this cluster's
  // workloads actually mount them (via PVC target_storage_id).
  for (const s of p.sites || []) {
    for (const ex of (s.external_services || [])) {
      if (archClusterId) continue;
      if (["database", "cache", "queue", "object_store", "backup"].includes(ex.kind)) {
        dbRow.push({ kind: "extsvc", item: ex });
      }
    }
    for (const st of (s.storages || [])) {
      if (archClusterId && !refStorageIds.has(st.id)) continue;
      dbRow.push({ kind: "storage", item: st });
    }
  }

  // ---- Final row order ----
  const rows = [];
  // Sort env rows: same tag's zones together in zone order, then by tag
  const sortedKeys = [...envRows.keys()].sort((a, b) => {
    const A = envRows.get(a), B = envRows.get(b);
    if (A.tag !== B.tag) return A.tag.localeCompare(B.tag);
    return (A.zone || "").localeCompare(B.zone || "");
  });
  for (const key of sortedKeys) {
    const r = envRows.get(key);
    if (!r.items.length) continue;
    const label = r.zone ? `(${r.tag} · ${r.zone})` : `(${r.tag})`;
    rows.push({ label, items: r.items, tag: key, zone: r.zone, envTag: r.tag });
  }
  if (mgmtRow.length) rows.push({ label: "(관리/Mgmt)", items: mgmtRow, tag: "_mgmt" });
  if (dbRow.length) rows.push({ label: "(DB/Storage)", items: dbRow, tag: "_db" });
  // Ops/Mgmt lane sits at the very top — cross-cutting nodes above all env rows.
  if (opsRow.length) rows.unshift({ label: "(Ops · Mgmt/CI)", items: opsRow, tag: "_ops" });

  // ---- Switches per row ----
  // Split rows: only switches from sites whose zone matches this row's zone.
  // Unsplit env rows: all switches from sites that host this cluster's nodes.
  // Mgmt/db: all switches.
  const rowSwitches = new Map();
  for (const r of rows) {
    if (r.tag === "_mgmt" || r.tag === "_db" || r.tag === "_ops") continue;
    const switches = [];
    const seen = new Set();
    if (r.zone) {
      // zone-specific: switches from sites whose zone matches
      for (const s of (p.sites || [])) {
        if (siteZone.get(s.id) !== r.zone) continue;
        for (const d of (s.network_devices || [])) {
          if (d.kind === "switch" && !seen.has(d.id)) { switches.push(d); seen.add(d.id); }
        }
      }
    } else {
      // unsplit: walk this env's clusters' sites
      for (const c of shownClusters) {
        if ((c.environment_tag || c.name) !== r.envTag) continue;
        const sitesUsed = new Set();
        for (const nid of (c.node_ids || [])) {
          const n = (p.nodes || []).find(x => x.id === nid);
          if (n) sitesUsed.add(n.site_id);
        }
        for (const sid of sitesUsed) {
          const s = (p.sites || []).find(x => x.id === sid);
          if (!s) continue;
          for (const d of (s.network_devices || [])) {
            if (d.kind === "switch" && !seen.has(d.id)) { switches.push(d); seen.add(d.id); }
          }
        }
      }
    }
    if (switches.length) rowSwitches.set(r.tag, switches);
  }
  // mgmt/db: all switches across all sites
  const allSwitches = [];
  const allSeen = new Set();
  for (const s of (p.sites || [])) {
    for (const d of (s.network_devices || [])) {
      if (d.kind === "switch" && !allSeen.has(d.id)) {
        allSwitches.push(d); allSeen.add(d.id);
      }
    }
  }
  if (allSwitches.length) {
    rowSwitches.set("_mgmt", allSwitches);
    rowSwitches.set("_db", allSwitches);
    rowSwitches.set("_ops", allSwitches);
  }

  if (!rows.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("h2", {}, [archClusterId ? "이 클러스터에는 표시할 워크로드가 없습니다" : "워크로드가 없습니다"]),
      // Keep an escape hatch so a single-cluster filter can't strand the user on an empty view.
      archClusterId ? el("button", {
        class: "btn-ghost", style: { marginTop: "12px" },
        onclick: () => { state.ui.archCluster = ""; emit(); },
      }, ["← 전체 클러스터 보기"]) : null,
    ]));
    return;
  }

  // Layout constants
  const SWITCH_W = 110, SWITCH_H = 36, SWITCH_VGAP = 4;
  const ROW_GAP = 50, BOX_W = 100, BOX_H = 56, BOX_GAP = 12, SUB_GAP = 8;
  const GROUP_GAP = 32; // horizontal gap between labelled groups sharing a packed line (mgmt/db/env)
  const PAD_LEFT = 20, PAD_RIGHT = 30, PAD_TOP = 20;
  const STUB_LEN = 36;
  const SUB_DROP = 18;
  const SUB_TO_CHILD = 12;
  // Env-row wrapping: when a single env row laid side-by-side would stretch wider than the
  // available drawing area, we drop the single-line layout and pack its standalone compute
  // boxes into multiple lines instead. Boxes are grouped by namespace (labelled) but packed
  // to minimise the number of lines: small namespaces share a line, a large one wraps and its
  // tail line still accepts following namespaces. Small projects stay under the budget and
  // render exactly as before.
  const LANE_LABEL_H = 16;   // height reserved above each wrapped line for its "ns:…" label(s)
  const LANE_VGAP = 16;      // vertical gap below the L4 line before the wrapped lines begin
  const SUBROW_VGAP = 12;    // vertical gap between wrapped lines
  // "Wrap when the diagram would exceed ~80% of the drawing area." Budget is in SVG user units
  // (≈ px at fit). rowAreaLeft (switch column) + PAD_RIGHT are fixed chrome, so the content of
  // one line may use the rest. Floored so a transient 0-width read can't collapse to 1 box/line.
  const containerW = Math.max(360, root.clientWidth || 1000);
  const rowAreaLeftX = PAD_LEFT + SWITCH_W + 30;
  const contentBudget = Math.max(BOX_W, 0.8 * containerW - rowAreaLeftX - PAD_RIGHT);

  const rowSwitchCount = r => Math.max(1, (rowSwitches.get(r.tag) || []).length);
  const rowSwitchStackH = r => {
    const n = rowSwitchCount(r);
    return n * SWITCH_H + (n - 1) * SWITCH_VGAP;
  };
  const itemFootprint = it => {
    if (it.kind === "l4") {
      const ch = l4Children.get(it.item.id) || [];
      if (ch.length) return Math.max(BOX_W, ch.length * BOX_W + (ch.length - 1) * SUB_GAP);
    }
    return BOX_W;
  };
  // Group rules per row tag:
  //   _mgmt → split by platform sub-role (Monitoring / Logging / GitOps / CI / ...)
  //           so the row visually separates operational concerns instead of dumping
  //           every platform pod into one stripe.
  //   _db   → group by owning cluster (DB/Storage stays as before).
  //   other → single passthrough.
  const getRowGroups = (r) => {
    if (r.tag === "_mgmt") {
      const byRole = new Map();
      for (const it of r.items) {
        const role = it.kind === "workload"
          ? platformRoleOf(it.item)
          : PLATFORM_OTHER;
        if (!byRole.has(role.role)) {
          byRole.set(role.role, { key: role.role, label: role.label, items: [], roleColor: role.color });
        }
        byRole.get(role.role).items.push(it);
      }
      // Preserve the curated role order; PLATFORM_OTHER appended last if present.
      const ordered = [];
      for (const r2 of PLATFORM_NS_ROLES) {
        if (byRole.has(r2.role)) ordered.push(byRole.get(r2.role));
      }
      if (byRole.has(PLATFORM_OTHER.role)) ordered.push(byRole.get(PLATFORM_OTHER.role));
      return ordered;
    }
    if (r.tag === "_db") {
      const byCluster = new Map();
      const shared = { key: "_shared", label: "외부", items: [] };
      for (const it of r.items) {
        if (it.cluster) {
          const cid = it.cluster.id;
          if (!byCluster.has(cid)) byCluster.set(cid, { key: cid, label: it.cluster.name, items: [] });
          byCluster.get(cid).items.push(it);
        } else {
          shared.items.push(it);
        }
      }
      const groups = [...byCluster.values()].sort((a, b) => (a.label || "").localeCompare(b.label || ""));
      if (shared.items.length) groups.push(shared);
      return groups;
    }
    return [{ key: r.tag, label: null, items: r.items }];
  };
  const groupWidth = g => {
    if (!g.items.length) return 0;
    let w = 0;
    for (const it of g.items) w += itemFootprint(it) + BOX_GAP;
    return w - BOX_GAP;
  };
  // mgmt/db rows stack their cluster groups vertically off a trunk; other rows lay items out side-by-side.
  const rowIsStacked = r => {
    const groups = getRowGroups(r);
    return groups.length > 1 && groups.some(g => g.label != null);
  };

  // ---- Env-row namespace packing (wide env rows) ----
  // _mgmt/_db already wrap (stacked groups); _ops is a flat node lane. Only the regular
  // environment rows can overflow horizontally, so packing applies to those.
  const isEnvRow = r => r.tag !== "_mgmt" && r.tag !== "_db" && r.tag !== "_ops";
  // Footprint of a side-by-side run of plain boxes (no L4 children among them).
  const boxRunWidth = n => n > 0 ? n * BOX_W + (n - 1) * BOX_GAP : 0;
  // Width of just the L4 items laid side-by-side (each may carry a wider child subtree).
  const l4LineWidth = items => {
    if (!items.length) return 0;
    let w = 0;
    for (const it of items) w += itemFootprint(it) + BOX_GAP;
    return w - BOX_GAP;
  };
  // Pack labelled groups of plain boxes into lines no wider than contentBudget. Each group
  // (a namespace for env rows; a platform sub-role / cluster for mgmt·db rows) keeps its label
  // on its first segment, but multiple groups share a line and a group's tail line accepts the
  // next group — minimising the number of lines. A group larger than one line wraps.
  // Balanced line count: pack to a per-line cap of ceil(N / linesNeeded) rather than greedily
  // filling to the budget, so a count that just clears a line multiple (6 → 3+3 not 5+1,
  // 11 → 4+4+3 not 5+5+1) never leaves a line with a single box.
  const packGroupsToLines = (groups) => {
    groups = groups.filter(g => g.items && g.items.length);
    if (!groups.length) return [];
    const N = groups.reduce((a, g) => a + g.items.length, 0);
    const perLineMax = Math.max(1, Math.floor((contentBudget + BOX_GAP) / (BOX_W + BOX_GAP)));
    const linesNeeded = Math.max(1, Math.ceil(N / perLineMax));
    const cap = Math.ceil(N / linesNeeded);   // ≤ perLineMax, so a full cap-line still fits the budget
    const lines = [];
    let cur = { segments: [], width: 0, count: 0 };
    const pushCur = () => { if (cur.segments.length) { lines.push(cur); cur = { segments: [], width: 0, count: 0 }; } };
    // Largest run of n boxes that fits the current line under both the balance cap and the budget.
    const fitCount = (n) => {
      const gapBefore = cur.count > 0 ? GROUP_GAP : 0;
      const byCap = cap - cur.count;
      const byWidth = Math.floor((contentBudget - cur.width - gapBefore + BOX_GAP) / (BOX_W + BOX_GAP));
      return Math.max(0, Math.min(n, byCap, byWidth));
    };
    for (const g of groups) {
      const whole = g.items.length;
      // Keep a small group (fits a line on its own) intact: if it won't fit in what's left of
      // the current line, wrap to a fresh line before placing it.
      if (cur.count > 0 && whole <= cap && boxRunWidth(whole) <= contentBudget && fitCount(whole) < whole) {
        pushCur();
      }
      let firstSeg = true;   // first segment of this group overall → carries the label
      let i = 0;
      while (i < whole) {
        let take = fitCount(whole - i);
        if (take <= 0) {
          if (cur.count === 0) take = 1;     // degenerate (budget < one box): force one
          else { pushCur(); continue; }      // no room left → wrap and retry on a fresh line
        }
        const gapBefore = cur.count > 0 ? GROUP_GAP : 0;
        cur.segments.push({ label: g.label, items: g.items.slice(i, i + take), showLabel: firstSeg });
        cur.width += gapBefore + boxRunWidth(take);
        cur.count += take;
        i += take;
        firstSeg = false;
        if (i < whole) pushCur();            // group continues → force a new line
      }
    }
    pushCur();
    return lines;
  };
  // Env rows: group the standalone compute boxes by namespace, label "ns:<name>".
  const packEnvLines = (items) => {
    const byNs = new Map();
    for (const it of items) {
      const ns = (it.item && it.item.namespace) || "default";
      if (!byNs.has(ns)) byNs.set(ns, []);
      byNs.get(ns).push(it);
    }
    const groups = [...byNs.entries()].sort((a, b) => a[0].localeCompare(b[0]))
      .map(([ns, list]) => ({ label: `ns:${ns}`, items: list }));
    return packGroupsToLines(groups);
  };
  const envWrap = (r) => {
    const l4Items = r.items.filter(it => it.kind === "l4");
    const rest = r.items.filter(it => it.kind !== "l4");
    return { l4Items, lines: packEnvLines(rest) };
  };
  // mgmt/db rows: pack their labelled groups (sub-role / cluster) horizontally too, instead of
  // one group per vertical line (which stretched the management area into a tall 1-wide column).
  const packStackedLines = (r) =>
    packGroupsToLines(getRowGroups(r).map(g => ({ label: g.label ? `⎈ ${g.label}` : null, items: g.items })));
  // Side-by-side width of the whole row, as the un-wrapped path would draw it.
  const sideBySideWidth = (r) => {
    const groups = getRowGroups(r);
    let w = 0;
    for (const g of groups) w += groupWidth(g) + GROUP_GAP;
    return Math.max(BOX_W, w - GROUP_GAP);
  };
  // Wrap only env rows, and only once their single-line width would overflow the budget.
  const envNeedsWrap = (r) => isEnvRow(r) && sideBySideWidth(r) > contentBudget;

  const l4LineHeight = (l4Items) => {
    if (!l4Items.length) return 0;
    const hasSubs = l4Items.some(it => (l4Children.get(it.item.id) || []).length > 0);
    return BOX_H + (hasSubs ? SUB_DROP + SUB_TO_CHILD + BOX_H + 8 : 0) + LANE_VGAP;
  };
  const wrappedLinesHeight = (lines) =>
    lines.length ? lines.length * (LANE_LABEL_H + BOX_H) + (lines.length - 1) * SUBROW_VGAP : 0;

  const rowWidth = r => {
    if (envNeedsWrap(r)) {
      const { l4Items, lines } = envWrap(r);
      const lineMax = Math.max(0, ...lines.map(l => l.width));
      return Math.max(BOX_W, l4LineWidth(l4Items), lineMax);
    }
    const groups = getRowGroups(r);
    if (!groups.length) return BOX_W;
    if (rowIsStacked(r)) {
      const lines = packStackedLines(r);
      return Math.max(BOX_W, 0, ...lines.map(l => l.width));
    }
    let w = 0;
    for (const g of groups) w += groupWidth(g) + GROUP_GAP;
    return Math.max(BOX_W, w - GROUP_GAP);
  };
  const rowHeight = r => {
    const stackH = rowSwitchStackH(r);
    const aboveBus = stackH / 2 + 30;
    let blockH;
    if (envNeedsWrap(r)) {
      const { l4Items, lines } = envWrap(r);
      blockH = l4LineHeight(l4Items) + wrappedLinesHeight(lines);
      return aboveBus + stackH / 2 + STUB_LEN + blockH + ROW_GAP;
    }
    const hasSubs = r.items.some(it => it.kind === "l4" && (l4Children.get(it.item.id) || []).length > 0);
    if (rowIsStacked(r)) {
      // Packed labelled lines (same metric as env wrapping): label band + boxes per line.
      blockH = wrappedLinesHeight(packStackedLines(r));
    } else {
      blockH = BOX_H;
    }
    const belowBus = stackH / 2 + STUB_LEN + blockH
      + (hasSubs ? SUB_DROP + SUB_TO_CHILD + BOX_H + 8 : 0);
    return aboveBus + belowBus + ROW_GAP;
  };

  const totalW = PAD_LEFT + SWITCH_W + 30 + Math.max(...rows.map(rowWidth), 0) + PAD_RIGHT;
  const rowTops = [];
  let cursorY = PAD_TOP;
  for (const r of rows) { rowTops.push(cursorY); cursorY += rowHeight(r); }
  const totalH = cursorY + 20;

  // Color mapping by item kind / workload category (matches Korean infra diagram style)
  const colorOf = (item) => {
    if (item.kind === "l4") return { fill: "#1e3a5f", stroke: "#34495e" };
    if (item.kind === "extsvc") {
      const c = { database: "#1f618d", cache: "#1f618d", queue: "#117a65",
                  object_store: "#1e8449", backup: "#5d6d7e",
                  monitoring: "#5d6d7e", logging: "#5d6d7e",
                  secret_store: "#7d6608", identity: "#5d6d7e" };
      return { fill: c[item.item.kind] || "#5d6d7e", stroke: "#34495e" };
    }
    if (item.kind === "storage") {
      return { fill: "#1e8449", stroke: "#27ae60" };
    }
    if (item.kind === "node") {
      // Ops/Mgmt lane node — colored by node.purpose
      const c = {
        management: { fill: "#5d4e7a", stroke: "#a78bfa" }, // purple-grey (ops console)
        bastion:    { fill: "#7d6608", stroke: "#d4ac0d" }, // amber (gateway/SSH)
        "ci-runner":{ fill: "#1e6091", stroke: "#3498db" }, // teal (build/deploy)
      };
      return c[item.item.purpose] || { fill: "#5d6d7e", stroke: "#7f8c8d" };
    }
    // Workloads: unified standard (category or namespace mode) — same colour on every screen.
    return workloadColorClass(item.item);
  };

  // ---- Pan / Zoom (view-local, manipulates the SVG viewBox) ----
  // Natural extent = the full diagram bounding box. Stored separately so a Fit/reset can
  // always return to it even after the user has panned/zoomed away.
  const naturalVB = { x: 0, y: 0, w: totalW, h: totalH };
  // Persisted current viewport. Architecture changes shape a lot (zone toggle, cluster/
  // workload edits all move totalW/totalH), so reset if the previous box is geometrically
  // broken, absurdly large, or has drifted entirely outside the new natural extent.
  const prevVB = state.ui.archViewBox;
  const vbBroken = !prevVB || prevVB.w <= 0 || prevVB.h <= 0
    || prevVB.w > naturalVB.w * 25
    || prevVB.h > naturalVB.h * 25
    || prevVB.x > naturalVB.x + naturalVB.w
    || prevVB.y > naturalVB.y + naturalVB.h
    || prevVB.x + prevVB.w < naturalVB.x
    || prevVB.y + prevVB.h < naturalVB.y;
  if (vbBroken) state.ui.archViewBox = { ...naturalVB };
  const vb = state.ui.archViewBox;

  const root_svg = svg("svg", {
    width: "100%",
    viewBox: `${vb.x} ${vb.y} ${vb.w} ${vb.h}`,
    preserveAspectRatio: "xMidYMid meet",
    style: "background:var(--bg);border:1px solid var(--border);border-radius:8px;height:min(72vh,720px);min-height:420px;cursor:grab;touch-action:none;",
  });

  // Push viewBox state → DOM. Local to this render so closures over `vb`/`root_svg` stay stable.
  const applyVB = () => root_svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const zoomPct = () => Math.round((naturalVB.w / vb.w) * 100);

  // Helper: draw a box with label/sub at given position
  const drawBox = (item, x, y) => {
    const cx = x + BOX_W / 2;
    const col = colorOf(item);
    let label, sub, onclick;
    if (item.kind === "l4") {
      label = "L4"; sub = `(${(item.item.vendor || item.item.kind).toLowerCase()})`;
      onclick = () => selectEntity("l4", item.item.id);
    } else if (item.kind === "workload") {
      label = item.item.name;
      const r = item.zoneReplicas != null ? item.zoneReplicas : item.item.replicas;
      sub = r > 1 ? `×${r}` : "";
      onclick = () => selectEntity("workload", item.item.id);
    } else if (item.kind === "extsvc") {
      label = item.item.name; sub = item.item.engine || item.item.kind;
      onclick = () => selectEntity("extsvc", item.item.id);
    } else if (item.kind === "storage") {
      label = item.item.name; sub = item.item.kind;
      onclick = () => selectEntity("storage", item.item.id);
    } else if (item.kind === "node") {
      label = item.item.name;
      sub = item.item.purpose || "node";
      onclick = () => selectEntity("node", item.item.id);
    }
    const g = svg("g", { style: "cursor:pointer", onclick });
    g.appendChild(svg("rect", {
      x, y, width: BOX_W, height: BOX_H, rx: 4, ry: 4,
      fill: col.fill, stroke: col.stroke, "stroke-width": 1.5,
    }));
    const lbl = label.length > 14 ? label.slice(0, 13) + "…" : label;
    g.appendChild(svg("text", {
      x: cx, y: y + (sub ? BOX_H / 2 - 2 : BOX_H / 2 + 5),
      "text-anchor": "middle", fill: "#fff",
      "font-size": "12", "font-weight": "600", "font-family": "Pretendard, sans-serif",
    }, [lbl]));
    if (sub) {
      g.appendChild(svg("text", {
        x: cx, y: y + BOX_H / 2 + 14,
        "text-anchor": "middle", fill: "rgba(255,255,255,0.8)",
        "font-size": "11", "font-family": "JetBrains Mono",
      }, [sub.length > 16 ? sub.slice(0, 15) + "…" : sub]));
    }
    root_svg.appendChild(g);
  };

  // Track final positions of workload/storage boxes so we can draw PVC→storage lines after.
  const archPositions = new Map();

  // Shared renderer for packed labelled lines (env namespace lanes + mgmt/db group flow):
  // each line of box segments hangs off a left vertical rail; labels sit in the band above.
  // topY = y of the first line's box tops. Returns nothing.
  const renderPackedLines = (lines, topY, busLineY, trunkX, rowAreaLeft) => {
    let cy = topY;
    let trunkBottom = busLineY;
    for (const line of lines) {
      const subTrunkY = cy - 4;          // horizontal connector just above the boxes
      let lx = rowAreaLeft;
      let lastCx = lx;
      for (let si = 0; si < line.segments.length; si++) {
        const seg = line.segments[si];
        if (si > 0) lx += GROUP_GAP;     // gap between groups sharing a line
        if (seg.showLabel && seg.label) {
          root_svg.appendChild(svg("text", {
            x: lx, y: cy - LANE_LABEL_H + 11,
            "text-anchor": "start", fill: "var(--text2)",
            "font-size": "10", "font-family": "JetBrains Mono", "font-weight": "600",
          }, [seg.label]));
        }
        for (const item of seg.items) {
          const cx = lx + BOX_W / 2;
          lastCx = cx;
          root_svg.appendChild(svg("line", { x1: cx, y1: subTrunkY, x2: cx, y2: cy, stroke: "#34495e", "stroke-width": 1 }));
          drawBox(item, lx, cy);
          if (item.kind === "workload" || item.kind === "storage") {
            archPositions.set(`${item.kind}:${item.item.id}`, { x: lx, y: cy, w: BOX_W, h: BOX_H });
          }
          lx += BOX_W + BOX_GAP;
        }
      }
      root_svg.appendChild(svg("line", { x1: trunkX, y1: subTrunkY, x2: lastCx, y2: subTrunkY, stroke: "#34495e", "stroke-width": 1 }));
      trunkBottom = subTrunkY;
      cy += BOX_H + SUBROW_VGAP + LANE_LABEL_H;
    }
    // Left rail: vertical trunk from the bus down to the last line's sub-trunk.
    root_svg.appendChild(svg("line", { x1: trunkX, y1: busLineY, x2: trunkX, y2: trunkBottom, stroke: "#34495e", "stroke-width": 1 }));
  };

  // Per-row geometry: stack center = busY
  const rowGeom = rowTops.map((top, i) => {
    const stackH = rowSwitchStackH(rows[i]);
    const stackTop = top;
    const busY = stackTop + stackH / 2;
    const boxY = busY + STUB_LEN;
    return { stackTop, stackH, busY, boxY };
  });

  // Vertical spine (left edge connecting all switch stacks at their bus center)
  const spineX = PAD_LEFT + SWITCH_W / 2;
  root_svg.appendChild(svg("line", {
    x1: spineX, y1: rowGeom[0].busY,
    x2: spineX, y2: rowGeom[rowGeom.length - 1].busY,
    stroke: "#34495e", "stroke-width": 2,
  }));

  rows.forEach((row, rowIdx) => {
    const { stackTop, stackH, busY, boxY } = rowGeom[rowIdx];
    const lineY = busY;

    // Switch stack — bind to real network_devices[kind=switch].
    // When N>1, render each switch as a separate box stacked vertically;
    // each connects to the same horizontal bus via a short stub.
    const realSwitches = rowSwitches.get(row.tag) || [];
    const sStackBottom = stackTop + stackH;

    if (realSwitches.length === 0) {
      // Logical-only switch (fallback)
      const sy = busY - SWITCH_H / 2;
      root_svg.appendChild(svg("rect", {
        x: PAD_LEFT, y: sy, width: SWITCH_W, height: SWITCH_H,
        rx: 3, ry: 3, fill: "#1e3a5f",
        stroke: "#34495e", "stroke-width": 1.5,
      }));
      root_svg.appendChild(svg("text", {
        x: PAD_LEFT + SWITCH_W / 2, y: sy + SWITCH_H / 2 + 5,
        "text-anchor": "middle", fill: "#fff",
        "font-size": "13", "font-weight": "600", "font-family": "Pretendard, sans-serif",
      }, ["switch"]));
    } else {
      // Stack of real switches
      for (let i = 0; i < realSwitches.length; i++) {
        const sw = realSwitches[i];
        const sy = stackTop + i * (SWITCH_H + SWITCH_VGAP);
        const swG = svg("g", {
          style: "cursor:pointer",
          onclick: () => selectEntity("netdev", sw.id),
        });
        swG.appendChild(svg("rect", {
          x: PAD_LEFT, y: sy, width: SWITCH_W, height: SWITCH_H,
          rx: 3, ry: 3, fill: "#1e3a5f",
          stroke: "#4d9cff", "stroke-width": 2,
        }));
        // First line: "switch"
        swG.appendChild(svg("text", {
          x: PAD_LEFT + SWITCH_W / 2, y: sy + SWITCH_H / 2 - 2,
          "text-anchor": "middle", fill: "#fff",
          "font-size": "11", "font-weight": "600", "font-family": "Pretendard, sans-serif",
        }, ["switch"]));
        // Second line: device name (small)
        swG.appendChild(svg("text", {
          x: PAD_LEFT + SWITCH_W / 2, y: sy + SWITCH_H / 2 + 11,
          "text-anchor": "middle", fill: "rgba(255,255,255,0.75)",
          "font-size": "9", "font-family": "JetBrains Mono",
        }, [sw.name.length > 14 ? sw.name.slice(0, 13) + "…" : sw.name]));
        root_svg.appendChild(swG);
        // Stub from this switch's right edge to spine X (so each switch
        // visibly joins the bus)
        const swCY = sy + SWITCH_H / 2;
        if (Math.abs(swCY - busY) > 1) {
          // Draw vertical connector inside switch column area linking to busY
          root_svg.appendChild(svg("line", {
            x1: PAD_LEFT + SWITCH_W, y1: swCY,
            x2: PAD_LEFT + SWITCH_W + 14, y2: swCY,
            stroke: "#34495e", "stroke-width": 1.5,
          }));
          root_svg.appendChild(svg("line", {
            x1: PAD_LEFT + SWITCH_W + 14, y1: swCY,
            x2: PAD_LEFT + SWITCH_W + 14, y2: busY,
            stroke: "#34495e", "stroke-width": 1.5,
          }));
        }
      }
    }

    // Row label below stack (italic)
    root_svg.appendChild(svg("text", {
      x: PAD_LEFT + SWITCH_W / 2, y: sStackBottom + 18,
      "text-anchor": "middle", fill: "var(--text2)",
      "font-size": "12", "font-style": "italic", "font-family": "Pretendard, sans-serif",
    }, [row.label]));
    // Sub-label: count or vendor
    if (realSwitches.length > 0) {
      const subLine = realSwitches.length === 1
        ? (realSwitches[0].vendor || realSwitches[0].kind)
        : `${realSwitches.length} switches`;
      root_svg.appendChild(svg("text", {
        x: PAD_LEFT + SWITCH_W / 2, y: sStackBottom + 32,
        "text-anchor": "middle", fill: "var(--text3)",
        "font-size": "10", "font-family": "JetBrains Mono",
      }, [subLine]));
    }

    // Horizontal switch bus line
    const lineEndX = totalW - PAD_RIGHT;
    root_svg.appendChild(svg("line", {
      x1: PAD_LEFT + SWITCH_W, y1: lineY,
      x2: lineEndX, y2: lineY,
      stroke: "#34495e", "stroke-width": 1.5,
    }));

    // Component boxes — grouped by cluster for mgmt/db rows, flat for others
    const groups = getRowGroups(row);
    const stacked = rowIsStacked(row);

    if (stacked) {
      // Labelled groups (platform sub-roles / clusters) packed horizontally into lines off a
      // left rail — multiple groups share a line so the management area no longer stretches
      // into a tall 1-wide column. Wraps at the same width budget as env namespace lanes.
      renderPackedLines(
        packStackedLines(row),
        boxY + LANE_LABEL_H,            // first line's box tops (label band above)
        lineY, PAD_LEFT + SWITCH_W + 14, PAD_LEFT + SWITCH_W + 30,
      );
    } else if (envNeedsWrap(row)) {
      // ---- Namespace packing (wide env rows) ----
      // L4 items (with their child subtrees) stay on a side-by-side top line, exactly like
      // the un-wrapped path. The remaining standalone compute boxes are packed into lines no
      // wider than contentBudget, grouped by namespace (labelled) but sharing lines so the
      // number of lines stays small. Each line hangs off a left rail.
      const { l4Items, lines } = envWrap(row);
      const rowAreaLeft = PAD_LEFT + SWITCH_W + 30;
      const trunkX = PAD_LEFT + SWITCH_W + 14; // left rail the lines hang off

      // --- Top line: L4 items + subtrees (same drawing as the side-by-side branch) ---
      let bx = rowAreaLeft;
      for (const item of l4Items) {
        const subs = l4Children.get(item.item.id) || [];
        const footprint = itemFootprint(item);
        const cx = bx + footprint / 2;
        const itemX = cx - BOX_W / 2;
        root_svg.appendChild(svg("line", {
          x1: cx, y1: lineY, x2: cx, y2: boxY, stroke: "#34495e", "stroke-width": 1,
        }));
        drawBox(item, itemX, boxY);
        if (subs.length) {
          const subsW = subs.length * BOX_W + (subs.length - 1) * SUB_GAP;
          const subY = boxY + BOX_H + SUB_DROP;
          const childY = subY + SUB_TO_CHILD;
          const childStartX = cx - subsW / 2;
          root_svg.appendChild(svg("line", {
            x1: cx, y1: boxY + BOX_H, x2: cx, y2: subY, stroke: "#34495e", "stroke-width": 1,
          }));
          if (subs.length > 1) {
            root_svg.appendChild(svg("line", {
              x1: childStartX + BOX_W / 2, y1: subY,
              x2: childStartX + subsW - BOX_W / 2, y2: subY, stroke: "#34495e", "stroke-width": 1,
            }));
          }
          for (let j = 0; j < subs.length; j++) {
            const ccx = childStartX + j * (BOX_W + SUB_GAP) + BOX_W / 2;
            root_svg.appendChild(svg("line", {
              x1: ccx, y1: subY, x2: ccx, y2: childY, stroke: "#34495e", "stroke-width": 1,
            }));
            drawBox(subs[j], ccx - BOX_W / 2, childY);
            if (subs[j].kind === "workload") {
              archPositions.set(`workload:${subs[j].item.id}`, { x: ccx - BOX_W / 2, y: childY, w: BOX_W, h: BOX_H });
            }
          }
        }
        bx += footprint + BOX_GAP;
      }
      const l4LineH = l4LineHeight(l4Items);

      // --- Packed namespace lines hung off the same left rail ---
      renderPackedLines(lines, boxY + l4LineH + LANE_LABEL_H, lineY, trunkX, rowAreaLeft);
    } else {
      // Side-by-side layout (env rows or single-group mgmt/db)
      let bx = PAD_LEFT + SWITCH_W + 30;
      for (let gi = 0; gi < groups.length; gi++) {
        const g = groups[gi];
        if (!g.items.length) continue;
        for (let i = 0; i < g.items.length; i++) {
          const item = g.items[i];
          const subs = item.kind === "l4" ? (l4Children.get(item.item.id) || []) : [];
          const footprint = itemFootprint(item);
          const cx = bx + footprint / 2;
          const itemX = cx - BOX_W / 2;

          root_svg.appendChild(svg("line", {
            x1: cx, y1: lineY, x2: cx, y2: boxY,
            stroke: "#34495e", "stroke-width": 1,
          }));

          drawBox(item, itemX, boxY);
          if (item.kind === "workload" || item.kind === "storage") {
            archPositions.set(`${item.kind}:${item.item.id}`, { x: itemX, y: boxY, w: BOX_W, h: BOX_H });
          }

          if (subs.length) {
            const subsW = subs.length * BOX_W + (subs.length - 1) * SUB_GAP;
            const subY = boxY + BOX_H + SUB_DROP;
            const childY = subY + SUB_TO_CHILD;
            const childStartX = cx - subsW / 2;

            root_svg.appendChild(svg("line", {
              x1: cx, y1: boxY + BOX_H, x2: cx, y2: subY,
              stroke: "#34495e", "stroke-width": 1,
            }));
            if (subs.length > 1) {
              root_svg.appendChild(svg("line", {
                x1: childStartX + BOX_W / 2, y1: subY,
                x2: childStartX + subsW - BOX_W / 2, y2: subY,
                stroke: "#34495e", "stroke-width": 1,
              }));
            }
            for (let j = 0; j < subs.length; j++) {
              const ccx = childStartX + j * (BOX_W + SUB_GAP) + BOX_W / 2;
              root_svg.appendChild(svg("line", {
                x1: ccx, y1: subY, x2: ccx, y2: childY,
                stroke: "#34495e", "stroke-width": 1,
              }));
              drawBox(subs[j], ccx - BOX_W / 2, childY);
              const sub = subs[j];
              if (sub.kind === "workload") {
                archPositions.set(`workload:${sub.item.id}`, { x: ccx - BOX_W / 2, y: childY, w: BOX_W, h: BOX_H });
              }
            }
          }

          bx += footprint;
          if (i < g.items.length - 1) bx += BOX_GAP;
        }
        if (gi < groups.length - 1) bx += GROUP_GAP;
      }
    }
  });

  // PVC → storage connection lines (per workload's persistent_volumes[].target_storage_id)
  for (const c of (p.clusters || [])) {
    for (const w of (c.workloads || [])) {
      const wPos = archPositions.get(`workload:${w.id}`);
      if (!wPos) continue;
      for (const pv of (w.persistent_volumes || [])) {
        if (!pv.target_storage_id) continue;
        const stPos = archPositions.get(`storage:${pv.target_storage_id}`);
        if (!stPos) continue;
        const x1 = wPos.x + wPos.w / 2, y1 = wPos.y + wPos.h;
        const x2 = stPos.x + stPos.w / 2, y2 = stPos.y;
        root_svg.appendChild(svg("path", {
          d: `M ${x1},${y1} L ${x2},${y2}`,
          fill: "none",
          stroke: "#34d399", "stroke-width": 1.4, "stroke-opacity": 0.55,
          "stroke-dasharray": "4,3",
        }));
      }
    }
  }

  // Wrapper with section header
  const wrap = el("div", {});
  const zoneToggle = el("input", {
    type: "checkbox",
    checked: state.ui.archGroupByZone !== false,
    onchange: e => {
      state.ui.archGroupByZone = !!e.target.checked;
      emit(); saveSoon();
    },
    style: { marginRight: "4px", verticalAlign: "middle" },
  });
  // Detect any multi-zone cluster to know whether toggle has any effect
  const anyMultiZone = [...clusterZones.values()].some(zs => zs.length >= 2);
  // Legend entries for the workloads actually shown (respects the cluster filter + colour mode).
  const archLegendEntries = legendEntriesFor(shownClusters.flatMap(c => c.workloads || []));
  wrap.appendChild(el("div", {
