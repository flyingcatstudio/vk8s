function renderTopologyGrid(root, p) {
  if (!p.sites.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⌗"]),
      el("h2", {}, ["사이트가 없습니다"]),
      el("p", {}, ["트리에서 ＋ Add Site로 첫 사이트를 만드세요."]),
    ]));
    return;
  }

  // Next step hint based on workflow progression
  const totalNodes = p.nodes.length;
  const hasCluster = (p.clusters || []).length > 0;
  if (totalNodes === 0) {
    root.appendChild(el("div", { class: "next-hint" }, [
      el("span", { class: "icon" }, ["①"]),
      el("div", { class: "body" }, [
        el("div", { class: "head" }, ["Next step"]),
        el("div", { class: "lead" }, ["좌측 ＋ Add Node로 노드를 추가하세요."]),
      ]),
      el("button", { class: "btn", onclick: openAddNode }, ["＋ Add Node"]),
    ]));
  } else if (!hasCluster) {
    root.appendChild(el("div", { class: "next-hint" }, [
      el("span", { class: "icon" }, ["②"]),
      el("div", { class: "body" }, [
        el("div", { class: "head" }, ["Next step"]),
        el("div", { class: "lead" }, [`노드 ${totalNodes}개 추가됨. 이제 클러스터를 만들어 노드를 묶으세요.`]),
      ]),
      el("button", { class: "btn", onclick: openAddCluster }, ["＋ Add Cluster"]),
    ]));
  } else {
    const unassigned = p.nodes.filter(n => !getNodeCluster(n.id)).length;
    if (unassigned > 0) {
      root.appendChild(el("div", { class: "next-hint" }, [
        el("span", { class: "icon" }, ["▲"]),
        el("div", { class: "body" }, [
          el("div", { class: "head" }, ["Note"]),
          el("div", { class: "lead" }, [`${unassigned}개 노드가 클러스터에 할당되지 않음. 클러스터를 선택해 추가하세요.`]),
        ]),
      ]));
    }
    const totalWl = (p.clusters || []).reduce((a, c) => a + (c.workloads?.length || 0), 0);
    if (totalWl === 0) {
      const firstC = p.clusters[0];
      root.appendChild(el("div", { class: "next-hint" }, [
        el("span", { class: "icon" }, ["③"]),
        el("div", { class: "body" }, [
          el("div", { class: "head" }, ["Next step"]),
          el("div", { class: "lead" }, [`클러스터가 준비됐습니다. 이제 워크로드(서비스)를 추가하세요.`]),
        ]),
        el("button", { class: "btn", onclick: () => openAddWorkload(firstC.id) }, ["＋ Add Workload"]),
      ]));
    }
  }

  for (const s of p.sites) {
    const card = el("div", { class: "topo-site" });
    const header = el("div", { class: "topo-site-header" }, [
      el("span", { class: "name" }, [s.name]),
      el("span", { class: "kind", dataset: { kind: s.kind } }, [s.kind]),
      el("span", { class: "region" }, [s.kind === "cloud" ? `${s.cloud_provider || ""} · ${s.region || ""}` : ""]),
    ]);
    card.appendChild(header);

    if (s.kind === "onprem") {
      const usage = siteUsage(s, p, state.catalog.gpuModels);
      const uPct  = usage.u_max ? usage.u_used / usage.u_max * 100 : 0;
      const kwPct = usage.kw_max ? usage.kw_used / usage.kw_max * 100 : 0;
      card.appendChild(el("div", { class: "topo-site-bars" }, [
        makeBarLine("Rack U",  `${usage.u_used}/${usage.u_max}U`,  uPct),
        makeBarLine("Power",   `${usage.kw_used.toFixed(1)}/${usage.kw_max}kW`, kwPct),
      ]));
    }

    // Network devices (top — perimeter security)
    const ndIconMap = { switch: "⇄", router: "⊞", firewall: "🛡", waf: "🛡", cdn: "🌍", vpn: "🔐", dns: "🌐", ddos: "⚠" };
    const netdevs = s.network_devices || [];
    if (netdevs.length) {
      const ndRow = el("div", {
        style: { display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "12px" },
      });
      for (const d of netdevs) {
        ndRow.appendChild(el("div", {
          style: {
            background: "var(--surface2)",
            border: "1px solid " + (d.ha ? "var(--green)" : "var(--border)"),
            borderRadius: "6px",
            padding: "6px 10px",
            cursor: "pointer",
            fontSize: "11px",
            display: "flex", alignItems: "center", gap: "6px",
          },
          onclick: () => selectEntity("netdev", d.id),
        }, [
          el("span", {}, [ndIconMap[d.kind] || "▢"]),
          el("strong", {}, [d.name]),
          el("span", { style: { color: "var(--text3)", fontFamily: "JetBrains Mono", fontSize: "10px" } }, [
            `${d.kind}${d.vendor ? ` · ${d.vendor}` : ""}${d.ha ? " · HA" : ""}`,
          ]),
        ]));
      }
      card.appendChild(ndRow);
    }

    // L4 LBs (top of site)
    const l4s = s.l4_balancers || [];
    if (l4s.length) {
      const l4Row = el("div", {
        style: { display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "12px" },
      });
      for (const l4 of l4s) {
        l4Row.appendChild(el("div", {
          style: {
            background: "var(--surface2)",
            border: "1px solid " + (l4.ha ? "var(--green)" : "var(--border)"),
            borderRadius: "6px",
            padding: "6px 10px",
            cursor: "pointer",
            fontSize: "11px",
            display: "flex", alignItems: "center", gap: "6px",
          },
          onclick: () => selectEntity("l4", l4.id),
        }, [
          el("span", {}, ["⚖"]),
          el("strong", {}, [l4.name]),
          el("span", { style: { color: "var(--text3)", fontFamily: "JetBrains Mono", fontSize: "10px" } }, [
            `${l4.vendor || l4.kind} ${l4.vip ? `· ${l4.vip}` : ""}${l4.ha ? " · HA" : ""}`,
          ]),
        ]));
      }
      card.appendChild(l4Row);
    }

    const nodes = (s.node_ids || []).map(id => p.nodes.find(n => n.id === id)).filter(Boolean);
    if (!nodes.length) {
      card.appendChild(el("div", { class: "topo-empty-site" }, ["노드 없음. ＋ Add Node로 추가."]));
    } else {
      const grid = el("div", { class: "topo-nodes" });
      for (const n of nodes) {
        const isSel = state.ui.selectedKind === "node" && state.ui.selectedId === n.id;
        const totalGpu = (n.spec.gpu || []).reduce((a, g) => a + g.count, 0);
        const gpuMax = (n.spec.gpu_chassis?.max_count || 0);
        const power = computeNodePowerW(n, state.catalog.gpuModels);
        grid.appendChild(el("div", {
          class: "topo-node" + (isSel ? " selected" : ""),
          onclick: () => selectEntity("node", n.id),
        }, [
          el("div", { class: "node-name" }, [n.name]),
          el("div", { class: "node-model" }, [`${n.brand} · ${n.model}${n.spec.form_factor ? ` · ${n.spec.form_factor}` : ""}`]),
          el("div", { class: "node-stats" }, [
            el("span", { class: "stat" }, [el("span", {}, ["vCPU"]), el("span", { class: "v" }, [String(n.spec.vcpu || 0)])]),
            el("span", { class: "stat" }, [el("span", {}, ["RAM"]), el("span", { class: "v" }, [`${n.spec.memory_gb || 0} GB`])]),
            n.source === "onprem"
              ? el("span", { class: "stat" }, [el("span", {}, ["Power"]), el("span", { class: "v" }, [`${(power/1000).toFixed(1)} kW`])])
              : el("span", { class: "stat" }, [el("span", {}, ["NIC"]), el("span", { class: "v" }, [`${(n.spec.nics?.[0]?.speed_gbps || 0)} G`])]),
            gpuMax > 0
              ? el("span", { class: "stat" }, [el("span", {}, ["GPU"]), el("span", { class: "v" }, [`${totalGpu}/${gpuMax}`])])
              : el("span", { class: "stat" }, [el("span", {}, ["Disk"]), el("span", { class: "v" }, [`${(n.spec.disks?.[0]?.size_gb || 0)} GB`])]),
          ]),
          totalGpu ? el("div", { class: "gpu-line" }, [
            `🟩 ${(n.spec.gpu || []).map(g => `${g.count}× ${g.model}`).join(", ")}`
          ]) : null,
          (() => {
            const cl = getNodeCluster(n.id);
            if (!cl) return null;
            const roles = Array.isArray(n.cluster_roles) ? n.cluster_roles : [];
            const roleStr = roles.map(r => r === "control-plane" ? "cp" : r).join(" + ") || "no-role";
            return el("div", { class: "cluster-badge" }, [
              `⎈ ${cl.name}`,
              el("span", { class: "role" }, [roleStr]),
            ]);
          })(),
        ]));
      }
      card.appendChild(grid);
    }

    // Storages (bottom of site)
    const storages = s.storages || [];
    if (storages.length) {
      const stRow = el("div", {
        style: { display: "flex", flexWrap: "wrap", gap: "8px", marginTop: "12px" },
      });
      for (const st of storages) {
        stRow.appendChild(el("div", {
          style: {
            background: "var(--surface2)",
            border: "1px solid var(--border)",
            borderRadius: "6px",
            padding: "6px 10px",
            cursor: "pointer",
            fontSize: "11px",
            display: "flex", alignItems: "center", gap: "6px",
          },
          onclick: () => selectEntity("storage", st.id),
        }, [
          el("span", {}, ["💾"]),
          el("strong", {}, [st.name]),
          el("span", { style: { color: "var(--text3)", fontFamily: "JetBrains Mono", fontSize: "10px" } }, [
            `${st.kind}/${st.protocol}${st.capacity_tb ? ` · ${st.capacity_tb}TB` : ""}`,
          ]),
        ]));
      }
      card.appendChild(stRow);
    }

    // External services (bottom — managed services)
    const exIconMap = { database: "🗄", cache: "⚡", queue: "📨", registry: "📦", backup: "💼", monitoring: "📊", logging: "📝", secret_store: "🔑", identity: "👤", object_store: "🪣", custom: "❓" };
    const extsvcs = s.external_services || [];
    if (extsvcs.length) {
      const exRow = el("div", {
        style: { display: "flex", flexWrap: "wrap", gap: "8px", marginTop: "12px" },
      });
      for (const e of extsvcs) {
        exRow.appendChild(el("div", {
          style: {
            background: "var(--surface2)",
            border: "1px dashed var(--purple)",
            borderRadius: "6px",
            padding: "6px 10px",
            cursor: "pointer",
            fontSize: "11px",
            display: "flex", alignItems: "center", gap: "6px",
          },
          onclick: () => selectEntity("extsvc", e.id),
        }, [
          el("span", {}, [exIconMap[e.kind] || "❓"]),
          el("strong", {}, [e.name]),
          el("span", { style: { color: "var(--text3)", fontFamily: "JetBrains Mono", fontSize: "10px" } }, [
            `${e.kind}${e.engine ? `/${e.engine}` : ""}${e.endpoint ? ` · ${e.endpoint}` : ""}`,
          ]),
        ]));
      }
      card.appendChild(exRow);
    }

    root.appendChild(card);
  }
}

//============ Render: Topology Diagram (SVG) ============
function renderTopologyDiagram(root, p) {
  if (!p.sites.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⛬"]),
      el("h2", {}, ["사이트가 없습니다"]),
      el("p", {}, ["트리에서 ＋ Add Site로 첫 사이트를 만드세요."]),
    ]));
    return;
  }
  const NS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs = {}, children = []) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v != null) node.setAttribute(k, v);
    }
    for (const c of [].concat(children)) {
      if (c == null) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  };

  // Layout constants
  const L4_H = 40, L4_W = 160, NODE_W = 180, NODE_H = 70, ST_H = 40, ST_W = 160;
  const ND_H = 36, ND_W = 140, EX_H = 40, EX_W = 160;
  const COL_GAP = 14, ROW_GAP = 30, SITE_PAD = 24, SITE_GAP = 40;
  const ITEM_GAP = 12;

  // Compute layout (top-down, sites stack vertically; or grid if many sites)
  // For simplicity: stack sites vertically.
  let cursorY = 10;
  let maxX = 0;
  const placed = []; // { kind, item, x, y, w, h, refIds }

  for (const s of p.sites) {
    const nodes = (s.node_ids || []).map(id => p.nodes.find(n => n.id === id)).filter(Boolean);
    const l4s = s.l4_balancers || [];
    const storages = s.storages || [];
    const netdevs = s.network_devices || [];
    const extsvcs = s.external_services || [];
    const nodesPerRow = Math.max(1, Math.min(nodes.length, 4));
    const nodeGridW = nodesPerRow * NODE_W + (nodesPerRow - 1) * COL_GAP;
    const l4RowW = l4s.length ? (l4s.length * L4_W + (l4s.length - 1) * ITEM_GAP) : 0;
    const stRowW = storages.length ? (storages.length * ST_W + (storages.length - 1) * ITEM_GAP) : 0;
    const ndRowW = netdevs.length ? (netdevs.length * ND_W + (netdevs.length - 1) * ITEM_GAP) : 0;
    const exRowW = extsvcs.length ? (extsvcs.length * EX_W + (extsvcs.length - 1) * ITEM_GAP) : 0;
    const innerW = Math.max(nodeGridW, l4RowW, stRowW, ndRowW, exRowW, 300);
    const siteW = innerW + SITE_PAD * 2;

    const nodeRows = Math.ceil(nodes.length / nodesPerRow) || 1;
    let innerH = 0;
    if (netdevs.length) innerH += ND_H + ROW_GAP;
    if (l4s.length) innerH += L4_H + ROW_GAP;
    innerH += nodeRows * NODE_H + (nodeRows - 1) * COL_GAP;
    if (storages.length) innerH += ROW_GAP + ST_H;
    if (extsvcs.length) innerH += ROW_GAP + EX_H;
    if (!nodes.length) innerH = Math.max(innerH, 80);
    const siteH = innerH + SITE_PAD * 2 + 20;

    const siteX = 10;
    const siteY = cursorY;
    placed.push({ kind: "site", item: s, x: siteX, y: siteY, w: siteW, h: siteH });

    let innerY = siteY + SITE_PAD + 20;

    // Network devices (top)
    if (netdevs.length) {
      const startX = siteX + SITE_PAD + (innerW - ndRowW) / 2;
      for (let i = 0; i < netdevs.length; i++) {
        placed.push({
          kind: "netdev", item: netdevs[i],
          x: startX + i * (ND_W + ITEM_GAP),
          y: innerY,
          w: ND_W, h: ND_H,
        });
      }
      innerY += ND_H + ROW_GAP;
    }

    // L4
    if (l4s.length) {
      const startX = siteX + SITE_PAD + (innerW - l4RowW) / 2;
      for (let i = 0; i < l4s.length; i++) {
        placed.push({
          kind: "l4", item: l4s[i],
          x: startX + i * (L4_W + ITEM_GAP),
          y: innerY,
          w: L4_W, h: L4_H,
        });
      }
      innerY += L4_H + ROW_GAP;
    }

    // Nodes (with cluster boundary tracking — collect bounds)
    const nodeStartX = siteX + SITE_PAD + (innerW - nodeGridW) / 2;
    const nodeBoundsByCluster = new Map();
    for (let i = 0; i < nodes.length; i++) {
      const r = Math.floor(i / nodesPerRow), col = i % nodesPerRow;
      const nx = nodeStartX + col * (NODE_W + COL_GAP);
      const ny = innerY + r * (NODE_H + COL_GAP);
      placed.push({
        kind: "node", item: nodes[i],
        x: nx, y: ny, w: NODE_W, h: NODE_H,
      });
      const cl = getNodeCluster(nodes[i].id);
      if (cl) {
        const b = nodeBoundsByCluster.get(cl.id) || { cluster: cl, minX: nx, minY: ny, maxX: nx + NODE_W, maxY: ny + NODE_H };
        b.minX = Math.min(b.minX, nx);
        b.minY = Math.min(b.minY, ny);
        b.maxX = Math.max(b.maxX, nx + NODE_W);
        b.maxY = Math.max(b.maxY, ny + NODE_H);
        nodeBoundsByCluster.set(cl.id, b);
      }
    }
    innerY += nodeRows * NODE_H + (nodeRows - 1) * COL_GAP;

    // Storage
    if (storages.length) {
      innerY += ROW_GAP;
      const startX = siteX + SITE_PAD + (innerW - stRowW) / 2;
      for (let i = 0; i < storages.length; i++) {
        placed.push({
          kind: "storage", item: storages[i],
          x: startX + i * (ST_W + ITEM_GAP),
          y: innerY,
          w: ST_W, h: ST_H,
        });
      }
      innerY += ST_H;
    }

    // External services
    if (extsvcs.length) {
      innerY += ROW_GAP;
      const startX = siteX + SITE_PAD + (innerW - exRowW) / 2;
      for (let i = 0; i < extsvcs.length; i++) {
        placed.push({
          kind: "extsvc", item: extsvcs[i],
          x: startX + i * (EX_W + ITEM_GAP),
          y: innerY,
          w: EX_W, h: EX_H,
        });
      }
    }

    // Save cluster bounds for this site
    placed.push({ kind: "_cluster_bounds", siteId: s.id, bounds: nodeBoundsByCluster });

    maxX = Math.max(maxX, siteX + siteW);
    cursorY += siteH + SITE_GAP;
  }

  const totalW = maxX + 20;
  const totalH = cursorY + 10;
  const root_svg = svg("svg", {
    width: "100%",
    viewBox: `0 0 ${totalW} ${totalH}`,
    style: "background:var(--bg);border:1px solid var(--border);border-radius:8px;",
  });

  // Theme tokens (read from CSS)
  const colors = {
    bg: "#08090c",
    surface: "#111318",
    surface2: "#181b23",
    border: "#252a36",
    border2: "#353c4d",
    text: "#e8ecf4",
    text2: "#8892a4",
    text3: "#5a6377",
    accent: "#4d9cff",
    purple: "#a78bfa",
    green: "#34d399",
    yellow: "#fbbf24",
    orange: "#fb923c",
  };

  const placedById = new Map();
  for (const it of placed) if (it.item?.id) placedById.set(`${it.kind}:${it.item.id}`, it);

  // Helper: site that owns this L4/storage entity
  const ownerSiteOf = entityKind => entityId => {
    const arrKey = entityKind === "l4" ? "l4_balancers" : "storages";
    return placed.find(x => x.kind === "site" && (x.item[arrKey] || []).some(it => it.id === entityId));
  };

  // STEP 1: Draw site rects first (background)
  for (const it of placed) {
    if (it.kind !== "site") continue;
    const isOnprem = it.item.kind === "onprem";
    root_svg.appendChild(svg("rect", {
      x: it.x, y: it.y, width: it.w, height: it.h,
      rx: 10, ry: 10,
      fill: colors.surface, stroke: colors.border, "stroke-width": 1.5,
    }));
    root_svg.appendChild(svg("text", {
      x: it.x + 14, y: it.y + 22,
      fill: colors.text, "font-size": "13", "font-weight": "600",
      "font-family": "Pretendard, sans-serif",
    }, [it.item.name]));
    root_svg.appendChild(svg("text", {
      x: it.x + it.w - 14, y: it.y + 22,
      "text-anchor": "end",
      fill: isOnprem ? colors.orange : colors.accent,
      "font-size": "10", "font-family": "JetBrains Mono",
    }, [it.item.kind]));
  }

  // SVG defs (arrowhead markers)
  const defs = svg("defs", {}, []);
  const mkMarker = (id, color) => svg("marker", {
    id, viewBox: "0 0 10 10", refX: 8, refY: 5,
    markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse",
  }, [
    svg("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: color }),
  ]);
  defs.appendChild(mkMarker("arrow-accent", colors.accent));
  defs.appendChild(mkMarker("arrow-green", colors.green));
  defs.appendChild(mkMarker("arrow-purple", colors.purple));
  defs.appendChild(mkMarker("arrow-orange", colors.orange));
  root_svg.appendChild(defs);

  // Read layer toggles
  const layers = state.ui.topologyLayers || { compute: true, network: false, services: false, ingress: false, sites: true };

  // Compute cluster bounds (for ingress/services connections)
  const clusterBounds = new Map();
  const clusterColors = ["#a78bfa", "#34d399", "#fbbf24", "#f87171", "#4d9cff"];
  const clusterIdxByKey = new Map();
  let cidx = 0;
  for (const it of placed) {
    if (it.kind !== "_cluster_bounds") continue;
    for (const [cid, b] of it.bounds) {
      let i = clusterIdxByKey.get(cid);
      if (i == null) { i = cidx++; clusterIdxByKey.set(cid, i); }
      const PAD = 8;
      clusterBounds.set(cid, {
        x: b.minX - PAD, y: b.minY - PAD,
        w: (b.maxX - b.minX) + PAD * 2,
        h: (b.maxY - b.minY) + PAD * 2,
        cluster: b.cluster,
        color: clusterColors[i % clusterColors.length],
      });
    }
  }

  // STEP 1.5: Cluster boundary boxes
  for (const [cid, cb] of clusterBounds) {
    root_svg.appendChild(svg("rect", {
      x: cb.x, y: cb.y, width: cb.w, height: cb.h,
      rx: 8, ry: 8,
      fill: cb.color, "fill-opacity": 0.05,
      stroke: cb.color, "stroke-opacity": 0.5, "stroke-width": 1, "stroke-dasharray": "5,3",
    }));
    root_svg.appendChild(svg("text", {
      x: cb.x + 6, y: cb.y - 4,
      fill: cb.color, "font-size": "10", "font-family": "JetBrains Mono", "font-weight": "600",
    }, [`⎈ ${cb.cluster.name}`]));
  }

  // STEP 2: Draw connection lines (above site rects, below inner boxes)
  // ── Compute layer ──
  if (layers.compute) {
  // L4 → worker nodes
  for (const it of placed) {
    if (it.kind !== "l4") continue;
    const targets = it.item.target_cluster_ids || [];
    let targetNodes = [];
    if (targets.length) {
      for (const cid of targets) {
        const c = p.clusters.find(x => x.id === cid);
        if (!c) continue;
        for (const nid of c.node_ids || []) {
          const n = p.nodes.find(x => x.id === nid);
          if (n && (n.cluster_roles || []).includes("worker")) {
            const placement = placedById.get("node:" + nid);
            if (placement) targetNodes.push(placement);
          }
        }
      }
    } else {
      // Fallback: same-site worker nodes
      const owner = ownerSiteOf("l4")(it.item.id);
      const ownerSiteId = owner?.item?.id;
      for (const np of placed) {
        if (np.kind !== "node") continue;
        if (ownerSiteId && np.item.site_id !== ownerSiteId) continue;
        if ((np.item.cluster_roles || []).includes("worker")) targetNodes.push(np);
      }
    }
    for (const tgt of targetNodes) {
      root_svg.appendChild(svg("line", {
        x1: it.x + it.w / 2, y1: it.y + it.h,
        x2: tgt.x + tgt.w / 2, y2: tgt.y,
        stroke: colors.accent, "stroke-width": 2, "stroke-opacity": 0.7,
      }));
    }
  }

  // Storage → cluster nodes (same fallback)
  for (const it of placed) {
    if (it.kind !== "storage") continue;
    const targets = it.item.target_cluster_ids || [];
    let targetNodes = [];
    if (targets.length) {
      for (const cid of targets) {
        const c = p.clusters.find(x => x.id === cid);
        if (!c) continue;
        for (const nid of c.node_ids || []) {
          const placement = placedById.get("node:" + nid);
          if (placement) targetNodes.push(placement);
        }
      }
    } else {
      // Fallback: all nodes in same site that belong to a cluster
      const owner = ownerSiteOf("storage")(it.item.id);
      const ownerSiteId = owner?.item?.id;
      for (const np of placed) {
        if (np.kind !== "node") continue;
        if (ownerSiteId && np.item.site_id !== ownerSiteId) continue;
        if (getNodeCluster(np.item.id)) targetNodes.push(np);
      }
    }
    for (const tgt of targetNodes) {
      root_svg.appendChild(svg("line", {
        x1: it.x + it.w / 2, y1: it.y,
        x2: tgt.x + tgt.w / 2, y2: tgt.y + tgt.h,
        stroke: colors.green, "stroke-width": 2, "stroke-opacity": 0.7,
        "stroke-dasharray": "5,3",
      }));
    }
  }
  } // end compute layer

  // ── Network layer: Firewall→L4, Switch→Nodes, Router→L4 ──
  if (layers.network) {
    const ownerSiteOfDevice = (devId) =>
      placed.find(x => x.kind === "site" && (x.item.network_devices || []).some(d => d.id === devId));
    for (const it of placed) {
      if (it.kind !== "netdev") continue;
      const owner = ownerSiteOfDevice(it.item.id);
      if (!owner) continue;
      const ownerSiteId = owner.item.id;
      // Find L4s in same site
      const l4sInSite = placed.filter(x =>
        x.kind === "l4" && (owner.item.l4_balancers || []).some(l => l.id === x.item.id));
      const nodesInSite = placed.filter(x => x.kind === "node" && x.item.site_id === ownerSiteId);

      if (it.item.kind === "firewall" || it.item.kind === "waf" || it.item.kind === "ddos" || it.item.kind === "router") {
        // Perimeter device → connect to all L4s in same site
        for (const l4 of l4sInSite) {
          root_svg.appendChild(svg("line", {
            x1: it.x + it.w / 2, y1: it.y + it.h,
            x2: l4.x + l4.w / 2, y2: l4.y,
            stroke: colors.orange, "stroke-width": 2, "stroke-opacity": 0.7,
            "marker-end": "url(#arrow-orange)",
          }));
        }
      } else if (it.item.kind === "switch") {
        // Switch → all nodes in same site (uplink, dotted)
        for (const np of nodesInSite) {
          root_svg.appendChild(svg("line", {
            x1: it.x + it.w / 2, y1: it.y + it.h,
            x2: np.x + np.w / 2, y2: np.y,
            stroke: colors.text3, "stroke-width": 1, "stroke-opacity": 0.4,
            "stroke-dasharray": "1,3",
          }));
        }
      } else if (it.item.kind === "vpn" || it.item.kind === "cdn" || it.item.kind === "dns") {
        // Edge devices: just connect to first L4 (or skip)
        if (l4sInSite[0]) {
          root_svg.appendChild(svg("line", {
            x1: it.x + it.w / 2, y1: it.y + it.h,
            x2: l4sInSite[0].x + l4sInSite[0].w / 2, y2: l4sInSite[0].y,
            stroke: colors.orange, "stroke-width": 1.5, "stroke-opacity": 0.4,
            "stroke-dasharray": "3,3",
          }));
        }
      }
    }
  }

  // ── Services layer: External Service → Cluster ──
  if (layers.services) {
    for (const it of placed) {
      if (it.kind !== "extsvc") continue;
      const targets = it.item.target_cluster_ids || [];
      // Fallback: same-site clusters
      let resolved = targets;
      if (!resolved.length) {
        const owner = placed.find(x =>
          x.kind === "site" && (x.item.external_services || []).some(s => s.id === it.item.id));
        if (owner) {
          const ownerSiteId = owner.item.id;
          // Clusters where any node is in this site
          const clusterIds = new Set();
          for (const c of (p.clusters || [])) {
            if ((c.node_ids || []).some(nid => {
              const n = p.nodes.find(x => x.id === nid);
              return n?.site_id === ownerSiteId;
            })) clusterIds.add(c.id);
          }
          resolved = Array.from(clusterIds);
        }
      }
      for (const cid of resolved) {
        const cb = clusterBounds.get(cid);
        if (!cb) continue;
        // Line from extsvc top to cluster boundary bottom (extsvc is below cluster)
        const exX = it.x + it.w / 2;
        const cbX = cb.x + cb.w / 2;
        root_svg.appendChild(svg("line", {
          x1: exX, y1: it.y,
          x2: cbX, y2: cb.y + cb.h,
          stroke: colors.purple, "stroke-width": 1.5, "stroke-opacity": 0.6,
          "stroke-dasharray": "5,4",
          "marker-end": "url(#arrow-purple)",
        }));
      }
    }
  }

  // ── Ingress layer: external host → cluster ──
  if (layers.ingress) {
    for (const c of (p.clusters || [])) {
      const cb = clusterBounds.get(c.id);
      if (!cb) continue;
      const rules = c.ingress_rules || [];
      for (let i = 0; i < rules.length; i++) {
        const r = rules[i];
        const arrowX = cb.x + 30 + i * 110;
        // Don't go past cluster width
        const ax = Math.min(arrowX, cb.x + cb.w - 30);
        const arrowYStart = cb.y - 26;
        const arrowYEnd = cb.y - 1;
        const lineColor = r.tls ? colors.green : colors.accent;
        root_svg.appendChild(svg("text", {
          x: ax, y: arrowYStart - 4, fill: lineColor,
          "font-size": "9", "font-family": "JetBrains Mono", "font-weight": "600",
        }, [`${r.tls ? "🔒" : "🌐"} ${r.host}`]));
        root_svg.appendChild(svg("line", {
          x1: ax, y1: arrowYStart,
          x2: ax, y2: arrowYEnd,
          stroke: lineColor, "stroke-width": 1.5, "stroke-opacity": 0.8,
          "marker-end": r.tls ? "url(#arrow-green)" : "url(#arrow-accent)",
        }));
      }
    }
  }

  // STEP 3: Draw inner boxes (above lines)
  for (const it of placed) {
    if (it.kind === "site" || it.kind === "_cluster_bounds") continue;
    if (it.kind === "netdev") {
      const ndIcon = { switch: "⇄", router: "⊞", firewall: "🛡", waf: "🛡", cdn: "🌍", vpn: "🔐", dns: "🌐", ddos: "⚠" };
      const haColor = it.item.ha ? colors.green : colors.border2;
      const g = svg("g", { style: "cursor:pointer", onclick: () => selectEntity("netdev", it.item.id) });
      g.appendChild(svg("rect", {
        x: it.x, y: it.y, width: it.w, height: it.h, rx: 6, ry: 6,
        fill: colors.surface2, stroke: haColor, "stroke-width": 1.5,
      }));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 14, fill: colors.text, "font-size": "10", "font-weight": "600",
      }, [`${ndIcon[it.item.kind] || "▢"} ${it.item.name}`]));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 27, fill: colors.text2, "font-size": "9", "font-family": "JetBrains Mono",
      }, [`${it.item.kind}${it.item.vendor ? ` · ${it.item.vendor}` : ""}`]));
      root_svg.appendChild(g);
      continue;
    }
    if (it.kind === "extsvc") {
      const exIcon = { database: "🗄", cache: "⚡", queue: "📨", registry: "📦", backup: "💼", monitoring: "📊", logging: "📝", secret_store: "🔑", identity: "👤", object_store: "🪣", custom: "❓" };
      const g = svg("g", { style: "cursor:pointer", onclick: () => selectEntity("extsvc", it.item.id) });
      g.appendChild(svg("rect", {
        x: it.x, y: it.y, width: it.w, height: it.h, rx: 6, ry: 6,
        fill: colors.surface2, stroke: colors.purple, "stroke-width": 1.5,
        "stroke-dasharray": "6,2",
      }));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 16, fill: colors.text, "font-size": "11", "font-weight": "600",
      }, [`${exIcon[it.item.kind] || "❓"} ${it.item.name}`]));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 30, fill: colors.text2, "font-size": "10", "font-family": "JetBrains Mono",
      }, [`${it.item.kind}${it.item.engine ? `/${it.item.engine}` : ""}`]));
      root_svg.appendChild(g);
      continue;
    }
    if (it.kind === "l4") {
      const haColor = it.item.ha ? colors.green : colors.border2;
      const g = svg("g", { style: "cursor:pointer", onclick: () => selectEntity("l4", it.item.id) });
      g.appendChild(svg("rect", {
        x: it.x, y: it.y, width: it.w, height: it.h, rx: 6, ry: 6,
        fill: colors.surface2, stroke: haColor, "stroke-width": 1.5,
      }));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 16, fill: colors.text, "font-size": "11", "font-weight": "600",
      }, ["⚖ " + it.item.name]));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 30, fill: colors.text2, "font-size": "10", "font-family": "JetBrains Mono",
      }, [`${it.item.vendor || it.item.kind}${it.item.vip ? ` ${it.item.vip}` : ""}`]));
      root_svg.appendChild(g);
      continue;
    }
    if (it.kind === "storage") {
      const g = svg("g", { style: "cursor:pointer", onclick: () => selectEntity("storage", it.item.id) });
      g.appendChild(svg("rect", {
        x: it.x, y: it.y, width: it.w, height: it.h, rx: 6, ry: 6,
        fill: colors.surface2, stroke: colors.border2, "stroke-width": 1.5,
      }));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 16, fill: colors.text, "font-size": "11", "font-weight": "600",
      }, ["💾 " + it.item.name]));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 30, fill: colors.text2, "font-size": "10", "font-family": "JetBrains Mono",
      }, [`${it.item.kind}/${it.item.protocol}${it.item.capacity_tb ? ` ${it.item.capacity_tb}TB` : ""}`]));
      root_svg.appendChild(g);
      continue;
    }
    if (it.kind === "node") {
      const cluster = getNodeCluster(it.item.id);
      const isSelected = state.ui.selectedKind === "node" && state.ui.selectedId === it.item.id;
      const stroke = isSelected ? colors.accent : (cluster ? colors.purple : colors.border);
      const g = svg("g", { style: "cursor:pointer", onclick: () => selectEntity("node", it.item.id) });
      g.appendChild(svg("rect", {
        x: it.x, y: it.y, width: it.w, height: it.h, rx: 6, ry: 6,
        fill: colors.surface2, stroke, "stroke-width": isSelected ? 2 : 1.5,
      }));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 16, fill: colors.text, "font-size": "11", "font-weight": "600",
      }, ["▣ " + it.item.name]));
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 30, fill: colors.text2, "font-size": "9", "font-family": "JetBrains Mono",
      }, [`${it.item.brand} ${it.item.spec?.form_factor || ""}`]));
      // GPU line
      const totalGpu = (it.item.spec?.gpu || []).reduce((a, g) => a + (g.count || 0), 0);
      g.appendChild(svg("text", {
        x: it.x + 8, y: it.y + 44, fill: colors.text2, "font-size": "9", "font-family": "JetBrains Mono",
      }, [`${it.item.spec?.vcpu}c · ${it.item.spec?.memory_gb}GB${totalGpu ? ` · ${totalGpu} GPU` : ""}`]));
      // Cluster + role
      if (cluster) {
        const roleStr = (it.item.cluster_roles || []).map(r => r === "control-plane" ? "cp" : r).join("+");
        g.appendChild(svg("text", {
          x: it.x + 8, y: it.y + 60, fill: colors.purple, "font-size": "9", "font-family": "JetBrains Mono",
        }, [`⎈ ${cluster.name} ${roleStr}`]));
      }
      // Node IP
      if (it.item.network?.ip) {
        g.appendChild(svg("text", {
          x: it.x + it.w - 8, y: it.y + 60, "text-anchor": "end",
          fill: colors.text3, "font-size": "9", "font-family": "JetBrains Mono",
        }, [it.item.network.ip]));
      }
      root_svg.appendChild(g);
    }
  }

  // STEP 4: Site links (project-level, between sites)
  if (layers.sites) {
  for (const link of (p.site_links || [])) {
    const fromSite = placed.find(x => x.kind === "site" && x.item.id === link.from_site_id);
    const toSite = placed.find(x => x.kind === "site" && x.item.id === link.to_site_id);
    if (!fromSite || !toSite) continue;
    // Connect site rects (right edge of upper site to left edge of lower)
    const x1 = fromSite.x + fromSite.w;
    const y1 = fromSite.y + fromSite.h / 2;
    const x2 = toSite.x + toSite.w;
    const y2 = toSite.y + toSite.h / 2;
    // Use a curved path between sites
    const cx = Math.max(x1, x2) + 60;
    const path = `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
    const linkColor = { vpn: colors.purple, direct_connect: colors.accent, internet: colors.text3, leased: colors.green, private_link: colors.orange }[link.kind] || colors.accent;
    const g = svg("g", { style: "cursor:pointer", onclick: () => selectEntity("sitelink", link.id) });
    g.appendChild(svg("path", {
      d: path, fill: "none", stroke: linkColor, "stroke-width": 2, "stroke-opacity": 0.7,
      "stroke-dasharray": link.kind === "internet" ? "3,3" : "",
    }));
    // Label
    const midY = (y1 + y2) / 2;
    g.appendChild(svg("rect", {
      x: cx + 8, y: midY - 10, width: 100, height: 20, rx: 4, ry: 4,
      fill: colors.surface, stroke: linkColor, "stroke-width": 1,
    }));
    g.appendChild(svg("text", {
      x: cx + 58, y: midY + 4, "text-anchor": "middle",
      fill: linkColor, "font-size": "9", "font-family": "JetBrains Mono",
    }, [`${link.kind}${link.bandwidth_gbps ? ` ${link.bandwidth_gbps}G` : ""}`]));
    root_svg.appendChild(g);
  }
  } // end sites layer

  // Legend
  const legend = el("div", {
    style: { fontSize: "10px", color: "var(--text3)", marginTop: "8px", display: "flex", gap: "12px", fontFamily: "JetBrains Mono", flexWrap: "wrap" },
  }, [
    el("span", {}, [`⚖ L4 LB`]),
    el("span", {}, [`▣ Node`]),
    el("span", {}, [`💾 Storage`]),
    el("span", {}, [`🛡 Network Device`]),
    el("span", {}, [`🗄 External Service (점선)`]),
    el("span", { style: { color: "var(--purple)" } }, ["⎈ Cluster boundary"]),
    el("span", { style: { color: "var(--accent)" } }, ["—— L4→Worker"]),
    el("span", { style: { color: "var(--green)" } }, ["- - Storage→Node"]),
    el("span", { style: { color: "var(--purple)" } }, ["~~ Site Link"]),
  ]);

  root.appendChild(root_svg);
  root.appendChild(legend);
}

//============ Scheduling simulation (first-fit) ============
function simulateScheduling(project) {
  const gpuModels = state.catalog.gpuModels;
  // Per-node remaining capacity (worker nodes only)
  const remaining = new Map();
  for (const n of project.nodes || []) {
    if (!(n.cluster_roles || []).includes("worker")) continue;
    const gpus = n.spec?.gpu || [];
    const totalGpu = gpus.reduce((a, g) => a + (g.count || 0), 0);
    const totalVram = gpus.reduce((a, g) => a + (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0), 0);
    const byModel = new Map();
    for (const g of gpus) byModel.set(g.model, (byModel.get(g.model) || 0) + (g.count || 0));
    remaining.set(n.id, {
      cpu: n.spec?.vcpu || 0,
      mem: n.spec?.memory_gb || 0,
      gpu: totalGpu,
      vram: totalVram,
      gpuByModel: byModel,
    });
  }

  const placements = new Map();   // nodeId → array of { workloadId, workloadName, replicaIdx, cpuReq, memReq, gpuReq, gpuModel }
  const unscheduled = [];

  for (const c of project.clusters || []) {
    const workers = (c.node_ids || [])
      .map(id => project.nodes.find(n => n.id === id))
      .filter(n => n && (n.cluster_roles || []).includes("worker"));
    for (const w of c.workloads || []) {
      const reqs = w.resources?.requests || {};
      const cpuReq = reqs.cpu || 0;
      const memReq = reqs.memory_gb || 0;
      const gpuReq = reqs.gpu?.count || 0;
      const gpuModel = reqs.gpu?.model;
      const vramReq = (reqs.gpu?.vram_gb || 0) * gpuReq;
      for (let i = 0; i < (w.replicas || 1); i++) {
        let placedNode = null;
        for (const n of workers) {
          const r = remaining.get(n.id);
          if (!r) continue;
          if (r.cpu < cpuReq || r.mem < memReq || r.gpu < gpuReq || r.vram < vramReq) continue;
          if (gpuModel && (r.gpuByModel.get(gpuModel) || 0) < gpuReq) continue;
          // Place
          r.cpu -= cpuReq; r.mem -= memReq; r.gpu -= gpuReq; r.vram -= vramReq;
          if (gpuModel && gpuReq > 0) r.gpuByModel.set(gpuModel, r.gpuByModel.get(gpuModel) - gpuReq);
          placedNode = n.id;
          break;
        }
        if (placedNode) {
          if (!placements.has(placedNode)) placements.set(placedNode, []);
          placements.get(placedNode).push({
            workloadId: w.id, workloadName: w.name, replicaIdx: i,
            cpuReq, memReq, gpuReq, gpuModel,
          });
        } else {
          unscheduled.push({
            workloadId: w.id, workloadName: w.name, replicaIdx: i,
            clusterId: c.id, clusterName: c.name,
            reqs: { cpu: cpuReq, mem: memReq, gpu: gpuReq, gpuModel },
          });
        }
      }
    }
  }
  return { placements, unscheduled };
}

//============ Render: Capacity view ============
function renderCapacity() {
  const root = $("#viewBody");
  root.innerHTML = "";
  const p = state.project;
  if (!p) return;
  const clusters = p.clusters || [];
  if (!clusters.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⌘"]),
      el("h2", {}, ["Capacity 뷰"]),
      el("p", {}, ["클러스터에 노드와 워크로드가 있어야 의미 있는 결과가 나옵니다."]),
    ]));
    return;
  }
  const gpuModels = state.catalog.gpuModels;
  const sim = simulateScheduling(p);
  const totalPods = clusters.reduce((a, c) => a + (c.workloads || []).reduce((aa, w) => aa + (w.replicas || 1), 0), 0);
  const placedPods = totalPods - sim.unscheduled.length;

  // Top summary
  const summary = el("div", { class: "next-hint" }, [
    el("span", { class: "icon" }, ["⎈"]),
    el("div", { class: "body" }, [
      el("div", { class: "head" }, [
        "Scheduling simulation (first-fit) ", helpIcon("view.capacity"),
      ]),
      el("div", { class: "lead" }, [
        `${placedPods}/${totalPods} pods placed`,
        sim.unscheduled.length
          ? el("span", { style: { color: "var(--red)", marginLeft: "10px" } }, [`⊗ ${sim.unscheduled.length} unschedulable`])
          : el("span", { style: { color: "var(--green)", marginLeft: "10px" } }, ["✓ all placed"]),
      ]),
    ]),
  ]);
  root.appendChild(summary);

  for (const c of clusters) {
    root.appendChild(renderCapacityCluster(c, sim, p, gpuModels));
  }
  if (sim.unscheduled.length) {
    root.appendChild(renderUnscheduled(sim.unscheduled));
  }
}

function renderCapacityCluster(c, sim, project, gpuModels) {
  const card = el("div", { class: "topo-site" });
  const allNodes = (c.node_ids || []).map(id => project.nodes.find(n => n.id === id)).filter(Boolean);
  const workers = allNodes.filter(n => (n.cluster_roles || []).includes("worker"));
  const cpOnly = allNodes.filter(n => (n.cluster_roles || []).length > 0 && !(n.cluster_roles || []).includes("worker"));

  card.appendChild(el("div", { class: "topo-site-header" }, [
    el("span", { class: "name" }, [c.name]),
    el("span", {
      class: "kind",
      style: { background: "rgba(167,139,250,.15)", color: "var(--purple)" },
    }, ["cluster"]),
    el("span", { class: "region" }, [
      `${workers.length} worker · ${cpOnly.length} cp-only · ${(c.workloads || []).length} workloads`,
    ]),
  ]));

  if (!workers.length) {
    card.appendChild(el("div", { class: "topo-empty-site" }, ["worker 노드 없음 — 워크로드 스케줄 불가"]));
    return card;
  }

  const list = el("div", { style: { display: "flex", flexDirection: "column", gap: "12px" } });
  for (const n of workers) list.appendChild(renderCapacityNode(n, sim, gpuModels));
  card.appendChild(list);
  return card;
}

function renderCapacityNode(n, sim, gpuModels) {
  const placed = sim.placements.get(n.id) || [];
  const usedCpu = placed.reduce((a, p) => a + p.cpuReq, 0);
  const usedMem = placed.reduce((a, p) => a + p.memReq, 0);
  const usedGpu = placed.reduce((a, p) => a + p.gpuReq, 0);
  const usedVram = placed.reduce((a, p) =>
    a + (p.gpuModel ? (gpuModels[p.gpuModel]?.vram_gb || 0) * p.gpuReq : 0), 0);

  const totCpu = n.spec?.vcpu || 0;
  const totMem = n.spec?.memory_gb || 0;
  const gpus = n.spec?.gpu || [];
  const totGpu = gpus.reduce((a, g) => a + (g.count || 0), 0);
  const totVram = gpus.reduce((a, g) => a + (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0), 0);
  const psuMax = n.spec?.power?.psu_max_w || 0;
  const power = computeNodePowerW(n, gpuModels);
  const roleStr = (n.cluster_roles || []).map(r => r === "control-plane" ? "cp" : r).join("+") || "no-role";

  const card = el("div", {
    class: "topo-node",
    style: { cursor: "pointer" },
    onclick: () => selectEntity("node", n.id),
  });
  card.appendChild(el("div", { class: "node-name" }, [n.name]));
  card.appendChild(el("div", { class: "node-model" }, [
    `${n.brand} · ${n.model} · ${n.spec?.form_factor || ""} · ${roleStr}`,
  ]));

  const bars = el("div", {
    style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px 16px", marginTop: "10px" },
  });
  bars.appendChild(makeBarLine("CPU", `${usedCpu.toFixed(1)}/${totCpu}c`, totCpu > 0 ? usedCpu / totCpu * 100 : 0));
  bars.appendChild(makeBarLine("Memory", `${usedMem.toFixed(0)}/${totMem} GB`, totMem > 0 ? usedMem / totMem * 100 : 0));
  if (totGpu > 0) {
    bars.appendChild(makeBarLine("GPU", `${usedGpu}/${totGpu}`, totGpu > 0 ? usedGpu / totGpu * 100 : 0));
    if (totVram > 0) bars.appendChild(makeBarLine("VRAM", `${usedVram}/${totVram} GB`, usedVram / totVram * 100));
  }
  if (n.source === "onprem" && psuMax > 0) {
    bars.appendChild(makeBarLine("PSU", `${power}/${psuMax} W`, power / psuMax * 100));
  }
  card.appendChild(bars);

  if (placed.length) {
    const podBox = el("div", {
      style: { marginTop: "10px", padding: "8px 10px", background: "var(--bg)", borderRadius: "5px" },
    });
    podBox.appendChild(el("div", {
      style: { fontSize: "10px", color: "var(--text2)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "6px", fontWeight: 600 },
    }, [`${placed.length} pods placed`]));
    // Group by workload
    const byWl = new Map();
    for (const p of placed) {
      const e = byWl.get(p.workloadId) || { name: p.workloadName, count: 0, cpu: 0, mem: 0, gpu: 0 };
      e.count += 1; e.cpu += p.cpuReq; e.mem += p.memReq; e.gpu += p.gpuReq;
      byWl.set(p.workloadId, e);
    }
    for (const [wlId, info] of byWl) {
      const row = el("div", {
        style: { fontSize: "11px", padding: "3px 0", display: "flex", gap: "8px", cursor: "pointer", color: "var(--text2)" },
        onclick: e => { e.stopPropagation(); selectEntity("workload", wlId); },
      }, [
        el("span", {}, [`◇ ${info.name} × ${info.count}`]),
        el("span", { style: { color: "var(--text3)", marginLeft: "auto", fontFamily: "JetBrains Mono", fontSize: "10px" } }, [
          `${info.cpu.toFixed(1)}c · ${info.mem.toFixed(0)}GB${info.gpu ? ` · ${info.gpu} GPU` : ""}`,
        ]),
      ]);
      podBox.appendChild(row);
    }
    card.appendChild(podBox);
  } else {
    card.appendChild(el("div", {
      style: { marginTop: "10px", color: "var(--text3)", fontSize: "11px", fontStyle: "italic", textAlign: "center", padding: "6px" },
    }, ["할당된 pod 없음"]));
  }

  return card;
}

      el("div", { class: "big" }, ["▦"]),

      el("p", {}, ["클러스터에 네임스페이스를 추가하면 여기서 그래프로 보입니다."]),

function renderNamespaceCluster(c) {
  const card = el("div", { class: "topo-site" });
  card.appendChild(el("div", { class: "topo-site-header" }, [
    el("span", { class: "name" }, [c.name]),
    el("span", { class: "kind", style: { background: "rgba(167,139,250,.15)", color: "var(--purple)" } }, ["cluster"]),
    el("span", { class: "region" }, [
      `${(c.namespaces || []).length} namespaces · ${(c.network_policies || []).length} policies · ${(c.workloads || []).length} workloads`,
    ]),
  ]));

  // Group workloads by namespace
  const byNs = new Map();
  byNs.set("default", { ns: null, workloads: [] });
  for (const ns of c.namespaces || []) byNs.set(ns.name, { ns, workloads: [] });
  for (const w of c.workloads || []) {
    const k = w.namespace || "default";
    if (!byNs.has(k)) byNs.set(k, { ns: null, workloads: [] });
    byNs.get(k).workloads.push(w);
  }

  const grid = el("div", {
    style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: "12px" },
  });
  for (const [nsName, info] of byNs) {
    const isDeny = info.ns?.default_deny;
    const nsCard = el("div", {
      style: {
        background: "var(--surface2)",
        border: "1px solid " + (isDeny ? "var(--orange)" : "var(--border)"),
        borderRadius: "8px",
        padding: "12px",
        cursor: "pointer",
      },
      onclick: () => selectEntity("cluster", c.id),
    });
    nsCard.appendChild(el("div", {
      style: { display: "flex", alignItems: "center", gap: "6px", marginBottom: "8px" },
    }, [
      el("span", {}, [isDeny ? "🔒" : "▦"]),
      el("span", { style: { fontWeight: 600, fontSize: "13px" } }, [nsName]),
      isDeny ? el("span", {
        style: { fontSize: "10px", padding: "1px 5px", background: "rgba(251,146,60,.15)", color: "var(--orange)", borderRadius: "3px", fontFamily: "JetBrains Mono", textTransform: "uppercase", letterSpacing: "0.04em" },
      }, ["deny"]) : null,
      !info.ns && nsName !== "default" ? el("span", {
        style: { fontSize: "10px", color: "var(--yellow)", marginLeft: "auto" },
        title: "namespace not declared in cluster",
      }, ["⚠"]) : null,
    ]));
    if (info.workloads.length === 0) {
      nsCard.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text3)", fontStyle: "italic" } }, ["워크로드 없음"]));
    } else {
      for (const w of info.workloads) {
        nsCard.appendChild(el("div", {
          style: { fontSize: "12px", padding: "4px 8px", margin: "2px 0", background: "var(--surface)", borderRadius: "4px", cursor: "pointer", display: "flex", gap: "8px" },
          onclick: e => { e.stopPropagation(); selectEntity("workload", w.id); },
        }, [
          el("span", {}, [`◇ ${w.name}`]),
          el("span", { style: { color: "var(--text3)", marginLeft: "auto", fontSize: "10px", fontFamily: "JetBrains Mono" } }, [
            `×${w.replicas}${w.category ? ` · ${w.category}` : ""}`,
          ]),
        ]));
      }
    }
    grid.appendChild(nsCard);
  }
  card.appendChild(grid);

  // NetworkPolicies
  const nps = c.network_policies || [];
  if (nps.length) {
    const title = el("div", { class: "section-title", style: { marginTop: "16px" } }, [`Network Policies (${nps.length})`]);
    title.appendChild(helpIcon("networkpolicy.preset"));
    card.appendChild(title);
    const npList = el("div", { class: "row-list" });
    for (const np of nps) {
      let presetDesc = "custom";
      if (np.preset === "default-deny") presetDesc = "🔒 deny all";
      else if (np.preset === "allow-from-same-ns") presetDesc = `same-ns →`;
      else if (np.preset === "allow-from-namespace") presetDesc = `${(np.ingress?.[0]?.from_namespaces || ["?"]).join(",")} →`;
      else if (np.preset === "allow-from-ingress") presetDesc = `🌐 ingress →`;
      npList.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, ["🔗"]),
        el("span", { class: "name", style: { fontSize: "12px" } }, [np.name]),
        el("span", { style: { fontSize: "11px", color: "var(--text2)", fontFamily: "JetBrains Mono", marginLeft: "auto" } }, [
          `${presetDesc} ${np.namespace}`,
        ]),
      ]));
    }
    card.appendChild(npList);
  }

  // Hint to use cluster inspector to manage
  card.appendChild(el("div", {
    style: { marginTop: "12px", fontSize: "11px", color: "var(--text3)", fontStyle: "italic" },
  }, [`💡 NS·NP 추가/수정은 클러스터 인스펙터 (오른쪽 패널) 에서`]));

  return card;
}

//============ Render: Architecture (switch-bus diagram, Korean style) ============
function renderArchitecture() {
  const root = $("#viewBody");
  root.innerHTML = "";
  const p = state.project;
  if (!p?.clusters?.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⊟"]),
      el("h2", {}, ["Network Architecture"]),
      el("p", {}, ["클러스터·워크로드가 있어야 표시됩니다."]),
    ]));
    return;
  }

  const NS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs = {}, children = []) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v != null) node.setAttribute(k, v);
    }
    for (const c of [].concat(children)) {
      if (c == null) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  };

  // Classification
  const platformNs = new Set(["kube-system", "ingress-nginx", "cert-manager",
    "monitoring", "logging", "velero", "external-secrets", "argocd", "istio-system"]);
  const isStateful = w => w.kind === "StatefulSet" || ["DB", "Cache", "Queue"].includes(w.category);
  const isPlatform = w => platformNs.has(w.namespace || "default");

  // Pre-compute L4 → workload routing (via cluster.ingress_rules.paths).
  // Only "compute" (non-platform, non-stateful) workloads become L4 children.
  // childWorkloadIds: set of workload IDs that should NOT appear as siblings
  // (they're rendered under their L4 instead).
  const l4Children = new Map();   // l4.id → array of { kind:"workload", item, cluster }
  const childWorkloadIds = new Set();
  for (const s of p.sites || []) {
    for (const lb of (s.l4_balancers || [])) {
      const children = [];
      const targets = lb.target_cluster_ids || [];
      for (const cid of targets) {
        const c = p.clusters.find(x => x.id === cid);
        if (!c) continue;
        for (const r of (c.ingress_rules || [])) {
          for (const path of (r.paths || [])) {
            const w = (c.workloads || []).find(x => x.id === path.workload_id);
            if (!w) continue;
            if (isPlatform(w) || isStateful(w)) continue;
            if (childWorkloadIds.has(w.id)) continue;
            children.push({ kind: "workload", item: w, cluster: c });
            childWorkloadIds.add(w.id);
          }
        }
      }
      if (children.length) l4Children.set(lb.id, children);
    }
  }

  // Build groups
  const envRows = new Map(); // env_tag → array of items
  const mgmtRow = [];
  const dbRow = [];

  for (const c of p.clusters) {
    const tag = c.environment_tag || c.name;
    if (!envRows.has(tag)) envRows.set(tag, []);
    // Add L4 LB(s) targeting this cluster as the first items of the row
    for (const s of p.sites || []) {
      for (const lb of (s.l4_balancers || [])) {
        if ((lb.target_cluster_ids || []).includes(c.id)) {
          envRows.get(tag).push({ kind: "l4", item: lb });
        }
      }
    }
    for (const w of (c.workloads || [])) {
      if (childWorkloadIds.has(w.id)) continue; // pulled into L4 sub-tree
      if (isPlatform(w)) {
        mgmtRow.push({ kind: "workload", item: w, cluster: c });
      } else if (isStateful(w)) {
        dbRow.push({ kind: "workload", item: w, cluster: c });
      } else {
        envRows.get(tag).push({ kind: "workload", item: w, cluster: c });
      }
    }
  }

  // External services + storages → DB row
  for (const s of p.sites || []) {
    for (const ex of (s.external_services || [])) {
      if (["database", "cache", "queue", "object_store", "backup"].includes(ex.kind)) {
        dbRow.push({ kind: "extsvc", item: ex });
      }
    }
    for (const st of (s.storages || [])) {
      dbRow.push({ kind: "storage", item: st });
    }
  }

  // Final row order
  const rows = [];
  for (const [tag, items] of envRows) {
    if (items.length) rows.push({ label: `(${tag})`, items, tag });
  }
  if (mgmtRow.length) rows.push({ label: "(관리/Mgmt)", items: mgmtRow, tag: "_mgmt" });
  if (dbRow.length) rows.push({ label: "(DB/Storage)", items: dbRow, tag: "_db" });

  // Map row.tag → array of real switch entities (network_devices[kind=switch]).
  // For env rows: ALL switches from sites that host this cluster's nodes.
  // For mgmt/db rows: all switches in all sites (these are logical groupings).
  const rowSwitches = new Map();
  for (const c of p.clusters) {
    const tag = c.environment_tag || c.name;
    const sitesUsed = new Set();
    for (const nid of (c.node_ids || [])) {
      const n = p.nodes.find(x => x.id === nid);
      if (n) sitesUsed.add(n.site_id);
    }
    const switches = rowSwitches.get(tag) || [];
    const seen = new Set(switches.map(s => s.id));
    for (const sid of sitesUsed) {
      const s = (p.sites || []).find(x => x.id === sid);
      if (!s) continue;
      for (const d of (s.network_devices || [])) {
        if (d.kind === "switch" && !seen.has(d.id)) {
          switches.push(d);
          seen.add(d.id);
        }
      }
    }
    if (switches.length) rowSwitches.set(tag, switches);
  }
  // mgmt/db: all switches across all sites
  const allSwitches = [];
  const allSeen = new Set();
  for (const s of (p.sites || [])) {
    for (const d of (s.network_devices || [])) {
      if (d.kind === "switch" && !allSeen.has(d.id)) {
        allSwitches.push(d);
        allSeen.add(d.id);
      }
    }
  }
  if (allSwitches.length) {
    rowSwitches.set("_mgmt", allSwitches);
    rowSwitches.set("_db", allSwitches);
  }

  if (!rows.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("h2", {}, ["워크로드가 없습니다"]),
    ]));
    return;
  }

  // Layout constants
  const SWITCH_W = 110, SWITCH_H = 36, SWITCH_VGAP = 4;
  const ROW_GAP = 32, BOX_W = 100, BOX_H = 56, BOX_GAP = 12, SUB_GAP = 8;
  const PAD_LEFT = 20, PAD_RIGHT = 30, PAD_TOP = 20;
  const STUB_LEN = 36;
  const SUB_DROP = 18;
  const SUB_TO_CHILD = 12;

  const rowSwitchCount = r => Math.max(1, (rowSwitches.get(r.tag) || []).length);
  const rowSwitchStackH = r => {
    const n = rowSwitchCount(r);
    return n * SWITCH_H + (n - 1) * SWITCH_VGAP;
  };
  const itemFootprint = it => {
    if (it.kind === "l4") {
      const ch = l4Children.get(it.item.id) || [];
      if (ch.length) return Math.max(BOX_W, ch.length * BOX_W + (ch.length - 1) * SUB_GAP);
    }
    return BOX_W;
  };
  const rowWidth = r => {
    if (!r.items.length) return BOX_W;
    let w = 0;
    for (const it of r.items) w += itemFootprint(it) + BOX_GAP;
    return w - BOX_GAP;
  };
  const rowHeight = r => {
    const hasSubs = r.items.some(it => it.kind === "l4" && (l4Children.get(it.item.id) || []).length > 0);
    const stackH = rowSwitchStackH(r);
    // Switch stack (above bus) + 30 (label space) + STUB_LEN (bus → boxes) + BOX_H + (subs)
    // Bus is at stackH/2, items below.
    const aboveBus = stackH / 2 + 30;
    const belowBus = stackH / 2 + STUB_LEN + BOX_H + (hasSubs ? SUB_DROP + SUB_TO_CHILD + BOX_H + 8 : 0);
    return aboveBus + belowBus + ROW_GAP;
  };

  const totalW = PAD_LEFT + SWITCH_W + 30 + Math.max(...rows.map(rowWidth), 0) + PAD_RIGHT;
  const rowTops = [];
  let cursorY = PAD_TOP;
  for (const r of rows) { rowTops.push(cursorY); cursorY += rowHeight(r); }
  const totalH = cursorY + 20;

  // Color mapping by item kind / workload category (matches Korean infra diagram style)
  const colorOf = (item) => {
    if (item.kind === "l4") return { fill: "#1e3a5f", stroke: "#34495e" };
    if (item.kind === "extsvc") {
      const c = { database: "#1f618d", cache: "#1f618d", queue: "#117a65",
                  object_store: "#1e8449", backup: "#5d6d7e",
                  monitoring: "#5d6d7e", logging: "#5d6d7e",
                  secret_store: "#7d6608", identity: "#5d6d7e" };
      return { fill: c[item.item.kind] || "#5d6d7e", stroke: "#34495e" };
    }
    if (item.kind === "storage") {
      return { fill: "#1e8449", stroke: "#27ae60" };
    }
    // workload by category
    const cat = item.item.category;
    const map = {
      Frontend:      { fill: "#7d3c98", stroke: "#9b59b6" },  // purple (web)
      API:           { fill: "#1e6091", stroke: "#2980b9" },  // teal blue (was/agt)
      WAS:           { fill: "#1e6091", stroke: "#2980b9" },
      "ML-Inference":{ fill: "#922b21", stroke: "#c0392b" },  // red
      "ML-Training": { fill: "#922b21", stroke: "#c0392b" },
      Video:         { fill: "#943126", stroke: "#cd5c5c" },
      DB:            { fill: "#1f618d", stroke: "#3498db" },
      Cache:         { fill: "#1f618d", stroke: "#3498db" },
      Queue:         { fill: "#117a65", stroke: "#1abc9c" },
      Batch:         { fill: "#1e8449", stroke: "#27ae60" },  // green agent
      Other:         { fill: "#5d6d7e", stroke: "#7f8c8d" },
      Frontend:      { fill: "#7d3c98", stroke: "#9b59b6" },
    };
    return map[cat] || { fill: "#5d6d7e", stroke: "#7f8c8d" };
  };

  const root_svg = svg("svg", {
    width: "100%",
    viewBox: `0 0 ${totalW} ${totalH}`,
    style: "background:var(--bg);border:1px solid var(--border);border-radius:8px;",
  });

  // Helper: draw a box with label/sub at given position
  const drawBox = (item, x, y) => {
    const cx = x + BOX_W / 2;
    const col = colorOf(item);
    let label, sub, onclick;
    if (item.kind === "l4") {
      label = "L4"; sub = `(${(item.item.vendor || item.item.kind).toLowerCase()})`;
      onclick = () => selectEntity("l4", item.item.id);
    } else if (item.kind === "workload") {
      label = item.item.name; sub = item.item.replicas > 1 ? `×${item.item.replicas}` : "";
      onclick = () => selectEntity("workload", item.item.id);
    } else if (item.kind === "extsvc") {
      label = item.item.name; sub = item.item.engine || item.item.kind;
      onclick = () => selectEntity("extsvc", item.item.id);
    } else if (item.kind === "storage") {
      label = item.item.name; sub = item.item.kind;
      onclick = () => selectEntity("storage", item.item.id);
    }
    const g = svg("g", { style: "cursor:pointer", onclick });
    g.appendChild(svg("rect", {
      x, y, width: BOX_W, height: BOX_H, rx: 4, ry: 4,
      fill: col.fill, stroke: col.stroke, "stroke-width": 1.5,
    }));
    const lbl = label.length > 14 ? label.slice(0, 13) + "…" : label;
    g.appendChild(svg("text", {
      x: cx, y: y + (sub ? BOX_H / 2 - 2 : BOX_H / 2 + 5),
      "text-anchor": "middle", fill: "#fff",
      "font-size": "12", "font-weight": "600", "font-family": "Pretendard, sans-serif",
    }, [lbl]));
    if (sub) {
      g.appendChild(svg("text", {
        x: cx, y: y + BOX_H / 2 + 14,
        "text-anchor": "middle", fill: "rgba(255,255,255,0.8)",
        "font-size": "11", "font-family": "JetBrains Mono",
      }, [sub.length > 16 ? sub.slice(0, 15) + "…" : sub]));
    }
    root_svg.appendChild(g);
  };

  // Per-row geometry: stack center = busY
  const rowGeom = rowTops.map((top, i) => {
    const stackH = rowSwitchStackH(rows[i]);
    const stackTop = top;
    const busY = stackTop + stackH / 2;
    const boxY = busY + STUB_LEN;
    return { stackTop, stackH, busY, boxY };
  });

  // Vertical spine (left edge connecting all switch stacks at their bus center)
  const spineX = PAD_LEFT + SWITCH_W / 2;
  root_svg.appendChild(svg("line", {
    x1: spineX, y1: rowGeom[0].busY,
    x2: spineX, y2: rowGeom[rowGeom.length - 1].busY,
    stroke: "#34495e", "stroke-width": 2,
  }));

  rows.forEach((row, rowIdx) => {
    const { stackTop, stackH, busY, boxY } = rowGeom[rowIdx];
    const lineY = busY;

    // Switch stack — bind to real network_devices[kind=switch].
    // When N>1, render each switch as a separate box stacked vertically;
    // each connects to the same horizontal bus via a short stub.
    const realSwitches = rowSwitches.get(row.tag) || [];
    const sStackBottom = stackTop + stackH;

    if (realSwitches.length === 0) {
      // Logical-only switch (fallback)
      const sy = busY - SWITCH_H / 2;
      root_svg.appendChild(svg("rect", {
        x: PAD_LEFT, y: sy, width: SWITCH_W, height: SWITCH_H,
        rx: 3, ry: 3, fill: "#1e3a5f",
        stroke: "#34495e", "stroke-width": 1.5,
      }));
      root_svg.appendChild(svg("text", {
        x: PAD_LEFT + SWITCH_W / 2, y: sy + SWITCH_H / 2 + 5,
        "text-anchor": "middle", fill: "#fff",
        "font-size": "13", "font-weight": "600", "font-family": "Pretendard, sans-serif",
      }, ["switch"]));
    } else {
      // Stack of real switches
      for (let i = 0; i < realSwitches.length; i++) {
        const sw = realSwitches[i];
        const sy = stackTop + i * (SWITCH_H + SWITCH_VGAP);
        const swG = svg("g", {
          style: "cursor:pointer",
          onclick: () => selectEntity("netdev", sw.id),
        });
        swG.appendChild(svg("rect", {
          x: PAD_LEFT, y: sy, width: SWITCH_W, height: SWITCH_H,
          rx: 3, ry: 3, fill: "#1e3a5f",
          stroke: "#4d9cff", "stroke-width": 2,
        }));
        // First line: "switch"
        swG.appendChild(svg("text", {
          x: PAD_LEFT + SWITCH_W / 2, y: sy + SWITCH_H / 2 - 2,
          "text-anchor": "middle", fill: "#fff",
          "font-size": "11", "font-weight": "600", "font-family": "Pretendard, sans-serif",
        }, ["switch"]));
        // Second line: device name (small)
        swG.appendChild(svg("text", {
          x: PAD_LEFT + SWITCH_W / 2, y: sy + SWITCH_H / 2 + 11,
          "text-anchor": "middle", fill: "rgba(255,255,255,0.75)",
          "font-size": "9", "font-family": "JetBrains Mono",
        }, [sw.name.length > 14 ? sw.name.slice(0, 13) + "…" : sw.name]));
        root_svg.appendChild(swG);
        // Stub from this switch's right edge to spine X (so each switch
        // visibly joins the bus)
        const swCY = sy + SWITCH_H / 2;
        if (Math.abs(swCY - busY) > 1) {
          // Draw vertical connector inside switch column area linking to busY
          root_svg.appendChild(svg("line", {
            x1: PAD_LEFT + SWITCH_W, y1: swCY,
            x2: PAD_LEFT + SWITCH_W + 14, y2: swCY,
            stroke: "#34495e", "stroke-width": 1.5,
          }));
          root_svg.appendChild(svg("line", {
            x1: PAD_LEFT + SWITCH_W + 14, y1: swCY,
            x2: PAD_LEFT + SWITCH_W + 14, y2: busY,
            stroke: "#34495e", "stroke-width": 1.5,
          }));
        }
      }
    }

    // Row label below stack (italic)
    root_svg.appendChild(svg("text", {
      x: PAD_LEFT + SWITCH_W / 2, y: sStackBottom + 18,
      "text-anchor": "middle", fill: "var(--text2)",
      "font-size": "12", "font-style": "italic", "font-family": "Pretendard, sans-serif",
    }, [row.label]));
    // Sub-label: count or vendor
    if (realSwitches.length > 0) {
      const subLine = realSwitches.length === 1
        ? (realSwitches[0].vendor || realSwitches[0].kind)
        : `${realSwitches.length} switches`;
      root_svg.appendChild(svg("text", {
        x: PAD_LEFT + SWITCH_W / 2, y: sStackBottom + 32,
        "text-anchor": "middle", fill: "var(--text3)",
        "font-size": "10", "font-family": "JetBrains Mono",
      }, [subLine]));
    }

    // Horizontal switch bus line
    const lineEndX = totalW - PAD_RIGHT;
    root_svg.appendChild(svg("line", {
      x1: PAD_LEFT + SWITCH_W, y1: lineY,
      x2: lineEndX, y2: lineY,
      stroke: "#34495e", "stroke-width": 1.5,
    }));

    // Component boxes (with optional L4 sub-trees)
    let bx = PAD_LEFT + SWITCH_W + 30;
    for (const item of row.items) {
      const subs = item.kind === "l4" ? (l4Children.get(item.item.id) || []) : [];
      const footprint = itemFootprint(item);
      const cx = bx + footprint / 2;
      const itemX = cx - BOX_W / 2;

      // Vertical connector from bus line down to box top
      root_svg.appendChild(svg("line", {
        x1: cx, y1: lineY, x2: cx, y2: boxY,
        stroke: "#34495e", "stroke-width": 1,
      }));

      drawBox(item, itemX, boxY);

      if (subs.length) {
        const subsW = subs.length * BOX_W + (subs.length - 1) * SUB_GAP;
        const subY = boxY + BOX_H + SUB_DROP;
        const childY = subY + SUB_TO_CHILD;
        const childStartX = cx - subsW / 2;

        // L4 bottom → sub line vertical
        root_svg.appendChild(svg("line", {
          x1: cx, y1: boxY + BOX_H, x2: cx, y2: subY,
          stroke: "#34495e", "stroke-width": 1,
        }));
        // Horizontal connector spanning children (only if 2+)
        if (subs.length > 1) {
          root_svg.appendChild(svg("line", {
            x1: childStartX + BOX_W / 2, y1: subY,
            x2: childStartX + subsW - BOX_W / 2, y2: subY,
            stroke: "#34495e", "stroke-width": 1,
          }));
        }
        // Each child: vertical drop + box
        for (let i = 0; i < subs.length; i++) {
          const ccx = childStartX + i * (BOX_W + SUB_GAP) + BOX_W / 2;
          root_svg.appendChild(svg("line", {
            x1: ccx, y1: subY, x2: ccx, y2: childY,
            stroke: "#34495e", "stroke-width": 1,
          }));
          drawBox(subs[i], ccx - BOX_W / 2, childY);
        }
      }

      bx += footprint + BOX_GAP;
    }
  });

  // Wrapper with section header
  const wrap = el("div", {});
  wrap.appendChild(el("div", {
    style: { display: "flex", alignItems: "baseline", gap: "12px", marginBottom: "10px" },
  }, [
    el("h2", { style: { fontSize: "16px", fontWeight: 600, margin: 0 } }, ["인프라 아키텍처 — 네트워크 관점"]),
    el("span", { style: { fontSize: "11px", color: "var(--text3)", fontStyle: "italic" } }, [
      "switch 버스 + 환경별 그룹 (prod/dev/관리/DB·Storage)",
    ]),
  ]));
  wrap.appendChild(root_svg);

  // Legend
  wrap.appendChild(el("div", {
    style: { fontSize: "11px", color: "var(--text2)", marginTop: "10px", display: "flex", gap: "10px", flexWrap: "wrap" },
  }, [
    el("span", { style: { background: "#7d3c98", color: "#fff", padding: "2px 8px", borderRadius: "3px" } }, ["Frontend"]),
    el("span", { style: { background: "#1e6091", color: "#fff", padding: "2px 8px", borderRadius: "3px" } }, ["API/WAS"]),
    el("span", { style: { background: "#1e8449", color: "#fff", padding: "2px 8px", borderRadius: "3px" } }, ["Batch/Storage"]),
    el("span", { style: { background: "#922b21", color: "#fff", padding: "2px 8px", borderRadius: "3px" } }, ["ML"]),
    el("span", { style: { background: "#1f618d", color: "#fff", padding: "2px 8px", borderRadius: "3px" } }, ["DB/Cache"]),
    el("span", { style: { background: "#5d6d7e", color: "#fff", padding: "2px 8px", borderRadius: "3px" } }, ["Mgmt"]),
    el("span", { style: { background: "#1e3a5f", color: "#fff", padding: "2px 8px", borderRadius: "3px" } }, ["L4/Switch"]),
  ]));

  root.appendChild(wrap);
}

function renderFindings() {
  const findings = state.project ? runValidator(state.project) : [];
  state.ui.findings = findings;

  const counts = { error: 0, warn: 0, info: 0 };
  for (const f of findings) counts[f.sev] = (counts[f.sev] || 0) + 1;
  $("#cntErr").textContent = String(counts.error);
  $("#cntWarn").textContent = String(counts.warn);
  $("#cntInfo").textContent = String(counts.info);

  // Hide the "validator coming in Phase 2" placeholder (we're in Phase 2 now)
  const placeholder = document.querySelector(".findings-summary span[style*='Phase 2']");
  if (placeholder) placeholder.style.display = "none";

  // Render expanded list if visible
  const list = $("#findingsList");
  if (list.style.display !== "none") {
    list.innerHTML = "";
    if (!findings.length) {
      list.appendChild(el("div", { style: { padding: "12px 16px", color: "var(--text2)", fontSize: "12px", textAlign: "center" } }, ["✓ 모든 검증 통과"]));
    } else {
      // Sort: error → warn → info
      const sevOrder = { error: 0, warn: 1, info: 2 };
      const sorted = [...findings].sort((a, b) => sevOrder[a.sev] - sevOrder[b.sev]);
      for (const f of sorted) {
        const icon = f.sev === "error" ? "⊗" : f.sev === "warn" ? "▲" : "ⓘ";
        const color = f.sev === "error" ? "var(--red)" : f.sev === "warn" ? "var(--yellow)" : "var(--accent)";
        const row = el("div", {
          class: "finding-row",
          onclick: () => {
            if (f.scope) selectEntity(f.scope.kind, f.scope.id);
          },
        }, [
          el("span", { class: "id", style: { color } }, [icon]),
          el("span", { class: "id" }, [f.id]),
          el("span", { class: "msg" }, [f.msg]),
        ]);
        if (f.helpId && HELP[f.helpId]) {
          const ic = helpIcon(f.helpId);
          ic.addEventListener("click", e => e.stopPropagation());
          row.appendChild(ic);
        }
        list.appendChild(row);
      }
    }
  }
}

// Save/restore focus across full re-renders so typing in inputs
// doesn't lose focus on every keystroke. Inputs that need preservation
// must carry a stable data-focus-key attribute.
function captureFocus() {
  const elFocused = document.activeElement;
  if (!elFocused || elFocused === document.body) return null;
  const key = elFocused.getAttribute && elFocused.getAttribute("data-focus-key");
  if (!key) return null;
  const sel = (elFocused.selectionStart != null)
    ? { start: elFocused.selectionStart, end: elFocused.selectionEnd, dir: elFocused.selectionDirection }
    : null;
  return { key, sel };
}
function restoreFocus(saved) {
  if (!saved) return;
  let target;
  try {
    target = document.querySelector(`[data-focus-key="${CSS.escape(saved.key)}"]`);
  } catch (e) { return; }
  if (!target) return;
  target.focus();
  if (saved.sel && typeof target.setSelectionRange === "function") {
    try { target.setSelectionRange(saved.sel.start, saved.sel.end, saved.sel.dir || "none"); } catch (e) {}
  }
}

function renderAll() {
  const focus = captureFocus();
  renderTopbar();
  renderViewTabs();
  renderTree();
  renderInspector();
  renderViewBody();
  renderFindings();
  restoreFocus(focus);
}

//============ Add Node modal ============
function openAddNode() {
  if (!state.project) return;
  if (!state.project.sites.length) {
    alert("먼저 사이트를 추가하세요.");
    return;
  }

  const root = el("div");
  root.appendChild(el("h2", {}, ["Add Node"]));

  // Determine source filter based on mode
  const mode = state.project.mode;
  const allowedSources = mode === "hybrid" ? ["onprem", "cloud"] : [mode];
  const entries = state.catalog.entries.filter(e => allowedSources.includes(e.source));

  // Brand options
  const brands = [...new Set(entries.map(e => e.brand))].sort();
  let selectedBrand = brands[0];
  let selectedKey = entries.find(e => e.brand === selectedBrand)?.key;

  const brandSel = el("select", {
    onchange: e => { selectedBrand = e.target.value;
      const first = entries.find(x => x.brand === selectedBrand);
      selectedKey = first?.key;
      rerenderModel();
    },
  }, brands.map(b => el("option", { value: b }, [b])));

  const modelWrap = el("div");

  const previewWrap = el("div");

  const qtyInput = el("input", { type: "number", min: "1", value: "1" });

  // Site
  const siteOpts = () => state.project.sites
    .filter(s => allowedSources.includes(s.kind) && (s.kind === entryFor(selectedKey)?.source))
    .map(s => el("option", { value: s.id }, [`${s.name} (${s.kind})`]));
  const siteSel = el("select", {});

  const nameInput = el("input", { placeholder: "(자동 생성)", value: "" });

  function entryFor(key) { return entries.find(e => e.key === key); }

  function rerenderModel() {
    modelWrap.innerHTML = "";
    const filtered = entries.filter(e => e.brand === selectedBrand);
    const sel = el("select", {
      onchange: e => { selectedKey = e.target.value; rerenderPreview(); },
    }, filtered.map(e =>
      el("option", { value: e.key, selected: e.key === selectedKey ? "" : null },
        [`${e.display_name} (${e.category})`])));
    modelWrap.appendChild(el("div", { class: "field" }, [
      el("label", {}, ["Model"]), sel,
    ]));

    // Update sites filter
    siteSel.innerHTML = "";
    siteOpts().forEach(o => siteSel.appendChild(o));

    rerenderPreview();
  }

  function rerenderPreview() {
    previewWrap.innerHTML = "";
    const e = entryFor(selectedKey);
    if (!e) return;
    const spec = e.spec;
    const chassis = spec.gpu_chassis || {};
    const gpus = spec.gpu || [];
    const power = computeNodePowerW({ spec }, state.catalog.gpuModels);

    previewWrap.appendChild(el("div", { class: "section-title" }, ["Preview"]));
    previewWrap.appendChild(el("div", { class: "compat-result" }, [
      el("div", {}, [`${spec.vcpu} vCPU · ${spec.memory_gb} GB RAM${spec.form_factor ? ` · ${spec.form_factor}` : ""}`]),
      e.source === "onprem" ? el("div", {}, [`Power ~${(power/1000).toFixed(1)} kW (TDP base ${spec.power?.typical_w_base || 0}W + GPUs)`]) : null,
      chassis.max_count
        ? el("div", {}, [`GPU chassis: max ${chassis.max_count} · ${(chassis.supported_form_factors||[]).join("/")} · ${chassis.nvlink_topology}`])
        : null,
      gpus.length
        ? el("div", { class: "ok" }, [`Pre-installed GPU: ${gpus.map(g => `${g.count}× ${g.model}`).join(", ")}`])
        : null,
      e.notes ? el("div", { style: { color: "var(--text2)", marginTop: "4px" } }, [`📝 ${e.notes}`]) : null,
    ]));

    // Compat check
    const issues = checkNodeCompatibility(spec, state.catalog.gpuModels);
    if (issues.length) {
      const list = el("div", { class: "compat-result" });
      for (const i of issues) list.appendChild(el("div", { class: i.sev === "err" ? "err" : "warn" }, [`${i.sev === "err" ? "⊗" : "▲"} ${i.msg}`]));
      previewWrap.appendChild(list);
    }
  }

  root.appendChild(el("div", { class: "field" }, [lbl("Brand", "catalog.brand"), brandSel]));
  root.appendChild(modelWrap);
  root.appendChild(previewWrap);
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [el("label", {}, ["Quantity"]), qtyInput]),
    el("div", { class: "field" }, [el("label", {}, ["Site"]), siteSel]),
  ]));
  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Name (optional)"]), nameInput]));

  rerenderModel();

  const actions = el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      if (!siteSel.value) { alert("Source에 맞는 사이트가 없습니다. 먼저 사이트를 추가하세요."); return; }
      addNode({
        catalogKey: selectedKey,
        siteId: siteSel.value,
        name: nameInput.value.trim() || null,
        qty: parseInt(qtyInput.value) || 1,
      });
      closeModal();
    } }, ["Add"]),
  ]);
  root.appendChild(actions);

  openModal(root);
}

      closeModal();

  root.appendChild(actions);

  openModal(root);

function openEditNamespace(clusterId, name) {

  const root = el("div");
  root.appendChild(el("h2", {}, [`Namespace: ${ns.name}`]));
  root.appendChild(el("div", { class: "section-title" }, ["Resource Quota"]));

  const cpuInput = el("input", { type: "number", min: "0", value: rq.cpu || "", placeholder: "(no limit)" });
  const memInput = el("input", { type: "number", min: "0", value: rq.memory_gb || "", placeholder: "(no limit)" });
  const gpuInput = el("input", { type: "number", min: "0", value: rq.gpu || "", placeholder: "(no limit)" });
  const podsInput = el("input", { type: "number", min: "1", value: rq.max_pods || "", placeholder: "(no limit)" });

  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("CPU (cores)", "ns.quota.cpu"), cpuInput]),
    el("div", { class: "field" }, [lbl("Memory (GB)", "ns.quota.memory"), memInput]),
  ]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("GPU count", "ns.quota.gpu"), gpuInput]),
    el("div", { class: "field" }, [lbl("Max Pods", "ns.quota.pods"), podsInput]),
  ]));

  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      const newRq = {};
      if (cpuInput.value) newRq.cpu = parseFloat(cpuInput.value);
      if (memInput.value) newRq.memory_gb = parseFloat(memInput.value);
      if (gpuInput.value) newRq.gpu = parseInt(gpuInput.value);
      if (podsInput.value) newRq.max_pods = parseInt(podsInput.value);
      if (Object.keys(newRq).length) {
        updateNamespaceField(clusterId, name, "resource_quota", newRq);
      } else {
        // Empty: delete the field
        const updated = state.project.clusters.find(x => x.id === clusterId).namespaces.find(n => n.name === name);
        if (updated) delete updated.resource_quota;
        emit(); saveSoon();
      }
      closeModal();
    } }, ["Save"]),
  ]));
  openModal(root);
}
