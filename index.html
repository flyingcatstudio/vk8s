  const fromSel = el("select", {}, sites.map(s => el("option", { value: s.id }, [s.name])));
  const toSel = el("select", {}, sites.map((s, i) =>
    el("option", { value: s.id, selected: i === 1 ? "" : null }, [s.name])));
  const kindSel = el("select", {}, [
    ["vpn", "VPN (site-to-site)"],
    ["direct_connect", "Direct Connect (AWS DX / Cloud Interconnect)"],
    ["internet", "Internet"],
    ["leased", "Leased Line (전용회선)"],
    ["private_link", "PrivateLink / PSC"],
  ].map(([v, l]) => el("option", { value: v }, [l])));
  const bwInput = el("input", { type: "number", min: "0", step: "0.1", value: "1" });
  const latInput = el("input", { type: "number", min: "0", value: "10" });

  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [el("label", {}, ["From Site"]), fromSel]),
    el("div", { class: "field" }, [el("label", {}, ["To Site"]), toSel]),
  ]));
  root.appendChild(el("div", { class: "field" }, [lbl("Kind", "sitelink.kind"), kindSel]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("Bandwidth (Gbps)", "sitelink.bandwidth"), bwInput]),
    el("div", { class: "field" }, [lbl("Latency (ms)", "sitelink.latency"), latInput]),
  ]));

  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      if (fromSel.value === toSel.value) {
        alert("From과 To는 다른 사이트여야 합니다.");
        return;
      }
      addSiteLink({
        from_site_id: fromSel.value,
        to_site_id: toSel.value,
        kind: kindSel.value,
        bandwidth_gbps: parseFloat(bwInput.value) || 1,
        latency_ms: parseFloat(latInput.value) || 10,
      });
      closeModal();
    } }, ["Add"]),
  ]));
  openModal(root);
}

//============ Cluster Production Preset modal ============
function openClusterPreset(clusterId) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;

  const root = el("div");
  root.appendChild(el("h2", {}, ["Apply Production Preset"]));
  root.appendChild(el("div", {
    style: { fontSize: "12px", color: "var(--text2)", marginBottom: "12px" },
  }, [
    `Cluster: `, el("strong", {}, [c.name]),
    `. 선택한 항목만 추가 — 이미 있는 namespace/workload는 건드리지 않습니다 (idempotent).`,
  ]));

  const options = [
    { key: "haControlPlane", label: "HA Control Plane",
      desc: "노드 ≥3이면 첫 3개에 control-plane 역할 추가 (worker와 겸용)", default: true },
    { key: "ingress", label: "Ingress Controller (nginx)",
      desc: "ingress-nginx ns + ingress-nginx-controller (LB 80/443)", default: true },
    { key: "tls", label: "TLS Cert Manager",
      desc: "cert-manager ns + cert-manager 워크로드 (자동 인증서 발급)", default: true },
    { key: "monitoring", label: "Monitoring (Prometheus + Grafana)",
      desc: "monitoring ns (default-deny) + prometheus(StatefulSet) + grafana", default: true },
    { key: "logging", label: "Logging (Loki)",
      desc: "logging ns (default-deny) + loki(StatefulSet)", default: true },
    { key: "metricsServer", label: "Metrics Server",
      desc: "kube-system에 metrics-server (HPA 동작에 필요)", default: true },
    { key: "networkPolicies", label: "Default-Deny Network Policies",
      desc: "monitoring/logging에 default-deny + same-ns allow", default: true },
    { key: "resourceQuotas", label: "Resource Quotas",
      desc: "platform ns들에 적정 quota 자동 설정", default: true },
    { key: "backup", label: "Backup (Velero)",
      desc: "velero ns + velero 워크로드 (S3 등 백업 타겟 별도 설정 필요)", default: false },
    { key: "secretStore", label: "External Secrets Operator",
      desc: "external-secrets ns + ESO (Vault/AWS Secrets 통합)", default: false },
    { key: "gitops", label: "GitOps (ArgoCD)",
      desc: "argocd ns + argocd-server (Git 기반 배포)", default: false },
    { key: "mesh", label: "Service Mesh (Istio)",
      desc: "istio-system ns + istiod. 운영 복잡도 큼", default: false },
  ];

  const inputs = {};
  for (const opt of options) {
    const cb = el("input", { type: "checkbox", checked: opt.default ? "" : null });
    inputs[opt.key] = cb;
    root.appendChild(el("label", {
      style: {
        display: "flex", alignItems: "flex-start", gap: "8px",
        padding: "8px 10px", margin: "3px 0",
        background: "var(--surface2)", border: "1px solid var(--border)",
        borderRadius: "5px", cursor: "pointer",
        textTransform: "none", letterSpacing: 0,
      },
    }, [
      cb,
      el("div", { style: { flex: 1 } }, [
        el("div", { style: { fontSize: "12px", fontWeight: 600, color: "var(--text)" } }, [opt.label]),
        el("div", { style: { fontSize: "11px", color: "var(--text2)", marginTop: "2px" } }, [opt.desc]),
      ]),
    ]));
  }

  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      const opts = {};
      for (const k of Object.keys(inputs)) opts[k] = inputs[k].checked;
      applyClusterPreset(clusterId, opts);
      closeModal();
    } }, ["Apply"]),
  ]));

  openModal(root);
  // Wider modal for all options
  $("#modalContent").style.maxWidth = "640px";
}

//============ Architecture Templates ============
// Each template returns a complete project. Pre-includes platform
// workloads (nginx-ingress / cert-manager / metrics-server) so user
// gets a working setup without running applyClusterPreset.

function _mkPlatformWorkloads() {
  // Standard production preset workloads, returned as a flat array
  // for embedding in cluster.workloads
  const std = (name, ns, cat, replicas, cpu, mem, kind = "Deployment") => ({
    id: slug(name) + "-" + uid(),
    name, category: cat, namespace: ns,
    labels: { app: slug(name) },
    replicas, kind,
    resources: { requests: { cpu, memory_gb: mem } },
  });
  return [
    {
      ...std("ingress-nginx-controller", "ingress-nginx", "API", 2, 0.1, 0.25),
      network: { service: { type: "LoadBalancer", ports: [
        { name: "http", port: 80, target_port: 80, protocol: "TCP" },
        { name: "https", port: 443, target_port: 443, protocol: "TCP" },
      ] } },
    },
    std("cert-manager", "cert-manager", "Other", 1, 0.05, 0.128),
    {
      ...std("prometheus", "monitoring", "Other", 1, 0.5, 4, "StatefulSet"),
      persistent_volumes: [{ size_gb: 100, access_mode: "RWO", storage_class: "" }],
      network: { service: { type: "ClusterIP", ports: [{ name: "web", port: 9090, target_port: 9090, protocol: "TCP" }] } },
    },
    {
      ...std("grafana", "monitoring", "Frontend", 1, 0.1, 0.5),
      network: { service: { type: "ClusterIP", ports: [{ name: "http", port: 3000, target_port: 3000, protocol: "TCP" }] } },
    },
    {
      ...std("loki", "logging", "Other", 1, 0.5, 2, "StatefulSet"),
      persistent_volumes: [{ size_gb: 200, access_mode: "RWO", storage_class: "" }],
    },
    std("metrics-server", "kube-system", "Other", 1, 0.05, 0.128),
  ];
}

function _platformNamespaces() {
  return [
    { name: "ingress-nginx", labels: { "kubernetes.io/metadata.name": "ingress-nginx" } },
    { name: "cert-manager" },
    { name: "monitoring", default_deny: true, labels: { tier: "platform" }, resource_quota: { cpu: 8, memory_gb: 32, max_pods: 50 } },
    { name: "logging", default_deny: true, labels: { tier: "platform" }, resource_quota: { cpu: 8, memory_gb: 32, max_pods: 30 } },

function _platformNps() {
  return [
    { id: "monitoring-deny-" + uid(), name: "monitoring-default-deny", namespace: "monitoring", preset: "default-deny", policy_types: ["Ingress", "Egress"], ingress: [], egress: [] },
    { id: "monitoring-allow-same-" + uid(), name: "monitoring-allow-same-ns", namespace: "monitoring", preset: "allow-from-same-ns", policy_types: ["Ingress"], ingress: [{ from_namespaces: ["monitoring"] }] },

  // External replicated DB (primary in Zone-A)

    web: "web-" + uid(),
    api: "api-" + uid(),

  const ing1 = "ing-web-" + uid();

  const platformWls = _mkPlatformWorkloads();

  // Site link mesh: A↔B, B↔C, A↔C
  const sitelinks = [

      }],
      network_devices: [
        { id: fwIds[i], name: `FW-${z}`, kind: "firewall", vendor: "FortiGate", model: "FG-100F", throughput_gbps: 10, ha: true },

      ],

  },
];

function applyTemplate(templateId, projectName) {
  const t = TEMPLATES.find(x => x.id === templateId);
  if (!t) return;
  state.project = t.apply(projectName || t.name);
  state.ui.selectedKind = state.ui.selectedId = null;
  state.ui.view = "topology";
  emit(); saveSoon();
}

function openTemplates() {
  const root = el("div");
  root.appendChild(el("h2", {}, ["Architecture Templates"]));
  root.appendChild(el("div", {
    style: { fontSize: "12px", color: "var(--text2)", marginBottom: "12px" },
  }, [
    "표준 인프라 패턴을 한 번에 생성. 기존 프로젝트는 덮어씌워집니다 — 필요시 먼저 Export 하세요.",
  ]));

  const nameInput = el("input", { value: "my-vk8s-project", placeholder: "프로젝트 이름" });
  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Project name"]), nameInput]));

  const grid = el("div", {
    style: { display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: "10px", marginTop: "10px" },
  });
  for (const t of TEMPLATES) {
    grid.appendChild(el("button", {
      style: {
        background: "var(--surface2)", border: "1px solid var(--border)",
        borderRadius: "8px", padding: "14px", cursor: "pointer",
        textAlign: "left", color: "var(--text)", fontFamily: "inherit",
        display: "flex", flexDirection: "column", gap: "6px",
      },
      onclick: () => {
        if (state.project) {
          if (!confirm("현재 프로젝트가 덮어씌워집니다. 진행?")) return;
        }
        applyTemplate(t.id, nameInput.value.trim() || t.name);
        closeModal();
      },
    }, [
      el("div", { style: { display: "flex", alignItems: "center", gap: "10px" } }, [
        el("span", { style: { fontSize: "22px" } }, [t.icon]),
        el("strong", { style: { fontSize: "14px" } }, [t.name]),
      ]),
      el("div", { style: { fontSize: "11px", color: "var(--text2)", lineHeight: "1.5" } }, [t.description]),
    ]));
  }
  root.appendChild(grid);

  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
  ]));

  openModal(root);
  $("#modalContent").style.maxWidth = "720px";
}

//============ Splash ============
function renderSplash() {
  const splash = $("#splash");
  if (!state.project) splash.classList.remove("hidden");
  else                splash.classList.add("hidden");
}

function bindSplash() {
  let chosen = null;
  for (const btn of document.querySelectorAll(".mode-option")) {
    // Add ? help icon to title
    const titleEl = btn.querySelector(".title");
    if (titleEl) {
      const help = helpIcon("mode." + btn.dataset.mode);
      help.addEventListener("click", e => e.stopPropagation()); // don't toggle selection
      titleEl.appendChild(help);
    }
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-option").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      chosen = btn.dataset.mode;
      $("#btnSplashCreate").disabled = !chosen;
    });
  }
  $("#btnSplashCreate").addEventListener("click", () => {
    if (!chosen) return;
    createProject(chosen, $("#splashName").value);
  });
  $("#btnSplashImport").addEventListener("click", () => $("#fileImport").click());
  const btnTpl = $("#btnSplashTemplates");
  if (btnTpl) btnTpl.addEventListener("click", openTemplates);
}

//============ Import / Export ============
function exportProject() {
  if (!state.project) return;
  const blob = new Blob([JSON.stringify(state.project, null, 2)], { type: "application/json" });
  const a = el("a", {
    href: URL.createObjectURL(blob),
    download: `${slug(state.project.name) || "vk8s-project"}.json`,
  });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
function importProjectFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.version || !obj.mode) throw new Error("Not a vk8s project file");
      state.project = migrateProject(obj);
      state.ui.selectedKind = state.ui.selectedId = null;
      emit(); saveSoon();
    } catch (e) {
      alert("Import 실패: " + e.message);
    }
  };
  reader.readAsText(file);
}

//============ Findings strip toggle ============
function bindFindings() {
  const btn = $("#btnFindings");
  const list = $("#findingsList");
  btn.addEventListener("click", () => {
    const open = list.style.display !== "none";
    list.style.display = open ? "none" : "block";
    btn.textContent = open ? "Findings ▾" : "Findings ▴";
    document.getElementById("app").dataset.findingsExpanded = String(!open);
    renderFindings();
  });
}

//============ Init ============
async function init() {
  // Bind chrome events
  bindSplash();
  bindFindings();
  $("#btnNewProject").addEventListener("click", () => {
    if (state.project && !confirm("현재 프로젝트를 닫고 새로 시작합니다. 계속?")) return;
    state.project = null;
    state.ui.selectedKind = state.ui.selectedId = null;
    localStorage.removeItem(STORAGE_KEY);
    emit();
  });
  $("#btnExport").addEventListener("click", exportProject);
  $("#btnImport").addEventListener("click", () => $("#fileImport").click());
  $("#btnGlossary").addEventListener("click", openGlossary);
  $("#btnTemplates").addEventListener("click", openTemplates);
  $("#fileImport").addEventListener("change", e => {
    const file = e.target.files[0];
    if (file) importProjectFromFile(file);
    e.target.value = "";
  });
  // Modal background click closes
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  // Keyboard
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveSoon(); }
    if (e.key === "Delete" && state.ui.selectedId && document.activeElement.tagName !== "INPUT") {
      deleteEntity(state.ui.selectedKind, state.ui.selectedId);
    }
  });

  // Load catalog
  try {
    await loadCatalog();
  } catch (e) {
    alert("Catalog 로드 실패: " + e.message + "\n로컬 file:// 으로 열면 fetch 차단됩니다. 정적 서버로 실행하세요. (예: python3 -m http.server)");
    console.error(e);
    return;
  }

  // Restore project from localStorage
  const saved = loadProject();
  if (saved) state.project = saved;

  // Subscribe + initial render
  subscribe(renderAll);
  subscribe(renderSplash);
  emit();
}

init();
</script>
