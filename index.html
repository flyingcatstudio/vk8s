<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vk8s — k8s capacity studio</title>
<meta name="description" content="vk8s: 가상 Kubernetes 환경을 설계·시뮬레이션하고 인프라 호환성을 검증하는 브라우저 도구.">
<meta name="author" content="FCStudio">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='26' fill='%234d9cff'/></svg>">
<link rel="canonical" href="https://aiotool.net/vk8s/">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Pretendard:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #08090c;
    --surface: #111318;
    --surface2: #181b23;
    --surface3: #1e222d;
    --border: #252a36;
    --border2: #353c4d;
    --text: #e8ecf4;
    --text2: #8892a4;
    --text3: #5a6377;
    --accent: #4d9cff;
    --accent2: #1a6ddb;
    --accent-glow: rgba(77,156,255,0.12);
    --green: #34d399;
    --green-glow: rgba(52,211,153,0.1);
    --yellow: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
    --orange: #fb923c;

    --topbar-h: 48px;
    --tree-w: 260px;
    --inspector-w: 380px;
    --findings-h: 32px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Outfit', -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }

  /* === Layout === */
  .app {
    display: grid;
    grid-template-columns: var(--tree-w) 1fr var(--inspector-w);
    grid-template-rows: var(--topbar-h) 1fr var(--findings-h);
    grid-template-areas:
      "topbar topbar topbar"
      "tree   canvas inspector"
      "findings findings findings";
    height: 100vh;
  }
  .app[data-left-collapsed="true"]  { grid-template-columns: 0 1fr var(--inspector-w); }
  .app[data-right-collapsed="true"] { grid-template-columns: var(--tree-w) 1fr 0; }
  .app[data-left-collapsed="true"][data-right-collapsed="true"] { grid-template-columns: 0 1fr 0; }
  .app[data-findings-expanded="true"] { grid-template-rows: var(--topbar-h) 1fr 240px; }

  /* === Resize gutters between tree / canvas / inspector. Absolute-positioned so they sit
     on top of the grid column boundaries without disturbing the grid template (which has
     collapsed states bound to it). Drag to resize, double-click to reset to defaults. === */
  .gutter {
    position: absolute;
    top: var(--topbar-h);
    bottom: var(--findings-h);
    width: 6px;
    cursor: col-resize;
    background: transparent;
    z-index: 50;
    user-select: none;
    transition: background .12s;
  }
  .gutter:hover, .gutter.dragging { background: rgba(77,156,255,.35); }
  .gutter-l { left: calc(var(--tree-w) - 3px); }
  .gutter-r { right: calc(var(--inspector-w) - 3px); }
  .app[data-left-collapsed="true"]  .gutter-l { display: none; }
  .app[data-right-collapsed="true"] .gutter-r { display: none; }
  .app[data-findings-expanded="true"] .gutter { bottom: 240px; }

  /* === Topbar === */
  .topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar .logo {
    font-family: 'Outfit';
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.02em;
  }
  .topbar .logo .dot { color: var(--accent); }
  .topbar .project-name {
    font-weight: 500;
    color: var(--text);
  }
  .topbar .mode-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'JetBrains Mono';
    text-transform: uppercase;
  }
  .topbar .mode-badge[data-mode="onprem"] { background: rgba(251,146,60,.15); color: var(--orange); }
  .topbar .mode-badge[data-mode="cloud"]  { background: rgba(77,156,255,.15); color: var(--accent); }
  .topbar .mode-badge[data-mode="hybrid"] { background: rgba(167,139,250,.15); color: var(--purple); }
  .topbar .spacer { flex: 1; }
  .topbar .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    transition: all .15s;
  }
  .topbar .icon-btn:hover {
    border-color: var(--border2);
    color: var(--text);
    background: var(--surface2);
  }
  .save-status {
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono';
  }

  /* === Tree === */
  .tree {
    grid-area: tree;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 8px;
  }
  .tree-section {
    margin-bottom: 12px;
  }
  .tree-section-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    color: var(--text2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .tree-section-header .count {
    color: var(--text3);
    font-family: 'JetBrains Mono';
  }
  .tree-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    margin: 1px 0;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text);
    border-left: 2px solid transparent;
  }
  .tree-item:hover { background: var(--surface2); }
  .tree-item.selected {
    background: var(--accent-glow);
    border-left-color: var(--accent);
  }
  .tree-item .icon { flex-shrink: 0; }
  .tree-item .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tree-item .meta {
    font-size: 10px;
    color: var(--text3);
    font-family: 'JetBrains Mono';
  }
  .tree-item .lock-dot {
    color: var(--yellow);
    font-size: 9px;
    line-height: 1;
    flex-shrink: 0;
  }
  .tree-item.child { padding-left: 24px; }
  .tree-actions {
    margin-top: 8px;
    padding: 0 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .add-btn {
    background: var(--surface2);
    border: 1px dashed var(--border2);
    color: var(--text2);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    text-align: left;
    transition: all .15s;
  }
  .add-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }
  .empty-hint {
    color: var(--text3);
    font-size: 11px;
    padding: 4px 10px;
    font-style: italic;
  }

  /* === Canvas === */
  .canvas {
    grid-area: canvas;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }
  .view-tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 12px;
    gap: 2px;
    flex-shrink: 0;
  }
  .view-tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    padding: 10px 14px;
    font-size: 12px;
    transition: all .15s;
  }
  .view-tab:hover { color: var(--text); }
  .view-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .view-tab.disabled {
    color: var(--text3);
    cursor: not-allowed;
    opacity: 0.5;
  }
  .view-tab.disabled::after {
    content: 'soon';
    margin-left: 6px;
    font-size: 9px;
    color: var(--text3);
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono';
    letter-spacing: 0.05em;
  }
  .view-tab .tab-num {
    color: var(--text3);
    font-size: 10px;
    margin-right: 6px;
    font-family: 'JetBrains Mono';
  }
  .view-body {
    flex: 1;
    overflow: auto;
    padding: 24px;
  }
  .view-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text2);
    text-align: center;
    gap: 12px;
  }
  .view-empty .big { font-size: 48px; opacity: 0.3; }
  .view-empty h2 { font-weight: 500; color: var(--text); }
  .view-empty p { font-size: 12px; max-width: 360px; }

  /* === Topology === */
  .topo-site {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .topo-site-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .topo-site-header .name {
    font-weight: 600;
    font-size: 14px;
  }
  .topo-site-header .kind {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono';
  }
  .topo-site-header .kind[data-kind="onprem"] { background: rgba(251,146,60,.15); color: var(--orange); }
  .topo-site-header .kind[data-kind="cloud"]  { background: rgba(77,156,255,.15); color: var(--accent); }
  .topo-site-header .region {
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono';
  }
  .topo-site-bars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .topo-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .topo-bar-label .val { font-family: 'JetBrains Mono'; }
  .bar {
    height: 6px;
    background: var(--surface3);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--green);
    transition: width .3s, background .3s;
  }
  .bar-fill[data-level="medium"] { background: var(--accent); }
  .bar-fill[data-level="high"]   { background: var(--yellow); }
  .bar-fill[data-level="critical"]{ background: var(--red); }

  .topo-nodes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .topo-node {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all .15s;
    position: relative;
  }
  .topo-node:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }
  .topo-node.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 20px var(--accent-glow);
  }
  .topo-node .node-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .topo-node .node-model {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 8px;
    font-family: 'JetBrains Mono';
  }
  .topo-node .node-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    font-size: 11px;
  }
  .topo-node .stat {
    display: flex;
    justify-content: space-between;
    color: var(--text2);
  }
  .topo-node .stat .v { color: var(--text); font-family: 'JetBrains Mono'; }
  .topo-node .gpu-line {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 11px;
    color: var(--purple);
    font-family: 'JetBrains Mono';
  }
  .topo-empty-site {
    color: var(--text3);
    font-size: 12px;
    font-style: italic;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    text-align: center;
  }
  .cluster-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(167,139,250,.12);
    color: var(--purple);
    font-family: 'JetBrains Mono';
    margin-top: 6px;
  }
  .cluster-badge .role {
    color: var(--text3);
    font-size: 9px;
    text-transform: uppercase;
  }
  .next-hint {
    background: linear-gradient(135deg, var(--accent-glow), transparent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .next-hint .icon { font-size: 22px; color: var(--accent); }
  .next-hint .body { flex: 1; }
  .next-hint .body .head {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .next-hint .body .lead { font-size: 13px; }
  .role-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: 'JetBrains Mono';
    text-transform: uppercase;
  }
  .role-tag[data-role="control-plane"] { background: rgba(77,156,255,.15); color: var(--accent); }
  .role-tag[data-role="worker"] { background: rgba(52,211,153,.12); color: var(--green); }
  .role-tag[data-role="etcd"] { background: rgba(167,139,250,.15); color: var(--purple); }
  .role-tag[data-role="unassigned"] { background: var(--surface3); color: var(--text3); }
  .row-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .row-list .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--surface2);
    border-radius: 5px;
    font-size: 12px;
  }
  .row-list .row .name { flex: 1; }
  .row-list .row select.role {
    padding: 2px 6px;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 3px;
    font-size: 11px;
  }
  .row-list .row .x {
    background: transparent;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 2px 6px;
  }
  .row-list .row .x:hover { color: var(--red); }
  .checkbox-list {
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px;
    background: var(--surface2);
  }
  .checkbox-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    cursor: pointer;
    border-radius: 3px;
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text);
    margin: 0;
  }
  .checkbox-list label:hover { background: var(--surface3); }
  .checkbox-list label .meta {
    margin-left: auto;
    color: var(--text3);
    font-size: 10px;
    font-family: 'JetBrains Mono';
  }
  .checkbox-list label.taken {
    color: var(--text3);
    cursor: not-allowed;
  }
  .checkbox-list label.taken .meta { color: var(--orange); }

  /* === Inspector === */
  .inspector {
    grid-area: inspector;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
  }
  .inspector-empty {
    color: var(--text3);
    text-align: center;
    padding: 40px 20px;
    font-size: 12px;
    font-style: italic;
  }
  .insp-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .insp-header .kind {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text3);
    font-family: 'JetBrains Mono';
    letter-spacing: 0.05em;
  }
  .insp-header .name {
    flex: 1;
    font-weight: 600;
    font-size: 14px;
  }
  .insp-header .delete,
  .insp-header .duplicate {
    background: transparent;
    border: none;
    color: var(--text3);
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .insp-header .delete:hover { color: var(--red); background: rgba(248,113,113,.1); }

  /* Locked workload/cluster: disable editable controls but keep header buttons interactive */
  .inspector-locked input,
  .inspector-locked select,
  .inspector-locked textarea,
  .inspector-locked button.add-btn,
  .inspector-locked button.btn-ghost {
    pointer-events: none;
    opacity: 0.55;
  }
  .inspector-locked .insp-header button { pointer-events: auto !important; opacity: 1 !important; }
  .lock-banner {
    background: rgba(251,191,36,.08);
    border: 1px solid var(--yellow);
    border-radius: 4px;
    padding: 6px 10px;
    margin-bottom: 10px;
    font-size: 11px;
    color: var(--yellow);
    font-family: 'JetBrains Mono', monospace;
  }
  .insp-header .duplicate:hover { color: var(--accent); background: var(--accent-glow); }

  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 5px;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .field-readonly {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 7px 10px;
    border-radius: 5px;
    color: var(--text);
    font-family: 'JetBrains Mono';
    font-size: 12px;
  }

  .section-title {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 18px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }

  .gpu-config {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .chassis-info {
    font-size: 11px;
    color: var(--text2);
    font-family: 'JetBrains Mono';
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .chassis-info strong { color: var(--purple); }
  .gpu-row {
    display: grid;
    grid-template-columns: 1.6fr 0.6fr 0.8fr auto;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
  }

  /* === Findings strip === */
  .findings {
    grid-area: findings;
    background: var(--surface);
    border-top: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .findings-summary {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 16px;
    flex-shrink: 0;
    font-size: 12px;
  }
  .findings-summary .count {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text2);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid transparent;
    user-select: none;
  }
  .findings-summary .count:hover { background: var(--surface2); color: var(--text); }
  .findings-summary .count[data-active="true"] { background: var(--surface2); border-color: var(--border2); color: var(--text); }
  .findings-summary .count .icon { font-size: 14px; }
  .findings-summary .count[data-sev="error"] .icon { color: var(--red); }
  .findings-summary .count[data-sev="warn"] .icon  { color: var(--yellow); }
  .findings-summary .count[data-sev="info"] .icon  { color: var(--accent); }
  .findings-summary .spacer { flex: 1; }
  .findings-summary .toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
  }
  .findings-summary .toggle:hover { color: var(--text); border-color: var(--border2); }

  .findings-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    border-top: 1px solid var(--border);
  }
  .finding-row {
    display: grid;
    grid-template-columns: 24px 200px 1fr;
    gap: 12px;
    padding: 6px 16px;
    font-size: 12px;
    cursor: pointer;
  }
  .finding-row:hover { background: var(--surface2); }
  .finding-row .id { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--text3); }
  .finding-row .msg { color: var(--text); }

  /* === Splash === */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,9,12,0.92);
    backdrop-filter: blur(8px);

//============ Tooltip ============
let _tipEl = null;
let _pinned = null;
function _ensureTip() {
  if (!_tipEl) {
    _tipEl = document.createElement("div");
    _tipEl.className = "tooltip";
    document.body.appendChild(_tipEl);
  }
  return _tipEl;
}
function _renderTipContent(help, pinned) {
  const tip = _ensureTip();
  tip.innerHTML = "";
  if (help.title) {
    const h = document.createElement("div");
    h.className = "tip-title";
    h.textContent = help.title;
    tip.appendChild(h);
  }
  const body = document.createElement("div");
  body.className = "tip-body";
  body.textContent = help.body;
  tip.appendChild(body);
  if (help.reco) {
    const r = document.createElement("div");
    r.className = "tip-reco";
    r.textContent = help.reco;
    tip.appendChild(r);
  }
  if (!pinned) {
    const ph = document.createElement("div");
    ph.className = "tip-pin-hint";
    ph.textContent = "클릭하면 고정";
    tip.appendChild(ph);
  }
}
function showTooltip(target, helpId, pinned = false) {
  const help = HELP[helpId];
  if (!help) return;
  const tip = _ensureTip();
  _renderTipContent(help, pinned);
  // Position (auto-flip)
  tip.classList.add("visible");
  tip.style.visibility = "hidden";
  const r = target.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left + r.width / 2 - tw / 2;
  let top = r.bottom + 8;
  if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
  if (left < 8) left = 8;
  if (top + th > window.innerHeight - 8) top = r.top - th - 8;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
  tip.style.visibility = "";
}
function hideTooltip() {
  if (_tipEl) _tipEl.classList.remove("visible");
  if (_pinned) {
    _pinned.classList.remove("pinned");
    _pinned = null;
  }
}
function helpIcon(helpId) {
  const span = document.createElement("span");
  span.className = "help";
  span.textContent = "?";
  span.tabIndex = 0;
  span.setAttribute("aria-label", "Help: " + (HELP[helpId]?.title || helpId));
  span.addEventListener("mouseenter", () => { if (!_pinned) showTooltip(span, helpId, false); });
  span.addEventListener("mouseleave", () => { if (!_pinned) hideTooltip(); });
  span.addEventListener("click", e => {
    e.stopPropagation();
    if (_pinned === span) {
      hideTooltip();
    } else {
      if (_pinned) _pinned.classList.remove("pinned");
      _pinned = span;
      span.classList.add("pinned");
      showTooltip(span, helpId, true);
    }
  });
  span.addEventListener("focus", () => showTooltip(span, helpId, false));
  span.addEventListener("blur", () => { if (!_pinned) hideTooltip(); });
  return span;
}
// Click outside closes pinned tooltip
document.addEventListener("click", e => {
  if (_pinned && !_pinned.contains(e.target) && _tipEl && !_tipEl.contains(e.target)) {
    hideTooltip();
  }
});

//============ Glossary modal ============
function openGlossary() {
  const root = el("div");
  root.appendChild(el("h2", {}, ["Glossary — 용어/설정 도움말"]));
  root.appendChild(el("div", { style: { color: "var(--text2)", fontSize: "12px", marginBottom: "12px" } }, [
    "각 메뉴/필드의 ? 아이콘을 눌러도 같은 내용을 볼 수 있습니다.",
  ]));

  // Group by cat
  const groups = {};
  for (const [id, h] of Object.entries(HELP)) {
    const cat = h.cat || "기타";
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push({ id, ...h });
  }
  const order = ["모드", "사이트", "노드", "GPU", "클러스터", "기타"];
  const keys = Object.keys(groups).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  const list = el("div", { class: "glossary-list" });
  for (const k of keys) {
    const g = el("div", { class: "glossary-group" });
    g.appendChild(el("h3", {}, [k]));
    for (const item of groups[k]) {
      g.appendChild(el("div", { class: "glossary-item" }, [
        el("div", { class: "gt" }, [item.title || item.id]),
        el("div", { class: "gb" }, [item.body || ""]),
        item.reco ? el("div", { class: "gr" }, [item.reco]) : null,
      ]));
    }
    list.appendChild(g);
  }
  root.appendChild(list);
  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Close"]),
  ]));
  // Make modal-card wider for glossary
  openModal(root);
  $("#modalContent").style.maxWidth = "640px";
}

//============ Helpers ============
const $ = sel => document.querySelector(sel);
const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "style") Object.assign(node.style, v);
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "dataset") for (const [dk, dv] of Object.entries(v)) node.dataset[dk] = dv;
    else if (v != null) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
};

// === IP / CIDR utilities ===
function parseCidr(cidr) {
  if (!cidr || typeof cidr !== "string") return null;
  const m = cidr.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/);
  if (!m) return null;
  const parts = [parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), parseInt(m[4])];
  const prefix = parseInt(m[5]);
  if (parts.some(p => p < 0 || p > 255) || prefix < 0 || prefix > 32) return null;
  const base = ((parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8) | parts[3]) >>> 0;
  const mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32 - prefix)) >>> 0;
  const network = base & mask;
  const size = prefix === 32 ? 1 : (2 ** (32 - prefix));
  return { network, prefix, size, mask };
}
function ipFromInt(n) {
  return [(n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff].join(".");
}
function ipToInt(ip) {
  if (!ip) return null;
  const m = ip.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
  if (!m) return null;
  const parts = [parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), parseInt(m[4])];
  if (parts.some(p => p < 0 || p > 255)) return null;
  return ((parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8) | parts[3]) >>> 0;
}
function ipInCidr(ip, cidr) {
  const c = parseCidr(cidr);
  const i = ipToInt(ip);
  if (c === null || i === null) return false;
  return (i & c.mask) === c.network;
}
function nextNodeIp(cluster, project) {
  if (!cluster?.network?.node_subnet) return null;
  const c = parseCidr(cluster.network.node_subnet);
  if (!c) return null;
  // Avoid every IP already used by ANY node in this subnet across the whole project (not just
  // this cluster's nodes), so a pasted/cloned cluster sharing the subnet doesn't reissue the
  // same .11/.12/… as the source. Nodes in other subnets are unaffected.
  const used = new Set();
  for (const n of (project.nodes || [])) {
    const ip = n?.network?.ip;
    if (ip && ipInCidr(ip, cluster.network.node_subnet)) used.add(ip);
  }
  // Reserve first 10 (gateway/dhcp/etc) + last (broadcast for /24).
  // Try .11 onward, skip used, fall within subnet, not all-ones.
  const startIdx = Math.min(11, c.size - 2);
  const endIdx = c.size - 1; // exclude broadcast
  for (let i = startIdx; i < endIdx; i++) {
    const ip = ipFromInt(c.network + i);
    if (!used.has(ip)) return ip;
  }
  return null;
}

//============ Catalog loader ============
async function loadCatalog() {
  // Production builds inline the catalog as window.__VK8S_CATALOG__ (see build.js).
  // Dev (python3 -m http.server etc.) falls back to fetch.
  const inlined = (typeof window !== "undefined") && window.__VK8S_CATALOG__ && window.__VK8S_CATALOG__.files;
  let results;
  if (inlined && CATALOG_FILES.every(p => inlined[p] != null)) {
    results = CATALOG_FILES.map(p => [p, inlined[p]]);
    console.log("Catalog source: inlined (build-time)");
  } else {
    results = await Promise.all(CATALOG_FILES.map(async p => {
      // cache:"no-cache" → always revalidate with the server (conditional GET, 304 when
      // unchanged) so a plain reload picks up catalog edits. python3 -m http.server sends no
      // Cache-Control, so without this the browser can serve a stale catalog from cache.
      const res = await fetch(p, { cache: "no-cache" });
      if (!res.ok) throw new Error(`Failed to load ${p}: ${res.status}`);
      return [p, await res.json()];
    }));
    console.log("Catalog source: fetch (runtime)");
  }
  const map = Object.fromEntries(results);
  state.catalog.gpuModels = map["data/gpu-models.json"].models;
  state.catalog.runtime   = map["data/runtime-profiles.json"].profiles;
  const entries = [];
  for (const [path, doc] of results) {
    if (path.includes("/catalog/")) {
      for (const e of (doc.entries || [])) entries.push(e);
    }
  }
  state.catalog.entries = entries;
  state.catalog.loaded  = true;
  console.log(`Loaded ${entries.length} catalog entries, ${Object.keys(state.catalog.gpuModels).length} GPU models`);
}

//============ Persistence ============
let saveTimer = null;
function saveSoon() {
  $("#saveStatus").textContent = "saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (state.project) localStorage.setItem(STORAGE_KEY, JSON.stringify(state.project));
    $("#saveStatus").textContent = "saved";
    setTimeout(() => { if ($("#saveStatus").textContent === "saved") $("#saveStatus").textContent = ""; }, 1500);
  }, 600);
}
function migrateProject(p) {
  if (!p || !p.version) return p;
  if (p.version === "0.1" || p.version === "0.2") {
    // 0.2 → 0.3: cluster_role (singular enum) → cluster_roles (array)
    for (const n of p.nodes || []) {
      if (n.cluster_roles == null) {
        const r = n.cluster_role;
        n.cluster_roles = (!r || r === "unassigned") ? [] : [r];
      }
      delete n.cluster_role;
    }
    p.version = "0.3";
    console.log("Project migrated to v0.3");
  }
  if (p.version === "0.3") {
    // 0.3 → 0.4: optional network fields. Add defaults to clusters that lack them.
    for (const c of p.clusters || []) {
      if (!c.network) {
        c.network = {
          pod_cidr: "10.244.0.0/16",
          service_cidr: "10.96.0.0/12",
          node_subnet: "192.168.10.0/24",
          dns_domain: "cluster.local",
        };
      }
      if (!Array.isArray(c.ingress_rules)) c.ingress_rules = [];
    }
    p.version = "0.4";
    console.log("Project migrated to v0.4");
  }
  if (p.version === "0.4") {
    // 0.4 → 0.5: optional Site.l4_balancers and Site.storages
    for (const s of p.sites || []) {
      if (!Array.isArray(s.l4_balancers)) s.l4_balancers = [];
      if (!Array.isArray(s.storages)) s.storages = [];
    }
    p.version = "0.5";
    console.log("Project migrated to v0.5");
  }
  if (p.version === "0.5") {
    // 0.5 → 0.6: network_devices, external_services, site_links, Node.purpose
    for (const s of p.sites || []) {
      if (!Array.isArray(s.network_devices)) s.network_devices = [];
      if (!Array.isArray(s.external_services)) s.external_services = [];
    }
    for (const n of p.nodes || []) {
      if (!n.purpose) n.purpose = "compute";
    }
    if (!Array.isArray(p.site_links)) p.site_links = [];
    p.version = "0.6";
    console.log("Project migrated to v0.6");
  }
  return p;
}

function loadProject() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try {
    const p = JSON.parse(raw);
    if (p && p.version) return migrateProject(p);
  } catch (e) { console.warn("Failed to load saved project", e); }
  return null;
}

//============ Project actions ============
function createProject(mode, name) {
  state.project = {
    version: SCHEMA_VERSION,
    name: name.trim() || "untitled",
    mode,
    sites: [],
    nodes: [],
    clusters: [],
    metadata: {
      created_at: new Date().toISOString(),

function addSite(seed, silent = false) {
  if (!state.project) return;
  const id = slug(seed.name) + "-" + uid();
  const site = {
    id,
    name: seed.name,
    kind: seed.kind,

  };

  site.network_devices = [];
  site.external_services = [];

function addNode(seed) {
  if (!state.project) return;
  // seed: { catalogKey, siteId, name, qty }
  const tmpl = state.catalog.entries.find(e => e.key === seed.catalogKey);
  if (!tmpl) throw new Error("Catalog entry not found: " + seed.catalogKey);
  const site = state.project.sites.find(s => s.id === seed.siteId);
  if (!site) throw new Error("Site not found: " + seed.siteId);
  const qty = Math.max(1, parseInt(seed.qty) || 1);
  const created = [];
  for (let i = 0; i < qty; i++) {
    const id = slug(tmpl.key) + "-" + uid();
    const node = {
      id,
      name: seed.name ? (qty === 1 ? seed.name : `${seed.name}-${i+1}`) : `${tmpl.display_name} #${state.project.nodes.length + 1}`,
      source: tmpl.source,
      brand: tmpl.brand,
      model: tmpl.key,
      custom: false,
      site_id: site.id,
      cluster_roles: [],
      purpose: "compute",
      spec: JSON.parse(JSON.stringify(tmpl.spec)),
    };
    state.project.nodes.push(node);
    site.node_ids.push(id);
    created.push(node);
  }
  if (created.length === 1) selectEntity("node", created[0].id);
  emit(); saveSoon();
  return created;
}

function duplicateNode(nodeId) {
  if (!state.project) return;
  const orig = state.project.nodes.find(x => x.id === nodeId);
  if (!orig) return;
  const baseName = (orig.name || "").replace(/\s*#\d+\s*$/, "").trim() || "node";
  const nameExists = name => state.project.nodes.some(n => n.name === name);
  let n = 1;
  while (nameExists(`${baseName} #${n}`)) n++;
  const copy = {
    ...orig,
    id: slug(orig.model || "node") + "-" + uid(),
    name: `${baseName} #${n}`,
    cluster_roles: Array.isArray(orig.cluster_roles) ? [...orig.cluster_roles] : [],
    spec: JSON.parse(JSON.stringify(orig.spec || {})),
    network: orig.network ? JSON.parse(JSON.stringify(orig.network)) : undefined,
  };
  // Clear IP so it gets re-allocated when assigned to a cluster
  if (copy.network) copy.network.ip = "";
  state.project.nodes.push(copy);
  const site = state.project.sites.find(s => s.id === copy.site_id);
  if (site && !site.node_ids.includes(copy.id)) site.node_ids.push(copy.id);
  const origCluster = getNodeCluster(nodeId);
  if (origCluster) {
    assignNodeToCluster(copy.id, origCluster.id, copy.cluster_roles[0] || "worker", true);
  }
  selectEntity("node", copy.id);
  emit(); saveSoon();
  return copy;
}

function deleteEntity(kind, id) {
  if (!state.project) return;
  if (kind === "site") {
    const site = state.project.sites.find(s => s.id === id);
    if (!site) return;
    if (site.node_ids.length) {
      if (!confirm(`이 사이트에는 ${site.node_ids.length}개의 노드가 있습니다. 모두 함께 삭제됩니다. 진행?`)) return;
      site.node_ids.slice().forEach(nid => deleteEntity("node", nid));
    }
    state.project.sites = state.project.sites.filter(s => s.id !== id);
  } else if (kind === "node") {
    state.project.nodes = state.project.nodes.filter(n => n.id !== id);
    state.project.sites.forEach(s => s.node_ids = s.node_ids.filter(nid => nid !== id));
    (state.project.clusters || []).forEach(c => c.node_ids = (c.node_ids || []).filter(nid => nid !== id));
  } else if (kind === "cluster") {
    const c = (state.project.clusters || []).find(x => x.id === id);
    if (!c) return;
    const removedNodeIds = c.node_ids || [];
    // Remove the cluster first so the "still claimed?" check below ignores it.
    state.project.clusters = state.project.clusters.filter(x => x.id !== id);
    // Unassign its nodes (clear roles) — but skip any node another cluster still references, so
    // a node shared across clusters (e.g. from imported/edited data) keeps its worker role and
    // that other cluster's workloads don't suddenly become unschedulable.
    for (const nid of removedNodeIds) {
      if (state.project.clusters.some(o => (o.node_ids || []).includes(nid))) continue;
      const n = state.project.nodes.find(x => x.id === nid);
      if (n) n.cluster_roles = [];
    }
  } else if (kind === "workload") {
    deleteWorkload(id);
    return;
  } else if (kind === "l4") {
    deleteL4(id);
    return;
  } else if (kind === "storage") {
    deleteStorage(id);
    return;
  } else if (kind === "netdev") {
    deleteNetworkDevice(id);
    return;
  } else if (kind === "extsvc") {
    deleteExternalService(id);
    return;
  } else if (kind === "sitelink") {
    deleteSiteLink(id);
    return;
  }
  if (state.ui.selectedId === id) state.ui.selectedId = null;
  emit(); saveSoon();
}

//============ Cluster actions ============
function addCluster(seed) {
  if (!state.project) return;
  if (!state.project.clusters) state.project.clusters = [];
  const id = slug(seed.name) + "-" + uid();
  const cluster = {
    id,
    name: seed.name || "cluster",
    environment_tag: seed.environment_tag || "",
    k8s_version: seed.k8s_version || "1.30",
    ha_control_plane: !!seed.ha_control_plane,
    node_ids: [],
    network: {
      pod_cidr: seed.pod_cidr || "10.244.0.0/16",
      service_cidr: seed.service_cidr || "10.96.0.0/12",
      node_subnet: seed.node_subnet || "192.168.10.0/24",
      dns_domain: seed.dns_domain || "cluster.local",
    },
    ingress_rules: [],
    addons: {
      cni: seed.cni || "Calico",
      ingress: seed.ingress || "NGINX",
      metrics_server: true,
      gpu_operator: !!seed.gpu_operator,
      service_mesh: "None",
    },
    namespaces: [],
    network_policies: [],
    workloads: [],
  };
  state.project.clusters.push(cluster);
  // assign initial nodes
  for (const nid of (seed.node_ids || [])) {
    assignNodeToCluster(nid, id, /*defaultRole*/null, /*silent*/true);
  }
  selectEntity("cluster", id);
  emit(); saveSoon();
  return cluster;

function getNodeCluster(nodeId) {
  return (state.project?.clusters || []).find(c => (c.node_ids || []).includes(nodeId));
}

function assignNodeToCluster(nodeId, clusterId, defaultRole, silent = false) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  const c = (state.project.clusters || []).find(x => x.id === clusterId);
  if (!n || !c) return;
  // remove from any other cluster (one cluster per node)
  for (const other of state.project.clusters) {
    if (other.id !== clusterId) other.node_ids = (other.node_ids || []).filter(nid => nid !== nodeId);
  }
  if (!c.node_ids.includes(nodeId)) c.node_ids.push(nodeId);
  if (!Array.isArray(n.cluster_roles)) n.cluster_roles = [];
  if (n.cluster_roles.length === 0) {
    n.cluster_roles = [defaultRole || "worker"];
  }
  // Auto-allocate node IP from cluster.network.node_subnet if not in subnet
  if (!n.network) n.network = {};
  if (!n.network.ip || !ipInCidr(n.network.ip, c.network?.node_subnet)) {
    const ip = nextNodeIp(c, state.project);
    if (ip) n.network.ip = ip;
  }
  if (!silent) { emit(); saveSoon(); }
}

function removeNodeFromCluster(nodeId, clusterId) {
  const c = (state.project.clusters || []).find(x => x.id === clusterId);
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!c) return;
  c.node_ids = (c.node_ids || []).filter(nid => nid !== nodeId);
  // Only clear roles if no other cluster still references this node (guards shared-node states).
  const stillClaimed = (state.project.clusters || []).some(o => o.id !== clusterId && (o.node_ids || []).includes(nodeId));
  if (n && !stillClaimed) n.cluster_roles = [];
  emit(); saveSoon();
}

//============ Node GPU editing (onprem) ============
function addNodeGpu(nodeId) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || n.source !== "onprem") return;
  const chassis = n.spec.gpu_chassis || {};
  const supported = chassis.supported_models || [];
  if (!supported.length) return;
  const gpuModels = state.catalog.gpuModels;
  // Pick the first model whose form factor is in chassis.supported_form_factors
  const okModel = supported.find(m =>
    !gpuModels[m] || (chassis.supported_form_factors || []).includes(gpuModels[m].form_factor)
  ) || supported[0];
  const ginfo = gpuModels[okModel] || {};
  // Default count: nvswitch-mesh fills available slots; bridge-pair = 2; otherwise 1
  if (!n.spec.gpu) n.spec.gpu = [];
  const used = n.spec.gpu.reduce((a, g) => a + (g.count || 0), 0);
  const remaining = (chassis.max_count || 0) - used;
  let defaultCount = 1;
  if (chassis.nvlink_topology === "nvswitch-mesh") defaultCount = remaining;
  else if (chassis.nvlink_topology === "bridge-pair") defaultCount = Math.min(2, remaining);
  defaultCount = Math.max(1, Math.min(defaultCount, remaining || 1));
  n.spec.gpu.push({
    model: okModel,
    form_factor: ginfo.form_factor,
    count: defaultCount,
    nvlink_enabled: chassis.nvlink_topology !== "none" && ginfo.nvlink_capable !== false,
  });
  emit(); saveSoon();
}

function updateNodeGpu(nodeId, index, partial) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || !n.spec.gpu || !n.spec.gpu[index]) return;
  const cur = n.spec.gpu[index];
  // If model changes, also update form_factor based on gpu-models reference, and
  // reconcile MIG: drop it if the new model can't do MIG, or reset to the first
  // profile if the currently-selected profile isn't valid for the new model.
  if (partial.model && state.catalog.gpuModels[partial.model]) {
    const ni = state.catalog.gpuModels[partial.model];
    partial.form_factor = ni.form_factor;
    const profs = ni.mig_profiles || [];
    if (!ni.mig_capable || !profs.length) {
      partial.mig_enabled = false;
      partial.mig_profile = "";
    } else if (cur.mig_enabled && !profs.some(p => p.name === cur.mig_profile)) {
      partial.mig_profile = profs[0].name;
    }
  }
  Object.assign(cur, partial);
  // Invariant: MIG enabled ⇒ a profile valid for the current model is selected
  // (guards programmatic/imported state where mig_profile may be missing).
  if (cur.mig_enabled) {
    const mi = state.catalog.gpuModels[cur.model];
    const mprofs = (mi && mi.mig_profiles) || [];
    if (!mprofs.some(p => p.name === cur.mig_profile)) {
      if (mprofs.length) cur.mig_profile = mprofs[0].name;
      else { cur.mig_enabled = false; delete cur.mig_profile; }
    }
  }
  emit(); saveSoon();
}

function removeNodeGpu(nodeId, index) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || !n.spec.gpu) return;
  n.spec.gpu.splice(index, 1);
  if (n.spec.gpu.length === 0) delete n.spec.gpu;
  if (!n.spec.gpu) n.spec.gpu = [];
  emit(); saveSoon();
}

//============ Node disk editing (storage expansion) ============
function addNodeDisk(nodeId) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n) return;
  if (!Array.isArray(n.spec.disks)) n.spec.disks = [];
  // Seed new row from last existing disk so capacity expansion uses a familiar default.
  const last = n.spec.disks[n.spec.disks.length - 1];
  n.spec.disks.push({
    size_gb: last?.size_gb || 960,
    type: last?.type || "NVMe",
    count: 1,
  });
  emit(); saveSoon();
}

function updateNodeDisk(nodeId, index, partial) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || !Array.isArray(n.spec.disks) || !n.spec.disks[index]) return;
  const cur = n.spec.disks[index];
  const next = { ...cur, ...partial };
  if (partial.size_gb != null) next.size_gb = Math.max(1, Number(partial.size_gb) || 0);
  if (partial.count != null) next.count = Math.max(1, parseInt(partial.count) || 1);
  if (partial.type != null && !["NVMe", "SSD", "HDD"].includes(partial.type)) next.type = cur.type || "NVMe";
  if (partial.raid != null && !["none", "0", "1", "5", "6", "10"].includes(partial.raid)) next.raid = cur.raid || "none";
  // Drop raid field entirely when "none" to keep payload clean
  if (next.raid === "none" || next.raid == null) delete next.raid;
  n.spec.disks[index] = next;
  emit(); saveSoon();
}

// RAID usable capacity. Returns { usable_gb, min_count, valid }.
// level: "0"=stripe, "1"=mirror, "5"=single parity, "6"=double parity, "10"=mirrored stripe.
function raidUsable(disk) {
  const size = Number(disk.size_gb) || 0;
  const count = parseInt(disk.count) || 1;
  const level = disk.raid || "none";
  const raw = size * count;
  switch (level) {
    case "0":  return { usable_gb: raw,                       min_count: 2, valid: count >= 2 };
    case "1":  return { usable_gb: size,                      min_count: 2, valid: count >= 2 };
    case "5":  return { usable_gb: size * Math.max(0, count - 1), min_count: 3, valid: count >= 3 };
    case "6":  return { usable_gb: size * Math.max(0, count - 2), min_count: 4, valid: count >= 4 };
    case "10": return { usable_gb: size * Math.floor(count / 2),  min_count: 4, valid: count >= 4 && count % 2 === 0 };
    case "none":
    default:   return { usable_gb: raw, min_count: 1, valid: true };
  }
}

function removeNodeDisk(nodeId, index) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || !Array.isArray(n.spec.disks)) return;
  n.spec.disks.splice(index, 1);
  emit(); saveSoon();
}

const NIC_SPEEDS = [1, 10, 25, 40, 50, 100, 200, 400];

function setNodeRoleEnabled(nodeId, role, enabled) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n) return;
  if (!Array.isArray(n.cluster_roles)) n.cluster_roles = [];
  const has = n.cluster_roles.includes(role);
  if (enabled && !has) n.cluster_roles.push(role);
  else if (!enabled && has) n.cluster_roles = n.cluster_roles.filter(r => r !== role);
  emit(); saveSoon();
}

function updateClusterField(id, path, value) {
  const c = state.project.clusters.find(x => x.id === id);
  if (!c) return;
  // Allow toggling lock itself even when locked
  if (isClusterLocked(c) && path !== "locked") return;
  const parts = path.split(".");
  let obj = c;
  while (parts.length > 1) {
    const p = parts.shift();
    if (obj[p] == null) obj[p] = {};
    obj = obj[p];
  }
  obj[parts[0]] = value;
  emit(); saveSoon();
}

//============ Workload actions ============
function addWorkload(clusterId, seed) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!c.workloads) c.workloads = [];
  const id = slug(seed.name) + "-" + uid();
  const wl = {
    id,
    name: seed.name,
    category: seed.category || "API",
    namespace: seed.namespace || "default",
    labels: seed.labels || { app: slug(seed.name) || id },
    replicas: parseInt(seed.replicas) || 1,
    kind: seed.kind || "Deployment",
    resources: {
      requests: {
        cpu: parseFloat(seed.cpu) || 0.5,
        memory_gb: parseFloat(seed.memory_gb) || 1,
      },
    },
  };
  if (seed.gpu_count && seed.gpu_count > 0) {
    wl.resources.requests.gpu = { count: parseInt(seed.gpu_count) };
    if (seed.gpu_model) wl.resources.requests.gpu.model = seed.gpu_model;
  }
  // Default network.service based on category
  const wantsService = ["API", "Frontend", "WAS", "DB", "Cache", "Queue", "ML-Inference"].includes(wl.category);
  if (wantsService) {
    const portByCategory = {
      "Frontend": [{ name: "http", port: 80, target_port: 80, protocol: "TCP" }],
      "API": [{ name: "http", port: 8080, target_port: 8080, protocol: "TCP" }],
      "WAS": [{ name: "http", port: 8080, target_port: 8080, protocol: "TCP" }],
      "DB": [{ name: "pg", port: 5432, target_port: 5432, protocol: "TCP" }],
      "Cache": [{ name: "redis", port: 6379, target_port: 6379, protocol: "TCP" }],
      "Queue": [{ name: "kafka", port: 9092, target_port: 9092, protocol: "TCP" }],
      "ML-Inference": [{ name: "http", port: 8080, target_port: 8080, protocol: "TCP" }],
    };
    wl.network = {
      service: {
        type: "ClusterIP",
        ports: portByCategory[wl.category] || [{ name: "http", port: 80, target_port: 80, protocol: "TCP" }],
      },
    };
  }
  // Apply runtime preset if chosen
  if (seed.runtime_preset && state.catalog.runtime[seed.runtime_preset]) {
    const p = state.catalog.runtime[seed.runtime_preset];
    wl.runtime = JSON.parse(JSON.stringify(p));
    delete wl.runtime.notes;
  }
  c.workloads.push(wl);
  selectEntity("workload", id);
  emit(); saveSoon();
  return wl;
}

function quickDeployWorkload(clusterId, frameworkKey, ha = false) {
  const tmpl = QUICK_DEPLOY_TEMPLATES[frameworkKey];
  const c = (state.project?.clusters || []).find(x => x.id === clusterId);
  if (!tmpl || !c) return;
  const useHA = (ha && tmpl.haCapable) || tmpl.alwaysHA;
  const preset = state.catalog.runtime?.[tmpl.seed.runtime_preset];
  const existing = new Set((c.workloads || []).map(w => w.name));
  let n = 1;
  while (existing.has(`${tmpl.namePrefix}-${n}`)) n++;

  const seed = {
    name: `${tmpl.namePrefix}-${n}`,
    ...tmpl.seed,
    runtime_preset: preset ? tmpl.seed.runtime_preset : undefined,
  };
  if (useHA && tmpl.haReplicas) seed.replicas = tmpl.haReplicas;

  const wl = addWorkload(clusterId, seed);
  if (!wl) return;

  let changed = false;
  // Resource limits (max) — from template seed
  if (tmpl.seed.cpu_limit != null || tmpl.seed.memory_limit_gb != null) {
    wl.resources.limits = wl.resources.limits || {};
    if (tmpl.seed.cpu_limit != null) wl.resources.limits.cpu = tmpl.seed.cpu_limit;
    if (tmpl.seed.memory_limit_gb != null) wl.resources.limits.memory_gb = tmpl.seed.memory_limit_gb;
    changed = true;
  }
  // Override service port for product-specific defaults (DB/Queue/etc)
  if (tmpl.servicePort && wl.network?.service?.ports?.length) {
    wl.network.service.ports[0] = {
      name: tmpl.servicePort.name,
      port: tmpl.servicePort.port,
      target_port: tmpl.servicePort.port,
      protocol: "TCP",
    };
    changed = true;
  }
  // Stateful templates get a PVC
  if (tmpl.pvc) {
    wl.persistent_volumes = [{
      size_gb: tmpl.pvc.size_gb,
      access_mode: tmpl.pvc.access_mode || "RWO",
      storage_class: "",
    }];
    changed = true;
  }
  // HA: pod anti-affinity by node so replicas spread across nodes
  if (useHA) {
    wl.scheduling = wl.scheduling || {};
    wl.scheduling.anti_affinity = "spread-by-node";
    changed = true;
  }
  if (changed) { emit(); saveSoon(); }
}

function findWorkload(id) {
  for (const c of state.project.clusters || []) {
    const w = (c.workloads || []).find(x => x.id === id);
    if (w) return { workload: w, cluster: c };
  }
  return null;
}

function deleteWorkload(id) {
  for (const c of state.project.clusters || []) {
    const idx = (c.workloads || []).findIndex(x => x.id === id);
    if (idx >= 0) {
      c.workloads.splice(idx, 1);
      // remove this id from any depends_on entries
      for (const w of c.workloads) {
        if (Array.isArray(w.depends_on)) {
          w.depends_on = w.depends_on.filter(d => d.target_workload_id !== id);
        }
      }
      break;
    }
  }
  if (state.ui.selectedId === id) state.ui.selectedId = null;
  emit(); saveSoon();
}

// Parse decimal input from oninput handlers. Returns parsed number or null if the
// input is in an intermediate state (empty, ".", "0.", "-", trailing dot) — caller
// should skip the update so re-render doesn't snap the value back.
function parseDecimalInput(raw) {
  const s = String(raw).trim();
  if (s === "" || s === "-" || s === "." || s === "-." || s.endsWith(".")) return null;
  const v = parseFloat(s);
  return Number.isFinite(v) ? v : null;
}

// ============ Copy/Paste via system clipboard ============
// Clipboard envelope: { _vk8s_clip: 1, kind: "workload"|"cluster", data: {...} }
const VK8S_CLIP_MARKER = "_vk8s_clip";

async function copyEntityToClipboard(kind, id) {
  let data;
  const extra = {};
  if (kind === "workload") {
    const f = findWorkload(id);
    if (!f) return;
    data = JSON.parse(JSON.stringify(f.workload));
  } else if (kind === "cluster") {
    const c = (state.project?.clusters || []).find(x => x.id === id);
    if (!c) return;
    data = JSON.parse(JSON.stringify(c));
    // Bundle every object *within* the cluster: its assigned nodes (full) + the sites those
    // nodes live in (shell only — name/kind/region/capacity), so paste can rebuild a fully
    // scheduled clone, including across projects where the original nodes/sites don't exist.
    const nodes = (c.node_ids || [])
      .map(nid => (state.project.nodes || []).find(n => n.id === nid)).filter(Boolean);
    const siteIds = new Set(nodes.map(n => n.site_id).filter(Boolean));
    extra.nodes = JSON.parse(JSON.stringify(nodes));
    extra.sites = [...siteIds]
      .map(sid => (state.project.sites || []).find(s => s.id === sid)).filter(Boolean)
      .map(s => ({ id: s.id, name: s.name, kind: s.kind, cloud_provider: s.cloud_provider, region: s.region, capacity: s.capacity }));
  } else { return; }
  const envelope = { [VK8S_CLIP_MARKER]: 1, kind, data, ...extra };
  const text = JSON.stringify(envelope, null, 2);
  // In-memory backup so paste works even if clipboard permission denied
  state.ui.clipboard = envelope;
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    flashStatus(`${kind} '${data.name}' 복사됨`);
  } catch (_) {
    flashStatus(`${kind} '${data.name}' 복사됨 (메모리만)`);
  }
}

async function readClipboardEnvelope() {
  // Try system clipboard first, fall back to in-memory
  try {
    if (navigator.clipboard?.readText) {
      const text = await navigator.clipboard.readText();
      const parsed = JSON.parse(text);
      if (parsed && parsed[VK8S_CLIP_MARKER]) return parsed;
    }
  } catch (_) { /* fall through */ }
  return state.ui.clipboard || null;
}

async function pasteWorkloadIntoCluster(clusterId) {
  const envelope = await readClipboardEnvelope();
  if (!envelope || envelope.kind !== "workload") {
    alert("클립보드에 워크로드가 없습니다.");
    return;
  }
  const c = (state.project?.clusters || []).find(x => x.id === clusterId);
  if (!c) return;
  if (!Array.isArray(c.workloads)) c.workloads = [];
  // Deep clone, regenerate id, dedupe name
  const src = envelope.data;
  const baseName = (src.name || "workload").replace(/\s*#\d+\s*$/, "").trim();
  const existing = new Set(c.workloads.map(w => w.name));
  let n = 1;
  while (existing.has(`${baseName} #${n}`)) n++;
  const newName = `${baseName} #${n}`;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = slug(copy.model || copy.name || "workload") + "-" + uid();
  copy.name = newName;
  delete copy.locked; // pasted copy starts unlocked
  // depends_on inside the cloned workload still points to original IDs.
  // If those workloads exist in this target cluster, keep refs; else drop.
  const validIds = new Set((c.workloads || []).map(w => w.id));
  if (Array.isArray(copy.depends_on)) {
    copy.depends_on = copy.depends_on.filter(d => validIds.has(d.target_workload_id));
  }
  c.workloads.push(copy);
  selectEntity("workload", copy.id);
  emit(); saveSoon();
  flashStatus(`Pasted as '${newName}'`);
}

async function pasteClusterIntoProject() {
  const envelope = await readClipboardEnvelope();
  if (!envelope || envelope.kind !== "cluster") {
    alert("클립보드에 클러스터가 없습니다.");
    return;
  }
  if (!Array.isArray(state.project.clusters)) state.project.clusters = [];
  const src = envelope.data;
  const baseName = (src.name || "cluster").replace(/\s*#\d+\s*$/, "").trim();
  const existing = new Set(state.project.clusters.map(c => c.name));
  let n = 1;
  while (existing.has(`${baseName} #${n}`)) n++;
  const newName = `${baseName} #${n}`;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = slug(copy.name || "cluster") + "-" + uid();
  copy.name = newName;
  delete copy.locked;
  // Workloads: keep but regenerate ids; remap depends_on within the cluster.
  copy.node_ids = [];   // rebuilt below from the bundled nodes
  const idMap = new Map();
  if (Array.isArray(copy.workloads)) {
    for (const w of copy.workloads) {
      const oldId = w.id;
      w.id = slug(w.name || "wl") + "-" + uid();
      idMap.set(oldId, w.id);
      delete w.locked;
    }
    // Remap depends_on
    for (const w of copy.workloads) {
      if (Array.isArray(w.depends_on)) {
        w.depends_on = w.depends_on
          .map(d => ({ ...d, target_workload_id: idMap.get(d.target_workload_id) || d.target_workload_id }))
          .filter(d => idMap.has(d.target_workload_id) || (d.target_workload_id && (state.project.clusters.flatMap(c2 => (c2.workloads || [])).some(w2 => w2.id === d.target_workload_id))));
      }
    }
  }
  // Push the cluster first so assignNodeToCluster can attach the rebuilt nodes to it.
  state.project.clusters.push(copy);

  // Recreate the bundled nodes (the cluster's compute) into existing-or-new sites, then assign
  // them to the new cluster. Sites are reused by id, then by name, else recreated as a shell.
  const bundledNodes = Array.isArray(envelope.nodes) ? envelope.nodes : [];
  const bundledSites = Array.isArray(envelope.sites) ? envelope.sites : [];
  const siteMap = new Map();
  const resolveSiteId = (oldSiteId) => {
    if (siteMap.has(oldSiteId)) return siteMap.get(oldSiteId);
    let target = (state.project.sites || []).find(s => s.id === oldSiteId);
    if (!target) {
      const shell = bundledSites.find(s => s.id === oldSiteId);
      if (shell) {
        target = (state.project.sites || []).find(s => s.name === shell.name)
          || addSite({ name: shell.name, kind: shell.kind, cloud_provider: shell.cloud_provider, region: shell.region, capacity: shell.capacity }, true);
      }
    }
    if (!target) target = (state.project.sites || [])[0] || addSite({ name: "Imported Site", kind: "onprem" }, true);
    siteMap.set(oldSiteId, target.id);
    return target.id;
  };
  const nodeNameExists = name => (state.project.nodes || []).some(nd => nd.name === name);
  for (const bn of bundledNodes) {
    const node = JSON.parse(JSON.stringify(bn));
    const role0 = (Array.isArray(node.cluster_roles) && node.cluster_roles.length) ? node.cluster_roles[0] : "worker";
    const base = (node.name || "node").replace(/\s*#\d+\s*$/, "").trim() || "node";
    let k = 1; while (nodeNameExists(`${base} #${k}`)) k++;
    node.id = slug(node.model || node.name || "node") + "-" + uid();
    node.name = `${base} #${k}`;
    node.site_id = resolveSiteId(bn.site_id);
    delete node.locked;
    if (node.network) node.network.ip = "";   // re-allocated on assignment
    state.project.nodes.push(node);
    const site = state.project.sites.find(s => s.id === node.site_id);
    if (site && !(site.node_ids || (site.node_ids = [])).includes(node.id)) site.node_ids.push(node.id);
    assignNodeToCluster(node.id, copy.id, role0, true);
  }

  selectEntity("cluster", copy.id);
  emit(); saveSoon();
  const nodeNote = bundledNodes.length ? ` (+${bundledNodes.length} nodes)` : "";
  flashStatus(`Pasted as '${newName}'${nodeNote}`);
}

function flashStatus(msg) {
  const el = $("#saveStatus");
  if (!el) return;
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 2500);
}

// ============ Entity lock helpers ============
// Workload/cluster can be marked locked to prevent accidental edits.
// All updateXField functions check this and silently no-op when locked.
function isWorkloadLocked(workload) { return workload && workload.locked === true; }
function isClusterLocked(cluster) { return cluster && cluster.locked === true; }
function toggleWorkloadLock(id) {
  const f = findWorkload(id);
  if (!f) return;
  f.workload.locked = !f.workload.locked;
  if (!f.workload.locked) delete f.workload.locked;
  emit(); saveSoon();
}
function toggleClusterLock(id) {
  const c = (state.project?.clusters || []).find(x => x.id === id);
  if (!c) return;
  c.locked = !c.locked;
  if (!c.locked) delete c.locked;
  emit(); saveSoon();
}

// Integer-only variant. Returns null for empty / non-numeric. No decimal support.
function parseIntInput(raw) {
  const s = String(raw).trim();
  if (s === "" || s === "-") return null;
  if (!/^-?\d+$/.test(s)) return null;
  const v = parseInt(s, 10);
  return Number.isFinite(v) ? v : null;
}

// No-op kept for backwards compatibility in case any callsite still references it.
// We rely on default browser focus behavior + restoreFocus for cursor preservation.
const focusSelectAll = () => {};

function updateWorkloadField(id, path, value) {
  const found = findWorkload(id);
  if (!found) return;
  // Allow toggling lock itself even when locked
  if (isWorkloadLocked(found.workload) && path !== "locked") return;
  const parts = path.split(".");
  let obj = found.workload;
  while (parts.length > 1) {
    const p = parts.shift();
    if (obj[p] == null) obj[p] = {};
    obj = obj[p];
  }
  obj[parts[0]] = value;
  emit(); saveSoon();
}

//============ Namespace + NetworkPolicy actions ============
function addNamespace(clusterId, seed) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!c.namespaces) c.namespaces = [];
  if (c.namespaces.some(n => n.name === seed.name)) {
    alert(`Namespace '${seed.name}' already exists in this cluster.`);
    return;
  }
  c.namespaces.push({
    name: seed.name,
    description: seed.description || "",
    labels: seed.labels || {},
    default_deny: !!seed.default_deny,
  });
  emit(); saveSoon();
}

function deleteNamespace(clusterId, name) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c || !c.namespaces) return;
  // Reassign workloads in this NS to "default"
  for (const w of c.workloads || []) {
    if (w.namespace === name) w.namespace = "default";
  }
  // Delete NPs in this NS or referencing it
  if (c.network_policies) {
    c.network_policies = c.network_policies.filter(np => np.namespace !== name);
    for (const np of c.network_policies) {
      if (np.ingress) {
        for (const r of np.ingress) {
          if (r.from_namespaces) r.from_namespaces = r.from_namespaces.filter(n => n !== name);
        }
      }
      if (np.egress) {
        for (const r of np.egress) {
          if (r.to_namespaces) r.to_namespaces = r.to_namespaces.filter(n => n !== name);
        }
      }
    }
  }
  c.namespaces = c.namespaces.filter(n => n.name !== name);
  emit(); saveSoon();
}

// Rename a namespace and cascade the new name to every reference site:
//   - workloads' .namespace
//   - network_policies' .namespace
//   - network_policies[].ingress[].from_namespaces[]
//   - network_policies[].egress[].to_namespaces[]
// Returns { ok: true } on success or { ok: false, error } with a human-readable reason.
function renameNamespace(clusterId, oldName, newName) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c || !c.namespaces) return { ok: false, error: "cluster를 찾을 수 없습니다" };
  if (oldName === newName) return { ok: true, unchanged: true };
  if (oldName === "default") {
    return { ok: false, error: "'default' namespace는 K8s 기본이라 이름을 바꿀 수 없습니다" };
  }
  if (!/^[a-z0-9][a-z0-9-]*$/.test(newName)) {
    return { ok: false, error: "이름 형식 오류: 소문자·숫자·-만 허용, 첫 글자는 영숫자 (DNS-1123)" };
  }
  if (newName.length > 63) {
    return { ok: false, error: "이름은 63자 이하여야 합니다 (DNS-1123)" };
  }
  if (c.namespaces.some(n => n.name === newName)) {
    return { ok: false, error: `'${newName}'은 이미 이 cluster에 존재합니다` };
  }
  const ns = c.namespaces.find(n => n.name === oldName);
  if (!ns) return { ok: false, error: `namespace '${oldName}'를 찾을 수 없습니다` };
  ns.name = newName;
  // Cascade to workloads
  for (const w of (c.workloads || [])) {
    if (w.namespace === oldName) w.namespace = newName;
  }
  // Cascade to network policies (own namespace + cross-NS references)
  for (const np of (c.network_policies || [])) {
    if (np.namespace === oldName) np.namespace = newName;
    if (np.ingress) {
      for (const r of np.ingress) {
        if (r.from_namespaces) r.from_namespaces = r.from_namespaces.map(n => n === oldName ? newName : n);
      }
    }
    if (np.egress) {
      for (const r of np.egress) {
        if (r.to_namespaces) r.to_namespaces = r.to_namespaces.map(n => n === oldName ? newName : n);
      }
    }
  }
  emit(); saveSoon();
  return { ok: true };
}

function updateNamespaceField(clusterId, name, path, value) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c || !c.namespaces) return;
  const ns = c.namespaces.find(n => n.name === name);
  if (!ns) return;
  const parts = path.split(".");
  let obj = ns;
  while (parts.length > 1) {
    const p = parts.shift();
    if (obj[p] == null) obj[p] = {};
    obj = obj[p];
  }
  obj[parts[0]] = value;
  emit(); saveSoon();
}

function addNetworkPolicy(clusterId, seed) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!c.network_policies) c.network_policies = [];
  const id = slug(seed.preset || seed.name) + "-" + uid();
  const np = {
    id,
    name: seed.name || `${seed.preset}-${(c.network_policies.length || 0) + 1}`,
    namespace: seed.namespace,
    preset: seed.preset || "custom",
    policy_types: ["Ingress"],
  };
  if (seed.preset === "default-deny") {
    np.policy_types = ["Ingress", "Egress"];
    np.ingress = [];
    np.egress = [];
  } else if (seed.preset === "allow-from-same-ns") {
    np.ingress = [{ from_namespaces: [seed.namespace] }];
  } else if (seed.preset === "allow-from-namespace" && seed.from_namespace) {
    np.ingress = [{ from_namespaces: [seed.from_namespace] }];
  } else if (seed.preset === "allow-from-ingress") {
    np.ingress = [{ from_namespaces: ["ingress-nginx"] }];
  }
  c.network_policies.push(np);
  emit(); saveSoon();
}

function deleteNetworkPolicy(clusterId, npId) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c || !c.network_policies) return;
  c.network_policies = c.network_policies.filter(np => np.id !== npId);
  emit(); saveSoon();
}

//============ Cluster Production Preset ============
function applyClusterPreset(clusterId, opts = {}) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  const o = {
    haControlPlane: true, ingress: true, tls: true, monitoring: true,
    logging: true, metricsServer: true, backup: false,
    secretStore: false, gitops: false, mesh: false,
    networkPolicies: true, resourceQuotas: true,
    ...opts,
  };

  // 1. HA control plane: if ≥3 nodes, mark first 3 as cp+worker (preserving worker)
  if (o.haControlPlane) {
    const nodes = (c.node_ids || []).map(id => state.project.nodes.find(n => n.id === id)).filter(Boolean);
    if (nodes.length >= 3) {
      for (let i = 0; i < 3; i++) {
        const n = nodes[i];
        if (!Array.isArray(n.cluster_roles)) n.cluster_roles = [];
        if (!n.cluster_roles.includes("control-plane")) n.cluster_roles.push("control-plane");
        if (!n.cluster_roles.includes("worker")) n.cluster_roles.push("worker");
      }
      c.ha_control_plane = true;
    } else if (nodes.length >= 1) {
      // Single/dual: dual-role on the first
      const n = nodes[0];
      if (!Array.isArray(n.cluster_roles)) n.cluster_roles = [];
      if (!n.cluster_roles.includes("control-plane")) n.cluster_roles.push("control-plane");
      if (!n.cluster_roles.includes("worker")) n.cluster_roles.push("worker");
    }
  }

  // 2. Namespaces
  if (!c.namespaces) c.namespaces = [];
  const ensureNs = (name, default_deny = false, labels = {}) => {
    if (!c.namespaces.some(n => n.name === name)) {
      const ns = { name, default_deny, labels };
      c.namespaces.push(ns);
      return ns;
    }
    return c.namespaces.find(n => n.name === name);
  };
  if (o.ingress) ensureNs("ingress-nginx", false, { "kubernetes.io/metadata.name": "ingress-nginx" });
  if (o.tls) ensureNs("cert-manager", false);
  if (o.monitoring) ensureNs("monitoring", true, { tier: "platform" });
  if (o.logging) ensureNs("logging", true, { tier: "platform" });
  if (o.backup) ensureNs("velero", false);
  if (o.secretStore) ensureNs("external-secrets", false);
  if (o.gitops) ensureNs("argocd", false);
  if (o.mesh) ensureNs("istio-system", false);

  // 3. Platform workloads
  if (!c.workloads) c.workloads = [];
  const addWl = (seed) => {
    if (c.workloads.some(w => w.name === seed.name)) return;
    const id = slug(seed.name) + "-" + uid();
    const wl = {
      id,
      name: seed.name,
      category: seed.category || "Other",
      namespace: seed.namespace,
      labels: seed.labels || { app: slug(seed.name) },
      replicas: seed.replicas || 1,
      kind: seed.kind || "Deployment",
      resources: seed.resources || { requests: { cpu: 0.1, memory_gb: 0.25 } },
    };
    if (seed.runtime) wl.runtime = seed.runtime;
    if (seed.network) wl.network = seed.network;
    if (seed.persistent_volumes) wl.persistent_volumes = seed.persistent_volumes;
    c.workloads.push(wl);
  };

  if (o.ingress) {
    addWl({
      name: "ingress-nginx-controller", category: "API", namespace: "ingress-nginx",
      replicas: 2,
      resources: { requests: { cpu: 0.1, memory_gb: 0.25 } },
      network: { service: { type: "LoadBalancer", ports: [
        { name: "http",  port: 80,  target_port: 80,  protocol: "TCP" },
        { name: "https", port: 443, target_port: 443, protocol: "TCP" },
      ] } },
    });
  }
  if (o.tls) {
    addWl({
      name: "cert-manager", category: "Other", namespace: "cert-manager",
      replicas: 1,
      resources: { requests: { cpu: 0.05, memory_gb: 0.128 } },
    });
  }
  if (o.monitoring) {
    addWl({
      name: "prometheus", category: "Other", namespace: "monitoring", kind: "StatefulSet",
      replicas: 1,
      resources: { requests: { cpu: 0.5, memory_gb: 4 } },
      persistent_volumes: [{ size_gb: 100, access_mode: "RWO", storage_class: "" }],
      network: { service: { type: "ClusterIP", ports: [{ name: "web", port: 9090, target_port: 9090, protocol: "TCP" }] } },
    });
    addWl({
      name: "grafana", category: "Frontend", namespace: "monitoring",
      replicas: 1,
      resources: { requests: { cpu: 0.1, memory_gb: 0.5 } },
      network: { service: { type: "ClusterIP", ports: [{ name: "http", port: 3000, target_port: 3000, protocol: "TCP" }] } },
    });
  }
  if (o.logging) {
    addWl({
      name: "loki", category: "Other", namespace: "logging", kind: "StatefulSet",
      replicas: 1,
      resources: { requests: { cpu: 0.5, memory_gb: 2 } },
      persistent_volumes: [{ size_gb: 200, access_mode: "RWO", storage_class: "" }],
    });
  }
  if (o.metricsServer) {
    addWl({
      name: "metrics-server", category: "Other", namespace: "kube-system",
      replicas: 1,
      resources: { requests: { cpu: 0.05, memory_gb: 0.128 } },
    });
  }
  if (o.backup) {
    addWl({
      name: "velero", category: "Other", namespace: "velero",
      replicas: 1,
      resources: { requests: { cpu: 0.1, memory_gb: 0.25 } },
    });
  }
  if (o.secretStore) {
    addWl({
      name: "external-secrets-operator", category: "Other", namespace: "external-secrets",
      replicas: 1,
      resources: { requests: { cpu: 0.05, memory_gb: 0.128 } },
    });
  }
  if (o.gitops) {
    addWl({
      name: "argocd-server", category: "API", namespace: "argocd",
      replicas: 2,
      resources: { requests: { cpu: 0.2, memory_gb: 0.5 } },
      network: { service: { type: "ClusterIP", ports: [{ name: "https", port: 443, target_port: 8080, protocol: "TCP" }] } },
    });
  }
  if (o.mesh) {
    addWl({
      name: "istiod", category: "Other", namespace: "istio-system",
      replicas: 1,
      resources: { requests: { cpu: 0.5, memory_gb: 2 } },
    });
  }

  // 4. NetworkPolicies (default-deny + same-ns allow on prod ns)
  if (o.networkPolicies) {
    if (!c.network_policies) c.network_policies = [];
    const addNp = (seed) => {
      if (c.network_policies.some(x => x.name === seed.name)) return;
      c.network_policies.push({
        id: slug(seed.name) + "-" + uid(),
        name: seed.name,
        namespace: seed.namespace,
        preset: seed.preset,
        policy_types: seed.policy_types || ["Ingress"],
        ingress: seed.ingress,
        egress: seed.egress,
      });
    };
    if (o.monitoring) {
      addNp({ name: "monitoring-default-deny", namespace: "monitoring", preset: "default-deny",
              policy_types: ["Ingress", "Egress"], ingress: [], egress: [] });
      addNp({ name: "monitoring-allow-same-ns", namespace: "monitoring", preset: "allow-from-same-ns",
              ingress: [{ from_namespaces: ["monitoring"] }] });
      addNp({ name: "monitoring-allow-from-ingress", namespace: "monitoring", preset: "allow-from-namespace",
              ingress: [{ from_namespaces: ["ingress-nginx"] }] });
    }
    if (o.logging) {
      addNp({ name: "logging-default-deny", namespace: "logging", preset: "default-deny",
              policy_types: ["Ingress", "Egress"], ingress: [], egress: [] });
      addNp({ name: "logging-allow-same-ns", namespace: "logging", preset: "allow-from-same-ns",
              ingress: [{ from_namespaces: ["logging"] }] });
    }
  }

  // 5. Addons
  if (!c.addons) c.addons = {};
  if (o.ingress) c.addons.ingress = "NGINX";
  if (!c.addons.cni || c.addons.cni === "None") c.addons.cni = "Calico";
  if (o.metricsServer) c.addons.metrics_server = true;
  if (o.mesh) c.addons.service_mesh = "Istio";
  // GPU operator if any GPU node in cluster
  const hasGpu = (c.node_ids || []).some(nid => {
    const n = state.project.nodes.find(x => x.id === nid);
    return (n?.spec?.gpu || []).length > 0;
  });
  if (hasGpu) c.addons.gpu_operator = true;

  // 6. ResourceQuotas
  if (o.resourceQuotas) {
    const setQuota = (nsName, quota) => {
      const ns = c.namespaces.find(n => n.name === nsName);
      if (ns && !ns.resource_quota) ns.resource_quota = quota;
    };
    if (o.monitoring) setQuota("monitoring", { cpu: 8, memory_gb: 32, max_pods: 50 });
    if (o.logging) setQuota("logging", { cpu: 8, memory_gb: 32, max_pods: 30 });
    if (o.tls) setQuota("cert-manager", { cpu: 2, memory_gb: 4, max_pods: 10 });
    if (o.ingress) setQuota("ingress-nginx", { cpu: 4, memory_gb: 8, max_pods: 20 });
  }

  emit(); saveSoon();
}

//============ Workload service helpers ============
function ensureWorkloadService(w, defaultType = "ClusterIP") {
  if (!w.network) w.network = {};
  if (!w.network.service) w.network.service = { type: defaultType, ports: [] };
  if (!Array.isArray(w.network.service.ports)) w.network.service.ports = [];
  return w.network.service;
}
function addServicePort(workloadId) {
  const found = findWorkload(workloadId);
  if (!found) return;
  const svc = ensureWorkloadService(found.workload);
  const defaults = { name: "http", port: 80, target_port: 8080, protocol: "TCP" };
  // Choose unique name
  const usedNames = new Set(svc.ports.map(p => p.name));
  let n = "http";
  if (usedNames.has(n)) {
    let i = 2;
    while (usedNames.has(`port-${i}`)) i++;
    n = `port-${i}`;
  }
  svc.ports.push({ ...defaults, name: n });
  emit(); saveSoon();
}
function updateServicePort(workloadId, idx, patch) {
  const found = findWorkload(workloadId);
  if (!found?.workload?.network?.service?.ports?.[idx]) return;
  Object.assign(found.workload.network.service.ports[idx], patch);
  emit(); saveSoon();
}
function removeServicePort(workloadId, idx) {
  const found = findWorkload(workloadId);
  if (!found?.workload?.network?.service?.ports) return;
  found.workload.network.service.ports.splice(idx, 1);
  emit(); saveSoon();
}

function lookupLineEndpointName(part) {
  // part = "kind:id" (or "ingress:cid:idx" for ingress sources)
  const [kind, ...rest] = part.split(":");
  const id = rest.join(":");
  const p = state.project;
  if (!p) return id;
  if (kind === "cluster") return p.clusters?.find(c => c.id === id)?.name || id;
  if (kind === "node")    return p.nodes?.find(n => n.id === id)?.name || id;
  if (kind === "l4")      {
    for (const s of p.sites || []) for (const lb of s.l4_balancers || []) if (lb.id === id) return lb.name;
  }
  if (kind === "storage") {
    for (const s of p.sites || []) for (const st of s.storages || []) if (st.id === id) return st.name;
  }
  if (kind === "netdev")  {
    for (const s of p.sites || []) for (const d of s.network_devices || []) if (d.id === id) return d.name;
  }
  if (kind === "extsvc")  {
    for (const s of p.sites || []) for (const e of s.external_services || []) if (e.id === id) return e.name;
  }
  if (kind === "ingress") {
    // ingress:${cid}:${ruleIdx}
    const [cid, idx] = rest;
    const cn = p.clusters?.find(c => c.id === cid)?.name || cid;
    return `${cn} ingress[${idx}]`;
  }
  return id;
}

    obj = obj[p];
