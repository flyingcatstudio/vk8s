<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vk8s — k8s capacity studio</title>
<meta name="description" content="vk8s: 가상 Kubernetes 환경을 설계·시뮬레이션하고 인프라 호환성을 검증하는 브라우저 도구.">
<meta name="author" content="FCStudio">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='26' fill='%234d9cff'/></svg>">
<link rel="canonical" href="https://aiotool.net/vk8s/">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Pretendard:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #08090c;
    --surface: #111318;
    --surface2: #181b23;
    --surface3: #1e222d;
    --border: #252a36;
    --border2: #353c4d;
    --text: #e8ecf4;
    --text2: #8892a4;
    --text3: #5a6377;
    --accent: #4d9cff;
    --accent2: #1a6ddb;
    --accent-glow: rgba(77,156,255,0.12);
    --green: #34d399;
    --green-glow: rgba(52,211,153,0.1);
    --yellow: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
    --orange: #fb923c;

    --topbar-h: 48px;
    --tree-w: 260px;
    --inspector-w: 380px;
    --findings-h: 32px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Outfit', -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }

  /* === Layout === */
  .app {
    display: grid;
    grid-template-columns: var(--tree-w) 1fr var(--inspector-w);
    grid-template-rows: var(--topbar-h) 1fr var(--findings-h);
    grid-template-areas:
      "topbar topbar topbar"
      "tree   canvas inspector"
      "findings findings findings";
    height: 100vh;
  }
  .app[data-left-collapsed="true"]  { grid-template-columns: 0 1fr var(--inspector-w); }
  .app[data-right-collapsed="true"] { grid-template-columns: var(--tree-w) 1fr 0; }
  .app[data-left-collapsed="true"][data-right-collapsed="true"] { grid-template-columns: 0 1fr 0; }
  .app[data-findings-expanded="true"] { grid-template-rows: var(--topbar-h) 1fr 240px; }

  /* === Topbar === */
  .topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar .logo {
    font-family: 'Outfit';
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.02em;
  }
  .topbar .logo .dot { color: var(--accent); }
  .topbar .project-name {
    font-weight: 500;
    color: var(--text);
  }
  .topbar .mode-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'JetBrains Mono';
    text-transform: uppercase;
  }
  .topbar .mode-badge[data-mode="onprem"] { background: rgba(251,146,60,.15); color: var(--orange); }
  .topbar .mode-badge[data-mode="cloud"]  { background: rgba(77,156,255,.15); color: var(--accent); }
  .topbar .mode-badge[data-mode="hybrid"] { background: rgba(167,139,250,.15); color: var(--purple); }
  .topbar .spacer { flex: 1; }
  .topbar .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    transition: all .15s;
  }
  .topbar .icon-btn:hover {
    border-color: var(--border2);
    color: var(--text);
    background: var(--surface2);
  }
  .save-status {
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono';
  }

  /* === Tree === */
  .tree {
    grid-area: tree;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 8px;
  }
  .tree-section {
    margin-bottom: 12px;
  }
  .tree-section-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    color: var(--text2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .tree-section-header .count {
    color: var(--text3);
    font-family: 'JetBrains Mono';
  }
  .tree-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    margin: 1px 0;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text);
    border-left: 2px solid transparent;
  }
  .tree-item:hover { background: var(--surface2); }
  .tree-item.selected {
    background: var(--accent-glow);
    border-left-color: var(--accent);
  }
  .tree-item .icon { flex-shrink: 0; }
  .tree-item .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tree-item .meta {
    font-size: 10px;
    color: var(--text3);
    font-family: 'JetBrains Mono';
  }
  .tree-item.child { padding-left: 24px; }
  .tree-actions {
    margin-top: 8px;
    padding: 0 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .add-btn {
    background: var(--surface2);
    border: 1px dashed var(--border2);
    color: var(--text2);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    text-align: left;
    transition: all .15s;
  }
  .add-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }
  .empty-hint {
    color: var(--text3);
    font-size: 11px;
    padding: 4px 10px;
    font-style: italic;
  }

  /* === Canvas === */
  .canvas {
    grid-area: canvas;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }
  .view-tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 12px;
    gap: 2px;
    flex-shrink: 0;
  }
  .view-tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text2);
    padding: 10px 14px;
    font-size: 12px;
    transition: all .15s;
  }
  .view-tab:hover { color: var(--text); }
  .view-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .view-tab.disabled {
    color: var(--text3);
    cursor: not-allowed;
    opacity: 0.5;
  }
  .view-tab.disabled::after {
    content: 'soon';
    margin-left: 6px;
    font-size: 9px;
    color: var(--text3);
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono';
    letter-spacing: 0.05em;
  }
  .view-tab .tab-num {
    color: var(--text3);
    font-size: 10px;
    margin-right: 6px;
    font-family: 'JetBrains Mono';
  }
  .view-body {
    flex: 1;
    overflow: auto;
    padding: 24px;
  }
  .view-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text2);
    text-align: center;
    gap: 12px;
  }
  .view-empty .big { font-size: 48px; opacity: 0.3; }
  .view-empty h2 { font-weight: 500; color: var(--text); }
  .view-empty p { font-size: 12px; max-width: 360px; }

  /* === Topology === */
  .topo-site {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .topo-site-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .topo-site-header .name {
    font-weight: 600;
    font-size: 14px;
  }
  .topo-site-header .kind {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono';
  }
  .topo-site-header .kind[data-kind="onprem"] { background: rgba(251,146,60,.15); color: var(--orange); }
  .topo-site-header .kind[data-kind="cloud"]  { background: rgba(77,156,255,.15); color: var(--accent); }
  .topo-site-header .region {
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono';
  }
  .topo-site-bars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .topo-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .topo-bar-label .val { font-family: 'JetBrains Mono'; }
  .bar {
    height: 6px;
    background: var(--surface3);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--green);
    transition: width .3s, background .3s;
  }
  .bar-fill[data-level="medium"] { background: var(--accent); }
  .bar-fill[data-level="high"]   { background: var(--yellow); }
  .bar-fill[data-level="critical"]{ background: var(--red); }

  .topo-nodes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .topo-node {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all .15s;
    position: relative;
  }
  .topo-node:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }
  .topo-node.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 20px var(--accent-glow);
  }
  .topo-node .node-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .topo-node .node-model {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 8px;
    font-family: 'JetBrains Mono';
  }
  .topo-node .node-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    font-size: 11px;
  }
  .topo-node .stat {
    display: flex;
    justify-content: space-between;
    color: var(--text2);
  }
  .topo-node .stat .v { color: var(--text); font-family: 'JetBrains Mono'; }
  .topo-node .gpu-line {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 11px;
    color: var(--purple);
    font-family: 'JetBrains Mono';
  }
  .topo-empty-site {
    color: var(--text3);
    font-size: 12px;
    font-style: italic;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    text-align: center;
  }
  .cluster-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(167,139,250,.12);
    color: var(--purple);
    font-family: 'JetBrains Mono';
    margin-top: 6px;
  }
  .cluster-badge .role {
    color: var(--text3);
    font-size: 9px;
    text-transform: uppercase;
  }
  .next-hint {
    background: linear-gradient(135deg, var(--accent-glow), transparent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .next-hint .icon { font-size: 22px; color: var(--accent); }
  .next-hint .body { flex: 1; }
  .next-hint .body .head {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .next-hint .body .lead { font-size: 13px; }
  .role-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: 'JetBrains Mono';
    text-transform: uppercase;
  }
  .role-tag[data-role="control-plane"] { background: rgba(77,156,255,.15); color: var(--accent); }
  .role-tag[data-role="worker"] { background: rgba(52,211,153,.12); color: var(--green); }
  .role-tag[data-role="etcd"] { background: rgba(167,139,250,.15); color: var(--purple); }
  .role-tag[data-role="unassigned"] { background: var(--surface3); color: var(--text3); }
  .row-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .row-list .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--surface2);
    border-radius: 5px;
    font-size: 12px;
  }
  .row-list .row .name { flex: 1; }
  .row-list .row select.role {
    padding: 2px 6px;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 3px;
    font-size: 11px;
  }
  .row-list .row .x {
    background: transparent;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 2px 6px;
  }
  .row-list .row .x:hover { color: var(--red); }
  .checkbox-list {
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px;
    background: var(--surface2);
  }
  .checkbox-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    cursor: pointer;
    border-radius: 3px;
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text);
    margin: 0;
  }
  .checkbox-list label:hover { background: var(--surface3); }
  .checkbox-list label .meta {
    margin-left: auto;
    color: var(--text3);
    font-size: 10px;
    font-family: 'JetBrains Mono';
  }
  .checkbox-list label.taken {
    color: var(--text3);
    cursor: not-allowed;
  }
  .checkbox-list label.taken .meta { color: var(--orange); }

  /* === Inspector === */
  .inspector {
    grid-area: inspector;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
  }
  .inspector-empty {
    color: var(--text3);
    text-align: center;
    padding: 40px 20px;
    font-size: 12px;
    font-style: italic;
  }
  .insp-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .insp-header .kind {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text3);
    font-family: 'JetBrains Mono';
    letter-spacing: 0.05em;
  }
  .insp-header .name {
    flex: 1;
    font-weight: 600;
    font-size: 14px;
  }
  .insp-header .delete {
    background: transparent;
    border: none;
    color: var(--text3);
    padding: 4px 8px;
    border-radius: 4px;
  }
  .insp-header .delete:hover { color: var(--red); background: rgba(248,113,113,.1); }

  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 5px;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .field-readonly {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 7px 10px;
    border-radius: 5px;
    color: var(--text);
    font-family: 'JetBrains Mono';
    font-size: 12px;
  }

  .section-title {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 18px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }

  .gpu-config {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .chassis-info {
    font-size: 11px;
    color: var(--text2);
    font-family: 'JetBrains Mono';
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .chassis-info strong { color: var(--purple); }
  .gpu-row {
    display: grid;
    grid-template-columns: 1.6fr 0.6fr 0.8fr auto;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
  }

  /* === Findings strip === */
  .findings {
    grid-area: findings;
    background: var(--surface);
    border-top: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .findings-summary {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 16px;
    flex-shrink: 0;
    font-size: 12px;
  }
  .findings-summary .count {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text2);
  }
  .findings-summary .count .icon { font-size: 14px; }
  .findings-summary .count[data-sev="error"] .icon { color: var(--red); }
  .findings-summary .count[data-sev="warn"] .icon  { color: var(--yellow); }
  .findings-summary .count[data-sev="info"] .icon  { color: var(--accent); }
  .findings-summary .spacer { flex: 1; }
  .findings-summary .toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
  }
  .findings-summary .toggle:hover { color: var(--text); border-color: var(--border2); }

  .findings-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    border-top: 1px solid var(--border);
  }
  .finding-row {
    display: grid;
    grid-template-columns: 24px 200px 1fr;
    gap: 12px;
    padding: 6px 16px;
    font-size: 12px;
    cursor: pointer;
  }
  .finding-row:hover { background: var(--surface2); }
  .finding-row .id { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--text3); }
  .finding-row .msg { color: var(--text); }

  /* === Splash === */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,9,12,0.92);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  /* splash leaves topbar accessible so Help/Import work pre-project */
  #splash { top: var(--topbar-h); }
  .topbar { position: relative; z-index: 110; background: var(--surface); }
  .overlay.hidden { display: none; }
  .splash-card {
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  .splash-card h1 {
    font-family: 'Outfit';
    font-weight: 700;
    font-size: 28px;
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }
  .splash-card .tagline {
    color: var(--text2);
    margin-bottom: 28px;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .mode-option {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    cursor: pointer;
    transition: all .15s;
    text-align: left;
  }
  .mode-option:hover {
    border-color: var(--border2);
    background: var(--surface3);
  }
  .mode-option.selected {
    border-color: var(--accent);
    background: var(--accent-glow);
  }
  .mode-option .title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .mode-option .desc {
    font-size: 11px;
    color: var(--text2);
    line-height: 1.5;
  }
  .splash-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }
  .splash-actions .field { flex: 1; margin: 0; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-weight: 500;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent2); }
  .btn:disabled { background: var(--surface3); color: var(--text3); cursor: not-allowed; }

//============ Tooltip ============
let _tipEl = null;
let _pinned = null;
function _ensureTip() {
  if (!_tipEl) {
    _tipEl = document.createElement("div");
    _tipEl.className = "tooltip";
    document.body.appendChild(_tipEl);
  }
  return _tipEl;
}
function _renderTipContent(help, pinned) {
  const tip = _ensureTip();
  tip.innerHTML = "";
  if (help.title) {
    const h = document.createElement("div");
    h.className = "tip-title";
    h.textContent = help.title;
    tip.appendChild(h);
  }
  const body = document.createElement("div");
  body.className = "tip-body";
  body.textContent = help.body;
  tip.appendChild(body);
  if (help.reco) {
    const r = document.createElement("div");
    r.className = "tip-reco";
    r.textContent = help.reco;
    tip.appendChild(r);
  }
  if (!pinned) {
    const ph = document.createElement("div");
    ph.className = "tip-pin-hint";
    ph.textContent = "클릭하면 고정";
    tip.appendChild(ph);
  }
}
function showTooltip(target, helpId, pinned = false) {
  const help = HELP[helpId];
  if (!help) return;
  const tip = _ensureTip();
  _renderTipContent(help, pinned);
  // Position (auto-flip)
  tip.classList.add("visible");
  tip.style.visibility = "hidden";
  const r = target.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left + r.width / 2 - tw / 2;
  let top = r.bottom + 8;
  if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
  if (left < 8) left = 8;
  if (top + th > window.innerHeight - 8) top = r.top - th - 8;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
  tip.style.visibility = "";
}
function hideTooltip() {
  if (_tipEl) _tipEl.classList.remove("visible");
  if (_pinned) {
    _pinned.classList.remove("pinned");
    _pinned = null;
  }
}
function helpIcon(helpId) {
  const span = document.createElement("span");
  span.className = "help";
  span.textContent = "?";
  span.tabIndex = 0;
  span.setAttribute("aria-label", "Help: " + (HELP[helpId]?.title || helpId));
  span.addEventListener("mouseenter", () => { if (!_pinned) showTooltip(span, helpId, false); });
  span.addEventListener("mouseleave", () => { if (!_pinned) hideTooltip(); });
  span.addEventListener("click", e => {
    e.stopPropagation();
    if (_pinned === span) {
      hideTooltip();
    } else {
      if (_pinned) _pinned.classList.remove("pinned");
      _pinned = span;
      span.classList.add("pinned");
      showTooltip(span, helpId, true);
    }
  });
  span.addEventListener("focus", () => showTooltip(span, helpId, false));
  span.addEventListener("blur", () => { if (!_pinned) hideTooltip(); });
  return span;
}
// Click outside closes pinned tooltip
document.addEventListener("click", e => {
  if (_pinned && !_pinned.contains(e.target) && _tipEl && !_tipEl.contains(e.target)) {
    hideTooltip();
  }
});

//============ Glossary modal ============
function openGlossary() {
  const root = el("div");
  root.appendChild(el("h2", {}, ["Glossary — 용어/설정 도움말"]));
  root.appendChild(el("div", { style: { color: "var(--text2)", fontSize: "12px", marginBottom: "12px" } }, [
    "각 메뉴/필드의 ? 아이콘을 눌러도 같은 내용을 볼 수 있습니다.",
  ]));

  // Group by cat
  const groups = {};
  for (const [id, h] of Object.entries(HELP)) {
    const cat = h.cat || "기타";
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push({ id, ...h });
  }
  const order = ["모드", "사이트", "노드", "GPU", "클러스터", "기타"];
  const keys = Object.keys(groups).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  const list = el("div", { class: "glossary-list" });
  for (const k of keys) {
    const g = el("div", { class: "glossary-group" });
    g.appendChild(el("h3", {}, [k]));
    for (const item of groups[k]) {
      g.appendChild(el("div", { class: "glossary-item" }, [
        el("div", { class: "gt" }, [item.title || item.id]),
        el("div", { class: "gb" }, [item.body || ""]),
        item.reco ? el("div", { class: "gr" }, [item.reco]) : null,
      ]));
    }
    list.appendChild(g);
  }
  root.appendChild(list);
  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Close"]),
  ]));
  // Make modal-card wider for glossary
  openModal(root);
  $("#modalContent").style.maxWidth = "640px";
}

//============ Helpers ============
const $ = sel => document.querySelector(sel);
const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "style") Object.assign(node.style, v);
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "dataset") for (const [dk, dv] of Object.entries(v)) node.dataset[dk] = dv;
    else if (v != null) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
};
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const uid  = () => Math.random().toString(36).slice(2, 8);
function clsLevel(pct) {
  if (pct >= 90) return "critical";

}

// === IP / CIDR utilities ===
function parseCidr(cidr) {
  if (!cidr || typeof cidr !== "string") return null;
  const m = cidr.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/);
  if (!m) return null;
  const parts = [parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), parseInt(m[4])];
  const prefix = parseInt(m[5]);
  if (parts.some(p => p < 0 || p > 255) || prefix < 0 || prefix > 32) return null;
  const base = ((parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8) | parts[3]) >>> 0;
  const mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32 - prefix)) >>> 0;
  const network = base & mask;
  const size = prefix === 32 ? 1 : (2 ** (32 - prefix));
  return { network, prefix, size, mask };
}
function ipFromInt(n) {
  return [(n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff].join(".");
}
function ipToInt(ip) {
  if (!ip) return null;
  const m = ip.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
  if (!m) return null;
  const parts = [parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), parseInt(m[4])];
  if (parts.some(p => p < 0 || p > 255)) return null;
  return ((parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8) | parts[3]) >>> 0;
}
function ipInCidr(ip, cidr) {
  const c = parseCidr(cidr);
  const i = ipToInt(ip);
  if (c === null || i === null) return false;
  return (i & c.mask) === c.network;
}
function nextNodeIp(cluster, project) {
  if (!cluster?.network?.node_subnet) return null;
  const c = parseCidr(cluster.network.node_subnet);
  if (!c) return null;
  const used = new Set();
  for (const nid of cluster.node_ids || []) {
    const n = project.nodes.find(x => x.id === nid);
    const ip = n?.network?.ip;
    if (ip) used.add(ip);
  }
  // Reserve first 10 (gateway/dhcp/etc) + last (broadcast for /24).
  // Try .11 onward, skip used, fall within subnet, not all-ones.
  const startIdx = Math.min(11, c.size - 2);
  const endIdx = c.size - 1; // exclude broadcast
  for (let i = startIdx; i < endIdx; i++) {
    const ip = ipFromInt(c.network + i);
    if (!used.has(ip)) return ip;
  }
  return null;
}

//============ Catalog loader ============
async function loadCatalog() {
  const results = await Promise.all(CATALOG_FILES.map(async p => {
    const res = await fetch(p);
    if (!res.ok) throw new Error(`Failed to load ${p}: ${res.status}`);
    return [p, await res.json()];
  }));
  const map = Object.fromEntries(results);
  state.catalog.gpuModels = map["data/gpu-models.json"].models;
  state.catalog.runtime   = map["data/runtime-profiles.json"].profiles;
  const entries = [];
  for (const [path, doc] of results) {
    if (path.includes("/catalog/")) {
      for (const e of (doc.entries || [])) entries.push(e);
    }
  }
  state.catalog.entries = entries;
  state.catalog.loaded  = true;
  console.log(`Loaded ${entries.length} catalog entries, ${Object.keys(state.catalog.gpuModels).length} GPU models`);
}

//============ Persistence ============
let saveTimer = null;
function saveSoon() {
  $("#saveStatus").textContent = "saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (state.project) localStorage.setItem(STORAGE_KEY, JSON.stringify(state.project));
    $("#saveStatus").textContent = "saved";
    setTimeout(() => { if ($("#saveStatus").textContent === "saved") $("#saveStatus").textContent = ""; }, 1500);
  }, 600);
}
function migrateProject(p) {
  if (!p || !p.version) return p;
  if (p.version === "0.1" || p.version === "0.2") {
    // 0.2 → 0.3: cluster_role (singular enum) → cluster_roles (array)
    for (const n of p.nodes || []) {
      if (n.cluster_roles == null) {
        const r = n.cluster_role;
        n.cluster_roles = (!r || r === "unassigned") ? [] : [r];
      }
      delete n.cluster_role;
    }
    p.version = "0.3";
    console.log("Project migrated to v0.3");
  }
  if (p.version === "0.3") {
    // 0.3 → 0.4: optional network fields. Add defaults to clusters that lack them.
    for (const c of p.clusters || []) {
      if (!c.network) {
        c.network = {
          pod_cidr: "10.244.0.0/16",
          service_cidr: "10.96.0.0/12",
          node_subnet: "192.168.10.0/24",
          dns_domain: "cluster.local",
        };
      }
      if (!Array.isArray(c.ingress_rules)) c.ingress_rules = [];
    }
    p.version = "0.4";
    console.log("Project migrated to v0.4");
  }
  if (p.version === "0.4") {
    // 0.4 → 0.5: optional Site.l4_balancers and Site.storages
    for (const s of p.sites || []) {
      if (!Array.isArray(s.l4_balancers)) s.l4_balancers = [];
      if (!Array.isArray(s.storages)) s.storages = [];
    }
    p.version = "0.5";
    console.log("Project migrated to v0.5");
  }
  if (p.version === "0.5") {
    // 0.5 → 0.6: network_devices, external_services, site_links, Node.purpose
    for (const s of p.sites || []) {
      if (!Array.isArray(s.network_devices)) s.network_devices = [];
      if (!Array.isArray(s.external_services)) s.external_services = [];
    }
    for (const n of p.nodes || []) {
      if (!n.purpose) n.purpose = "compute";
    }
    if (!Array.isArray(p.site_links)) p.site_links = [];
    p.version = "0.6";
    console.log("Project migrated to v0.6");
  }
  return p;
}

function loadProject() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try {
    const p = JSON.parse(raw);
    if (p && p.version) return migrateProject(p);
  } catch (e) { console.warn("Failed to load saved project", e); }
  return null;
}

//============ Project actions ============
function createProject(mode, name) {
  state.project = {
    version: SCHEMA_VERSION,
    name: name.trim() || "untitled",
    mode,
    sites: [],
    nodes: [],
    clusters: [],
    metadata: {
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
    },
  };
  // For non-hybrid, create a default site so Add Node has somewhere to land
  if (mode === "onprem") {
    addSite({ name: "IDC-1", kind: "onprem",
              capacity: { rack_units: 42, power_kw: 16 } }, /*silent*/true);
  } else if (mode === "cloud") {
    addSite({ name: "AWS Seoul", kind: "cloud",
              cloud_provider: "AWS", region: "ap-northeast-2" }, /*silent*/true);
  }
  emit(); saveSoon();
}

function addSite(seed, silent = false) {
  if (!state.project) return;
  const id = slug(seed.name) + "-" + uid();
  const site = {
    id,
    name: seed.name,
    kind: seed.kind,
    node_ids: [],
  };
  if (seed.kind === "cloud") {
    site.cloud_provider = seed.cloud_provider || "AWS";
    site.region = seed.region || "";
  }
  if (seed.kind === "onprem") {
    site.capacity = seed.capacity || { rack_units: 42, power_kw: 16 };
  }
  site.l4_balancers = [];
  site.storages = [];
  site.network_devices = [];
  site.external_services = [];
  state.project.sites.push(site);
  if (!silent) { selectEntity("site", id); emit(); saveSoon(); }
  return site;
}

function addNode(seed) {
  if (!state.project) return;
  // seed: { catalogKey, siteId, name, qty }
  const tmpl = state.catalog.entries.find(e => e.key === seed.catalogKey);
  if (!tmpl) throw new Error("Catalog entry not found: " + seed.catalogKey);
  const site = state.project.sites.find(s => s.id === seed.siteId);
  if (!site) throw new Error("Site not found: " + seed.siteId);
  const qty = Math.max(1, parseInt(seed.qty) || 1);
  const created = [];
  for (let i = 0; i < qty; i++) {
    const id = slug(tmpl.key) + "-" + uid();
    const node = {
      id,
      name: seed.name ? (qty === 1 ? seed.name : `${seed.name}-${i+1}`) : `${tmpl.display_name} #${state.project.nodes.length + 1}`,
      source: tmpl.source,
      brand: tmpl.brand,
      model: tmpl.key,
      custom: false,
      site_id: site.id,
      cluster_roles: [],
      purpose: "compute",
      spec: JSON.parse(JSON.stringify(tmpl.spec)),
    };
    state.project.nodes.push(node);
    site.node_ids.push(id);
    created.push(node);
  }
  if (created.length === 1) selectEntity("node", created[0].id);
  emit(); saveSoon();
  return created;
}

function deleteEntity(kind, id) {
  if (!state.project) return;
  if (kind === "site") {
    const site = state.project.sites.find(s => s.id === id);
    if (!site) return;
    if (site.node_ids.length) {
      if (!confirm(`이 사이트에는 ${site.node_ids.length}개의 노드가 있습니다. 모두 함께 삭제됩니다. 진행?`)) return;
      site.node_ids.slice().forEach(nid => deleteEntity("node", nid));
    }
    state.project.sites = state.project.sites.filter(s => s.id !== id);
  } else if (kind === "node") {
    state.project.nodes = state.project.nodes.filter(n => n.id !== id);
    state.project.sites.forEach(s => s.node_ids = s.node_ids.filter(nid => nid !== id));
    (state.project.clusters || []).forEach(c => c.node_ids = (c.node_ids || []).filter(nid => nid !== id));
  } else if (kind === "cluster") {
    const c = (state.project.clusters || []).find(x => x.id === id);
    if (!c) return;
    // unassign nodes from this cluster (clear roles)
    for (const nid of c.node_ids || []) {
      const n = state.project.nodes.find(x => x.id === nid);
      if (n) n.cluster_roles = [];
    }
    state.project.clusters = state.project.clusters.filter(x => x.id !== id);
  } else if (kind === "workload") {
    deleteWorkload(id);
    return;
  } else if (kind === "l4") {
    deleteL4(id);
    return;
  } else if (kind === "storage") {
    deleteStorage(id);
    return;
  } else if (kind === "netdev") {
    deleteNetworkDevice(id);
    return;
  } else if (kind === "extsvc") {
    deleteExternalService(id);
    return;
  } else if (kind === "sitelink") {
    deleteSiteLink(id);
    return;
  }
  if (state.ui.selectedId === id) state.ui.selectedId = null;
  emit(); saveSoon();
}

//============ Cluster actions ============
function addCluster(seed) {
  if (!state.project) return;
  if (!state.project.clusters) state.project.clusters = [];
  const id = slug(seed.name) + "-" + uid();
  const cluster = {
    id,
    name: seed.name || "cluster",
    environment_tag: seed.environment_tag || "",
    k8s_version: seed.k8s_version || "1.30",
    ha_control_plane: !!seed.ha_control_plane,
    node_ids: [],
    network: {
      pod_cidr: seed.pod_cidr || "10.244.0.0/16",
      service_cidr: seed.service_cidr || "10.96.0.0/12",
      node_subnet: seed.node_subnet || "192.168.10.0/24",
      dns_domain: seed.dns_domain || "cluster.local",
    },
    ingress_rules: [],
    addons: {
      cni: seed.cni || "Calico",
      ingress: seed.ingress || "NGINX",
      metrics_server: true,
      gpu_operator: !!seed.gpu_operator,
      service_mesh: "None",
    },
    namespaces: [],
    network_policies: [],
    workloads: [],
  };
  state.project.clusters.push(cluster);
  // assign initial nodes
  for (const nid of (seed.node_ids || [])) {
    assignNodeToCluster(nid, id, /*defaultRole*/null, /*silent*/true);
  }
  selectEntity("cluster", id);
  emit(); saveSoon();
  return cluster;
}

function getNodeCluster(nodeId) {
  return (state.project?.clusters || []).find(c => (c.node_ids || []).includes(nodeId));
}

function assignNodeToCluster(nodeId, clusterId, defaultRole, silent = false) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  const c = (state.project.clusters || []).find(x => x.id === clusterId);
  if (!n || !c) return;
  // remove from any other cluster (one cluster per node)
  for (const other of state.project.clusters) {
    if (other.id !== clusterId) other.node_ids = (other.node_ids || []).filter(nid => nid !== nodeId);
  }
  if (!c.node_ids.includes(nodeId)) c.node_ids.push(nodeId);
  if (!Array.isArray(n.cluster_roles)) n.cluster_roles = [];
  if (n.cluster_roles.length === 0) {
    n.cluster_roles = [defaultRole || "worker"];
  }
  // Auto-allocate node IP from cluster.network.node_subnet if not in subnet
  if (!n.network) n.network = {};
  if (!n.network.ip || !ipInCidr(n.network.ip, c.network?.node_subnet)) {
    const ip = nextNodeIp(c, state.project);
    if (ip) n.network.ip = ip;
  }
  if (!silent) { emit(); saveSoon(); }
}

function removeNodeFromCluster(nodeId, clusterId) {
  const c = (state.project.clusters || []).find(x => x.id === clusterId);
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!c) return;
  c.node_ids = (c.node_ids || []).filter(nid => nid !== nodeId);
  if (n) n.cluster_roles = [];
  emit(); saveSoon();
}

//============ Node GPU editing (onprem) ============
function addNodeGpu(nodeId) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || n.source !== "onprem") return;
  const chassis = n.spec.gpu_chassis || {};
  const supported = chassis.supported_models || [];
  if (!supported.length) return;
  const gpuModels = state.catalog.gpuModels;
  // Pick the first model whose form factor is in chassis.supported_form_factors
  const okModel = supported.find(m =>
    !gpuModels[m] || (chassis.supported_form_factors || []).includes(gpuModels[m].form_factor)
  ) || supported[0];
  const ginfo = gpuModels[okModel] || {};
  // Default count: nvswitch-mesh fills available slots; bridge-pair = 2; otherwise 1
  if (!n.spec.gpu) n.spec.gpu = [];
  const used = n.spec.gpu.reduce((a, g) => a + (g.count || 0), 0);
  const remaining = (chassis.max_count || 0) - used;
  let defaultCount = 1;
  if (chassis.nvlink_topology === "nvswitch-mesh") defaultCount = remaining;
  else if (chassis.nvlink_topology === "bridge-pair") defaultCount = Math.min(2, remaining);
  defaultCount = Math.max(1, Math.min(defaultCount, remaining || 1));
  n.spec.gpu.push({
    model: okModel,
    form_factor: ginfo.form_factor,
    count: defaultCount,
    nvlink_enabled: chassis.nvlink_topology !== "none" && ginfo.nvlink_capable !== false,
  });
  emit(); saveSoon();
}

function updateNodeGpu(nodeId, index, partial) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || !n.spec.gpu || !n.spec.gpu[index]) return;
  // If model changes, also update form_factor based on gpu-models reference
  if (partial.model && state.catalog.gpuModels[partial.model]) {
    partial.form_factor = state.catalog.gpuModels[partial.model].form_factor;
  }
  Object.assign(n.spec.gpu[index], partial);
  emit(); saveSoon();
}

function removeNodeGpu(nodeId, index) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || !n.spec.gpu) return;
  n.spec.gpu.splice(index, 1);
  if (n.spec.gpu.length === 0) delete n.spec.gpu;
  if (!n.spec.gpu) n.spec.gpu = [];
  emit(); saveSoon();
}

function setNodeRoleEnabled(nodeId, role, enabled) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n) return;
  if (!Array.isArray(n.cluster_roles)) n.cluster_roles = [];
  const has = n.cluster_roles.includes(role);
  if (enabled && !has) n.cluster_roles.push(role);
  else if (!enabled && has) n.cluster_roles = n.cluster_roles.filter(r => r !== role);
  emit(); saveSoon();
}

function updateClusterField(id, path, value) {
  const c = state.project.clusters.find(x => x.id === id);
  if (!c) return;
  const parts = path.split(".");
  let obj = c;
  while (parts.length > 1) {
    const p = parts.shift();
    if (obj[p] == null) obj[p] = {};
    obj = obj[p];
  }
  obj[parts[0]] = value;
  emit(); saveSoon();
}

//============ Workload actions ============
function addWorkload(clusterId, seed) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!c.workloads) c.workloads = [];
  const id = slug(seed.name) + "-" + uid();
  const wl = {
    id,
    name: seed.name,
    category: seed.category || "API",
    namespace: seed.namespace || "default",
    labels: seed.labels || { app: slug(seed.name) || id },
    replicas: parseInt(seed.replicas) || 1,
    kind: seed.kind || "Deployment",
    resources: {
      requests: {
        cpu: parseFloat(seed.cpu) || 0.5,
        memory_gb: parseFloat(seed.memory_gb) || 1,
      },
    },
  };
  if (seed.gpu_count && seed.gpu_count > 0) {
    wl.resources.requests.gpu = { count: parseInt(seed.gpu_count) };
    if (seed.gpu_model) wl.resources.requests.gpu.model = seed.gpu_model;
  }
  // Default network.service based on category
  const wantsService = ["API", "Frontend", "WAS", "DB", "Cache", "Queue", "ML-Inference"].includes(wl.category);
  if (wantsService) {
    const portByCategory = {
      "Frontend": [{ name: "http", port: 80, target_port: 80, protocol: "TCP" }],
      "API": [{ name: "http", port: 8080, target_port: 8080, protocol: "TCP" }],
      "WAS": [{ name: "http", port: 8080, target_port: 8080, protocol: "TCP" }],
      "DB": [{ name: "pg", port: 5432, target_port: 5432, protocol: "TCP" }],
      "Cache": [{ name: "redis", port: 6379, target_port: 6379, protocol: "TCP" }],
      "Queue": [{ name: "kafka", port: 9092, target_port: 9092, protocol: "TCP" }],
      "ML-Inference": [{ name: "http", port: 8080, target_port: 8080, protocol: "TCP" }],
    };
    wl.network = {
      service: {
        type: "ClusterIP",
        ports: portByCategory[wl.category] || [{ name: "http", port: 80, target_port: 80, protocol: "TCP" }],
      },
    };
  }
  // Apply runtime preset if chosen
  if (seed.runtime_preset && state.catalog.runtime[seed.runtime_preset]) {
    const p = state.catalog.runtime[seed.runtime_preset];
    wl.runtime = JSON.parse(JSON.stringify(p));
    delete wl.runtime.notes;
  }
  c.workloads.push(wl);
  selectEntity("workload", id);
  emit(); saveSoon();
  return wl;
}

function findWorkload(id) {
  for (const c of state.project.clusters || []) {
    const w = (c.workloads || []).find(x => x.id === id);
    if (w) return { workload: w, cluster: c };
  }
  return null;
}

function deleteWorkload(id) {
  for (const c of state.project.clusters || []) {
    const idx = (c.workloads || []).findIndex(x => x.id === id);
    if (idx >= 0) {
      c.workloads.splice(idx, 1);
      // remove this id from any depends_on entries
      for (const w of c.workloads) {
        if (Array.isArray(w.depends_on)) {
          w.depends_on = w.depends_on.filter(d => d.target_workload_id !== id);
        }
      }
      break;
    }
  }
  if (state.ui.selectedId === id) state.ui.selectedId = null;
  emit(); saveSoon();
}

function updateWorkloadField(id, path, value) {
  const found = findWorkload(id);
  if (!found) return;
  const parts = path.split(".");
  let obj = found.workload;
  while (parts.length > 1) {
    const p = parts.shift();
    if (obj[p] == null) obj[p] = {};
    obj = obj[p];
  }
  obj[parts[0]] = value;
  emit(); saveSoon();
}

//============ Namespace + NetworkPolicy actions ============
function addNamespace(clusterId, seed) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!c.namespaces) c.namespaces = [];
  if (c.namespaces.some(n => n.name === seed.name)) {
    alert(`Namespace '${seed.name}' already exists in this cluster.`);
    return;
  }
  c.namespaces.push({
    name: seed.name,
    description: seed.description || "",
    labels: seed.labels || {},
    default_deny: !!seed.default_deny,
  });
  emit(); saveSoon();
}

function deleteNamespace(clusterId, name) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c || !c.namespaces) return;
  // Reassign workloads in this NS to "default"
  for (const w of c.workloads || []) {
    if (w.namespace === name) w.namespace = "default";
  }
  // Delete NPs in this NS or referencing it
  if (c.network_policies) {
    c.network_policies = c.network_policies.filter(np => np.namespace !== name);
    for (const np of c.network_policies) {
      if (np.ingress) {
        for (const r of np.ingress) {
          if (r.from_namespaces) r.from_namespaces = r.from_namespaces.filter(n => n !== name);
        }
      }
      if (np.egress) {
        for (const r of np.egress) {
          if (r.to_namespaces) r.to_namespaces = r.to_namespaces.filter(n => n !== name);
        }
      }
    }
  }
  c.namespaces = c.namespaces.filter(n => n.name !== name);
  emit(); saveSoon();
}

function updateNamespaceField(clusterId, name, path, value) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c || !c.namespaces) return;
  const ns = c.namespaces.find(n => n.name === name);
  if (!ns) return;
  const parts = path.split(".");
  let obj = ns;
  while (parts.length > 1) {
    const p = parts.shift();
    if (obj[p] == null) obj[p] = {};
    obj = obj[p];
  }
  obj[parts[0]] = value;
  emit(); saveSoon();
}

function addNetworkPolicy(clusterId, seed) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!c.network_policies) c.network_policies = [];
  const id = slug(seed.preset || seed.name) + "-" + uid();
  const np = {
    id,
    name: seed.name || `${seed.preset}-${(c.network_policies.length || 0) + 1}`,
    namespace: seed.namespace,
    preset: seed.preset || "custom",
    policy_types: ["Ingress"],
  };
  if (seed.preset === "default-deny") {
    np.policy_types = ["Ingress", "Egress"];
    np.ingress = [];
    np.egress = [];
  } else if (seed.preset === "allow-from-same-ns") {
    np.ingress = [{ from_namespaces: [seed.namespace] }];
  } else if (seed.preset === "allow-from-namespace" && seed.from_namespace) {
    np.ingress = [{ from_namespaces: [seed.from_namespace] }];
  } else if (seed.preset === "allow-from-ingress") {
    np.ingress = [{ from_namespaces: ["ingress-nginx"] }];
  }
  c.network_policies.push(np);
  emit(); saveSoon();
}

function deleteNetworkPolicy(clusterId, npId) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c || !c.network_policies) return;
  c.network_policies = c.network_policies.filter(np => np.id !== npId);
  emit(); saveSoon();
}

//============ Cluster Production Preset ============
function applyClusterPreset(clusterId, opts = {}) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  const o = {
    haControlPlane: true, ingress: true, tls: true, monitoring: true,
    logging: true, metricsServer: true, backup: false,
    secretStore: false, gitops: false, mesh: false,
    networkPolicies: true, resourceQuotas: true,
    ...opts,
  };

  // 1. HA control plane: if ≥3 nodes, mark first 3 as cp+worker (preserving worker)
  if (o.haControlPlane) {
    const nodes = (c.node_ids || []).map(id => state.project.nodes.find(n => n.id === id)).filter(Boolean);
    if (nodes.length >= 3) {
      for (let i = 0; i < 3; i++) {
        const n = nodes[i];
        if (!Array.isArray(n.cluster_roles)) n.cluster_roles = [];
        if (!n.cluster_roles.includes("control-plane")) n.cluster_roles.push("control-plane");
        if (!n.cluster_roles.includes("worker")) n.cluster_roles.push("worker");
      }
      c.ha_control_plane = true;
    } else if (nodes.length >= 1) {
      // Single/dual: dual-role on the first
      const n = nodes[0];
      if (!Array.isArray(n.cluster_roles)) n.cluster_roles = [];
      if (!n.cluster_roles.includes("control-plane")) n.cluster_roles.push("control-plane");
      if (!n.cluster_roles.includes("worker")) n.cluster_roles.push("worker");
    }
  }

  // 2. Namespaces
  if (!c.namespaces) c.namespaces = [];
  const ensureNs = (name, default_deny = false, labels = {}) => {
    if (!c.namespaces.some(n => n.name === name)) {
      const ns = { name, default_deny, labels };
      c.namespaces.push(ns);
      return ns;
    }
    return c.namespaces.find(n => n.name === name);
  };
  if (o.ingress) ensureNs("ingress-nginx", false, { "kubernetes.io/metadata.name": "ingress-nginx" });
  if (o.tls) ensureNs("cert-manager", false);
  if (o.monitoring) ensureNs("monitoring", true, { tier: "platform" });
  if (o.logging) ensureNs("logging", true, { tier: "platform" });
  if (o.backup) ensureNs("velero", false);
  if (o.secretStore) ensureNs("external-secrets", false);
  if (o.gitops) ensureNs("argocd", false);
  if (o.mesh) ensureNs("istio-system", false);

  // 3. Platform workloads
  if (!c.workloads) c.workloads = [];
  const addWl = (seed) => {
    if (c.workloads.some(w => w.name === seed.name)) return;
    const id = slug(seed.name) + "-" + uid();
    const wl = {
      id,
      name: seed.name,
      category: seed.category || "Other",
      namespace: seed.namespace,
      labels: seed.labels || { app: slug(seed.name) },
      replicas: seed.replicas || 1,
      kind: seed.kind || "Deployment",
      resources: seed.resources || { requests: { cpu: 0.1, memory_gb: 0.25 } },
    };
    if (seed.runtime) wl.runtime = seed.runtime;
    if (seed.network) wl.network = seed.network;
    if (seed.persistent_volumes) wl.persistent_volumes = seed.persistent_volumes;
    c.workloads.push(wl);
  };

  if (o.ingress) {
    addWl({
      name: "ingress-nginx-controller", category: "API", namespace: "ingress-nginx",
      replicas: 2,
      resources: { requests: { cpu: 0.1, memory_gb: 0.25 } },
      network: { service: { type: "LoadBalancer", ports: [
        { name: "http",  port: 80,  target_port: 80,  protocol: "TCP" },
        { name: "https", port: 443, target_port: 443, protocol: "TCP" },
      ] } },
    });
  }
  if (o.tls) {
    addWl({
      name: "cert-manager", category: "Other", namespace: "cert-manager",
      replicas: 1,
      resources: { requests: { cpu: 0.05, memory_gb: 0.128 } },
    });
  }
  if (o.monitoring) {
    addWl({
      name: "prometheus", category: "Other", namespace: "monitoring", kind: "StatefulSet",
      replicas: 1,
      resources: { requests: { cpu: 0.5, memory_gb: 4 } },
      persistent_volumes: [{ size_gb: 100, access_mode: "RWO", storage_class: "" }],
      network: { service: { type: "ClusterIP", ports: [{ name: "web", port: 9090, target_port: 9090, protocol: "TCP" }] } },
    });
    addWl({
      name: "grafana", category: "Frontend", namespace: "monitoring",
      replicas: 1,
      resources: { requests: { cpu: 0.1, memory_gb: 0.5 } },
      network: { service: { type: "ClusterIP", ports: [{ name: "http", port: 3000, target_port: 3000, protocol: "TCP" }] } },
    });
  }
  if (o.logging) {
    addWl({
      name: "loki", category: "Other", namespace: "logging", kind: "StatefulSet",
      replicas: 1,
      resources: { requests: { cpu: 0.5, memory_gb: 2 } },
      persistent_volumes: [{ size_gb: 200, access_mode: "RWO", storage_class: "" }],
    });
  }
  if (o.metricsServer) {
    addWl({
      name: "metrics-server", category: "Other", namespace: "kube-system",
      replicas: 1,
      resources: { requests: { cpu: 0.05, memory_gb: 0.128 } },
    });
  }
  if (o.backup) {
    addWl({
      name: "velero", category: "Other", namespace: "velero",
      replicas: 1,
      resources: { requests: { cpu: 0.1, memory_gb: 0.25 } },
    });
  }
  if (o.secretStore) {
    addWl({
      name: "external-secrets-operator", category: "Other", namespace: "external-secrets",
      replicas: 1,
      resources: { requests: { cpu: 0.05, memory_gb: 0.128 } },
    });
  }
  if (o.gitops) {
    addWl({
      name: "argocd-server", category: "API", namespace: "argocd",
      replicas: 2,
      resources: { requests: { cpu: 0.2, memory_gb: 0.5 } },
      network: { service: { type: "ClusterIP", ports: [{ name: "https", port: 443, target_port: 8080, protocol: "TCP" }] } },
    });
  }
  if (o.mesh) {
    addWl({
      name: "istiod", category: "Other", namespace: "istio-system",
      replicas: 1,
      resources: { requests: { cpu: 0.5, memory_gb: 2 } },
    });
  }

  // 4. NetworkPolicies (default-deny + same-ns allow on prod ns)
  if (o.networkPolicies) {
    if (!c.network_policies) c.network_policies = [];
    const addNp = (seed) => {
      if (c.network_policies.some(x => x.name === seed.name)) return;
      c.network_policies.push({
        id: slug(seed.name) + "-" + uid(),
        name: seed.name,
        namespace: seed.namespace,
        preset: seed.preset,
        policy_types: seed.policy_types || ["Ingress"],
        ingress: seed.ingress,
        egress: seed.egress,
      });
    };
    if (o.monitoring) {
      addNp({ name: "monitoring-default-deny", namespace: "monitoring", preset: "default-deny",
              policy_types: ["Ingress", "Egress"], ingress: [], egress: [] });
      addNp({ name: "monitoring-allow-same-ns", namespace: "monitoring", preset: "allow-from-same-ns",
              ingress: [{ from_namespaces: ["monitoring"] }] });
      addNp({ name: "monitoring-allow-from-ingress", namespace: "monitoring", preset: "allow-from-namespace",
              ingress: [{ from_namespaces: ["ingress-nginx"] }] });
    }
    if (o.logging) {
      addNp({ name: "logging-default-deny", namespace: "logging", preset: "default-deny",
              policy_types: ["Ingress", "Egress"], ingress: [], egress: [] });
      addNp({ name: "logging-allow-same-ns", namespace: "logging", preset: "allow-from-same-ns",
              ingress: [{ from_namespaces: ["logging"] }] });
    }
  }

  // 5. Addons
  if (!c.addons) c.addons = {};
  if (o.ingress) c.addons.ingress = "NGINX";
  if (!c.addons.cni || c.addons.cni === "None") c.addons.cni = "Calico";
  if (o.metricsServer) c.addons.metrics_server = true;
  if (o.mesh) c.addons.service_mesh = "Istio";
  // GPU operator if any GPU node in cluster
  const hasGpu = (c.node_ids || []).some(nid => {
    const n = state.project.nodes.find(x => x.id === nid);
    return (n?.spec?.gpu || []).length > 0;
  });
  if (hasGpu) c.addons.gpu_operator = true;

  // 6. ResourceQuotas
  if (o.resourceQuotas) {
    const setQuota = (nsName, quota) => {
      const ns = c.namespaces.find(n => n.name === nsName);
      if (ns && !ns.resource_quota) ns.resource_quota = quota;
    };
    if (o.monitoring) setQuota("monitoring", { cpu: 8, memory_gb: 32, max_pods: 50 });
    if (o.logging) setQuota("logging", { cpu: 8, memory_gb: 32, max_pods: 30 });
    if (o.tls) setQuota("cert-manager", { cpu: 2, memory_gb: 4, max_pods: 10 });
    if (o.ingress) setQuota("ingress-nginx", { cpu: 4, memory_gb: 8, max_pods: 20 });
  }

  emit(); saveSoon();
}

//============ Ingress rule actions ============
function addIngressRule(clusterId, seed) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!c.ingress_rules) c.ingress_rules = [];
  const id = slug(seed.host) + "-" + uid();
  c.ingress_rules.push({
    id,
    name: seed.name || seed.host,
    host: seed.host,
    tls: !!seed.tls,
    paths: seed.paths || [],
  });
  emit(); saveSoon();

function ensureWorkloadService(w, defaultType = "ClusterIP") {
  if (!w.network) w.network = {};
  if (!w.network.service) w.network.service = { type: defaultType, ports: [] };
  if (!Array.isArray(w.network.service.ports)) w.network.service.ports = [];
  return w.network.service;
}
function addServicePort(workloadId) {
  const found = findWorkload(workloadId);
  if (!found) return;
  const svc = ensureWorkloadService(found.workload);
  const defaults = { name: "http", port: 80, target_port: 8080, protocol: "TCP" };
  // Choose unique name
  const usedNames = new Set(svc.ports.map(p => p.name));
  let n = "http";
  if (usedNames.has(n)) {
    let i = 2;
    while (usedNames.has(`port-${i}`)) i++;
    n = `port-${i}`;
  }
  svc.ports.push({ ...defaults, name: n });
  emit(); saveSoon();
}

}

//============ Validator ============
// Returns array of findings: { id, sev:'error'|'warn'|'info', msg, scope:{kind,id}, helpId? }
function runValidator(project) {
  if (!project) return [];
  const findings = [];
  const gpuModels = state.catalog.gpuModels;
  const F = (id, sev, msg, scope, helpId) => findings.push({ id, sev, msg, scope, helpId });

  // 1. Project: mode vs site kind
  for (const s of project.sites || []) {
    if (project.mode === "onprem" && s.kind !== "onprem")
      F("MODE_SITE_KIND_CONFLICT", "error", `Site '${s.name}': onprem 모드인데 cloud Site`, { kind: "site", id: s.id });
    if (project.mode === "cloud" && s.kind !== "cloud")
      F("MODE_SITE_KIND_CONFLICT", "error", `Site '${s.name}': cloud 모드인데 onprem Site`, { kind: "site", id: s.id });
  }

  // 2. Node GPU compatibility (chassis vs installed) + power
  for (const n of project.nodes || []) {
    const chassis = n.spec?.gpu_chassis || {};
    const gpus = n.spec?.gpu || [];
    const total = gpus.reduce((a, g) => a + (g.count || 0), 0);
    if (total > 0 && (chassis.max_count || 0) === 0) {
      F("GPU_CHASSIS_NOT_SUPPORTED", "error", `${n.name}: 이 새시는 GPU 미지원`, { kind: "node", id: n.id });
    }
    if (total > (chassis.max_count || 0) && (chassis.max_count || 0) > 0) {
      F("GPU_COUNT_EXCEEDS_CHASSIS", "error",
        `${n.name}: GPU ${total}장 > 새시 max ${chassis.max_count}`, { kind: "node", id: n.id });
    }
    for (const g of gpus) {
      if (g.form_factor && !(chassis.supported_form_factors || []).includes(g.form_factor)) {
        F("GPU_FORM_FACTOR_MISMATCH", "error",
          `${n.name}: ${g.model} 폼팩터(${g.form_factor}) 미지원`, { kind: "node", id: n.id });
      }
      if (g.model && (chassis.supported_models || []).length && !(chassis.supported_models || []).includes(g.model)) {
        F("GPU_MODEL_NOT_IN_CHASSIS_LIST", "error",
          `${n.name}: ${g.model}이 새시 목록에 없음`, { kind: "node", id: n.id });
      }
      if (g.nvlink_enabled && chassis.nvlink_topology === "none") {
        F("NVLINK_ON_NONE_TOPOLOGY", "error",
          `${n.name}: NVLink 미지원 새시인데 NVLink 활성`, { kind: "node", id: n.id });
      }
      // NVLink Bridge: 2장 페어링만 가능
      if (g.nvlink_enabled && chassis.nvlink_topology === "bridge-pair" && (g.count > 2 || g.count % 2 !== 0)) {
        F("NVLINK_BRIDGE_PAIR_LIMIT", "warn",
          `${n.name}: NVLink Bridge는 2장 페어링만 (${g.model} ×${g.count})`, { kind: "node", id: n.id });
      }
    }
    // SXM/NVSwitch는 보통 fully populated 권장
    if (chassis.nvlink_topology === "nvswitch-mesh" && total > 0 && total < (chassis.max_count || 0)) {
      F("NVLINK_SXM_NOT_FULLY_POPULATED", "warn",
        `${n.name}: SXM/NVSwitch 새시는 보통 ${chassis.max_count}장 fully populated 권장 (현재 ${total})`, { kind: "node", id: n.id });
    }
    // Node-level PSU power check (onprem only)
    if (n.source === "onprem") {
      const psu = n.spec?.power?.psu_max_w || 0;
      const used = computeNodePowerW(n, gpuModels);
      if (psu > 0 && used > psu) {
        F("NODE_POWER_EXCEEDS_PSU", "error",
          `${n.name}: ${used}W 요구 > PSU 정격 ${psu}W`, { kind: "node", id: n.id }, "node.gpu_power_budget");
      } else if (psu > 0 && used > psu * 0.9) {
        F("NODE_POWER_NEAR_PSU", "warn",
          `${n.name}: ${used}W (PSU ${(used / psu * 100).toFixed(0)}%) — 헤드룸 부족`, { kind: "node", id: n.id }, "node.gpu_power_budget");
      }
    }
  }

  // 3. Site capacity (onprem)
  for (const s of project.sites || []) {
    if (s.kind !== "onprem") continue;
    const usage = siteUsage(s, project, gpuModels);
    if (!usage) continue;
    if (usage.u_max && usage.u_used > usage.u_max) {
      F("SITE_RACK_UNITS_EXCEEDED", "error",
        `${s.name}: ${usage.u_used}U 요구, ${usage.u_max}U 가용`, { kind: "site", id: s.id }, "site.rack_units");
    }
    if (usage.kw_max && usage.kw_used > usage.kw_max) {
      F("SITE_POWER_EXCEEDED", "error",
        `${s.name}: ${usage.kw_used.toFixed(1)}kW 요구, ${usage.kw_max}kW 예산`, { kind: "site", id: s.id }, "site.power_kw");
    } else if (usage.kw_max && usage.kw_used / usage.kw_max >= 0.9) {
      F("SITE_POWER_HIGH_UTILIZATION", "warn",
        `${s.name}: 전력 ${(usage.kw_used / usage.kw_max * 100).toFixed(0)}% — 헤드룸 부족`, { kind: "site", id: s.id });
    }
  }

  // 4. Cluster checks
  for (const c of project.clusters || []) {
    const nodes = (c.node_ids || []).map(id => project.nodes.find(n => n.id === id)).filter(Boolean);
    if (!nodes.length) continue;
    const roleOf = n => Array.isArray(n.cluster_roles) ? n.cluster_roles : [];
    const cp = nodes.filter(n => roleOf(n).includes("control-plane")).length;
    if (cp === 0) {
      F("CLUSTER_NO_CONTROL_PLANE", "error",
        `${c.name}: control plane 노드 없음`, { kind: "cluster", id: c.id });
    }
    if (c.ha_control_plane && cp > 0 && cp < 3) {
      F("HA_CONTROL_PLANE_NOT_ENOUGH", "error",
        `${c.name}: HA control plane은 ≥3 필요 (현재 ${cp})`, { kind: "cluster", id: c.id }, "cluster.ha_control_plane");
    }
    if (c.ha_control_plane && cp >= 3 && cp % 2 === 0) {
      F("HA_CONTROL_PLANE_EVEN_NUMBER", "warn",
        `${c.name}: control plane ${cp}개 (짝수). etcd 쿼럼은 홀수 권장`, { kind: "cluster", id: c.id });
    }
    // GPU node + no operator
    const hasGpu = nodes.some(n => (n.spec?.gpu || []).length > 0 || (n.spec?.gpu_chassis?.max_count || 0) > 0);
    if (hasGpu && !c.addons?.gpu_operator) {
      F("GPU_NODE_NO_GPU_OPERATOR", "warn",
        `${c.name}: GPU 노드 보유 — GPU Operator 권장`, { kind: "cluster", id: c.id }, "cluster.gpu_operator");
    }
    // Mixed environments
    const sites = new Set(nodes.map(n => project.sites.find(s => s.id === n.site_id)?.kind).filter(Boolean));
    if (sites.size > 1) {
      F("CLUSTER_SPANS_ENVIRONMENTS", "warn",
        `${c.name}: cloud+onprem 양쪽에 걸침`, { kind: "cluster", id: c.id });
    }
    // No CNI
    if (!c.addons?.cni || c.addons.cni === "None") {
      F("NO_CNI_SELECTED", "warn",
        `${c.name}: CNI 미선택 — Pod 네트워킹 불가`, { kind: "cluster", id: c.id }, "cluster.cni");
    }

    // 5. Workload checks (per cluster)
    // Worker capacity: nodes with 'worker' role (so control-plane+worker dual-role contributes)
    const wls = c.workloads || [];
    const workerNodes = nodes.filter(n => roleOf(n).includes("worker"));
    const totalCpu = workerNodes.reduce((a, n) => a + (n.spec?.vcpu || 0), 0);
    const totalMem = workerNodes.reduce((a, n) => a + (n.spec?.memory_gb || 0), 0);
    const wlCpu = wls.reduce((a, w) => a + (w.resources?.requests?.cpu || 0) * (w.replicas || 1), 0);
    const wlMem = wls.reduce((a, w) => a + (w.resources?.requests?.memory_gb || 0) * (w.replicas || 1), 0);
    if (wls.length && totalCpu > 0 && wlCpu > totalCpu) {
      F("WORKLOAD_CPU_NOT_SCHEDULABLE", "error",
        `${c.name}: 워크로드 CPU ${wlCpu.toFixed(1)}c > 가용 ${totalCpu}c`, { kind: "cluster", id: c.id });
    }
    if (wls.length && totalMem > 0 && wlMem > totalMem) {
      F("WORKLOAD_MEM_NOT_SCHEDULABLE", "error",
        `${c.name}: 워크로드 RAM ${wlMem.toFixed(0)}GB > 가용 ${totalMem}GB`, { kind: "cluster", id: c.id });
    }

    // No worker capacity at all but workloads exist
    if (wls.length && workerNodes.length === 0) {
      F("CLUSTER_NO_WORKER", "error",
        `${c.name}: worker 역할 노드가 없음 — 워크로드 스케줄 불가`, { kind: "cluster", id: c.id }, "node.cluster_roles");
    }

    // GPU workload but no GPU node (count only worker-capable GPUs)
    for (const w of wls) {
      const gReq = w.resources?.requests?.gpu;
      if (!gReq) continue;
      const totalNeeded = (gReq.count || 0) * (w.replicas || 1);
      const totalAvail = workerNodes.reduce((a, n) =>
        a + (n.spec?.gpu || []).reduce((aa, g) => aa + (g.count || 0), 0), 0);
      if (totalNeeded > 0 && totalAvail === 0) {
        F("WORKLOAD_GPU_NO_NODE", "error",
          `${w.name}: GPU 요구하나 클러스터에 GPU 없음`, { kind: "workload", id: w.id });
      }
      if (totalNeeded > totalAvail && totalAvail > 0) {
        F("WORKLOAD_GPU_INSUFFICIENT", "error",
          `${w.name}: GPU ${totalNeeded}장 요구, ${totalAvail}장 가용`, { kind: "workload", id: w.id });
      }
      if (gReq.model) {
        const have = workerNodes.some(n => (n.spec?.gpu || []).some(g => g.model === gReq.model));
        if (!have) {
          F("WORKLOAD_GPU_MODEL_NOT_AVAILABLE", "error",
            `${w.name}: ${gReq.model} 요구, worker 노드에 없음`, { kind: "workload", id: w.id });
        }
      }
    }

    // Workload-level rules
    for (const w of wls) {
      // SPOF
      if ((w.replicas || 1) === 1 && ["API", "WAS", "DB", "Cache", "Queue"].includes(w.category)) {
        F("SPOF_RISK", "warn",
          `${w.name}: replicas=1, ${w.category} (SPOF 위험)`, { kind: "workload", id: w.id });
      }
      // JVM heap > memory request → OOM 보장
      const heap = w.runtime?.concurrency?.heap_gb;
      const mem = w.resources?.requests?.memory_gb;
      if (heap && mem && heap > mem) {
        F("JVM_HEAP_GT_REQUEST", "error",
          `${w.name}: heap ${heap}GB > memory ${mem}GB → OOMKilled 보장`, { kind: "workload", id: w.id }, "runtime.heap_gb");
      } else if (heap && mem && heap < mem * 0.5) {
        F("JVM_HEAP_TOO_SMALL", "warn",
          `${w.name}: heap ${heap}GB가 memory ${mem}GB의 절반 미만`, { kind: "workload", id: w.id }, "runtime.heap_gb");
      }
    }

    // Node not in any cluster but has cluster_role (shouldn't normally happen)
  }

  // 6. Node integrity
  for (const n of project.nodes || []) {
    const inCluster = (project.clusters || []).filter(c => (c.node_ids || []).includes(n.id));
    if (inCluster.length > 1) {
      F("NODE_IN_MULTIPLE_CLUSTERS", "error",
        `${n.name}: ${inCluster.length}개 클러스터에 속함`, { kind: "node", id: n.id });
    }
  }

  // 7a. Cluster network: CIDR overlap + node IP integrity
  for (const c of project.clusters || []) {
    const net = c.network || {};
    const cidrs = ["pod_cidr", "service_cidr", "node_subnet"]
      .map(k => ({ name: k, val: net[k], parsed: parseCidr(net[k]) }))
      .filter(x => x.parsed);
    for (let i = 0; i < cidrs.length; i++) {
      for (let j = i + 1; j < cidrs.length; j++) {
        const a = cidrs[i], b = cidrs[j];
        // overlap if ranges intersect
        const aEnd = a.parsed.network + a.parsed.size - 1;
        const bEnd = b.parsed.network + b.parsed.size - 1;
        if (a.parsed.network <= bEnd && b.parsed.network <= aEnd) {
          F("CLUSTER_CIDR_OVERLAP", "error",
            `${c.name}: ${a.name} (${a.val})와 ${b.name} (${b.val}) 범위 겹침`,
            { kind: "cluster", id: c.id }, "cluster.network");
        }
      }
    }
    // Node IP checks
    const nodeIps = new Map(); // ip → nodeName
    for (const nid of c.node_ids || []) {
      const n = project.nodes.find(x => x.id === nid);
      if (!n?.network?.ip) continue;
      const ip = n.network.ip;
      // Duplicate
      if (nodeIps.has(ip)) {
        F("NODE_IP_DUPLICATE", "error",
          `${n.name}: IP ${ip} 중복 (다른 노드: ${nodeIps.get(ip)})`,
          { kind: "node", id: n.id }, "node.ip");
      } else {
        nodeIps.set(ip, n.name);
      }
      // Out of node_subnet
      if (net.node_subnet && !ipInCidr(ip, net.node_subnet)) {
        F("NODE_IP_OUT_OF_SUBNET", "warn",
          `${n.name}: IP ${ip}가 ${net.node_subnet} 밖`,
          { kind: "node", id: n.id }, "node.ip");
      }
    }

    // 7b. Workload service + NodePort
    const nodePortsUsed = new Map();
    for (const w of c.workloads || []) {
      const svc = w.network?.service;
      if (!svc) continue;
      // ClusterIP within service_cidr
      if (svc.cluster_ip && net.service_cidr && !ipInCidr(svc.cluster_ip, net.service_cidr)) {
        F("SERVICE_IP_OUT_OF_CIDR", "warn",
          `${w.name}: cluster_ip ${svc.cluster_ip}가 service_cidr ${net.service_cidr} 밖`,
          { kind: "workload", id: w.id }, "service.cluster_ip");
      }
      // NodePort range + duplicates
      for (const p of svc.ports || []) {
        if (p.node_port == null) continue;
        if (p.node_port < 30000 || p.node_port > 32767) {
          F("NODE_PORT_OUT_OF_RANGE", "warn",
            `${w.name}: node_port ${p.node_port}는 30000-32767 권장 범위 밖`,
            { kind: "workload", id: w.id }, "service.node_port");
        }
        if (nodePortsUsed.has(p.node_port)) {
          F("NODE_PORT_DUPLICATE", "error",
            `${w.name}: node_port ${p.node_port} 중복 (${nodePortsUsed.get(p.node_port)})`,
            { kind: "workload", id: w.id });
        } else {
          nodePortsUsed.set(p.node_port, w.name);
        }
      }
      // LoadBalancer in onprem without lb_pool
      if (svc.type === "LoadBalancer" && !net.lb_pool) {
        const onpremNode = (c.node_ids || []).some(nid => {
          const n = project.nodes.find(x => x.id === nid);
          return n?.source === "onprem";
        });
        if (onpremNode) {
          F("LB_ONPREM_NO_POOL", "warn",
            `${w.name}: onprem LoadBalancer인데 cluster.network.lb_pool 미설정 (MetalLB 등 필요)`,
            { kind: "workload", id: w.id }, "cluster.lb_pool");
        }
      }
    }

    // 7c. Ingress rules validation
    const seenHosts = new Map();
    for (const r of c.ingress_rules || []) {
      if (seenHosts.has(r.host)) {
        F("INGRESS_HOST_DUPLICATE", "warn",
          `Ingress: host '${r.host}' 중복 (${seenHosts.get(r.host)})`,
          { kind: "cluster", id: c.id });
      } else {
        seenHosts.set(r.host, r.name);
      }
      for (const p of r.paths || []) {
        const target = (c.workloads || []).find(w => w.id === p.workload_id);
        if (!target) {
          F("INGRESS_TARGET_NOT_FOUND", "error",
            `Ingress '${r.host}${p.path}': 대상 workload 없음`,
            { kind: "cluster", id: c.id });
          continue;
        }
        const svc = target.network?.service;
        if (!svc || svc.type === "None") {
          F("INGRESS_TARGET_NO_SERVICE", "error",
            `Ingress '${r.host}${p.path}': '${target.name}'에 Service 미설정 (Network 탭)`,
            { kind: "workload", id: target.id }, "service.type");
        } else {
          const portMatch = (svc.ports || []).some(sp => sp.port === p.port);
          if (!portMatch) {
            F("INGRESS_PORT_MISMATCH", "warn",
              `Ingress '${r.host}${p.path}': port ${p.port}이 '${target.name}' service ports에 없음`,
              { kind: "workload", id: target.id });
          }
        }
      }
    }
  }

  // 7. Namespace + NetworkPolicy
  for (const c of project.clusters || []) {
    const declared = new Set((c.namespaces || []).map(n => n.name));
    declared.add("default"); // implicit
    // Workload namespace declared?
    for (const w of c.workloads || []) {
      const ns = w.namespace || "default";
      if (!declared.has(ns)) {
        F("WORKLOAD_NAMESPACE_NOT_DECLARED", "warn",
          `${w.name}: namespace '${ns}' 미선언 — cluster.namespaces에 추가 권장`,
          { kind: "workload", id: w.id }, "namespace.name");
      }
    }
    // default_deny without any allow rules
    for (const ns of c.namespaces || []) {
      if (!ns.default_deny) continue;
      const nsNps = (c.network_policies || []).filter(np => np.namespace === ns.name);
      const hasAllow = nsNps.some(np =>
        np.preset === "allow-from-same-ns" ||
        np.preset === "allow-from-namespace" ||
        np.preset === "allow-from-ingress" ||
        (Array.isArray(np.ingress) && np.ingress.length)
      );
      if (!hasAllow) {
        F("NS_DEFAULT_DENY_NO_ALLOW", "warn",
          `${c.name}/${ns.name}: default-deny인데 allow 룰 없음 — 모든 트래픽 차단됨`,
          { kind: "cluster", id: c.id }, "namespace.default_deny");
      }
    }
    // NetworkPolicy referencing nonexistent namespace
    for (const np of c.network_policies || []) {
      if (!declared.has(np.namespace)) {
        F("NETPOL_TARGET_NS_NOT_FOUND", "warn",
          `NP '${np.name}': 대상 namespace '${np.namespace}' 없음`,
          { kind: "cluster", id: c.id });
      }
      const fromNs = (np.ingress || []).flatMap(r => r.from_namespaces || []);
      for (const fns of fromNs) {
        if (!declared.has(fns) && fns !== "ingress-nginx") {
          F("NETPOL_FROM_NS_NOT_FOUND", "warn",
            `NP '${np.name}': from-ns '${fns}' 없음`,
            { kind: "cluster", id: c.id });
        }
      }
    }
  }

  return findings;
}

//============ Compatibility check (subset for Add Node preview) ============
function checkNodeCompatibility(spec, gpuModels) {
  const issues = [];
  const chassis = spec.gpu_chassis || {};
  const installed = spec.gpu || [];
  const totalGpu = installed.reduce((a, g) => a + (g.count || 0), 0);

  if (totalGpu > 0 && (chassis.max_count || 0) === 0) {
    issues.push({ sev: "err", msg: "이 새시는 GPU 미지원" });
  }
  if (totalGpu > (chassis.max_count || 0)) {
    issues.push({ sev: "err", msg: `GPU ${totalGpu}장 > 새시 max_count ${chassis.max_count || 0}` });
  }
  for (const g of installed) {
    if (g.form_factor && !(chassis.supported_form_factors || []).includes(g.form_factor)) {
      issues.push({ sev: "err", msg: `${g.model}: 폼팩터 ${g.form_factor} 미지원 (${(chassis.supported_form_factors||[]).join(",") || "none"})` });
    }
    if (g.model && !(chassis.supported_models || []).includes(g.model)) {
      issues.push({ sev: "err", msg: `${g.model}: 새시 supported_models에 없음` });
    }
    if (g.nvlink_enabled && chassis.nvlink_topology === "none") {
      issues.push({ sev: "err", msg: `${g.model}: NVLink 미지원 새시` });
    }
    if (g.nvlink_enabled && chassis.nvlink_topology === "bridge-pair" && (g.count > 2 || g.count % 2 !== 0)) {
      issues.push({ sev: "warn", msg: `NVLink Bridge는 2장 페어링만` });
    }
  }
  return issues;
}

//============ Power calc ============
function computeNodePowerW(node, gpuModels) {
  const spec = node.spec || {};
  const base = (spec.power && spec.power.typical_w_base) || 0;
  let gpuW = 0;
  for (const g of (spec.gpu || [])) {
    const ginfo = gpuModels[g.model];
    if (ginfo) gpuW += (g.count || 0) * (ginfo.tdp_w || 0);
  }
  const diskCount = (spec.disks || []).reduce((a, d) => a + (d.count || 1), 0);
  return base + gpuW + diskCount * 10;
}
function siteFormFactorU(formFactor) {
  if (!formFactor || formFactor === "Tower") return 0;
  const m = String(formFactor).match(/^(\d+)U$/);
  return m ? parseInt(m[1]) : 0;
}
function siteUsage(site, project, gpuModels) {
  if (site.kind !== "onprem") return null;
  const nodes = (site.node_ids || []).map(id => project.nodes.find(n => n.id === id)).filter(Boolean);
  const u = nodes.reduce((a, n) => a + siteFormFactorU(n.spec?.form_factor), 0);
  const w = nodes.reduce((a, n) => a + computeNodePowerW(n, gpuModels), 0);
  return {
    u_used: u,
    u_max: site.capacity?.rack_units || 0,
    kw_used: w / 1000,
    kw_max: site.capacity?.power_kw || 0,
  };
}

    ]));

    for (const n of nodes) {
      const cluster = getNodeCluster(n.id);
      const roles = Array.isArray(n.cluster_roles) ? n.cluster_roles : [];
      const roleAbbr = roles.map(r => r === "control-plane" ? "cp" : r === "worker" ? "w" : r).join("+");
      const meta = cluster ? `${cluster.name}${roleAbbr ? ` ${roleAbbr}` : ""}` : (n.spec?.form_factor || "");

        class: "tree-item child" + (state.ui.selectedKind === "node" && state.ui.selectedId === n.id ? " selected" : ""),
        onclick: () => selectEntity("node", n.id),
      }, [
        el("span", { class: "icon" }, ["▣"]),
        el("span", { class: "label" }, [n.name]),
        el("span", { class: "meta", style: cluster ? { color: "var(--purple)" } : {} }, [meta]),
      ]));

        el("span", { class: "label" }, [l4.name]),
        el("span", { class: "meta" }, [l4.vendor || l4.kind || ""]),

      sitesSec.appendChild(el("div", {
        class: "tree-item child" + (state.ui.selectedKind === "storage" && state.ui.selectedId === st.id ? " selected" : ""),
        onclick: () => selectEntity("storage", st.id),
      }, [
        el("span", { class: "icon" }, ["💾"]),
        el("span", { class: "label" }, [st.name]),
        el("span", { class: "meta" }, [st.kind || ""]),
      ]));
    }

    for (const d of (s.network_devices || [])) {
      sitesSec.appendChild(el("div", {

        onclick: () => selectEntity("netdev", d.id),
      }, [
        el("span", { class: "icon" }, [ndIcon[d.kind] || "▢"]),
        el("span", { class: "label" }, [d.name]),
        el("span", { class: "meta" }, [d.kind || ""]),
      ]));
    }
    // External services
    const extIcon = { database: "🗄", cache: "⚡", queue: "📨", registry: "📦", backup: "💼", monitoring: "📊", logging: "📝", secret_store: "🔑", identity: "👤", object_store: "🪣", custom: "❓" };
    for (const e of (s.external_services || [])) {

        class: "tree-item child" + (state.ui.selectedKind === "extsvc" && state.ui.selectedId === e.id ? " selected" : ""),

        el("span", { class: "label" }, [e.name]),
        el("span", { class: "meta" }, [e.kind || ""]),
      ]));
    }
  }

  // Site Links (project-level)
  const links = p.site_links || [];
  if (links.length || (p.sites?.length || 0) > 1) {
    const linksSec = el("div", { class: "tree-section" });
    linksSec.appendChild(el("div", { class: "tree-section-header" }, [
      "Site Links ", el("span", { class: "count" }, [`(${links.length})`]),
    ]));
    for (const link of links) {
      const fromSite = (p.sites || []).find(s => s.id === link.from_site_id);
      const toSite = (p.sites || []).find(s => s.id === link.to_site_id);

        class: "tree-item" + (state.ui.selectedKind === "sitelink" && state.ui.selectedId === link.id ? " selected" : ""),

  // Clusters section
  const clusters = p.clusters || [];

    "Clusters ", el("span", { class: "count" }, [`(${clusters.length})`]),

  if (!clusters.length) {
    clustersSec.appendChild(el("div", { class: "empty-hint" }, ["클러스터를 추가하세요."]));
  }
  for (const c of clusters) {

    const meta = `${(c.node_ids || []).length}n / ${wlCount}w`;
    clustersSec.appendChild(el("div", {
      class: "tree-item" + (state.ui.selectedKind === "cluster" && state.ui.selectedId === c.id ? " selected" : ""),
      onclick: () => selectEntity("cluster", c.id),
    }, [
      el("span", { class: "icon" }, ["⎈"]),
      el("span", { class: "label" }, [c.name]),
      el("span", { class: "meta" }, [meta]),
    ]));
    for (const w of (c.workloads || [])) {

        el("span", { class: "label" }, [w.name]),
        el("span", { class: "meta" }, [w.category]),
      ]));
    }
  }
  root.appendChild(clustersSec);

  // Actions
  const actions = el("div", { class: "tree-actions" });
  if (state.project.mode === "hybrid" || state.project.sites.length === 0 || state.project.sites.length < 5) {
    actions.appendChild(el("button", { class: "add-btn", onclick: openAddSite }, ["＋ Add Site"]));
  }
  actions.appendChild(el("button", { class: "add-btn", onclick: openAddNode }, ["＋ Add Node"]));
  actions.appendChild(el("button", { class: "add-btn", onclick: openAddCluster }, ["＋ Add Cluster"]));
  root.appendChild(actions);
}
