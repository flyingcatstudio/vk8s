    style: { display: "flex", alignItems: "center", gap: "12px", marginBottom: "10px", flexWrap: "wrap" },
  }, [
    el("h2", { style: { fontSize: "16px", fontWeight: 600, margin: 0 } }, ["인프라 아키텍처 — 네트워크 관점"]),
    el("span", { style: { fontSize: "11px", color: "var(--text3)", fontStyle: "italic" } }, [
      "switch 버스 + 환경별 그룹 (prod/dev/관리/DB·Storage)",
    ]),
    el("label", {
      style: {
        fontSize: "11px", color: anyMultiZone ? "var(--text2)" : "var(--text3)",
        display: "inline-flex", alignItems: "center", gap: "2px",
        marginLeft: "auto", cursor: anyMultiZone ? "pointer" : "default",
        opacity: anyMultiZone ? 1 : 0.5,
      },
      title: anyMultiZone
        ? "Zone (topology.kubernetes.io/zone 또는 site_id)별로 행을 분리합니다. L4·Switch·Storage가 zone별로 묶입니다."
        : "Zone이 2개 이상인 클러스터가 있을 때만 효과가 있습니다.",
    }, [zoneToggle, "Group by zone"]),
    colorByToggle(),
    ...diagramExportButtons(() => root_svg, "architecture", () => archLegendEntries),
  ]));

  // ---- Cluster filter bar — "All" + one tab per cluster (mirrors the Dependency view) ----
  if ((p.clusters || []).length > 1) {
    const cbar = el("div", {
      style: { display: "flex", gap: "4px", marginBottom: "10px", flexWrap: "wrap", alignItems: "center" },
    });
    cbar.appendChild(el("span", {
      style: { fontSize: "11px", color: "var(--text2)", marginRight: "6px", letterSpacing: "0.05em", textTransform: "uppercase", fontWeight: 600 },
    }, ["Cluster"]));
    const mkTab = (id, label, count) => el("button", {
      class: "view-tab" + (archClusterId === id ? " active" : ""),
      style: { padding: "4px 10px", fontSize: "11px" },
      onclick: () => { state.ui.archCluster = id; emit(); },
    }, [
      label,
      el("span", { style: { color: "var(--text3)", marginLeft: "6px", fontFamily: "JetBrains Mono", fontSize: "10px" } }, [`(${count})`]),
    ]);
    const totalWls = (p.clusters || []).reduce((a, c) => a + (c.workloads || []).length, 0);
    cbar.appendChild(mkTab("", "All", totalWls));
    for (const c of (p.clusters || [])) {
      cbar.appendChild(mkTab(c.id, c.name, (c.workloads || []).length));
    }
    wrap.appendChild(cbar);
  }

  // ---- Zoom / pan controls (own row above the SVG) ----
  const zoomPctSpan = el("span", {
    style: { fontFamily: "JetBrains Mono", fontSize: "11px", color: "var(--text2)", minWidth: "42px", textAlign: "center" },
  }, [`${zoomPct()}%`]);
  const refreshZoomPct = () => { zoomPctSpan.textContent = `${zoomPct()}%`; };

  const zoomAt = (factor, cx, cy) => {
    // Cursor-anchored zoom by changing viewBox dimensions while keeping the
    // world-space point under (cx, cy) fixed in screen space.
    const ratioX = (cx - vb.x) / vb.w;
    const ratioY = (cy - vb.y) / vb.h;
    vb.w = Math.max(20, Math.min(naturalVB.w * 20, vb.w * factor));
    vb.h = Math.max(20, Math.min(naturalVB.h * 20, vb.h * factor));
    vb.x = cx - ratioX * vb.w;
    vb.y = cy - ratioY * vb.h;
    applyVB(); refreshZoomPct();
  };
  const zoomFromCenter = (factor) => zoomAt(factor, vb.x + vb.w / 2, vb.y + vb.h / 2);
  const fit = () => { Object.assign(vb, naturalVB); applyVB(); refreshZoomPct(); };

  const zoomBtn = (label, title, onClick) => el("button", {
    style: {
      padding: "3px 9px", fontSize: "12px", lineHeight: 1,
      background: "var(--surface2)", border: "1px solid var(--border)",
      color: "var(--text2)", borderRadius: "4px", cursor: "pointer",
      fontFamily: "JetBrains Mono", fontWeight: 600,
    },
    title,
    onclick: onClick,
  }, [label]);
  wrap.appendChild(el("div", {
    style: { display: "flex", alignItems: "center", gap: "4px", marginBottom: "8px" },
  }, [
    el("span", {
      style: { fontSize: "11px", color: "var(--text3)", marginRight: "6px", letterSpacing: "0.05em", textTransform: "uppercase", fontWeight: 600 },
    }, ["Zoom"]),
    zoomBtn("−", "축소 (휠 아래로)", () => zoomFromCenter(1.2)),
    zoomBtn("+", "확대 (휠 위로)",   () => zoomFromCenter(1 / 1.2)),
    zoomPctSpan,
    zoomBtn("⊡ Fit", "전체 보기로 초기화", () => fit()),
    el("span", {
      style: { fontSize: "10px", color: "var(--text3)", marginLeft: "8px", fontStyle: "italic" },
    }, ["휠로 커서 위치 기준 확대 · 빈 영역 드래그로 이동"]),
  ]));

  // Wheel: cursor-anchored zoom. createSVGPoint + getScreenCTM → user-space coords.
  root_svg.addEventListener("wheel", e => {
    e.preventDefault();
    const pt = root_svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = root_svg.getScreenCTM();
    if (!ctm) return;
    const u = pt.matrixTransform(ctm.inverse());
    const factor = e.deltaY > 0 ? 1.06 : 1 / 1.06;
    zoomAt(factor, u.x, u.y);
  }, { passive: false });

  // Drag-pan: only when the press lands on the SVG background, not on a clickable box group.
  // Window listeners are attached on mousedown and removed on mouseup so they don't
  // accumulate across re-renders.
  const isOnNode = (target) => {
    let n = target;
    while (n && n !== root_svg) {
      if (n.tagName === "g" && n.getAttribute && /cursor:\s*pointer/i.test(n.getAttribute("style") || "")) return true;
      n = n.parentNode;
    }
    return false;
  };
  root_svg.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    if (isOnNode(e.target)) return;
    const ctm = root_svg.getScreenCTM();
    if (!ctm) return;
    const drag = {
      startX: e.clientX, startY: e.clientY,
      vbX0: vb.x, vbY0: vb.y,
      scaleX: 1 / ctm.a, scaleY: 1 / ctm.d,
      dragged: false,
    };
    root_svg.style.cursor = "grabbing";
    const onMove = ev => {
      const dx = ev.clientX - drag.startX;
      const dy = ev.clientY - drag.startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.dragged = true;
      vb.x = drag.vbX0 - dx * drag.scaleX;
      vb.y = drag.vbY0 - dy * drag.scaleY;
      applyVB();
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      root_svg.style.cursor = "grab";
      if (drag.dragged) {
        // Suppress the trailing click so a pan doesn't accidentally open the inspector.
        const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); window.removeEventListener("click", swallow, true); };
        window.addEventListener("click", swallow, true);
        setTimeout(() => window.removeEventListener("click", swallow, true), 60);
      }
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });

  wrap.appendChild(root_svg);

  // Legend — unified workload colour classes (current mode) + fixed infra chips.
  const legendRow = legendChipRow(archLegendEntries);
  for (const inf of [{ label: "L4/Switch", fill: "#1e3a5f", stroke: "#34495e" }, { label: "Storage", fill: "#1e8449", stroke: "#27ae60" }]) {
    legendRow.appendChild(el("span", {
      style: { display: "inline-flex", alignItems: "center", gap: "5px", padding: "1px 8px 1px 4px", borderRadius: "3px" },
    }, [
      el("span", { style: { width: "12px", height: "12px", borderRadius: "3px", background: inf.fill, border: `1px solid ${inf.stroke}`, display: "inline-block" } }, []),
      el("span", { style: { color: "var(--text3)" } }, [inf.label]),
    ]));
  }
  wrap.appendChild(legendRow);

  // Cross-cluster references (filter mode only): show each in-scope workload that depends on a
  // workload in ANOTHER cluster, plus the inverse (other clusters that depend on this cluster's
  // workloads). Architecture doesn't draw dep edges, so this surfaces the cross-cluster traffic
  // without changing the physical diagram. Click an entry to jump to its workload inspector.
  if (archClusterId) {
    const wlIndex = new Map();
    for (const c of (p.clusters || [])) for (const w of (c.workloads || [])) wlIndex.set(w.id, { w, c });
    const outRefs = [];   // shown cluster → other
    const inRefs  = [];   // other → shown cluster
    for (const c of shownClusters) {
      for (const w of (c.workloads || [])) {
        for (const d of (w.depends_on || [])) {
          const ent = wlIndex.get(d.target_workload_id);
          if (ent && ent.c.id !== c.id) outRefs.push({ from: w, to: ent.w, otherCluster: ent.c });
        }
      }
    }
    for (const c of (p.clusters || [])) {
      if (c.id === archClusterId) continue;
      for (const w of (c.workloads || [])) {
        for (const d of (w.depends_on || [])) {
          const ent = wlIndex.get(d.target_workload_id);
          if (ent && ent.c.id === archClusterId) inRefs.push({ from: w, fromCluster: c, to: ent.w });
        }
      }
    }
    if (outRefs.length || inRefs.length) {
      const refsBox = el("div", {
        style: {
          marginTop: "12px", padding: "10px 14px", borderRadius: "6px",
          background: "rgba(167,139,250,0.06)", border: "1px solid rgba(167,139,250,0.35)",
          fontSize: "11px", color: "var(--text2)",
        },
      });
      refsBox.appendChild(el("div", { style: { fontWeight: 600, color: "var(--purple)", marginBottom: "6px" } },
        [`↗ Cross-cluster references — out ${outRefs.length} · in ${inRefs.length}`]));
      const chip = (label, onclick, title) => el("button", {
        title,
        style: {
          padding: "3px 8px", fontSize: "11px", cursor: "pointer",
          background: "var(--surface2)", border: "1px solid var(--border)",
          color: "var(--text)", borderRadius: "4px", fontFamily: "inherit",
          margin: "0 6px 4px 0",
        },
        onclick,
      }, [label]);
      if (outRefs.length) {
        const row = el("div", { style: { marginBottom: "4px" } }, [
          el("span", { style: { color: "var(--text3)", marginRight: "6px" } }, ["outbound:"]),
        ]);
        for (const r of outRefs) {
          row.appendChild(chip(`${r.from.name} → ${r.otherCluster.name} / ${r.to.name}`,
            () => selectEntity("workload", r.to.id),
            "다른 클러스터의 타깃 워크로드로 이동"));
        }
        refsBox.appendChild(row);
      }
      if (inRefs.length) {
        const row = el("div", {}, [
          el("span", { style: { color: "var(--text3)", marginRight: "6px" } }, ["inbound:"]),
        ]);
        for (const r of inRefs) {
          row.appendChild(chip(`${r.fromCluster.name} / ${r.from.name} → ${r.to.name}`,
            () => selectEntity("workload", r.from.id),
            "외부에서 이 클러스터를 호출하는 워크로드로 이동"));
        }
        refsBox.appendChild(row);
      }
      wrap.appendChild(refsBox);
    }
  }

  root.appendChild(wrap);
}

//============ Render: Dependency graph ============
function renderDependency() {
  const root = $("#viewBody");
  root.innerHTML = "";
  const p = state.project;
  if (!p) return;

  const allClusters = p.clusters || [];
  // Reset selection if the targeted cluster has been removed.
  if (state.ui.depCluster && !allClusters.find(c => c.id === state.ui.depCluster)) {
    state.ui.depCluster = "";
  }
  const selectedClusterId = state.ui.depCluster || "";

  // View-local option (not persisted in project data): show edge labels (protocol:port + latency).
  if (state.ui.depShowLabels == null) state.ui.depShowLabels = true;
  const showEdgeLabels = state.ui.depShowLabels !== false;

  // Cluster filter bar — "All" + one tab per cluster (with workload count) + label toggle on the right.
  if (allClusters.length > 0) {
    const bar = el("div", {
      style: { display: "flex", gap: "4px", marginBottom: "12px", flexWrap: "wrap", alignItems: "center" },
    });
    bar.appendChild(el("span", {
      style: { fontSize: "11px", color: "var(--text2)", marginRight: "6px", letterSpacing: "0.05em", textTransform: "uppercase", fontWeight: 600 },
    }, ["Cluster"]));
    const mkTab = (id, label, count) => el("button", {
      class: "view-tab" + (selectedClusterId === id ? " active" : ""),
      style: { padding: "4px 10px", fontSize: "11px" },
      onclick: () => { state.ui.depCluster = id; emit(); },
    }, [
      label,
      el("span", { style: { color: "var(--text3)", marginLeft: "6px", fontFamily: "JetBrains Mono", fontSize: "10px" } }, [`(${count})`]),
    ]);
    const totalWls = allClusters.reduce((a, c) => a + (c.workloads || []).length, 0);
    bar.appendChild(mkTab("", "All", totalWls));
    for (const c of allClusters) {
      bar.appendChild(mkTab(c.id, c.name, (c.workloads || []).length));
    }
    // Right-aligned label toggle.
    const labelToggle = el("input", {
      type: "checkbox",
      checked: showEdgeLabels ? "" : null,
      onchange: e => { state.ui.depShowLabels = e.target.checked; emit(); },
    });
    bar.appendChild(el("label", {
      style: { display: "flex", alignItems: "center", gap: "6px", marginLeft: "auto", fontSize: "11px", color: "var(--text2)", cursor: "pointer" },
    }, [
      labelToggle,
      el("span", {}, ["edge label (protocol:port·latency)"]),
    ]));
    root.appendChild(bar);
  }

  // Collect workloads — filtered by selected cluster (or all clusters when blank),
  // and by the per-workload `hide_from_dep_graph` opt-out.
  const items = [];
  const byId = new Map();
  let hiddenByOptOut = 0;
  for (const c of allClusters) {
    if (selectedClusterId && c.id !== selectedClusterId) continue;
    for (const w of (c.workloads || [])) {
      if (w.hide_from_dep_graph) { hiddenByOptOut++; continue; }
      items.push({ w, c });
      byId.set(w.id, { w, c });
    }
  }
  if (hiddenByOptOut > 0) {
    root.appendChild(el("div", {
      style: { fontSize: "11px", color: "var(--text3)", marginBottom: "8px", fontFamily: "JetBrains Mono" },
    }, [`ℹ ${hiddenByOptOut} workload(s) hidden by 'hide_from_dep_graph' option`]));
  }

  // Cross-cluster ghost endpoints: when a cluster filter is active, surface workloads in OTHER
  // clusters that are referenced by (outbound) or that reference (inbound) the in-scope workloads.
  // Ghost items get rendered with a dashed border + cluster suffix; ghost↔ghost edges are skipped.
  let ghostCount = 0;
  if (selectedClusterId) {
    const allWlIndex = new Map();
    for (const c of allClusters) for (const w of (c.workloads || [])) allWlIndex.set(w.id, { w, c });
    const addGhost = (id) => {
      if (byId.has(id)) return;
      const ent = allWlIndex.get(id);
      if (!ent || ent.w.hide_from_dep_graph) return;
      const ghost = { w: ent.w, c: ent.c, isGhost: true };
      items.push(ghost); byId.set(ent.w.id, ghost); ghostCount++;
    };
    // Outbound ghosts: in-scope workload depends_on → other-cluster target.
    for (const it of items.slice()) {
      for (const d of (it.w.depends_on || [])) addGhost(d.target_workload_id);
    }
    // Inbound ghosts: other-cluster workload depends_on → in-scope target.
    for (const ent of allWlIndex.values()) {
      if (byId.has(ent.w.id)) continue;
      for (const d of (ent.w.depends_on || [])) {
        const tgt = byId.get(d.target_workload_id);
        if (tgt && !tgt.isGhost) { addGhost(ent.w.id); break; }
      }
    }
  }

  if (!items.length) {
    const selName = selectedClusterId ? allClusters.find(c => c.id === selectedClusterId)?.name : null;
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⊟"]),
      el("h2", {}, ["Dependency Graph"]),
      el("p", {}, [selName
        ? `'${selName}' 클러스터에 워크로드가 없습니다.`
        : "워크로드가 있어야 표시됩니다."]),
    ]));
    return;
  }

  // Build edges and adjacency. Drop edges to unknown targets (silent),
  // but count cross-cluster ones when a cluster filter is active so we can surface them.
  const edges = [];     // { from, to, protocol, port, avg_call_ms, fanout_pct, calls_per_request }
  const out = new Map();
  const inDeg = new Map();
  for (const { w } of items) {
    out.set(w.id, []);
    inDeg.set(w.id, 0);
  }
  for (const it of items) {
    out.set(it.w.id, []);   // re-init in case ghost addition added new ids after the initial loop
    inDeg.set(it.w.id, 0);
  }
  for (const it of items) {
    for (const d of (it.w.depends_on || [])) {
      const tgt = d.target_workload_id;
      const tgtIt = byId.get(tgt);
      if (!tgtIt) continue;
      // Skip edges between two ghosts (not relevant to the filtered focus view).
      if (it.isGhost && tgtIt.isGhost) continue;
      edges.push({
        from: it.w.id, to: tgt,
        protocol: d.protocol || "", port: d.port,
        avg_call_ms: d.avg_call_ms,
        fanout_pct: d.fanout_pct, calls_per_request: d.calls_per_request,
        isGhostEdge: !!(it.isGhost || tgtIt.isGhost),
      });
      out.get(it.w.id).push(tgt);
      inDeg.set(tgt, (inDeg.get(tgt) || 0) + 1);
    }
  }
  if (ghostCount > 0) {
    root.appendChild(el("div", {
      style: { fontSize: "11px", color: "var(--text2)", background: "rgba(167,139,250,.08)", border: "1px solid rgba(167,139,250,.30)", borderRadius: "6px", padding: "6px 10px", marginBottom: "10px", fontFamily: "JetBrains Mono" },
    }, [`↗ cross-cluster 엔드포인트 ${ghostCount}개 (점선 테두리, 클러스터명 표기)`]));
  }

  if (!edges.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⊘"]),
      el("h2", {}, ["No dependencies"]),
      el("p", {}, [
        "워크로드 ", String(items.length), "개 중 depends_on 관계가 없습니다. ",
        "워크로드 inspector → Dependencies 섹션에서 추가하세요.",
      ]),
    ]));
    return;
  }

  // ---- Layered layout (Kahn-style longest-path from sources) ----
  // Sources = in-degree 0. Layer 0 = leftmost. Cycle nodes go to maxLayer.
  const layer = new Map();
  const remaining = new Map(inDeg);
  const queue = [];
  for (const { w } of items) {
    if (remaining.get(w.id) === 0) { layer.set(w.id, 0); queue.push(w.id); }
  }
  while (queue.length) {
    const n = queue.shift();
    const ln = layer.get(n);
    for (const c of (out.get(n) || [])) {
      const lc = layer.has(c) ? Math.max(layer.get(c), ln + 1) : ln + 1;
      layer.set(c, lc);
      const r = remaining.get(c) - 1;
      remaining.set(c, r);
      if (r === 0) queue.push(c);
    }
  }
  // Cycle survivors: nodes that never hit in-degree 0
  let maxLayer = 0;
  for (const v of layer.values()) maxLayer = Math.max(maxLayer, v);
  const cycleNodes = new Set();
  for (const { w } of items) {
    if (!layer.has(w.id)) {
      layer.set(w.id, maxLayer + 1);
      cycleNodes.add(w.id);
    }
  }
  if (cycleNodes.size) maxLayer += 1;
  // Per-workload layer override (`w.dep_layer`): pin specific nodes to a chosen column. Null
  // / undefined keeps the auto-computed layer. Edges may cross sideways as a result — that's
  // the explicit user intent ("force this node into L1").
  for (const { w } of items) {
    if (typeof w.dep_layer === "number" && w.dep_layer >= 0) {
      layer.set(w.id, w.dep_layer);
      if (w.dep_layer > maxLayer) maxLayer = w.dep_layer;
    }
  }

  // Identify back edges (target's layer ≤ source's layer)
  const backEdges = new Set();
  for (let i = 0; i < edges.length; i++) {
    const e = edges[i];
    if (layer.get(e.to) <= layer.get(e.from)) backEdges.add(i);
  }

  // Group nodes per layer
  const layerNodes = [];
  for (let l = 0; l <= maxLayer; l++) layerNodes.push([]);
  for (const { w } of items) layerNodes[layer.get(w.id)].push(w.id);
  // Stable starting order (alphabetical) so barycenter ties are deterministic.
  for (const arr of layerNodes) arr.sort((a, b) => a.localeCompare(b));

  // ---- Crossing minimization (Sugiyama barycenter heuristic) ----
  // Reorder nodes within each layer so the mean index of their adjacent-layer neighbors
  // lines up; iterate forward (use upstream layer) and backward (use downstream layer)
  // sweeps. Back-edge endpoints in non-adjacent layers are filtered out so they don't
  // distort the layout. Sinks/sources fall back to the opposite side's mean.
  const inAdj = new Map();
  for (const { w } of items) inAdj.set(w.id, []);
  for (const e of edges) {
    if (inAdj.has(e.to)) inAdj.get(e.to).push(e.from);
  }
  const indexInLayer = new Map();
  const refreshIndex = (L) => {
    const arr = layerNodes[L];
    for (let i = 0; i < arr.length; i++) indexInLayer.set(arr[i], i);
  };
  for (let l = 0; l <= maxLayer; l++) refreshIndex(l);
  const meanIdx = (neighbors, refLayer) => {
    if (refLayer < 0 || refLayer > maxLayer) return null;
    let sum = 0, count = 0;
    for (const n of neighbors) {
      if (layer.get(n) !== refLayer) continue;
      const idx = indexInLayer.get(n);
      if (idx != null) { sum += idx; count++; }
    }
    return count > 0 ? sum / count : null;
  };
  // Count current crossings between two adjacent layers (counts pairs of edges that cross).
  const countCrossings = (Lupper, Llower) => {
    // Each edge from layer Lupper to layer Llower contributes (i_src, i_tgt) pairs.
    const pairs = [];
    for (const e of edges) {
      if (layer.get(e.from) === Lupper && layer.get(e.to) === Llower) {
        const a = indexInLayer.get(e.from), b = indexInLayer.get(e.to);
        if (a != null && b != null) pairs.push([a, b]);
      }
    }
    let cross = 0;
    for (let i = 0; i < pairs.length; i++) {
      for (let j = i + 1; j < pairs.length; j++) {
        const [a1, b1] = pairs[i], [a2, b2] = pairs[j];
        if ((a1 < a2 && b1 > b2) || (a1 > a2 && b1 < b2)) cross++;
      }
    }
    return cross;
  };
  const totalCrossings = () => {
    let t = 0;
    for (let L = 0; L < maxLayer; L++) t += countCrossings(L, L + 1);
    return t;
  };

  const SWEEPS = 24;
  let bestSnapshot = layerNodes.map(a => a.slice());
  let bestCross = totalCrossings();
  for (let s = 0; s < SWEEPS; s++) {
    const forward = (s % 2) === 0;
    if (forward) {
      for (let L = 1; L <= maxLayer; L++) {
        const arr = layerNodes[L];
        arr.sort((a, b) => {
          let bcA = meanIdx(inAdj.get(a) || [], L - 1);
          let bcB = meanIdx(inAdj.get(b) || [], L - 1);
          if (bcA == null) bcA = meanIdx(out.get(a) || [], L + 1);
          if (bcB == null) bcB = meanIdx(out.get(b) || [], L + 1);
          if (bcA == null && bcB == null) return 0;
          if (bcA == null) return 1;
          if (bcB == null) return -1;
          return bcA - bcB;
        });
        refreshIndex(L);
      }
    } else {
      for (let L = maxLayer - 1; L >= 0; L--) {
        const arr = layerNodes[L];
        arr.sort((a, b) => {
          let bcA = meanIdx(out.get(a) || [], L + 1);
          let bcB = meanIdx(out.get(b) || [], L + 1);
          if (bcA == null) bcA = meanIdx(inAdj.get(a) || [], L - 1);
          if (bcB == null) bcB = meanIdx(inAdj.get(b) || [], L - 1);
          if (bcA == null && bcB == null) return 0;
          if (bcA == null) return 1;
          if (bcB == null) return -1;
          return bcA - bcB;
        });
        refreshIndex(L);
      }
    }
    const cur = totalCrossings();
    if (cur < bestCross) {
      bestCross = cur;
      bestSnapshot = layerNodes.map(a => a.slice());
      if (cur === 0) break;
    }
  }
  // Restore the best ordering seen across all sweeps (sweeps can oscillate).
  for (let L = 0; L <= maxLayer; L++) {
    layerNodes[L] = bestSnapshot[L];
    refreshIndex(L);
  }

  // ---- Layout constants ----
  const BOX_W = 140, BOX_H = 50;
  const COL_W = BOX_W + 80;   // horizontal spacing per layer
  const ROW_H = BOX_H + 22;   // vertical spacing within a layer
  const PAD = 24;

  const maxRows = Math.max(...layerNodes.map(a => a.length), 1);
  const totalW = PAD * 2 + (maxLayer + 1) * COL_W - 80; // last layer doesn't need full COL_W spacing
  const totalH = PAD * 2 + maxRows * ROW_H + 20;

  // Per-node position
  const pos = new Map();  // wid → { cx, cy }
  layerNodes.forEach((nodes, l) => {
    const rows = nodes.length;
    const startY = PAD + (maxRows - rows) * ROW_H / 2 + BOX_H / 2;  // vertically centered
    nodes.forEach((wid, idx) => {
      const cx = PAD + l * COL_W + BOX_W / 2;
      const cy = startY + idx * ROW_H;
      pos.set(wid, { cx, cy });
    });
  });

  // ---- Node colour: unified standard (category / namespace mode), identical to Architecture ----
  const colorOf = (w) => workloadColorClass(w);

  // ---- SVG ----
  const NS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs = {}, children = []) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v != null) node.setAttribute(k, v);
    }
    for (const c of [].concat(children)) {
      if (c == null) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  };

  // Pre-pass: compute lane routing for non-back, multi-layer edges so we can
  // expand the SVG viewBox to accommodate bezier control-point overshoot.
  const laneOf = new Map(); // edge idx → { yLane, yc }
  let vbMinY = 0, vbMaxY = totalH;
  edges.forEach((e, idx) => {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) return;
    if (backEdges.has(idx)) {
      // Back edges arc up ~30px above the source/target row.
      vbMinY = Math.min(vbMinY, Math.min(a.cy, b.cy) - 40);
      return;
    }
    const fromL = layer.get(e.from);
    const toL = layer.get(e.to);
    const blockers = [];
    for (let l = fromL + 1; l <= toL - 1; l++) {
      for (const wid of layerNodes[l]) blockers.push(pos.get(wid).cy);
    }
    if (!blockers.length) return;
    blockers.sort((p, q) => p - q);
    const half = BOX_H / 2 + 12;
    const candidates = [blockers[0] - half, blockers[blockers.length - 1] + half];
    for (let i = 0; i < blockers.length - 1; i++) {
      if (blockers[i + 1] - blockers[i] >= 2 * half) {
        candidates.push((blockers[i] + blockers[i + 1]) / 2);
      }
    }
    const mid = (a.cy + b.cy) / 2;
    candidates.sort((p, q) => Math.abs(p - mid) - Math.abs(q - mid));
    const yLane = candidates[0];
    const yc = (4 * yLane - mid) / 3;
    laneOf.set(idx, { yLane, yc });
    vbMinY = Math.min(vbMinY, yc - 8);
    vbMaxY = Math.max(vbMaxY, yc + 8);
  });
  const vbHeight = vbMaxY - vbMinY;

  // ---- Pan / Zoom (view-local, manipulates the SVG viewBox) ----
  // Natural extent = the full graph bounding box. Stored separately so a Fit/reset can
  // always return to it even after the user has panned away.
  const naturalVB = { x: 0, y: vbMinY, w: totalW, h: vbHeight };
  // Persisted current viewport. Reset if previous viewBox is geometrically broken or
  // points entirely outside the new natural extent (e.g., when workloads were added).
  if (!state.ui.depViewBox || state.ui.depViewBox.w <= 0 || state.ui.depViewBox.h <= 0) {
    state.ui.depViewBox = { ...naturalVB };
  }
  const vb = state.ui.depViewBox;

  const root_svg = svg("svg", {
    width: "100%",
    viewBox: `${vb.x} ${vb.y} ${vb.w} ${vb.h}`,
    preserveAspectRatio: "xMidYMid meet",
    style: "background:var(--bg);border:1px solid var(--border);border-radius:8px;height:min(72vh,720px);min-height:420px;cursor:grab;touch-action:none;",
  });

  // Helpers to push viewBox state → DOM. Stays local to this render so closures over
  // `vb` and `root_svg` are stable; subsequent renders re-bind a fresh closure.
  const applyVB = () => root_svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const zoomPct = () => Math.round((naturalVB.w / vb.w) * 100);

  // Arrow markers
  const defs = svg("defs");
  defs.appendChild(svg("marker", {
    id: "arr", viewBox: "0 0 10 10", refX: 9, refY: 5,
    markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse",
  }, [svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "#7f8c8d" })]));
  defs.appendChild(svg("marker", {
    id: "arr-back", viewBox: "0 0 10 10", refX: 9, refY: 5,
    markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse",
  }, [svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "#e67e22" })]));
  root_svg.appendChild(defs);

  // ---- Focus mode: click a node to fade everything but its connected component ----
  // `state.ui.depFocusId` holds the clicked workload id. Reach = transitive upstream +
  // downstream via depends_on, so the focused subgraph stays vivid while siblings dim.
  // A stale focus id (filtered out / deleted) is cleared lazily here.
  if (state.ui.depFocusId && !byId.has(state.ui.depFocusId)) state.ui.depFocusId = null;
  const focusId = state.ui.depFocusId || null;
  let reach = null;
  if (focusId) {
    const outAdj = new Map(), inAdj = new Map();
    for (const e of edges) {
      (outAdj.get(e.from) || outAdj.set(e.from, []).get(e.from)).push(e.to);
      (inAdj.get(e.to) || inAdj.set(e.to, []).get(e.to)).push(e.from);
    }
    reach = new Set([focusId]);
    const stack = [focusId];
    while (stack.length) {
      const n = stack.pop();
      for (const x of outAdj.get(n) || []) if (!reach.has(x)) { reach.add(x); stack.push(x); }
      for (const x of inAdj.get(n)  || []) if (!reach.has(x)) { reach.add(x); stack.push(x); }
    }
  }
  const FADE = 0.18;
  const inFocus = (id) => !reach || reach.has(id);

  // ---- Edges (drawn first so nodes overlap) ----
  // Multi-layer edges route through a horizontal lane that lies in a gutter
  // between intervening layers' node rows, so the curve doesn't pass through any box.
  // Lanes are pre-computed below in `laneOf` (defined before viewBox so SVG height can expand to fit overshoot).
  edges.forEach((e, idx) => {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) return;
    const back = backEdges.has(idx);
    // Pick the side of each box that gives the shorter horizontal run. If A sits to the LEFT
    // of B, exit A's right edge and enter B's left (the default left-to-right reading). If A
    // sits to the right (e.g. via a layer-override pin or a cycle back-edge), exit A's left and
    // enter B's right — otherwise the curve has to sweep all the way around the node.
    const aOnLeft = a.cx <= b.cx;
    const x1 = aOnLeft ? a.cx + BOX_W / 2 : a.cx - BOX_W / 2;
    const x2 = aOnLeft ? b.cx - BOX_W / 2 : b.cx + BOX_W / 2;
    const sgn = aOnLeft ? 1 : -1;      // bezier control-point direction follows the chosen side
    const y1 = a.cy;
    const y2 = b.cy;
    const dx = Math.max(40, Math.abs(x2 - x1) / 2);
    const midline = (y1 + y2) / 2;

    let path;
    let labelY = midline - 8;
    if (back) {
      path = `M${x1},${y1} C${x1 + sgn * dx},${y1 - 30} ${x2 - sgn * dx},${y2 - 30} ${x2},${y2}`;
      labelY = midline - 28;
    } else {
      const lane = laneOf.get(idx);
      if (lane) {
        path = `M${x1},${y1} C${x1 + sgn * dx},${lane.yc} ${x2 - sgn * dx},${lane.yc} ${x2},${y2}`;
        labelY = lane.yLane - 4;
      } else {
        // Adjacent layers — gentle bezier (no intervening boxes to clear).
        path = `M${x1},${y1} C${x1 + sgn * dx},${y1} ${x2 - sgn * dx},${y2} ${x2},${y2}`;
      }
    }

    // Focus-mode opacity: an edge is "in focus" only when BOTH endpoints are in the reach set.
    const edgeInFocus = inFocus(e.from) && inFocus(e.to);
    const baseStrokeOp = e.isGhostEdge ? 0.65 : 1;
    root_svg.appendChild(svg("path", {
      d: path, fill: "none",
      stroke: back ? "#e67e22" : "#7f8c8d",
      "stroke-width": 1.4,
      "stroke-dasharray": back ? "4 3" : (e.isGhostEdge ? "3 4" : ""),
      "stroke-opacity": edgeInFocus ? baseStrokeOp : FADE,
      "marker-end": back ? "url(#arr-back)" : "url(#arr)",
    }));
    // Edge label (protocol:port + ms) — small, mid-arc. Suppressed when view-local toggle is off.
    if (showEdgeLabels) {
      const labelParts = [];
      // Protocol and port shown together (e.g. "HTTP:8080"); fall back to whichever exists.
      if (e.protocol || e.port != null) {
        labelParts.push(e.port != null ? `${e.protocol || ""}${e.protocol ? ":" : ""}${e.port}` : e.protocol);
      }
      if (e.avg_call_ms != null) labelParts.push(`${e.avg_call_ms}ms`);
      if (labelParts.length) {
        const mx = (x1 + x2) / 2;
        root_svg.appendChild(svg("text", {
          x: mx, y: labelY, "text-anchor": "middle",
          fill: back ? "#e67e22" : "var(--text3)",
          "font-size": "9", "font-family": "JetBrains Mono",
          "fill-opacity": edgeInFocus ? 1 : FADE,
        }, [labelParts.join(" / ")]));
      }
    }
  });

  // ---- Nodes ----
  for (const it of items) {
    const w = it.w;
    const np = pos.get(w.id);
    if (!np) continue;
    const col = colorOf(w);
    const x = np.cx - BOX_W / 2, y = np.cy - BOX_H / 2;
    const isFocusNode = reach && w.id === focusId;
    const nodeInFocus = inFocus(w.id);
    const g = svg("g", {
      style: "cursor:pointer",
      // First click focuses this node (its connected component stays vivid, the rest fades).
      // Click the same node again to restore. Clicking a different node switches focus to it.
      onclick: () => {
        state.ui.depFocusId = (state.ui.depFocusId === w.id) ? null : w.id;
        selectEntity("workload", w.id);
      },
      opacity: nodeInFocus ? 1 : FADE,
    });
    // Cross-cluster ghosts get a dashed border + slightly faded fill so the focus stays on
    // the in-scope cluster while still showing where data flows in/out. The clicked focus node
    // gets a thicker stroke so it's obvious which one is the focal point in its subgraph.
    g.appendChild(svg("rect", {
      x, y, width: BOX_W, height: BOX_H, rx: 6, ry: 6,
      fill: col.fill, stroke: col.stroke,
      "stroke-width": isFocusNode ? 2.8 : 1.5,
      "fill-opacity": it.isGhost ? 0.55 : 1,
      "stroke-dasharray": it.isGhost ? "4 3" : "",
    }));
    const lbl = w.name.length > 18 ? w.name.slice(0, 17) + "…" : w.name;
    g.appendChild(svg("text", {
      x: np.cx, y: y + 18, "text-anchor": "middle",
      fill: "#fff", "font-size": "12", "font-weight": "600",
      "font-family": "Pretendard, sans-serif",
    }, [lbl]));
    // Ghost: show the source cluster name as the sub-label so users see where it comes from.
    const sub = it.isGhost
      ? `↗ ${it.c.name}`
      : [w.category || "", w.replicas > 1 ? `×${w.replicas}` : ""].filter(Boolean).join(" ");
    if (sub) {
      g.appendChild(svg("text", {
        x: np.cx, y: y + 33, "text-anchor": "middle",
        fill: "rgba(255,255,255,0.85)", "font-size": "10",
        "font-family": "JetBrains Mono",
      }, [sub]));
    }
    if (w.namespace && !it.isGhost) {
      g.appendChild(svg("text", {
        x: np.cx, y: y + 45, "text-anchor": "middle",
        fill: "rgba(255,255,255,0.6)", "font-size": "9",
        "font-family": "JetBrains Mono",
      }, [`ns:${w.namespace}`]));
    }
    root_svg.appendChild(g);
  }

  // Layer column labels (top)
  for (let l = 0; l <= maxLayer; l++) {
    if (!layerNodes[l].length) continue;
    const x = PAD + l * COL_W + BOX_W / 2;
    const isFirst = l === 0;
    const isLast = l === maxLayer && !cycleNodes.size;
    const isCycle = cycleNodes.size && l === maxLayer;
    const lbl = isCycle ? "cycle"
              : isFirst ? "entry"
              : isLast ? "sink"
              : `L${l}`;
    root_svg.appendChild(svg("text", {
      x, y: PAD - 6, "text-anchor": "middle",
      fill: "var(--text3)", "font-size": "10",
      "font-family": "JetBrains Mono", "font-style": "italic",
    }, [lbl]));
  }

  // ---- Wrap ----
  const wrap = el("div", {});
  const fanIn = new Map();
  for (const e of edges) fanIn.set(e.to, (fanIn.get(e.to) || 0) + 1);
  let topFanIn = "";
  if (fanIn.size) {
    const [tid, tn] = [...fanIn.entries()].sort((a, b) => b[1] - a[1])[0];
    const wname = byId.get(tid)?.w?.name || tid;
    topFanIn = `fan-in 최다: ${wname} (${tn})`;
  }
  // Legend entries for the shown workloads (respects the cluster filter + colour mode).
  const depLegendEntries = legendEntriesFor(items.map(i => i.w));
  wrap.appendChild(el("div", {
    style: { display: "flex", alignItems: "baseline", gap: "12px", marginBottom: "10px", flexWrap: "wrap" },
  }, [
    el("h2", { style: { fontSize: "16px", fontWeight: 600, margin: 0 } }, [
      "Dependency Graph", helpIcon("view.dependency"),
    ]),
    el("span", { style: { fontSize: "11px", color: "var(--text3)", fontStyle: "italic" } }, [
      `${items.length} workloads · ${edges.length} edges · 깊이 ${maxLayer + 1}` +
      (cycleNodes.size ? ` · ⚠ cycle ${cycleNodes.size}` : ""),
    ]),
    topFanIn ? el("span", { style: { fontSize: "11px", color: "var(--text3)" } }, [topFanIn]) : null,
    el("span", { style: { flex: 1 } }, []),
    colorByToggle(),
    ...diagramExportButtons(() => root_svg, "dependency", () => depLegendEntries),
  ]));

  // ---- Zoom / pan controls (in their own row above the SVG) ----
  const zoomPctSpan = el("span", {
    style: { fontFamily: "JetBrains Mono", fontSize: "11px", color: "var(--text2)", minWidth: "42px", textAlign: "center" },
  }, [`${zoomPct()}%`]);
  const refreshZoomPct = () => { zoomPctSpan.textContent = `${zoomPct()}%`; };

  const zoomAt = (factor, cx, cy) => {
    // Cursor-anchored zoom by changing viewBox dimensions while keeping
    // the world-space point under (cx, cy) fixed in screen space.
    const ratioX = (cx - vb.x) / vb.w;
    const ratioY = (cy - vb.y) / vb.h;
    vb.w = Math.max(20, Math.min(naturalVB.w * 20, vb.w * factor));
    vb.h = Math.max(20, Math.min(naturalVB.h * 20, vb.h * factor));
    vb.x = cx - ratioX * vb.w;
    vb.y = cy - ratioY * vb.h;
    applyVB(); refreshZoomPct();
  };
  const zoomFromCenter = (factor) => {
    zoomAt(factor, vb.x + vb.w / 2, vb.y + vb.h / 2);
  };
  const fit = () => {
    Object.assign(vb, naturalVB);
    applyVB(); refreshZoomPct();
  };

  const zoomBtn = (label, title, onClick) => el("button", {
    style: {
      padding: "3px 9px", fontSize: "12px", lineHeight: 1,
      background: "var(--surface2)", border: "1px solid var(--border)",
      color: "var(--text2)", borderRadius: "4px", cursor: "pointer",
      fontFamily: "JetBrains Mono", fontWeight: 600,
    },
    title,
    onclick: onClick,
  }, [label]);
  const zoomBar = el("div", {
    style: { display: "flex", alignItems: "center", gap: "4px", marginBottom: "8px" },
  }, [
    el("span", {
      style: { fontSize: "11px", color: "var(--text3)", marginRight: "6px", letterSpacing: "0.05em", textTransform: "uppercase", fontWeight: 600 },
    }, ["Zoom"]),
    zoomBtn("−", "축소 (Ctrl+Scroll 또는 −)",   () => zoomFromCenter(1.2)),
    zoomBtn("+", "확대 (Ctrl+Scroll 또는 +)",   () => zoomFromCenter(1 / 1.2)),
    zoomPctSpan,
    zoomBtn("⊡ Fit", "전체 보기로 초기화",      () => fit()),
    el("span", {
      style: { fontSize: "10px", color: "var(--text3)", marginLeft: "8px", fontStyle: "italic" },
    }, ["휠로 커서 위치 기준 확대 · 빈 영역 드래그로 이동"]),
  ]);
  wrap.appendChild(zoomBar);

  // Wheel: cursor-anchored zoom. SVG.createSVGPoint + getScreenCTM gives user-space coords.
  root_svg.addEventListener("wheel", e => {
    e.preventDefault();
    const pt = root_svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = root_svg.getScreenCTM();
    if (!ctm) return;
    const u = pt.matrixTransform(ctm.inverse());
    // wheel down (positive deltaY) → zoom out (bigger viewBox)
    // Sensitivity = half of the original step (was ±12%/tick → now ±6%/tick).
    const factor = e.deltaY > 0 ? 1.06 : 1 / 1.06;
    zoomAt(factor, u.x, u.y);
  }, { passive: false });

  // Drag-pan: only when the press is on the SVG background, not on a clickable node group.
  // Window listeners are attached on mousedown and removed on mouseup so they don't
  // accumulate across re-renders.
  const isOnNode = (target) => {
    let n = target;
    while (n && n !== root_svg) {
      if (n.tagName === "g" && n.getAttribute && /cursor:\s*pointer/i.test(n.getAttribute("style") || "")) return true;
      n = n.parentNode;
    }
    return false;
  };
  root_svg.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    if (isOnNode(e.target)) return;
    const ctm = root_svg.getScreenCTM();
    if (!ctm) return;
    const state = {
      startX: e.clientX, startY: e.clientY,
      vbX0: vb.x, vbY0: vb.y,
      scaleX: 1 / ctm.a, scaleY: 1 / ctm.d,
      dragged: false,
    };
    root_svg.style.cursor = "grabbing";
    const onMove = ev => {
      const dx = ev.clientX - state.startX;
      const dy = ev.clientY - state.startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) state.dragged = true;
      vb.x = state.vbX0 - dx * state.scaleX;
      vb.y = state.vbY0 - dy * state.scaleY;
      applyVB();
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      root_svg.style.cursor = "grab";
      if (state.dragged) {
        // Suppress the trailing click so a pan doesn't accidentally open the inspector.
        const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); window.removeEventListener("click", swallow, true); };
        window.addEventListener("click", swallow, true);
        setTimeout(() => window.removeEventListener("click", swallow, true), 60);
      }
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });

  wrap.appendChild(root_svg);

  // Edge legend
  wrap.appendChild(el("div", {
    style: { fontSize: "11px", color: "var(--text2)", marginTop: "10px", display: "flex", gap: "10px", flexWrap: "wrap" },
  }, [
    el("span", {}, ["←caller"]),
    el("span", { style: { color: "var(--text3)" } }, ["→callee  (left = entry, right = sink)"]),
    el("span", { style: { marginLeft: "12px", color: "#e67e22" } }, ["⤺ back edge (cycle)"]),
  ]));
  // Node colour legend (unified standard, current mode)
  wrap.appendChild(legendChipRow(depLegendEntries));

  root.appendChild(wrap);
}

//============ Bottleneck analysis (5 static rules) ============
function analyzeBottlenecks(p) {
  const items = [];
  const byId = new Map();
  for (const c of p.clusters || []) {
    for (const w of c.workloads || []) {
      items.push({ w, c });
      byId.set(w.id, { w, c });
    }
  }
  // Inbound DB pool demand: caller's (pool × replicas) summed over all callers
  const dbPoolDemand = new Map();
  for (const { w } of items) {
    const pool = w.runtime?.connection_pool_per_replica;
    if (!pool) continue;
    for (const d of (w.depends_on || [])) {
      const v = pool * (w.replicas ?? 1);
      dbPoolDemand.set(d.target_workload_id, (dbPoolDemand.get(d.target_workload_id) || 0) + v);
    }
  }
  // Severity helpers
  const sevFromUtil = (u, blockAt = 1.0, warnAt = 0.8) =>
    u > blockAt ? "block" : u > warnAt ? "warn" : "ok";
  const fmtPct = u => `${Math.round(u * 100)}%`;
  const round1 = v => Math.round(v * 10) / 10;

  return items.map(({ w, c }) => {
    const tp = w.traffic_profile || {};
    const rt = w.runtime || {};
    const replicas = w.replicas ?? 1;
    const issues = [];
    const breakdowns = [];  // per-rule diagnostic
    let computeUtil = null, computeCap = null, computeInFlight = null;
    let latencyUsed = null, latencyBudget = null;
    const poolEntries = [];

    // Rule 1 — Compute capacity (Little's Law)
    if (tp.target_rps && tp.avg_request_ms) {
      computeInFlight = (tp.target_rps / 1000) * tp.avg_request_ms;
      let perRep, perRepNote;
      const cm = rt.concurrency?.model;
      if (cm === "thread-pool") {
        perRep = rt.concurrency.max_threads || 200;
        perRepNote = rt.concurrency.max_threads ? "max_threads" : "default 200 (thread-pool)";
      } else if (cm === "event-loop") {
        perRep = rt.concurrency?.max_threads || 1000;
        perRepNote = rt.concurrency?.max_threads ? "max_threads" : "default 1000 (event-loop)";
      } else if (cm === "process") {
        perRep = rt.concurrency?.max_threads || 50;
        perRepNote = rt.concurrency?.max_threads ? "max_threads" : "default 50 (process)";
      } else {
        perRep = rt.concurrency?.max_threads || 100;
        perRepNote = rt.concurrency?.max_threads ? "max_threads" : "default 100 (model 미설정)";
      }
      computeCap = perRep * replicas;
      computeUtil = computeInFlight / computeCap;
      const sev = sevFromUtil(computeUtil, 1.0, 0.8);
      breakdowns.push({
        rule: "Compute capacity (Little's Law)",
        status: sev,
        sources: [
          { label: "target_rps",         value: tp.target_rps,           path: "traffic_profile.target_rps",   unit: "req/s" },
          { label: "avg_request_ms",     value: tp.avg_request_ms,       path: "traffic_profile.avg_request_ms", unit: "ms" },
          { label: "concurrency.model",  value: cm || "(미설정)",         path: "runtime.concurrency.model" },
          { label: "per-replica capacity", value: perRep,                path: "runtime.concurrency.max_threads", unit: "threads", note: perRepNote },
          { label: "replicas",           value: replicas,                path: "workload.replicas" },
        ],
        formulas: [
          `in_flight = (target_rps / 1000) × avg_request_ms = (${tp.target_rps}/1000) × ${tp.avg_request_ms} = ${round1(computeInFlight)}`,
          `capacity  = per_replica × replicas = ${perRep} × ${replicas} = ${computeCap}`,
          `util      = in_flight / capacity = ${round1(computeInFlight)} / ${computeCap} = ${fmtPct(computeUtil)}`,
        ],
        threshold: "BLOCK > 100% · WARN > 80%",
        verdict: `${fmtPct(computeUtil)} → ${sev.toUpperCase()}`,
      });
      if (computeUtil > 1.0) {
        issues.push({ sev: "block",
          msg: `Compute saturated: ${Math.round(computeInFlight)} in-flight / ${computeCap} cap (${fmtPct(computeUtil)})`,
          fix: `replicas 또는 max_threads 증가, avg_request_ms 단축` });
      } else if (computeUtil > 0.8) {
        issues.push({ sev: "warn",
          msg: `Near compute capacity: ${fmtPct(computeUtil)} util (${Math.round(computeInFlight)}/${computeCap})` });
      }
    } else {
      breakdowns.push({
        rule: "Compute capacity (Little's Law)",
        status: "nodata",
        sources: [
          { label: "target_rps",     value: tp.target_rps     ?? "(미설정)", path: "traffic_profile.target_rps" },
          { label: "avg_request_ms", value: tp.avg_request_ms ?? "(미설정)", path: "traffic_profile.avg_request_ms" },
        ],
        formulas: ["in_flight 계산을 위해 target_rps + avg_request_ms 가 모두 필요"],
        threshold: "—",
        verdict: "no-data — 분석 생략",
      });
    }

    // Rule 2 & 3 — Per-downstream
    for (const d of (w.depends_on || [])) {
      const target = byId.get(d.target_workload_id);
      if (!target) continue;
      const fanout = (d.fanout_pct ?? 100) / 100;
      const cpr = d.calls_per_request || 1;
      const callerRps = tp.target_rps || 0;
      const rpsToTarget = callerRps * fanout * cpr;

      // Rule 2 — Caller pool exhaustion to this target
      if (rt.connection_pool_per_replica && d.avg_call_ms && callerRps) {
        const need = (rpsToTarget / 1000) * d.avg_call_ms;
        const avail = rt.connection_pool_per_replica * replicas;
        const u = avail ? need / avail : 0;
        poolEntries.push({
          target: target.w.name, need: round1(need),
          avail, util: u, rpsToTarget: Math.round(rpsToTarget),
        });
        const sev = sevFromUtil(u, 1.0, 0.8);
        breakdowns.push({
          rule: `Caller pool → ${target.w.name}`,
          status: sev,
          sources: [
            { label: "caller target_rps",      value: callerRps,       path: "traffic_profile.target_rps", unit: "req/s" },
            { label: "depends_on.fanout_pct",  value: d.fanout_pct ?? 100, path: `depends_on[${d.target_workload_id}].fanout_pct`, unit: "%" },
            { label: "depends_on.calls_per_request", value: cpr,       path: `depends_on[${d.target_workload_id}].calls_per_request` },
            { label: "depends_on.avg_call_ms", value: d.avg_call_ms,   path: `depends_on[${d.target_workload_id}].avg_call_ms`, unit: "ms" },
            { label: "connection_pool_per_replica", value: rt.connection_pool_per_replica, path: "runtime.connection_pool_per_replica" },
            { label: "replicas",                value: replicas,        path: "workload.replicas" },
          ],
          formulas: [
            `rps_to_target = caller_rps × fanout × cpr = ${callerRps} × ${fanout} × ${cpr} = ${Math.round(rpsToTarget)}`,
            `need = (rps_to_target / 1000) × avg_call_ms = (${Math.round(rpsToTarget)}/1000) × ${d.avg_call_ms} = ${round1(need)}`,
            `avail = pool × replicas = ${rt.connection_pool_per_replica} × ${replicas} = ${avail}`,
            `util = need / avail = ${round1(need)} / ${avail} = ${fmtPct(u)}`,
          ],
          threshold: "BLOCK > 100% · WARN > 80%",
          verdict: `${fmtPct(u)} → ${sev.toUpperCase()}`,
        });
        if (u > 1.0) {
          issues.push({ sev: "block",
            msg: `Pool→${target.w.name}: ${Math.round(need)} conn 필요 / ${avail} 보유 (${fmtPct(u)})`,
            fix: `connection_pool_per_replica 또는 replicas 증가` });
        } else if (u > 0.8) {
          issues.push({ sev: "warn", msg: `Pool→${target.w.name}: ${fmtPct(u)} util` });
        }
      }

      // Rule 3 — Downstream target RPS overload
      const targetTp = target.w.traffic_profile || {};
      if (targetTp.target_rps && callerRps) {
        const overload = rpsToTarget > targetTp.target_rps;
        const u = rpsToTarget / targetTp.target_rps;
        breakdowns.push({
          rule: `Downstream RPS → ${target.w.name}`,
          status: overload ? "block" : (u > 0.8 ? "warn" : "ok"),
          sources: [
            { label: "caller target_rps",      value: callerRps,         path: "traffic_profile.target_rps", unit: "req/s" },
            { label: "fanout × cpr",           value: `${fanout} × ${cpr}`, path: `depends_on[${d.target_workload_id}]` },
            { label: `${target.w.name}.target_rps`, value: targetTp.target_rps, path: `target.traffic_profile.target_rps`, unit: "req/s" },
          ],
          formulas: [
            `rps_to_target = ${callerRps} × ${fanout} × ${cpr} = ${Math.round(rpsToTarget)}`,
            `target_capacity = ${targetTp.target_rps}`,
            `util = ${Math.round(rpsToTarget)} / ${targetTp.target_rps} = ${fmtPct(u)}`,
          ],
          threshold: "BLOCK > 100% · WARN > 80%",
          verdict: `${fmtPct(u)} → ${overload ? "BLOCK" : (u > 0.8 ? "WARN" : "OK")}`,
        });
        if (overload) {
          issues.push({ sev: "block",
            msg: `${target.w.name} RPS overload: ${Math.round(rpsToTarget)} req/s > ${targetTp.target_rps}`,
            fix: `${target.w.name} replicas 증가 또는 fanout/calls_per_request 줄이기` });
        }
      }
    }

    // Rule 4 — DB max_connections oversubscription (this workload as TARGET)
    if (rt.max_connections) {
      const inbound = dbPoolDemand.get(w.id) || 0;
      const u = rt.max_connections ? inbound / rt.max_connections : 0;
      const sev = inbound > rt.max_connections ? "warn" : (u > 0.8 ? "warn" : "ok");
      breakdowns.push({
        rule: `Inbound conn budget (as DB target)`,
        status: sev,
        sources: [
          { label: "max_connections",   value: rt.max_connections, path: "runtime.max_connections" },
          { label: "Σ caller pool",     value: inbound,            path: "Σ caller.pool × replicas" },
        ],
        formulas: [
          `inbound = Σ over callers (pool × replicas) = ${inbound}`,
          `util = inbound / max_connections = ${inbound} / ${rt.max_connections} = ${fmtPct(u)}`,
        ],
        threshold: "WARN > 100% (oversubscription)",
        verdict: `${fmtPct(u)} → ${sev.toUpperCase()}`,
      });
      if (inbound > rt.max_connections) {
        issues.push({ sev: "warn",
          msg: `Connection oversubscription: callers may open ${inbound} > max ${rt.max_connections}`,
          fix: `${w.name} max_connections 증가 또는 caller pool 축소` });
      }
    }

    // Rule 5 — Latency budget (own + Σ downstream call_ms × calls_per_request)
    if (tp.avg_request_ms || (w.depends_on && w.depends_on.length)) {
      const own = tp.avg_request_ms || 0;
      let down = 0;
      const downTerms = [];
      for (const d of (w.depends_on || [])) {
        const cpr = d.calls_per_request || 1;
        const ms = d.avg_call_ms || 0;
        down += ms * cpr;
        if (ms) downTerms.push(`${ms}×${cpr}`);
      }
      latencyUsed = own + down;
      latencyBudget = tp.client_timeout_ms || 3000;
      const r = latencyUsed / latencyBudget;
      const sev = r > 1.0 ? "block" : (r > 0.7 ? "warn" : "ok");
      breakdowns.push({
        rule: "Latency budget",
        status: sev,
        sources: [
          { label: "avg_request_ms (own)",  value: own,                  path: "traffic_profile.avg_request_ms", unit: "ms" },
          { label: "Σ downstream call_ms",  value: down,                 path: "Σ depends_on[i].avg_call_ms × calls_per_request", unit: "ms" },
          { label: "client_timeout_ms",     value: latencyBudget,        path: "traffic_profile.client_timeout_ms", unit: "ms",
            note: tp.client_timeout_ms ? null : "default 3000ms (미설정)" },
        ],
        formulas: [
          `used = own + Σ(call_ms × cpr) = ${own} + (${downTerms.join(" + ") || 0}) = ${latencyUsed}ms`,
          `util = used / budget = ${latencyUsed} / ${latencyBudget} = ${fmtPct(r)}`,
        ],
        threshold: "BLOCK > 100% · WARN > 70%",
        verdict: `${fmtPct(r)} → ${sev.toUpperCase()}`,
      });
      if (r > 1.0 && latencyUsed > 0) {
        issues.push({ sev: "block",
          msg: `Latency budget exceeded: ${latencyUsed}ms / ${latencyBudget}ms`,
          fix: `downstream 호출 수/시간 줄이거나 client_timeout 늘리기` });
      } else if (r > 0.7 && latencyUsed > 0) {
        issues.push({ sev: "warn",
          msg: `Tight latency: ${latencyUsed}ms / ${latencyBudget}ms (${fmtPct(r)})` });
      }
    }

    const severity = issues.some(i => i.sev === "block") ? "block"
                   : issues.some(i => i.sev === "warn") ? "warn"
                   : (computeUtil != null || latencyUsed != null || poolEntries.length) ? "ok"
                   : "nodata";
    return {
      w, c, issues, severity, breakdowns,
      computeUtil, computeCap, computeInFlight,
      latencyUsed, latencyBudget,
      poolEntries,
    };
  });
}

//============ Render: Bottleneck ============
function renderBottleneck() {
  const root = $("#viewBody");
  root.innerHTML = "";
  const p = state.project;
  if (!p) return;
  const results = analyzeBottlenecks(p);
  if (!results.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⊟"]),
      el("h2", {}, ["Bottleneck"]),
      el("p", {}, ["워크로드가 있어야 분석합니다."]),
    ]));
    return;
  }

  const counts = { block: 0, warn: 0, ok: 0, nodata: 0 };
  for (const r of results) counts[r.severity]++;

  // Sort: block first, then warn, then ok, then nodata; within group by name
  const order = { block: 0, warn: 1, ok: 2, nodata: 3 };
  const sorted = [...results].sort((a, b) =>
    (order[a.severity] - order[b.severity]) || a.w.name.localeCompare(b.w.name));

  const wrap = el("div", {});

  // Header
  wrap.appendChild(el("div", {
    style: { display: "flex", alignItems: "baseline", gap: "12px", marginBottom: "10px", flexWrap: "wrap" },
  }, [
    el("h2", { style: { fontSize: "16px", fontWeight: 600, margin: 0 } }, [
      "Bottleneck Analysis", helpIcon("view.bottleneck"),
    ]),
    el("span", { style: { fontSize: "11px", color: "var(--text3)", fontStyle: "italic" } }, [
      "정적 룰: Little's Law + pool + downstream RPS + latency",
    ]),
  ]));

  // Severity counters
  const counterRow = el("div", {
    style: { display: "flex", gap: "8px", marginBottom: "14px", flexWrap: "wrap" },
  });
  const badge = (label, n, bg, fg = "#fff") => el("span", {
    style: {
      background: bg, color: fg, padding: "4px 12px", borderRadius: "4px",
      fontSize: "12px", fontWeight: "600", fontFamily: "JetBrains Mono",
    },
  }, [`${label} ${n}`]);
  counterRow.appendChild(badge("BLOCK", counts.block, "#922b21"));
  counterRow.appendChild(badge("WARN",  counts.warn,  "#b9770e"));
  counterRow.appendChild(badge("OK",    counts.ok,    "#1e8449"));
  counterRow.appendChild(badge("no-data", counts.nodata, "#5d6d7e"));
  wrap.appendChild(counterRow);

  // Hint when nothing analyzable
  if (counts.ok + counts.block + counts.warn === 0) {
    wrap.appendChild(el("div", {
      style: {
        background: "var(--surface2)", border: "1px dashed var(--border)",
        borderRadius: "8px", padding: "16px", color: "var(--text2)", fontSize: "12px",
        marginBottom: "14px", lineHeight: "1.6",
      },
    }, [
      el("strong", {}, ["분석 가능한 데이터가 없습니다."]), el("br"),
      "워크로드 inspector에서 ", el("code", {}, ["traffic_profile"]),
      " (target_rps + avg_request_ms) 와 ", el("code", {}, ["runtime.concurrency"]),
      " (model + max_threads), ", el("code", {}, ["depends_on"]),
      " (avg_call_ms + fanout) 를 채워야 룰이 작동합니다.",
    ]));
  }

  // Cards grid
  const grid = el("div", {
    style: {
      display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(360px, 1fr))",
      gap: "10px",
    },
  });
  const sevColor = {
    block: { left: "#c0392b", chip: "#922b21" },
    warn:  { left: "#d68910", chip: "#b9770e" },
    ok:    { left: "#27ae60", chip: "#1e8449" },
    nodata:{ left: "#5d6d7e", chip: "#5d6d7e" },
  };
  for (const r of sorted) {
    const c = sevColor[r.severity];
    const card = el("div", {
      style: {
        background: "var(--surface2)", border: "1px solid var(--border)",
        borderLeft: `4px solid ${c.left}`, borderRadius: "6px", padding: "12px",
        cursor: "pointer", display: "flex", flexDirection: "column", gap: "6px",
      },
      onclick: () => selectEntity("workload", r.w.id),
    });
    // Header line
    const hdr = el("div", {
      style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: "8px" },
    });
    hdr.appendChild(el("div", { style: { display: "flex", alignItems: "center", gap: "8px", minWidth: 0 } }, [
      el("strong", { style: { fontSize: "13px" } }, [r.w.name]),
      el("span", { style: { fontSize: "11px", color: "var(--text3)" } }, [
        `×${r.w.replicas ?? 1}`,
        r.w.namespace ? ` · ns:${r.w.namespace}` : "",
        r.w.category ? ` · ${r.w.category}` : "",
      ]),
    ]));
    hdr.appendChild(el("span", {
      style: {
        background: c.chip, color: "#fff", padding: "2px 8px", borderRadius: "3px",
        fontSize: "10px", fontWeight: "700", fontFamily: "JetBrains Mono",
      },
    }, [r.severity.toUpperCase()]));
    card.appendChild(hdr);

    // Metric rows
    const metricLine = (label, value, util) => {
      const utilText = util != null ? ` · ${Math.round(util * 100)}%` : "";
      const color = util == null ? "var(--text2)"
                  : util > 1.0 ? "#e74c3c"
                  : util > 0.8 ? "#f39c12"
                  : util > 0.7 ? "#f1c40f"
                  : "var(--text2)";
      return el("div", {
        style: { display: "flex", gap: "8px", fontSize: "11px", fontFamily: "JetBrains Mono" },
      }, [
        el("span", { style: { color: "var(--text3)", minWidth: "70px" } }, [label]),
        el("span", { style: { color, flex: 1 } }, [`${value}${utilText}`]),
      ]);
    };
    if (r.computeCap != null) {
      card.appendChild(metricLine("Compute",
        `${Math.round(r.computeInFlight)} in-flight / ${r.computeCap} cap`,
        r.computeUtil));
    }
    for (const pe of r.poolEntries) {
      card.appendChild(metricLine(`Pool→${pe.target}`,
        `${pe.need} need / ${pe.avail} pool · ${pe.rpsToTarget} rps`,
        pe.util));
    }
    if (r.latencyUsed != null) {
      card.appendChild(metricLine("Latency",
        `${r.latencyUsed}ms / ${r.latencyBudget}ms`,
        r.latencyUsed / r.latencyBudget));
    }
    if (r.severity === "nodata") {
      card.appendChild(el("div", {
        style: { fontSize: "11px", color: "var(--text3)", fontStyle: "italic" },
      }, ["traffic_profile 또는 depends_on 미설정 — 분석 불가"]));
    }

    // Issues list
    if (r.issues.length) {
      const ul = el("div", {
        style: { borderTop: "1px solid var(--border)", marginTop: "4px", paddingTop: "6px",
                 display: "flex", flexDirection: "column", gap: "4px" },
      });
      for (const iss of r.issues) {
        const dotColor = iss.sev === "block" ? "#e74c3c" : "#f39c12";
        ul.appendChild(el("div", {
          style: { fontSize: "11px", lineHeight: "1.5" },
        }, [
          el("span", {
            style: {
              color: dotColor, fontFamily: "JetBrains Mono", fontWeight: "700",
              marginRight: "5px",
            },
          }, [iss.sev === "block" ? "⛔" : "⚠"]),
          el("span", { style: { color: "var(--text)" } }, [iss.msg]),
          iss.fix ? el("div", {
            style: { color: "var(--text3)", fontSize: "10px", marginLeft: "18px",
                     fontStyle: "italic" },
          }, [`→ ${iss.fix}`]) : null,
        ]));
      }
      card.appendChild(ul);
    }

    // Per-rule breakdowns (expandable). Stops click bubbling so toggle
    // doesn't navigate to workload.
    if (r.breakdowns?.length) {
      const det = document.createElement("details");
      Object.assign(det.style, {
        borderTop: "1px solid var(--border)", marginTop: "4px", paddingTop: "6px",
      });
      det.addEventListener("click", e => e.stopPropagation());
      const sum = document.createElement("summary");
      Object.assign(sum.style, {
        fontSize: "11px", color: "var(--text2)", cursor: "pointer",
        userSelect: "none", padding: "2px 0",
      });
      sum.textContent = `근거 보기 (${r.breakdowns.length} rules)`;
      det.appendChild(sum);

      const sevDot = { block: "#e74c3c", warn: "#f39c12", ok: "#27ae60", nodata: "#5d6d7e" };
      for (const b of r.breakdowns) {
        const block = el("div", {
          style: {
            marginTop: "8px", padding: "8px", borderRadius: "4px",
            background: "var(--surface)", border: "1px solid var(--border)",
            fontSize: "10.5px", lineHeight: "1.55", fontFamily: "JetBrains Mono",
          },
        });
        // Rule header
        block.appendChild(el("div", {
          style: { display: "flex", alignItems: "center", gap: "6px", marginBottom: "4px" },
        }, [
          el("span", {
            style: { width: "8px", height: "8px", borderRadius: "50%",
                     background: sevDot[b.status] || "#5d6d7e", display: "inline-block" },
          }),
          el("strong", { style: { color: "var(--text)", fontFamily: "Pretendard, sans-serif" } }, [b.rule]),
          el("span", { style: { color: "var(--text3)", marginLeft: "auto", fontSize: "10px" } }, [b.verdict]),
        ]));
        // Sources
        if (b.sources?.length) {
          const srcWrap = el("div", { style: { color: "var(--text2)", marginBottom: "4px" } });
          srcWrap.appendChild(el("div", { style: { color: "var(--text3)", fontSize: "9.5px",
                                                    textTransform: "uppercase", letterSpacing: "0.5px",
                                                    marginBottom: "2px" } }, ["Sources"]));
          for (const s of b.sources) {
            srcWrap.appendChild(el("div", {}, [
              el("span", { style: { color: "var(--text3)" } }, [`${s.path} `]),
              el("span", { style: { color: "var(--text)" } }, [
                `= ${s.value}${s.unit ? " " + s.unit : ""}`,
              ]),
              s.note ? el("span", { style: { color: "var(--text3)", fontStyle: "italic" } },
                [` (${s.note})`]) : null,
            ]));
          }
          block.appendChild(srcWrap);
        }
        // Formulas
        if (b.formulas?.length) {
          const fWrap = el("div", { style: { color: "var(--text2)", marginBottom: "4px" } });
          fWrap.appendChild(el("div", { style: { color: "var(--text3)", fontSize: "9.5px",
                                                  textTransform: "uppercase", letterSpacing: "0.5px",
                                                  marginBottom: "2px" } }, ["Formula"]));
          for (const f of b.formulas) {
            fWrap.appendChild(el("div", { style: { color: "var(--text)" } }, [f]));
          }
          block.appendChild(fWrap);
        }
        // Threshold
        if (b.threshold) {
          block.appendChild(el("div", { style: { color: "var(--text3)" } }, [
            el("span", { style: { color: "var(--text3)", fontSize: "9.5px", textTransform: "uppercase", letterSpacing: "0.5px", marginRight: "4px" } }, ["Threshold"]),
            b.threshold,
          ]));
        }
        det.appendChild(block);
      }
      card.appendChild(det);
    }

    grid.appendChild(card);
  }
  wrap.appendChild(grid);

  root.appendChild(wrap);
}

// K8s canonical access mode names (schema uses RWO/RWX/ROX shorthand)
const _accessModeMap = { RWO: "ReadWriteOnce", ROX: "ReadOnlyMany", RWX: "ReadWriteMany" };
const _accessMode = (am) => _accessModeMap[am] || am || "ReadWriteOnce";

//============ Self-contained ZIP (STORE method, no compression) ============
// Format ref: PKWARE APPNOTE.TXT. Single-disk archive, no encryption.
function _zipStore(files) {
  const enc = new TextEncoder();
  const crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n >>> 0;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  const crc32 = (arr) => {
    let c = 0xffffffff;
    for (let i = 0; i < arr.length; i++) c = crcTable[(c ^ arr[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  };

  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = enc.encode(f.path);
    const dataBytes = typeof f.content === "string" ? enc.encode(f.content) : new Uint8Array(f.content);
    const crc = crc32(dataBytes);
    const size = dataBytes.length;

    const local = new Uint8Array(30 + nameBytes.length);
    const ldv = new DataView(local.buffer);
    ldv.setUint32(0, 0x04034b50, true);
    ldv.setUint16(4, 20, true);
    ldv.setUint16(6, 0, true);
    ldv.setUint16(8, 0, true);        // compression = store
    ldv.setUint16(10, 0, true);
    ldv.setUint16(12, 0x21, true);    // dummy date (1980-01-01)
    ldv.setUint32(14, crc, true);
    ldv.setUint32(18, size, true);
    ldv.setUint32(22, size, true);
    ldv.setUint16(26, nameBytes.length, true);
    ldv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    localParts.push(local);
    localParts.push(dataBytes);

    const central = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(central.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x21, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);

  const cdSize = centralParts.reduce((s, e) => s + e.length, 0);
  const cdOffset = offset;
  const eocd = new Uint8Array(22);
  const edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, cdSize, true);
  edv.setUint32(16, cdOffset, true);
  edv.setUint16(20, 0, true);

  const total = offset + cdSize + eocd.length;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const part of localParts) { out.set(part, pos); pos += part.length; }
  for (const part of centralParts) { out.set(part, pos); pos += part.length; }
  out.set(eocd, pos);
  return new Blob([out], { type: "application/zip" });
}

// Build an SVG <g> legend (colour swatches + labels, wrapping within [leftX, rightX]). Returns

  g.appendChild(mk("line", { x1: leftX, y1: topY, x2: rightX, y2: topY, stroke: mutedColor, "stroke-width": 1, "stroke-opacity": 0.4 }));

}

    const cv = document.createElement("canvas");

const _yStr = v => {
  if (typeof v !== "string") return String(v);
  if (v === "") return '""';
  if (/[:#\n{}\[\],&*?!|>'"%@`]/.test(v) || /^\s|\s$/.test(v)
      || /^(true|false|null|yes|no|on|off|~)$/i.test(v)
      || /^-?\d/.test(v)) return JSON.stringify(v);
  return v;
};
function _yObj(obj, indent = 0) {
  const pad = "  ".repeat(indent);
  const keys = Object.keys(obj || {});
  if (!keys.length) return `${pad}{}`;
  return keys.map(k => {
    const v = obj[k];
    if (v == null) return `${pad}${k}: null`;
    if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
      return `${pad}${k}: ${_yStr(v)}`;
    }
    if (Array.isArray(v)) {
      if (!v.length) return `${pad}${k}: []`;
      return `${pad}${k}:\n${_yArr(v, indent + 1)}`;
    }
    return `${pad}${k}:\n${_yObj(v, indent + 1)}`;
  }).join("\n");
}
function _yArr(arr, indent = 0) {
  const pad = "  ".repeat(indent);
  return arr.map(item => {
    if (item != null && typeof item === "object" && !Array.isArray(item)) {
      const lines = _yObj(item, indent + 1).split("\n");
      const firstPad = "  ".repeat(indent + 1);
      lines[0] = lines[0].replace(firstPad, `${pad}- `);
      return lines.join("\n");
    }
    return `${pad}- ${_yStr(item)}`;
  }).join("\n");
}

      }];
      const spec = {
        ingressClassName: r.ingress_class || "nginx",
        rules,
      };
      if (r.tls) {
        spec.tls = [{
          hosts: [r.host],
          secretName: r.tls_secret || `${slug(r.name || r.host)}-tls`,
        }];
      }
      docs.push(`apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${_yStr(slug(r.name || r.host))}
  namespace: ${_yStr(r.namespace || "default")}
  annotations:
    kubernetes.io/ingress.class: ${_yStr(r.ingress_class || "nginx")}
spec:
${_yObj(spec, 1)}`);
    }
  }

  return docs.join("\n---\n");
}

//============ Export: Helm values.yaml ============
function generateHelmValues(p) {
  const out = { workloads: {} };
  for (const c of (p.clusters || [])) {
    for (const w of (c.workloads || [])) {
      const name = slug(w.name);
      const v = {
        enabled: true,
        namespace: w.namespace || "default",
        kind: w.kind || "Deployment",
        replicaCount: w.replicas ?? 1,
        image: {
          repository: w.helm?.image_repo || `registry.example.com/${name}`,
          tag: w.helm?.image_tag || "latest",
          pullPolicy: "IfNotPresent",
        },
        resources: {
          requests: {
            cpu: String(w.resources?.requests?.cpu ?? 0.1),
            memory: `${w.resources?.requests?.memory_gb ?? 0.25}Gi`,
          },
          limits: {
            cpu: String(w.resources?.limits?.cpu ?? (w.resources?.requests?.cpu ?? 0.1) * 2),
            memory: `${w.resources?.limits?.memory_gb ?? (w.resources?.requests?.memory_gb ?? 0.25) * 2}Gi`,
          },
        },
      };
      if ((w.resources?.requests?.gpu?.count || 0) > 0) {
        v.resources.limits["nvidia.com/gpu"] = String(w.resources.requests.gpu.count);
      }
      const svc = w.network?.service;
      if (svc && svc.type !== "None") {
        v.service = {
          type: svc.type || "ClusterIP",
          ports: (svc.ports || []).map(pp => ({
            name: pp.name || `port-${pp.port}`,
            port: pp.port,
            targetPort: pp.target_port || pp.port,
            protocol: pp.protocol || "TCP",
          })),
        };
      }
      if (w.persistent_volumes?.length) {
        v.persistence = {
          enabled: true,
          volumes: w.persistent_volumes.map((pv, i) => {
            const pvName = pv.name || `data-${i}`;
            return {
              name: pvName,
              size: `${pv.size_gb}Gi`,
              accessMode: _accessMode(pv.access_mode),
              storageClass: pv.storage_class || "",
              mountPath: pv.mount_path || `/data/${pvName}`,
            };
          }),
        };
      }
      if (w.scheduling?.anti_affinity === "spread-by-zone") {
        v.topologySpread = {
          enabled: true, topologyKey: "topology.kubernetes.io/zone",
          maxSkew: 1, whenUnsatisfiable: "DoNotSchedule",
        };
      }
      if (w.scheduling?.node_selector && Object.keys(w.scheduling.node_selector).length) {
        v.nodeSelector = { ...w.scheduling.node_selector };
      }
      if (w.scheduling?.tolerations?.length) {
        v.tolerations = w.scheduling.tolerations.map(t => ({ ...t }));
      }
      if (w.scheduling?.anti_affinity === "spread-by-node") {
        v.podAntiAffinity = { enabled: true, topologyKey: "kubernetes.io/hostname" };
      }
      // HA topology — surfaced as a structured `ha` block so reviewers (and downstream chart
      // templates) can see the intended operator/mode without parsing the comments.
      if (w.ha && w.ha.mode && w.ha.mode !== "none") {
        v.ha = {
          mode: w.ha.mode,
          primaries: w.ha.primaries ?? 1,
          replicasPerPrimary: w.ha.replicas_per_primary ?? 0,
          quorumCount: w.ha.quorum_count ?? 0,
          ...(w.ha.operator ? { operator: w.ha.operator } : {}),
        };
      }
      out.workloads[name] = v;
    }
  }
  return `# Helm values for vk8s project: ${p.name}
# Generated ${new Date().toISOString()}
# Use with an umbrella chart that templates each entry under .Values.workloads.*

${_yObj(out)}`;
}

  // Per-cluster, per-workload templates
  for (const c of (p.clusters || [])) {
    for (const w of (c.workloads || [])) {
      files.push({
        path: `${chartName}/templates/${slug(w.name)}-deployment.yaml`,
        content: _helmDeploymentTpl(w, chartName),
      });
      if (w.network?.service && w.network.service.type !== "None") {
        files.push({
          path: `${chartName}/templates/${slug(w.name)}-service.yaml`,
          content: _helmServiceTpl(w),
        });
      }
      // For non-StatefulSet kinds, emit standalone PVCs (StatefulSet uses volumeClaimTemplates).
      if (w.persistent_volumes?.length && (w.kind || "Deployment") !== "StatefulSet") {
