function renderGpuRowEditable(n, idx, supportedModels, gpuModels) {
  const g = n.spec.gpu[idx];
  const ginfo = gpuModels[g.model] || {};
  const chassis = n.spec.gpu_chassis || {};
  // Max for THIS row = total max - other rows total
  const otherCount = (n.spec.gpu || []).reduce((a, gg, i) => a + (i === idx ? 0 : (gg.count || 0)), 0);
  const myMax = Math.max(1, (chassis.max_count || 0) - otherCount);
  const showNvlink = chassis.nvlink_topology !== "none" && (ginfo.nvlink_capable !== false);

  const modelSel = el("select", {
    style: { padding: "5px 8px", background: "var(--surface3)", border: "1px solid var(--border)", color: "var(--text)", borderRadius: "4px", fontSize: "12px" },
    onchange: e => updateNodeGpu(n.id, idx, { model: e.target.value }),
  }, supportedModels.length
    ? supportedModels.map(m => el("option", { value: m, selected: m === g.model ? "" : null }, [m]))
    : [el("option", { value: g.model, selected: "" }, [g.model])]
  );

  const countInput = el("input", {
    type: "number", min: "1", max: String(myMax), value: g.count,
    style: { padding: "5px 6px", background: "var(--surface3)", border: "1px solid var(--border)", color: "var(--text)", borderRadius: "4px", fontSize: "12px", width: "60px", textAlign: "center" },
    oninput: e => {
      let v = parseInt(e.target.value) || 1;
      if (v < 1) v = 1;
      if (v > myMax) { v = myMax; e.target.value = String(myMax); }
      updateNodeGpu(n.id, idx, { count: v });
    },
  });

  const nvlinkToggle = showNvlink
    ? el("label", {
        style: { display: "flex", alignItems: "center", gap: "4px", margin: 0, fontSize: "11px", textTransform: "none", letterSpacing: 0, color: g.nvlink_enabled ? "var(--purple)" : "var(--text3)", padding: "0 6px" },
      }, [
        el("input", {
          type: "checkbox",
          checked: g.nvlink_enabled ? "" : null,
          onchange: e => updateNodeGpu(n.id, idx, { nvlink_enabled: e.target.checked }),
        }),
        "NVLink",
      ])
    : el("span", { style: { fontSize: "10px", color: "var(--text3)", padding: "0 6px" } }, [""]);

  const headRow = el("div", {
    style: { display: "grid", gridTemplateColumns: "1fr 70px auto auto", gap: "6px", alignItems: "center" },
  }, [
    modelSel,
    countInput,
    nvlinkToggle,
    el("button", {
      class: "x", title: "remove",
      style: { background: "transparent", border: "none", color: "var(--text3)", cursor: "pointer", padding: "4px 8px" },
      onclick: () => removeNodeGpu(n.id, idx),
    }, ["✕"]),
  ]);

  const tdp = ginfo.tdp_w || 0;
  const totalKw = tdp * g.count / 1000;
  const tdpLine = el("div", {
    style: { fontSize: "10px", color: "var(--text3)", marginTop: "4px", fontFamily: "JetBrains Mono" },
  }, [
    `${ginfo.form_factor || g.form_factor || "?"}`,
    tdp ? `  ·  ${g.count}×${tdp}W = ${totalKw.toFixed(1)}kW` : "",
    ginfo.vram_gb ? `  ·  ${g.count * ginfo.vram_gb}GB VRAM total` : "",
  ]);

  return el("div", {
    style: { background: "var(--surface2)", border: "1px solid var(--border)", borderRadius: "5px", padding: "8px 10px", marginBottom: "6px" },
  }, [headRow, tdpLine]);
}

function moveNodeToSite(nodeId, newSiteId) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || n.site_id === newSiteId) return;
  // remove from old
  state.project.sites.forEach(s => s.node_ids = s.node_ids.filter(id => id !== nodeId));
  n.site_id = newSiteId;
  const news = state.project.sites.find(s => s.id === newSiteId);
  if (news) news.node_ids.push(nodeId);
  emit(); saveSoon();
}

//============ Scheduling simulation (first-fit) ============
function simulateScheduling(project) {
  const gpuModels = state.catalog.gpuModels;
  // Per-node remaining capacity (worker nodes only)
  const remaining = new Map();
  for (const n of project.nodes || []) {
    if (!(n.cluster_roles || []).includes("worker")) continue;
    const gpus = n.spec?.gpu || [];
    const totalGpu = gpus.reduce((a, g) => a + (g.count || 0), 0);
    const totalVram = gpus.reduce((a, g) => a + (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0), 0);
    const byModel = new Map();
    for (const g of gpus) byModel.set(g.model, (byModel.get(g.model) || 0) + (g.count || 0));
    remaining.set(n.id, {
      cpu: n.spec?.vcpu || 0,
      mem: n.spec?.memory_gb || 0,
      gpu: totalGpu,
      vram: totalVram,
      gpuByModel: byModel,
    });
  }

  const placements = new Map();   // nodeId → array of { workloadId, workloadName, replicaIdx, cpuReq, memReq, gpuReq, gpuModel }
  const unscheduled = [];

  for (const c of project.clusters || []) {
    const workers = (c.node_ids || [])
      .map(id => project.nodes.find(n => n.id === id))
      .filter(n => n && (n.cluster_roles || []).includes("worker"));
    for (const w of c.workloads || []) {
      const reqs = w.resources?.requests || {};
      const cpuReq = reqs.cpu || 0;
      const memReq = reqs.memory_gb || 0;
      const gpuReq = reqs.gpu?.count || 0;
      const gpuModel = reqs.gpu?.model;
      const vramReq = (reqs.gpu?.vram_gb || 0) * gpuReq;
      for (let i = 0; i < (w.replicas || 1); i++) {
        let placedNode = null;
        for (const n of workers) {
          const r = remaining.get(n.id);
          if (!r) continue;
          if (r.cpu < cpuReq || r.mem < memReq || r.gpu < gpuReq || r.vram < vramReq) continue;
          if (gpuModel && (r.gpuByModel.get(gpuModel) || 0) < gpuReq) continue;
          // Place
          r.cpu -= cpuReq; r.mem -= memReq; r.gpu -= gpuReq; r.vram -= vramReq;
          if (gpuModel && gpuReq > 0) r.gpuByModel.set(gpuModel, r.gpuByModel.get(gpuModel) - gpuReq);
          placedNode = n.id;
          break;
        }
        if (placedNode) {
          if (!placements.has(placedNode)) placements.set(placedNode, []);
          placements.get(placedNode).push({
            workloadId: w.id, workloadName: w.name, replicaIdx: i,
            cpuReq, memReq, gpuReq, gpuModel,
          });
        } else {
          unscheduled.push({
            workloadId: w.id, workloadName: w.name, replicaIdx: i,
            clusterId: c.id, clusterName: c.name,
            reqs: { cpu: cpuReq, mem: memReq, gpu: gpuReq, gpuModel },
          });
        }
      }
    }
  }
  return { placements, unscheduled };
}

//============ Render: Capacity view ============
function renderCapacity() {
  const root = $("#viewBody");
  root.innerHTML = "";
  const p = state.project;
  if (!p) return;
  const clusters = p.clusters || [];
  if (!clusters.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["⌘"]),
      el("h2", {}, ["Capacity 뷰"]),
      el("p", {}, ["클러스터에 노드와 워크로드가 있어야 의미 있는 결과가 나옵니다."]),
    ]));
    return;
  }
  const gpuModels = state.catalog.gpuModels;
  const sim = simulateScheduling(p);
  const totalPods = clusters.reduce((a, c) => a + (c.workloads || []).reduce((aa, w) => aa + (w.replicas || 1), 0), 0);
  const placedPods = totalPods - sim.unscheduled.length;

  // Top summary
  const summary = el("div", { class: "next-hint" }, [
    el("span", { class: "icon" }, ["⎈"]),
    el("div", { class: "body" }, [
      el("div", { class: "head" }, [
        "Scheduling simulation (first-fit) ", helpIcon("view.capacity"),
      ]),
      el("div", { class: "lead" }, [
        `${placedPods}/${totalPods} pods placed`,
        sim.unscheduled.length
          ? el("span", { style: { color: "var(--red)", marginLeft: "10px" } }, [`⊗ ${sim.unscheduled.length} unschedulable`])
          : el("span", { style: { color: "var(--green)", marginLeft: "10px" } }, ["✓ all placed"]),
      ]),
    ]),
  ]);
  root.appendChild(summary);

  for (const c of clusters) {
    root.appendChild(renderCapacityCluster(c, sim, p, gpuModels));
  }
  if (sim.unscheduled.length) {
    root.appendChild(renderUnscheduled(sim.unscheduled));
  }
}

function renderCapacityCluster(c, sim, project, gpuModels) {
  const card = el("div", { class: "topo-site" });
  const allNodes = (c.node_ids || []).map(id => project.nodes.find(n => n.id === id)).filter(Boolean);
  const workers = allNodes.filter(n => (n.cluster_roles || []).includes("worker"));
  const cpOnly = allNodes.filter(n => (n.cluster_roles || []).length > 0 && !(n.cluster_roles || []).includes("worker"));

  card.appendChild(el("div", { class: "topo-site-header" }, [
    el("span", { class: "name" }, [c.name]),
    el("span", {
      class: "kind",
      style: { background: "rgba(167,139,250,.15)", color: "var(--purple)" },
    }, ["cluster"]),
    el("span", { class: "region" }, [
      `${workers.length} worker · ${cpOnly.length} cp-only · ${(c.workloads || []).length} workloads`,
    ]),
  ]));

  if (!workers.length) {
    card.appendChild(el("div", { class: "topo-empty-site" }, ["worker 노드 없음 — 워크로드 스케줄 불가"]));
    return card;
  }

  const list = el("div", { style: { display: "flex", flexDirection: "column", gap: "12px" } });
  for (const n of workers) list.appendChild(renderCapacityNode(n, sim, gpuModels));
  card.appendChild(list);
  return card;
}

function renderCapacityNode(n, sim, gpuModels) {
  const placed = sim.placements.get(n.id) || [];
  const usedCpu = placed.reduce((a, p) => a + p.cpuReq, 0);
  const usedMem = placed.reduce((a, p) => a + p.memReq, 0);
  const usedGpu = placed.reduce((a, p) => a + p.gpuReq, 0);
  const usedVram = placed.reduce((a, p) =>
    a + (p.gpuModel ? (gpuModels[p.gpuModel]?.vram_gb || 0) * p.gpuReq : 0), 0);

  const totCpu = n.spec?.vcpu || 0;
  const totMem = n.spec?.memory_gb || 0;
  const gpus = n.spec?.gpu || [];
  const totGpu = gpus.reduce((a, g) => a + (g.count || 0), 0);
  const totVram = gpus.reduce((a, g) => a + (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0), 0);
  const psuMax = n.spec?.power?.psu_max_w || 0;
  const power = computeNodePowerW(n, gpuModels);
  const roleStr = (n.cluster_roles || []).map(r => r === "control-plane" ? "cp" : r).join("+") || "no-role";

  const card = el("div", {
    class: "topo-node",
    style: { cursor: "pointer" },
    onclick: () => selectEntity("node", n.id),
  });
  card.appendChild(el("div", { class: "node-name" }, [n.name]));
  card.appendChild(el("div", { class: "node-model" }, [
    `${n.brand} · ${n.model} · ${n.spec?.form_factor || ""} · ${roleStr}`,
  ]));

  const bars = el("div", {
    style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px 16px", marginTop: "10px" },
  });
  bars.appendChild(makeBarLine("CPU", `${usedCpu.toFixed(1)}/${totCpu}c`, totCpu > 0 ? usedCpu / totCpu * 100 : 0));
  bars.appendChild(makeBarLine("Memory", `${usedMem.toFixed(0)}/${totMem} GB`, totMem > 0 ? usedMem / totMem * 100 : 0));
  if (totGpu > 0) {
    bars.appendChild(makeBarLine("GPU", `${usedGpu}/${totGpu}`, totGpu > 0 ? usedGpu / totGpu * 100 : 0));
    if (totVram > 0) bars.appendChild(makeBarLine("VRAM", `${usedVram}/${totVram} GB`, usedVram / totVram * 100));
  }
  if (n.source === "onprem" && psuMax > 0) {
    bars.appendChild(makeBarLine("PSU", `${power}/${psuMax} W`, power / psuMax * 100));
  }
  card.appendChild(bars);

  if (placed.length) {
    const podBox = el("div", {
      style: { marginTop: "10px", padding: "8px 10px", background: "var(--bg)", borderRadius: "5px" },
    });
    podBox.appendChild(el("div", {
      style: { fontSize: "10px", color: "var(--text2)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "6px", fontWeight: 600 },
    }, [`${placed.length} pods placed`]));
    // Group by workload
    const byWl = new Map();
    for (const p of placed) {
      const e = byWl.get(p.workloadId) || { name: p.workloadName, count: 0, cpu: 0, mem: 0, gpu: 0 };
      e.count += 1; e.cpu += p.cpuReq; e.mem += p.memReq; e.gpu += p.gpuReq;
      byWl.set(p.workloadId, e);
    }
    for (const [wlId, info] of byWl) {
      const row = el("div", {
        style: { fontSize: "11px", padding: "3px 0", display: "flex", gap: "8px", cursor: "pointer", color: "var(--text2)" },
        onclick: e => { e.stopPropagation(); selectEntity("workload", wlId); },
      }, [

function renderNamespace() {
  const root = $("#viewBody");
  root.innerHTML = "";

  if (!p?.clusters?.length) {
    root.appendChild(el("div", { class: "view-empty" }, [
      el("div", { class: "big" }, ["▦"]),
      el("h2", {}, ["Namespace 뷰"]),

    ]));

  }
  for (const c of p.clusters) root.appendChild(renderNamespaceCluster(c));
}

function renderNamespaceCluster(c) {
  const card = el("div", { class: "topo-site" });
  card.appendChild(el("div", { class: "topo-site-header" }, [
    el("span", { class: "name" }, [c.name]),
    el("span", { class: "kind", style: { background: "rgba(167,139,250,.15)", color: "var(--purple)" } }, ["cluster"]),
    el("span", { class: "region" }, [
      `${(c.namespaces || []).length} namespaces · ${(c.network_policies || []).length} policies · ${(c.workloads || []).length} workloads`,
    ]),
  ]));

  // Group workloads by namespace
  const byNs = new Map();
  byNs.set("default", { ns: null, workloads: [] });
  for (const ns of c.namespaces || []) byNs.set(ns.name, { ns, workloads: [] });
  for (const w of c.workloads || []) {
    const k = w.namespace || "default";
    if (!byNs.has(k)) byNs.set(k, { ns: null, workloads: [] });
    byNs.get(k).workloads.push(w);
  }

  const grid = el("div", {
    style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: "12px" },
  });
  for (const [nsName, info] of byNs) {
    const isDeny = info.ns?.default_deny;
    const nsCard = el("div", {
      style: {
        background: "var(--surface2)",
        border: "1px solid " + (isDeny ? "var(--orange)" : "var(--border)"),
        borderRadius: "8px",
        padding: "12px",
        cursor: "pointer",
      },
      onclick: () => selectEntity("cluster", c.id),
    });
    nsCard.appendChild(el("div", {
      style: { display: "flex", alignItems: "center", gap: "6px", marginBottom: "8px" },
    }, [
      el("span", {}, [isDeny ? "🔒" : "▦"]),
      el("span", { style: { fontWeight: 600, fontSize: "13px" } }, [nsName]),
      isDeny ? el("span", {
        style: { fontSize: "10px", padding: "1px 5px", background: "rgba(251,146,60,.15)", color: "var(--orange)", borderRadius: "3px", fontFamily: "JetBrains Mono", textTransform: "uppercase", letterSpacing: "0.04em" },
      }, ["deny"]) : null,
      !info.ns && nsName !== "default" ? el("span", {
        style: { fontSize: "10px", color: "var(--yellow)", marginLeft: "auto" },
        title: "namespace not declared in cluster",
      }, ["⚠"]) : null,
    ]));
    if (info.workloads.length === 0) {
      nsCard.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text3)", fontStyle: "italic" } }, ["워크로드 없음"]));
    } else {
      for (const w of info.workloads) {
        nsCard.appendChild(el("div", {
          style: { fontSize: "12px", padding: "4px 8px", margin: "2px 0", background: "var(--surface)", borderRadius: "4px", cursor: "pointer", display: "flex", gap: "8px" },
          onclick: e => { e.stopPropagation(); selectEntity("workload", w.id); },
        }, [
          el("span", {}, [`◇ ${w.name}`]),
          el("span", { style: { color: "var(--text3)", marginLeft: "auto", fontSize: "10px", fontFamily: "JetBrains Mono" } }, [
            `×${w.replicas}${w.category ? ` · ${w.category}` : ""}`,
          ]),
        ]));
      }
    }
    grid.appendChild(nsCard);
  }
  card.appendChild(grid);

  // NetworkPolicies
  const nps = c.network_policies || [];
  if (nps.length) {
    const title = el("div", { class: "section-title", style: { marginTop: "16px" } }, [`Network Policies (${nps.length})`]);
    title.appendChild(helpIcon("networkpolicy.preset"));
    card.appendChild(title);
    const npList = el("div", { class: "row-list" });
    for (const np of nps) {
      let presetDesc = "custom";
      if (np.preset === "default-deny") presetDesc = "🔒 deny all";
      else if (np.preset === "allow-from-same-ns") presetDesc = `same-ns →`;
      else if (np.preset === "allow-from-namespace") presetDesc = `${(np.ingress?.[0]?.from_namespaces || ["?"]).join(",")} →`;
      else if (np.preset === "allow-from-ingress") presetDesc = `🌐 ingress →`;
      npList.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, ["🔗"]),
        el("span", { class: "name", style: { fontSize: "12px" } }, [np.name]),
        el("span", { style: { fontSize: "11px", color: "var(--text2)", fontFamily: "JetBrains Mono", marginLeft: "auto" } }, [
          `${presetDesc} ${np.namespace}`,
        ]),
      ]));
    }
    card.appendChild(npList);
  }

  // Hint to use cluster inspector to manage
  card.appendChild(el("div", {
    style: { marginTop: "12px", fontSize: "11px", color: "var(--text3)", fontStyle: "italic" },
  }, [`💡 NS·NP 추가/수정은 클러스터 인스펙터 (오른쪽 패널) 에서`]));

  return card;
}

  ]));
}

function renderFindings() {
  const findings = state.project ? runValidator(state.project) : [];
  state.ui.findings = findings;

  const counts = { error: 0, warn: 0, info: 0 };
  for (const f of findings) counts[f.sev] = (counts[f.sev] || 0) + 1;
  $("#cntErr").textContent = String(counts.error);
  $("#cntWarn").textContent = String(counts.warn);
  $("#cntInfo").textContent = String(counts.info);

  // Hide the "validator coming in Phase 2" placeholder (we're in Phase 2 now)
  const placeholder = document.querySelector(".findings-summary span[style*='Phase 2']");
  if (placeholder) placeholder.style.display = "none";

  // Render expanded list if visible
  const list = $("#findingsList");
  if (list.style.display !== "none") {
    list.innerHTML = "";
    if (!findings.length) {
      list.appendChild(el("div", { style: { padding: "12px 16px", color: "var(--text2)", fontSize: "12px", textAlign: "center" } }, ["✓ 모든 검증 통과"]));
    } else {
      // Sort: error → warn → info
      const sevOrder = { error: 0, warn: 1, info: 2 };
      const sorted = [...findings].sort((a, b) => sevOrder[a.sev] - sevOrder[b.sev]);
      for (const f of sorted) {
        const icon = f.sev === "error" ? "⊗" : f.sev === "warn" ? "▲" : "ⓘ";
        const color = f.sev === "error" ? "var(--red)" : f.sev === "warn" ? "var(--yellow)" : "var(--accent)";
        const row = el("div", {
          class: "finding-row",
          onclick: () => {
            if (f.scope) selectEntity(f.scope.kind, f.scope.id);
          },
        }, [
          el("span", { class: "id", style: { color } }, [icon]),
          el("span", { class: "id" }, [f.id]),
          el("span", { class: "msg" }, [f.msg]),
        ]);
        if (f.helpId && HELP[f.helpId]) {
          const ic = helpIcon(f.helpId);
          ic.addEventListener("click", e => e.stopPropagation());
          row.appendChild(ic);
        }
        list.appendChild(row);
      }
    }
  }
}

function renderAll() {
  renderTopbar();
  renderViewTabs();
  renderTree();
  renderInspector();
  renderViewBody();
  renderFindings();
}

//============ Add Node modal ============
function openAddNode() {
  if (!state.project) return;
  if (!state.project.sites.length) {
    alert("먼저 사이트를 추가하세요.");
    return;
  }

  const root = el("div");
  root.appendChild(el("h2", {}, ["Add Node"]));

  // Determine source filter based on mode
  const mode = state.project.mode;
  const allowedSources = mode === "hybrid" ? ["onprem", "cloud"] : [mode];
  const entries = state.catalog.entries.filter(e => allowedSources.includes(e.source));

  // Brand options
  const brands = [...new Set(entries.map(e => e.brand))].sort();
  let selectedBrand = brands[0];
  let selectedKey = entries.find(e => e.brand === selectedBrand)?.key;

  const brandSel = el("select", {
    onchange: e => { selectedBrand = e.target.value;
      const first = entries.find(x => x.brand === selectedBrand);
      selectedKey = first?.key;
      rerenderModel();
    },
  }, brands.map(b => el("option", { value: b }, [b])));

  const modelWrap = el("div");

  const previewWrap = el("div");

  const qtyInput = el("input", { type: "number", min: "1", value: "1" });

  // Site
  const siteOpts = () => state.project.sites
    .filter(s => allowedSources.includes(s.kind) && (s.kind === entryFor(selectedKey)?.source))
    .map(s => el("option", { value: s.id }, [`${s.name} (${s.kind})`]));
  const siteSel = el("select", {});

  const nameInput = el("input", { placeholder: "(자동 생성)", value: "" });

  function entryFor(key) { return entries.find(e => e.key === key); }

  function rerenderModel() {
    modelWrap.innerHTML = "";
    const filtered = entries.filter(e => e.brand === selectedBrand);
    const sel = el("select", {
      onchange: e => { selectedKey = e.target.value; rerenderPreview(); },
    }, filtered.map(e =>
      el("option", { value: e.key, selected: e.key === selectedKey ? "" : null },
        [`${e.display_name} (${e.category})`])));
    modelWrap.appendChild(el("div", { class: "field" }, [
      el("label", {}, ["Model"]), sel,
    ]));

    // Update sites filter
    siteSel.innerHTML = "";
    siteOpts().forEach(o => siteSel.appendChild(o));

    rerenderPreview();
  }

  function rerenderPreview() {
    previewWrap.innerHTML = "";
    const e = entryFor(selectedKey);
    if (!e) return;
    const spec = e.spec;
    const chassis = spec.gpu_chassis || {};
    const gpus = spec.gpu || [];
    const power = computeNodePowerW({ spec }, state.catalog.gpuModels);

    previewWrap.appendChild(el("div", { class: "section-title" }, ["Preview"]));
    previewWrap.appendChild(el("div", { class: "compat-result" }, [
      el("div", {}, [`${spec.vcpu} vCPU · ${spec.memory_gb} GB RAM${spec.form_factor ? ` · ${spec.form_factor}` : ""}`]),
      e.source === "onprem" ? el("div", {}, [`Power ~${(power/1000).toFixed(1)} kW (TDP base ${spec.power?.typical_w_base || 0}W + GPUs)`]) : null,
      chassis.max_count
        ? el("div", {}, [`GPU chassis: max ${chassis.max_count} · ${(chassis.supported_form_factors||[]).join("/")} · ${chassis.nvlink_topology}`])
        : null,
      gpus.length
        ? el("div", { class: "ok" }, [`Pre-installed GPU: ${gpus.map(g => `${g.count}× ${g.model}`).join(", ")}`])
        : null,
      e.notes ? el("div", { style: { color: "var(--text2)", marginTop: "4px" } }, [`📝 ${e.notes}`]) : null,
    ]));

    // Compat check
    const issues = checkNodeCompatibility(spec, state.catalog.gpuModels);
    if (issues.length) {
      const list = el("div", { class: "compat-result" });
      for (const i of issues) list.appendChild(el("div", { class: i.sev === "err" ? "err" : "warn" }, [`${i.sev === "err" ? "⊗" : "▲"} ${i.msg}`]));
      previewWrap.appendChild(list);
    }
  }

  root.appendChild(el("div", { class: "field" }, [lbl("Brand", "catalog.brand"), brandSel]));
  root.appendChild(modelWrap);
  root.appendChild(previewWrap);
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [el("label", {}, ["Quantity"]), qtyInput]),
    el("div", { class: "field" }, [el("label", {}, ["Site"]), siteSel]),
  ]));
  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Name (optional)"]), nameInput]));

  rerenderModel();

  const actions = el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      if (!siteSel.value) { alert("Source에 맞는 사이트가 없습니다. 먼저 사이트를 추가하세요."); return; }
      addNode({
        catalogKey: selectedKey,
        siteId: siteSel.value,
        name: nameInput.value.trim() || null,
        qty: parseInt(qtyInput.value) || 1,
      });
      closeModal();
    } }, ["Add"]),
  ]);
  root.appendChild(actions);

  openModal(root);
}

//============ Add Cluster modal ============
function openAddCluster() {
  if (!state.project) return;

  const root = el("div");
  root.appendChild(el("h2", {}, ["Add Cluster"]));

  const nameInput = el("input", { value: `cluster-${(state.project.clusters?.length || 0) + 1}` });
  const versionInput = el("input", { value: "1.30" });
  const tagInput = el("input", { value: "", placeholder: "prod" });

  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Name"]), nameInput]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("k8s version", "cluster.k8s_version"), versionInput]),
    el("div", { class: "field" }, [lbl("Environment tag", "cluster.environment_tag"), tagInput]),
  ]));

  const haInput = el("input", { type: "checkbox" });
  root.appendChild(el("label", { style: { display: "flex", alignItems: "center", gap: "8px", margin: "8px 0", fontSize: "12px", color: "var(--text)" } }, [
    haInput,
    el("span", {}, ["HA control plane (≥3 control-plane 노드 필요)"]),
    helpIcon("cluster.ha_control_plane"),
  ]));

  const cniSel = el("select", {}, ["Calico", "Cilium", "Flannel", "AWS-VPC-CNI", "None"].map(v => el("option", { value: v }, [v])));
  const ingressSel = el("select", {}, ["NGINX", "Traefik", "AWS-ALB", "None"].map(v => el("option", { value: v }, [v])));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("CNI", "cluster.cni"), cniSel]),
    el("div", { class: "field" }, [lbl("Ingress", "cluster.ingress"), ingressSel]),
  ]));

  // Node selection
  const available = state.project.nodes.filter(n => !getNodeCluster(n.id));
  const taken = state.project.nodes.filter(n => !!getNodeCluster(n.id));
  root.appendChild(el("div", { class: "field" }, [
    el("label", {}, [`Assign nodes (${available.length} available, ${taken.length} already in clusters)`]),
  ]));

  const checks = {};
  const list = el("div", { class: "checkbox-list" });
  if (state.project.nodes.length === 0) {
    list.appendChild(el("div", { class: "empty-hint" }, ["노드가 없습니다. 먼저 노드를 추가하세요."]));
  }
  for (const n of state.project.nodes) {
    const taken = getNodeCluster(n.id);
    const site = state.project.sites.find(s => s.id === n.site_id);
    const cb = el("input", {
      type: "checkbox",
      disabled: taken ? "" : null,
      checked: !taken && available.length <= 8 ? "" : null,  // pre-check small batches
    });
    checks[n.id] = cb;
    list.appendChild(el("label", { class: taken ? "taken" : "" }, [
      cb,
      el("span", {}, [n.name]),
      el("span", { class: "meta" }, [taken ? `in ${taken.name}` : `${n.brand} · ${site?.name || ""}`]),
    ]));
  }
  root.appendChild(list);

  const actions = el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      const node_ids = Object.entries(checks).filter(([_, cb]) => cb.checked).map(([id]) => id);
      addCluster({
        name: nameInput.value.trim() || "cluster",
        k8s_version: versionInput.value.trim() || "1.30",
        environment_tag: tagInput.value.trim(),
        ha_control_plane: haInput.checked,
        cni: cniSel.value,
        ingress: ingressSel.value,
        node_ids,
      });
      closeModal();
    } }, ["Create Cluster"]),
  ]);
  root.appendChild(actions);

  openModal(root);
}

  const cpuInput = el("input", { type: "number", min: "0", step: "0.1", value: "0.5" });
  const memInput = el("input", { type: "number", min: "0", step: "0.5", value: "1" });
  const gpuCountInput = el("input", { type: "number", min: "0", value: "0" });

  // Runtime preset
  const presets = state.catalog.runtime || {};
  const presetSel = el("select", {}, [
    el("option", { value: "" }, ["(none)"]),
    ...Object.keys(presets).map(k =>
      el("option", { value: k }, [`${k} — ${presets[k].framework || presets[k].language}`])),
  ]);

  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Name"]), nameInput]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("Category", "workload.category"), catSel]),
    el("div", { class: "field" }, [lbl("Replicas", "workload.replicas"), replicasInput]),
  ]));
  root.appendChild(el("div", { class: "field" }, [lbl("Namespace", "namespace.name"), nsSel]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("CPU per pod", "resources.cpu"), cpuInput]),
    el("div", { class: "field" }, [lbl("Memory (GB) per pod", "resources.memory"), memInput]),
  ]));
  root.appendChild(el("div", { class: "field" }, [
    lbl("GPU count per pod (선택)", "resources.gpu_count"), gpuCountInput,
  ]));
  root.appendChild(el("div", { class: "field" }, [
    lbl("Runtime preset (선택)", "workload.runtime_preset"), presetSel,
  ]));

  // Auto-suggest preset based on category
  catSel.addEventListener("change", () => {
    const map = {
      "API": "spring-boot-17",
      "WAS": "spring-boot-17",
      "Frontend": "node-fastify-20",
      "DB": "postgres-16",
      "Cache": "redis-7",
      "Queue": "kafka-3.7",
    };
    const suggest = map[catSel.value];
    if (suggest && presets[suggest]) presetSel.value = suggest;
  });
  catSel.dispatchEvent(new Event("change"));

  const actions = el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      addWorkload(clusterId, {
        name: nameInput.value.trim() || "service",
        category: catSel.value,
        namespace: nsSel.value || "default",
        replicas: parseInt(replicasInput.value) || 1,
        cpu: parseFloat(cpuInput.value),
        memory_gb: parseFloat(memInput.value),
        gpu_count: parseInt(gpuCountInput.value) || 0,
        runtime_preset: presetSel.value || undefined,
      });
      closeModal();
    } }, ["Add Workload"]),
  ]);
  root.appendChild(actions);

  openModal(root);
}

//============ Add Namespace modal ============
function openAddNamespace(clusterId) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  const root = el("div");
  root.appendChild(el("h2", {}, ["Add Namespace"]));
  const existing = (c.namespaces || []).length;
  const nameInput = el("input", { value: `ns-${existing + 1}`, placeholder: "frontend / backend / data" });
  const denyInput = el("input", { type: "checkbox" });
  root.appendChild(el("div", { class: "field" }, [lbl("Name", "namespace.name"), nameInput]));
  root.appendChild(el("label", {
    style: { display: "flex", alignItems: "center", gap: "8px", margin: "8px 0", fontSize: "12px", color: "var(--text)" },
  }, [
    denyInput,
    el("span", {}, ["default-deny (모든 ingress/egress 기본 차단)"]),
    helpIcon("namespace.default_deny"),
  ]));
  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      const name = nameInput.value.trim();
      if (!name) { alert("Name 필수"); return; }
      addNamespace(clusterId, { name, default_deny: denyInput.checked });
      closeModal();
    } }, ["Add"]),
  ]));
  openModal(root);
}

//============ Add Network Policy modal ============
function openAddNetworkPolicy(clusterId) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  const namespaces = c.namespaces || [];
  const root = el("div");
  root.appendChild(el("h2", {}, ["Add Network Policy"]));

  if (!namespaces.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["네임스페이스 먼저 추가하세요."]));
    root.appendChild(el("div", { class: "modal-actions" }, [
      el("button", { class: "btn-ghost", onclick: closeModal }, ["Close"]),
    ]));
    openModal(root);
    return;
  }

  const targetSel = el("select", {}, namespaces.map(n => el("option", { value: n.name }, [n.name])));
  const presetSel = el("select", {}, [
    ["default-deny", "Default Deny — 모든 ingress/egress 차단"],
    ["allow-from-same-ns", "Allow from Same NS — 같은 ns 내부만 허용"],
    ["allow-from-namespace", "Allow from Namespace — 특정 ns에서 허용"],
    ["allow-from-ingress", "Allow from Ingress — 외부 트래픽 허용"],
  ].map(([v, l]) => el("option", { value: v }, [l])));
  const fromNsSel = el("select", {}, namespaces.map(n => el("option", { value: n.name }, [n.name])));
  const fromNsWrap = el("div", { class: "field", style: { display: "none" } }, [
    lbl("From Namespace", "networkpolicy.from_namespace"), fromNsSel,
  ]);
  presetSel.addEventListener("change", () => {
    fromNsWrap.style.display = presetSel.value === "allow-from-namespace" ? "" : "none";
  });

  root.appendChild(el("div", { class: "field" }, [lbl("Apply to namespace", "networkpolicy.namespace"), targetSel]));
  root.appendChild(el("div", { class: "field" }, [lbl("Preset", "networkpolicy.preset"), presetSel]));
  root.appendChild(fromNsWrap);

  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      addNetworkPolicy(clusterId, {
        namespace: targetSel.value,
        preset: presetSel.value,
        from_namespace: fromNsSel.value,
      });
      closeModal();
    } }, ["Add"]),
  ]));
  openModal(root);
}

//============ Splash ============
function renderSplash() {
  const splash = $("#splash");
  if (!state.project) splash.classList.remove("hidden");
  else                splash.classList.add("hidden");
}

function bindSplash() {
  let chosen = null;
  for (const btn of document.querySelectorAll(".mode-option")) {
    // Add ? help icon to title
    const titleEl = btn.querySelector(".title");
    if (titleEl) {
      const help = helpIcon("mode." + btn.dataset.mode);
      help.addEventListener("click", e => e.stopPropagation()); // don't toggle selection
      titleEl.appendChild(help);
    }
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-option").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      chosen = btn.dataset.mode;
      $("#btnSplashCreate").disabled = !chosen;
    });
  }
  $("#btnSplashCreate").addEventListener("click", () => {
    if (!chosen) return;
    createProject(chosen, $("#splashName").value);
  });
  $("#btnSplashImport").addEventListener("click", () => $("#fileImport").click());
}

//============ Import / Export ============
function exportProject() {
  if (!state.project) return;
  const blob = new Blob([JSON.stringify(state.project, null, 2)], { type: "application/json" });
  const a = el("a", {
    href: URL.createObjectURL(blob),
    download: `${slug(state.project.name) || "vk8s-project"}.json`,
  });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
function importProjectFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.version || !obj.mode) throw new Error("Not a vk8s project file");
      state.project = migrateProject(obj);
      state.ui.selectedKind = state.ui.selectedId = null;
      emit(); saveSoon();
    } catch (e) {
      alert("Import 실패: " + e.message);
    }
  };
  reader.readAsText(file);
}

//============ Findings strip toggle ============
function bindFindings() {
  const btn = $("#btnFindings");
  const list = $("#findingsList");
  btn.addEventListener("click", () => {
    const open = list.style.display !== "none";
    list.style.display = open ? "none" : "block";
    btn.textContent = open ? "Findings ▾" : "Findings ▴";
    document.getElementById("app").dataset.findingsExpanded = String(!open);
    renderFindings();
  });
}

//============ Init ============
async function init() {
  // Bind chrome events
  bindSplash();
  bindFindings();
  $("#btnNewProject").addEventListener("click", () => {
    if (state.project && !confirm("현재 프로젝트를 닫고 새로 시작합니다. 계속?")) return;
    state.project = null;
    state.ui.selectedKind = state.ui.selectedId = null;
    localStorage.removeItem(STORAGE_KEY);
    emit();
  });
  $("#btnExport").addEventListener("click", exportProject);
  $("#btnImport").addEventListener("click", () => $("#fileImport").click());
  $("#btnGlossary").addEventListener("click", openGlossary);
  $("#fileImport").addEventListener("change", e => {
    const file = e.target.files[0];
    if (file) importProjectFromFile(file);
    e.target.value = "";
  });
  // Modal background click closes
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
  // Keyboard
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveSoon(); }
    if (e.key === "Delete" && state.ui.selectedId && document.activeElement.tagName !== "INPUT") {
      deleteEntity(state.ui.selectedKind, state.ui.selectedId);
    }
  });

  // Load catalog
  try {
    await loadCatalog();
  } catch (e) {
    alert("Catalog 로드 실패: " + e.message + "\n로컬 file:// 으로 열면 fetch 차단됩니다. 정적 서버로 실행하세요. (예: python3 -m http.server)");
    console.error(e);
    return;
  }

  // Restore project from localStorage
  const saved = loadProject();
  if (saved) state.project = saved;

  // Subscribe + initial render
  subscribe(renderAll);
  subscribe(renderSplash);
  emit();
}

init();
</script>
