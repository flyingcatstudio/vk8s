//============ Export: docker-compose.yml ============
// Best-effort translation of the k8s model to a single docker-compose.yml for single-host /
// local use. K8s concepts that have no compose equivalent are approximated or dropped, with an
// honest comment recorded per service (HA/operators, Service port-remap + LB, Ingress,
// NetworkPolicy, dynamic PVC, multi-cluster). Reuses the same field paths as generateK8sManifests
// so the two exports describe the same workloads.
function _composeMemMB(gb) { return Math.max(1, Math.round((gb || 0) * 1024)); }

function generateDockerCompose(p) {
  const clusters = p.clusters || [];

  // Globally-unique service name per workload id (compose service names share one namespace).
  // On collision across clusters/namespaces, qualify with the cluster slug, then a numeric suffix.
  const nameMap = new Map();
  const used = new Set();
  const allWl = [];
  for (const c of clusters) for (const w of (c.workloads || [])) allWl.push({ w, c });
  for (const { w, c } of allWl) {
    let n = slug(w.name) || `wl-${w.id}`;
    if (used.has(n)) n = `${n}-${slug(c.name) || "c"}`;
    const base = n; let i = 2;
    while (used.has(n)) n = `${base}-${i++}`;
    used.add(n); nameMap.set(w.id, n);
  }

  // Workloads reachable from outside (NodePort / LoadBalancer / behind an Ingress rule). These
  // publish a host port and so must run as a single container (one host can't bind a port twice).
  const ingressExposed = new Set();
  const ingressRoutes = [];
  for (const c of clusters) {
    for (const r of (c.ingress_rules || [])) {
      for (const path of (r.paths || [])) {
        ingressExposed.add(path.workload_id);
        const tn = nameMap.get(path.workload_id) || path.workload_id;
        ingressRoutes.push(`${r.host || "*"}${path.path || "/"} -> ${tn}:${path.port || 80}`);
      }
    }
  }

  const volumeDecls = [];
  const blocks = [];

  for (const { w, c } of allWl) {
    const name = nameMap.get(w.id);
    const kind = w.kind || "Deployment";
    const ns = w.namespace || "default";
    const svc = w.network?.service;
    const ports = (svc && svc.type !== "None") ? (svc.ports || []) : [];
    const externally = (svc && (svc.type === "NodePort" || svc.type === "LoadBalancer")) || ingressExposed.has(w.id);

    const reqCpu = w.resources?.requests?.cpu ?? 0.1;
    const reqMem = w.resources?.requests?.memory_gb ?? 0.25;
    const limCpu = w.resources?.limits?.cpu ?? reqCpu * 2;
    const limMem = w.resources?.limits?.memory_gb ?? reqMem * 2;
    const image = w.helm?.image_repo || `registry.example.com/${name}`;
    const tag = w.helm?.image_tag || "latest";
    const gpuCount = w.resources?.requests?.gpu?.count || 0;
    const origReplicas = w.replicas ?? 1;

    const s = {};
    s.image = `${image}:${tag}`;
    s.restart = (kind === "Job" || kind === "CronJob") ? "no" : "unless-stopped";

    if (w.runtime?.heap_gb) {
      s.environment = { JAVA_OPTS: `-Xmx${w.runtime.heap_gb}g -Xms${w.runtime.heap_gb}g` };
    }

    if (ports.length) {
      if (externally) {
        // Publish to the host. host:container — host side uses the k8s service port for familiarity.
        s.ports = ports.map(pt => `${pt.port}:${pt.target_port || pt.port}`);
      } else {
        // Internal only — reachable by other services as <name>:<containerPort> over the network.
        s.expose = [...new Set(ports.map(pt => String(pt.target_port || pt.port)))];
      }
    }

    // persistent_volumes -> local named volumes (no dynamic provisioning / no NFS on a single host).
    const vmounts = [];
    (w.persistent_volumes || []).forEach((pv, i) => {
      const vn = `${name}-${slug(pv.name) || `data-${i}`}`;
      const mp = pv.mount_path || `/data/${pv.name || `data-${i}`}`;
      vmounts.push(`${vn}:${mp}`);
      volumeDecls.push(vn);
    });
    if (vmounts.length) s.volumes = vmounts;

    // depends_on only orders startup; all services share one flat network so traffic also works.
    const deps = [...new Set((w.depends_on || [])
      .map(d => nameMap.get(d.target_workload_id))
      .filter(Boolean)
      .filter(n => n !== name))];
    if (deps.length) s.depends_on = deps;

    const deploy = {};
    if (kind !== "DaemonSet" && kind !== "Job" && kind !== "CronJob") {
      if (externally) {
        if (origReplicas > 1) deploy.replicas = 1;  // forced; see comment
      } else if (origReplicas > 1) {
        deploy.replicas = origReplicas;
      }
    }
    const reservations = { cpus: String(reqCpu), memory: `${_composeMemMB(reqMem)}M` };
    if (gpuCount) reservations.devices = [{ driver: "nvidia", count: gpuCount, capabilities: ["gpu"] }];
    deploy.resources = {
      limits: { cpus: String(limCpu), memory: `${_composeMemMB(limMem)}M` },
      reservations,
    };
    s.deploy = deploy;

    // ---- per-service comments: record everything the format silently drops ----
    const cm = [];
    cm.push(`# cluster: ${c.name} · namespace: ${ns} · kind: ${kind}`);
    if (externally && origReplicas > 1) {
      cm.push(`# replicas ${origReplicas} -> 1: a published host port can't be shared by multiple containers on one host; add an external LB to scale`);
    }
    // Service port-remap is lost: in-cluster callers must hit the CONTAINER port, not the k8s
    // service port. Relevant whether or not the service is published (external clients use the
    // host-mapped service port; in-cluster callers always use the container port).
    const remap = ports.filter(pt => (pt.target_port || pt.port) !== pt.port);
    if (remap.length) {
      const tps = remap.map(pt => pt.target_port || pt.port).join("/");
      const sps = remap.map(pt => pt.port).join("/");
      cm.push(`# port remap: in-cluster callers must use ${name}:${tps} (container port), not the k8s service port ${sps}${externally ? ` — published host port ${sps} maps to ${tps}` : ""}`);
    }
    if (w.ha && w.ha.mode && w.ha.mode !== "none") {
      const _pri = w.ha.primaries ?? 1, _rpp = w.ha.replicas_per_primary ?? 0;
      cm.push(`# HA intended: mode=${w.ha.mode}, ${_pri}×(1+${_rpp}) data pods${w.ha.operator ? `, operator: ${w.ha.operator}` : ""} — compose runs a single container; real HA needs the operator/orchestrator`);
    }
    if (kind === "DaemonSet") cm.push(`# DaemonSet: one pod per node in k8s; here a single instance`);
    if (kind === "Job" || kind === "CronJob") cm.push(`# ${kind}: run-once/scheduled in k8s; here restart:no — use 'docker compose run ${name}' or an external scheduler`);
    if (gpuCount) cm.push(`# GPU ×${gpuCount}: needs the NVIDIA Container Toolkit on the host`);

    const body = _yObj(s, 2);
    const cmLines = cm.map(l => `    ${l}`).join("\n");
    blocks.push(`  ${name}:\n${cmLines}\n${body}`);
  }

  // ---- header ----
  const header = `# Docker Compose — generated by vk8s · ${new Date().toISOString()}
# Project: ${p.name}${p.mode ? ` (mode: ${p.mode})` : ""}
#
# BEST-EFFORT translation of a Kubernetes model to docker-compose for single-host / local use.
# These k8s concepts have NO compose equivalent and are approximated or dropped (see per-service notes):
#   • Operators / CRDs / HA topology         -> single container per workload (no failover/replication)
#   • HPA autoscaling / pod self-healing      -> 'restart: unless-stopped' only
#   • Service (port remap + LB across pods)   -> compose DNS reaches the CONTAINER port directly
#   • Ingress                                 -> no equivalent; front exposed services with nginx/traefik
#   • NetworkPolicy / namespaces / RBAC       -> not enforced; all services share one flat network
#   • PVC / StorageClass / NFS                -> local named volumes (no dynamic provisioning)
#   • Multi-cluster                           -> flattened onto one Docker host & network
#
# Images are placeholders (registry.example.com/...) unless set per-workload in vk8s.
# Run:  docker compose up -d        Validate:  docker compose config -q`;

  const ingressBlock = ingressRoutes.length
    ? `\n#\n# ---- Ingress routes (no compose equivalent — put a reverse proxy in front) ----\n${ingressRoutes.map(r => `#   ${r}`).join("\n")}`
    : "";

  const uniqVols = [...new Set(volumeDecls)];
  const volumesSection = uniqVols.length
    ? `\n\nvolumes:\n${uniqVols.map(v => `  ${v}:`).join("\n")}`
    : "";

  return `${header}${ingressBlock}\n\nservices:\n${blocks.join("\n\n")}${volumesSection}\n`;
}

function _helmPvcTpl(w) {
  const name = slug(w.name);
  return `{{- $w := index .Values.workloads "${name}" }}
{{- if (and $w $w.enabled $w.persistence $w.persistence.enabled (ne ($w.kind | default "Deployment") "StatefulSet")) }}
{{- range $w.persistence.volumes }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${name}-{{ .name }}
  namespace: {{ $w.namespace | default "default" }}
  labels:
    app: ${name}
spec:
  accessModes: [ {{ .accessMode | default "ReadWriteOnce" | quote }} ]
  resources:
    requests:
      storage: {{ .size | quote }}
  {{- if .storageClass }}
  storageClassName: {{ .storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
`;
}

function _helmDeploymentTpl(w, chartName) {
  const name = slug(w.name);
  return `{{- $w := index .Values.workloads "${name}" }}
{{- if (and $w $w.enabled) }}
apiVersion: apps/v1
kind: {{ $w.kind | default "Deployment" }}
metadata:
  name: ${name}
  namespace: {{ $w.namespace | default "default" }}
  labels:
    app: ${name}
    {{- include "${chartName}.labels" . | nindent 4 }}
spec:
  {{- if ne ($w.kind | default "Deployment") "DaemonSet" }}
  replicas: {{ $w.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: ${name}
  {{- if eq ($w.kind | default "Deployment") "StatefulSet" }}
  serviceName: ${name}
  {{- with $w.persistence }}
  {{- if .enabled }}
  volumeClaimTemplates:
    {{- range .volumes }}
    - metadata:
        name: {{ .name }}
      spec:
        accessModes: [ {{ .accessMode | default "ReadWriteOnce" | quote }} ]
        resources:
          requests:
            storage: {{ .size | quote }}
        {{- if .storageClass }}
        storageClassName: {{ .storageClass | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        app: ${name}
        {{- include "${chartName}.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ${name}
          image: "{{ $w.image.repository }}:{{ $w.image.tag | default "latest" }}"
          imagePullPolicy: {{ $w.image.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: {{ $w.resources.requests.cpu | quote }}
              memory: {{ $w.resources.requests.memory | quote }}
            limits:
              cpu: {{ $w.resources.limits.cpu | quote }}
              memory: {{ $w.resources.limits.memory | quote }}
              {{- if index $w.resources.limits "nvidia.com/gpu" }}
              nvidia.com/gpu: {{ index $w.resources.limits "nvidia.com/gpu" | quote }}
              {{- end }}
          {{- with $w.service }}
          ports:
            {{- range .ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort | default .port }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- end }}
          {{- with $w.persistence }}
          {{- if .enabled }}
          volumeMounts:
            {{- range .volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
      {{- if and $w.persistence $w.persistence.enabled (ne ($w.kind | default "Deployment") "StatefulSet") }}
      volumes:
        {{- range $w.persistence.volumes }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: ${name}-{{ .name }}
        {{- end }}
      {{- end }}
      {{- with $w.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew | default 1 }}
          topologyKey: {{ .topologyKey | quote }}
          whenUnsatisfiable: {{ .whenUnsatisfiable | quote }}
          labelSelector:
            matchLabels:
              app: ${name}
      {{- end }}
      {{- end }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.podAntiAffinity }}
      {{- if .enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ${name}
                topologyKey: {{ .topologyKey | default "kubernetes.io/hostname" | quote }}
      {{- end }}
      {{- end }}
{{- end }}
`;
}

function _helmServiceTpl(w) {
  const name = slug(w.name);
  return `{{- $w := index .Values.workloads "${name}" }}
{{- if (and $w $w.enabled $w.service) }}
apiVersion: v1
kind: Service
metadata:
  name: ${name}
  namespace: {{ $w.namespace | default "default" }}
  labels:
    app: ${name}
spec:
  type: {{ $w.service.type | default "ClusterIP" }}
  selector:
    app: ${name}
  ports:
    {{- range $w.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .port }}
      protocol: {{ .protocol | default "TCP" }}
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
{{- end }}
`;
}

function _helmNamespacesTpl(c) {
  const parts = [];
  for (const ns of c.namespaces || []) {
    const labels = { ...(ns.labels || {}) };
    if (ns.default_deny) labels["vk8s/default-deny"] = "true";
    let s = `---\napiVersion: v1\nkind: Namespace\nmetadata:\n  name: ${_yStr(ns.name)}\n`;
    if (Object.keys(labels).length) {
      s += `  labels:\n${_yObj(labels, 2)}\n`;
    }
    parts.push(s);
    if (ns.resource_quota) {
      const q = ns.resource_quota;
      const hard = {};
      if (q.cpu != null) hard["requests.cpu"] = String(q.cpu);
      if (q.memory_gb != null) hard["requests.memory"] = `${q.memory_gb}Gi`;
      if (q.max_pods != null) hard["pods"] = String(q.max_pods);
      parts.push(`---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ${slug(ns.name)}-quota
  namespace: ${_yStr(ns.name)}
spec:
  hard:
${_yObj(hard, 2)}
`);
    }
  }
  return parts.join("");
}

function _helmNetworkPoliciesTpl(c) {
  const parts = [];
  for (const np of c.network_policies || []) {
    const spec = {
      podSelector: np.pod_selector?.match_labels
        ? { matchLabels: np.pod_selector.match_labels } : {},
      policyTypes: [],
    };
    if (np.ingress) {
      spec.policyTypes.push("Ingress");
      spec.ingress = (np.ingress || []).map(rule => {
        const r = {};
        if (rule.from_namespaces?.length) {
          r.from = rule.from_namespaces.map(ns => ({
            namespaceSelector: { matchLabels: { "kubernetes.io/metadata.name": ns } },
          }));
        }
        if (rule.ports?.length) {
          r.ports = rule.ports.map(p => ({ port: p.port, protocol: p.protocol || "TCP" }));
        }
        return r;
      });
    }
    if (np.egress) {
      spec.policyTypes.push("Egress");
      spec.egress = (np.egress || []).map(rule => {
        const r = {};
        if (rule.to_namespaces?.length) {
          r.to = rule.to_namespaces.map(ns => ({
            namespaceSelector: { matchLabels: { "kubernetes.io/metadata.name": ns } },
          }));
        }
        if (rule.ports?.length) {
          r.ports = rule.ports.map(p => ({ port: p.port, protocol: p.protocol || "TCP" }));
        }
        return r;
      });
    }
    parts.push(`---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${_yStr(np.name)}
  namespace: ${_yStr(np.namespace || "default")}
spec:
${_yObj(spec, 1)}
`);
  }
  return parts.join("");
}

function _helmIngressesTpl(c) {
  const parts = [];
  for (const r of c.ingress_rules || []) {
    const rules = [{
      host: r.host,
      http: {
        paths: (r.paths || []).map(p => {
          const w = (c.workloads || []).find(x => x.id === p.workload_id);
          const svcName = w ? slug(w.name) : p.workload_id;
          return {
            path: p.path || "/",
            pathType: p.path_type || "Prefix",
            backend: {
              service: { name: svcName, port: { number: p.port || 80 } },
            },
          };
        }),
      },
    }];
    const spec = {
      ingressClassName: r.ingress_class || "nginx",
      rules,
    };
    if (r.tls) {
      spec.tls = [{ hosts: [r.host], secretName: r.tls_secret || `${slug(r.name || r.host)}-tls` }];
    }
    parts.push(`---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${_yStr(slug(r.name || r.host))}
  namespace: ${_yStr(r.namespace || "default")}
  annotations:
    kubernetes.io/ingress.class: ${_yStr(r.ingress_class || "nginx")}
spec:
${_yObj(spec, 1)}
`);
  }
  return parts.join("");
}

//============ Export: Capacity report (Markdown) ============
// ============ Project Report — section-based, selectable ============
// Each section is { id, label, emit(p) -> string[] }. generateCapacityReport(p, hidden=[]) emits the
// header + every section whose id is NOT in `hidden`. Storing the *deselected* ids (not selected)
// means any section added later defaults ON for existing saved UIs. Sections self-compute (no shared
// ctx) so each can be omitted independently; an explicitly-selected but empty section prints "_(none)_".

// Escape a value for a Markdown table cell (pipe + newline would otherwise break the table).
const _mdCell = v => String(v == null || v === "" ? "—" : v).replace(/\|/g, "\\|").replace(/\n/g, " ");
const _reportNodeIdToCluster = p => {
  const m = new Map();
  for (const c of (p.clusters || [])) for (const id of (c.node_ids || [])) m.set(id, c.name);
  return m;
};
const _reportWorkloadIdToName = p => {
  const m = new Map();
  for (const c of (p.clusters || [])) for (const w of (c.workloads || [])) m.set(w.id, w.name);
  return m;
};
const _depLabel = d => {
  const proto = d.protocol || "";
  return d.port != null ? `${proto}${proto ? ":" : ""}${d.port}` : proto;
};

function _secOverview(p) {
  const counts = {
    sites: (p.sites || []).length,
    nodes: (p.nodes || []).length,
    clusters: (p.clusters || []).length,
    workloads: (p.clusters || []).reduce((s, c) => s + (c.workloads?.length || 0), 0),
  };
  return [
    "## Overview", "",
    "| Metric | Count |", "|---|---|",
    `| Sites | ${counts.sites} |`,
    `| Nodes | ${counts.nodes} |`,
    `| Clusters | ${counts.clusters} |`,
    `| Workloads | ${counts.workloads} |`,
  ];
}

function _secNodes(p) {
  const out = ["## Node Specs", ""];
  const nodes = p.nodes || [];
  if (!nodes.length) { out.push("_(none)_"); return out; }
  const gm = state.catalog?.gpuModels || {};
  const n2c = _reportNodeIdToCluster(p);
  out.push("| Node | Cluster | Site | Source | Roles | vCPU | RAM (GB) | Disk | GPU | Power (W) |");
  out.push("|---|---|---|---|---|---|---|---|---|---|");
  for (const n of nodes) {
    const site = (p.sites || []).find(s => s.id === n.site_id);
    const roles = Array.isArray(n.cluster_roles) && n.cluster_roles.length ? n.cluster_roles.join("+") : "—";
    const disks = n.spec?.disks || [];
    const diskTot = disks.reduce((a, d) => a + (d.size_gb || 0) * (d.count || 1), 0);
    const diskTypes = [...new Set(disks.map(d => d.type).filter(Boolean))].join("/");
    const diskStr = diskTot ? `${diskTot}GB${diskTypes ? ` ${diskTypes}` : ""}` : "—";
    const gpu = (n.spec?.gpu || []).map(g =>
      `${g.model}×${g.count}${g.mig_enabled && g.mig_profile ? ` [MIG ${g.mig_profile}]` : ""}`).join(", ") || "—";
    const powerW = Math.round(computeNodePowerW(n, gm));
    out.push(`| ${_mdCell(n.name)} | ${_mdCell(n2c.get(n.id))} | ${_mdCell(site?.name)} | ${_mdCell(n.source)} | ${_mdCell(roles)} | ${_mdCell(n.spec?.vcpu)} | ${_mdCell(n.spec?.memory_gb)} | ${_mdCell(diskStr)} | ${_mdCell(gpu)} | ${powerW} |`);
  }
  return out;
}

function _secSites(p) {
  const out = ["## Site Capacity", ""];
  const sites = p.sites || [];
  if (!sites.length) { out.push("_(none)_"); return out; }
  const gm = state.catalog?.gpuModels || {};
  out.push("| Site | Kind | Provider/Region | Nodes | U used | kW est | kW budget | Util |");
  out.push("|---|---|---|---|---|---|---|---|");
  for (const s of sites) {
    const nodesHere = (p.nodes || []).filter(n => n.site_id === s.id);
    let uUsed = 0, wEst = 0;
    for (const n of nodesHere) {
      uUsed += siteFormFactorU(n.spec?.form_factor || "1U");
      wEst += computeNodePowerW(n, gm);   // accurate catalog TDP + disk power (consistent w/ Node Specs)
    }
    const kwEst = wEst / 1000;
    const kwBudget = s.capacity?.power_kw || 0;
    const util = kwBudget ? `${Math.round((kwEst / kwBudget) * 100)}%` : "—";
    out.push(`| ${_mdCell(s.name)} | ${_mdCell(s.kind)} | ${_mdCell(s.cloud_provider || "—")}/${_mdCell(s.region || "—")} | ${nodesHere.length} | ${uUsed}U / ${s.capacity?.rack_units || "—"} | ${kwEst.toFixed(1)} | ${kwBudget || "—"} | ${util} |`);
  }
  return out;
}

function _secGpu(p) {
  const out = ["## GPU Plan", ""];
  const gm = state.catalog?.gpuModels || {};
  const byModel = new Map();
  let totalGpus = 0, totalVram = 0;
  for (const n of (p.nodes || [])) for (const g of (n.spec?.gpu || [])) {
    byModel.set(g.model, (byModel.get(g.model) || 0) + g.count);
    totalGpus += g.count;
    const ref = gm[g.model];
    if (ref?.vram_gb) totalVram += ref.vram_gb * g.count;
  }
  if (!totalGpus) { out.push("_(none)_"); return out; }
  out.push(`**Total GPUs:** ${totalGpus} · **Aggregate VRAM:** ~${totalVram} GB`, "");
  out.push("| Model | Count | VRAM/each | TDP/each |", "|---|---|---|---|");
  for (const [model, cnt] of [...byModel].sort((a, b) => b[1] - a[1])) {
    const ref = gm[model] || {};
    out.push(`| ${_mdCell(model)} | ${cnt} | ${ref.vram_gb || "—"} GB | ${ref.tdp_w || "—"} W |`);
  }
  return out;
}

function _secNetwork(p) {
  const out = ["## Network Plan", ""];
  const rows = [];
  for (const c of (p.clusters || [])) if (c.network) rows.push({
    cluster: c.name,
    pod: c.network.pod_cidr || "—", svc: c.network.service_cidr || "—",
    node: c.network.node_subnet || "—", lb: c.network.lb_pool || "—",
    dns: c.network.dns_domain || "cluster.local",
  });
  if (!rows.length) { out.push("_(none)_"); return out; }
  out.push("| Cluster | Pod CIDR | Service CIDR | Node Subnet | LB Pool | DNS |", "|---|---|---|---|---|---|");
  for (const r of rows) out.push(`| ${_mdCell(r.cluster)} | ${_mdCell(r.pod)} | ${_mdCell(r.svc)} | ${_mdCell(r.node)} | ${_mdCell(r.lb)} | ${_mdCell(r.dns)} |`);
  return out;
}

function _secClusters(p) {
  const out = ["## Cluster Configuration", ""];
  const clusters = p.clusters || [];
  if (!clusters.length) { out.push("_(none)_"); return out; }
  for (const c of clusters) {
    const nodes = (c.node_ids || []).map(id => (p.nodes || []).find(n => n.id === id)).filter(Boolean);
    const nodeDesc = nodes.map(n =>
      `${n.name}${Array.isArray(n.cluster_roles) && n.cluster_roles.length ? ` (${n.cluster_roles.join("+")})` : ""}`).join(", ") || "—";
    const ns = (c.namespaces || []).map(x => x.name).join(", ") || "—";
    out.push(`### ${_mdCell(c.name)}`, "");
    out.push(`- **k8s:** ${_mdCell(c.k8s_version || "—")} · **CNI:** ${_mdCell(c.addons?.cni || "—")} · **GPU operator:** ${c.addons?.gpu_operator ? "yes" : "no"} · **HA control plane:** ${c.ha_control_plane ? "yes" : "no"}`);
    out.push(`- **Nodes (${nodes.length}):** ${_mdCell(nodeDesc)}`);
    out.push(`- **Namespaces:** ${_mdCell(ns)}`);
    if (c.network) out.push(`- **Network:** pod ${_mdCell(c.network.pod_cidr || "—")} · svc ${_mdCell(c.network.service_cidr || "—")} · DNS ${_mdCell(c.network.dns_domain || "cluster.local")}`);
    out.push(`- **Workloads:** ${(c.workloads || []).length}`, "");
  }
  if (out[out.length - 1] === "") out.pop();
  return out;
}

function _secArchitecture(p) {
  const out = ["## Architecture", ""];
  const wlName = _reportWorkloadIdToName(p);
  let any = false;
  for (const c of (p.clusters || [])) {
    const edges = [];
    for (const w of (c.workloads || [])) for (const d of (w.depends_on || [])) {
      const tgt = wlName.get(d.target_workload_id);
      if (!tgt) continue;
      const pp = _depLabel(d), ms = d.avg_call_ms != null ? ` · ${d.avg_call_ms}ms` : "";
      edges.push(`- ${_mdCell(w.name)} → ${_mdCell(tgt)}${pp ? ` · ${pp}` : ""}${ms}`);
    }
    const ingress = [];
    for (const r of (c.ingress_rules || [])) for (const path of (r.paths || [])) {
      const tgt = wlName.get(path.workload_id) || path.workload_id;
      ingress.push(`- ${_mdCell((r.host || "*") + (path.path || "/"))} → ${_mdCell(tgt)}:${path.port || 80}`);
    }
    if (!edges.length && !ingress.length) continue;
    any = true;
    out.push(`### ${_mdCell(c.name)}`, "");
    if (ingress.length) out.push("**Ingress routes:**", ...ingress, "");
    if (edges.length) out.push("**Dependencies:**", ...edges, "");
  }
  if (!any) { out.push("_(none)_"); return out; }
  if (out[out.length - 1] === "") out.pop();
  return out;
}

function _secWorkloadSummary(p) {
  const out = ["## Workload Summary", ""];
  let any = false;
  for (const c of (p.clusters || [])) {
    const wls = c.workloads || [];
    if (!wls.length) continue;
    any = true;
    out.push(`### Cluster: ${_mdCell(c.name)} (${wls.length} workloads)`, "");
    out.push("| Workload | Namespace | Category | Replicas | CPU req | Mem req | RPS |", "|---|---|---|---|---|---|---|");
    for (const w of wls) {
      out.push(`| ${_mdCell(w.name)} | ${_mdCell(w.namespace || "default")} | ${_mdCell(w.category || "—")} | ${w.replicas ?? 1} | ${w.resources?.requests?.cpu ?? "—"} | ${w.resources?.requests?.memory_gb ?? "—"} GB | ${w.traffic_profile?.target_rps ?? "—"} |`);
    }
    out.push("");
  }
  if (!any) { out.push("_(none)_"); return out; }
  if (out[out.length - 1] === "") out.pop();
  return out;
}

function _secWorkloadDetail(p) {
  const out = ["## Workload Details", ""];
  const wlName = _reportWorkloadIdToName(p);
  let any = false;
  for (const c of (p.clusters || [])) for (const w of (c.workloads || [])) {
    any = true;
    const r = w.resources || {}, req = r.requests || {}, lim = r.limits || {};
    const gpu = req.gpu?.count ? ` · GPU ×${req.gpu.count}${req.gpu.model ? ` (${req.gpu.model})` : ""}` : "";
    const img = `${w.helm?.image_repo || "registry.example.com/" + slug(w.name)}:${w.helm?.image_tag || "latest"}`;
    out.push(`### ${_mdCell(c.name)} / ${_mdCell(w.name)}`, "");
    out.push(`- **kind:** ${w.kind || "Deployment"} · **ns:** ${_mdCell(w.namespace || "default")} · **replicas:** ${w.replicas ?? 1} · **category:** ${_mdCell(w.category || "—")}`);
    out.push(`- **image:** ${_mdCell(img)}`);
    out.push(`- **resources:** req ${req.cpu ?? "—"} CPU / ${req.memory_gb ?? "—"} GB${gpu} · lim ${lim.cpu ?? "—"} CPU / ${lim.memory_gb ?? "—"} GB`);
    const ports = (w.network?.service?.ports || []).map(pt => `${pt.name || pt.port} ${pt.port}→${pt.target_port || pt.port}/${pt.protocol || "TCP"}`).join(", ");
    if (ports) out.push(`- **ports:** ${_mdCell(ports)} (${_mdCell(w.network?.service?.type || "ClusterIP")})`);
    const deps = (w.depends_on || []).map(d => {
      const t = wlName.get(d.target_workload_id) || d.target_workload_id, pp = _depLabel(d);
      return `${t}${pp ? ` (${pp}${d.avg_call_ms != null ? `, ${d.avg_call_ms}ms` : ""})` : ""}`;
    }).join(", ");
    if (deps) out.push(`- **depends_on:** ${_mdCell(deps)}`);
    if (w.ha && w.ha.mode && w.ha.mode !== "none") {
      out.push(`- **HA:** ${_mdCell(w.ha.mode)} · ${(w.ha.primaries ?? 1)}×(1+${w.ha.replicas_per_primary ?? 0})${w.ha.quorum_count ? ` + ${w.ha.quorum_count} quorum` : ""}${w.ha.operator ? ` · operator: ${_mdCell(w.ha.operator)}` : ""}`);
    }
    const sched = [];
    if (w.scheduling?.anti_affinity && w.scheduling.anti_affinity !== "none") sched.push(`anti-affinity: ${w.scheduling.anti_affinity}`);
    if (w.scheduling?.node_selector && Object.keys(w.scheduling.node_selector).length) sched.push(`nodeSelector: ${Object.entries(w.scheduling.node_selector).map(([k, v]) => `${k}=${v}`).join(",")}`);
    if (w.scheduling?.tolerations?.length) sched.push(`${w.scheduling.tolerations.length} toleration(s)`);
    if (sched.length) out.push(`- **scheduling:** ${_mdCell(sched.join(" · "))}`);
    const pvs = (w.persistent_volumes || []).map(pv => `${pv.name || "data"} ${pv.size_gb || "?"}GB @ ${pv.mount_path || "/data"}`).join(", ");
    if (pvs) out.push(`- **storage:** ${_mdCell(pvs)}`);
    out.push("");
  }
  if (!any) { out.push("_(none)_"); return out; }
  if (out[out.length - 1] === "") out.pop();
  return out;
}

function _secValidation(p) {
  const out = ["## Validation Summary", ""];
  const findings = runValidator(p);
  const c = { error: 0, warn: 0, info: 0 };
  for (const f of findings) c[f.sev] = (c[f.sev] || 0) + 1;
  out.push(`**Errors:** ${c.error} · **Warnings:** ${c.warn} · **Info:** ${c.info}`, "");
  if (findings.length) {
    out.push("| Severity | Scope | Message |", "|---|---|---|");
    for (const f of findings.slice(0, 30)) {
      const scope = f.scope ? `${f.scope.kind}:${f.scope.id}` : (f.id || "—");
      out.push(`| ${f.sev} | ${_mdCell(scope)} | ${_mdCell(f.msg || "")} |`);
    }
    if (findings.length > 30) out.push(`\n_(+${findings.length - 30} more findings — open Findings panel for full list)_`);
  }
  return out;
}

const REPORT_SECTIONS = [
  { id: "overview",        label: "Overview",        emit: _secOverview },
  { id: "nodes",           label: "Node Specs",      emit: _secNodes },
  { id: "sites",           label: "Site Capacity",   emit: _secSites },
  { id: "gpu",             label: "GPU Plan",        emit: _secGpu },
  { id: "network",         label: "Network Plan",    emit: _secNetwork },
  { id: "clusters",        label: "Cluster Config",  emit: _secClusters },
  { id: "architecture",    label: "Architecture",    emit: _secArchitecture },
  { id: "workloads",       label: "Workload Summary",emit: _secWorkloadSummary },
  { id: "workload_detail", label: "Workload Detail", emit: _secWorkloadDetail },
  { id: "validation",      label: "Validation",      emit: _secValidation },
];

// hidden: array of section ids to omit. No args ⇒ full report (used by "Download everything").
function generateCapacityReport(p, hidden = []) {
  const hide = new Set(hidden);
  const today = new Date().toISOString().slice(0, 10);
  const lines = [];
  lines.push(`# ${_mdCell(p.name)} — Project Report`);
  lines.push("");
  lines.push(`**Mode:** ${p.mode} · **Generated:** ${today}`);
  if (p.description) lines.push(`\n> ${String(p.description).replace(/\n/g, " ")}`);
  lines.push("");
  for (const sec of REPORT_SECTIONS) {
    if (hide.has(sec.id)) continue;
    const out = sec.emit(p);
    if (out && out.length) { lines.push(...out, ""); }
  }
  lines.push("---");
  lines.push(`_Generated by vk8s · schema v${SCHEMA_VERSION}_`);
  return lines.join("\n");
}

//============ Render: Export ============
function renderExport() {
  const root = $("#viewBody");
  root.innerHTML = "";
  const p = state.project;
  if (!p) return;

  // Pre-generate everything (cheap; caches for buttons across tab switches)
  const slugName = slug(p.name) || "vk8s";
  const k8sContent = generateK8sManifests(p);
  const helmChart = generateHelmChart(p);    // { chartName, files[] }
  const composeContent = generateDockerCompose(p);
  // Report: the tab respects the per-section checkboxes; the "Download everything" zip always
  // bundles the FULL report (everything means everything), so generate both.
  if (!Array.isArray(state.ui.reportHiddenSections)) state.ui.reportHiddenSections = [];
  const reportFull = generateCapacityReport(p);
  const reportContent = generateCapacityReport(p, state.ui.reportHiddenSections);

  // Tab configuration
  // - single-file tabs: { kind:"single", id, name, ext, mime, content }
  // - multi-file tab:   { kind:"multi", id, name, files[], chartName }
  const tabs = [
    { kind: "single", id: "yaml",   name: "K8s Manifests",
      ext: "yaml", mime: "text/yaml", content: k8sContent,
      filename: `${slugName}-k8s.yaml` },
    { kind: "multi",  id: "helm",   name: "Helm Chart",
      files: helmChart.files, chartName: helmChart.chartName,
      filename: `${helmChart.chartName}-helm.zip` },
    { kind: "single", id: "compose", name: "Docker Compose",
      ext: "yml", mime: "text/yaml", content: composeContent,
      filename: `${slugName}-docker-compose.yml` },
    { kind: "single", id: "report", name: "Project Report",
      ext: "md", mime: "text/markdown", content: reportContent,
      filename: `${slugName}-report.md` },
  ];
  const cur = tabs.find(t => t.id === state.ui.exportTab) || tabs[0];

  const wrap = el("div", {});
  const btnStyle = {
    background: "var(--surface2)", border: "1px solid var(--border)",
    color: "var(--text)", padding: "5px 12px", borderRadius: "4px",
    cursor: "pointer", fontSize: "12px", fontFamily: "inherit",
  };
  const btnPrimary = { ...btnStyle, background: "var(--accent)", color: "#fff",
                       fontWeight: "600", border: "1px solid var(--accent)" };

  // Header row: title + master "Download everything (.zip)"
  const allFiles = [];
  allFiles.push({ path: `k8s-manifests.yaml`, content: k8sContent });
  allFiles.push({ path: `docker-compose.yml`, content: composeContent });
  allFiles.push({ path: `project-report.md`, content: reportFull });
  for (const f of helmChart.files) allFiles.push(f);

  let dlAllBtn;
  dlAllBtn = el("button", {
    style: btnPrimary,
    title: `${allFiles.length} files (k8s YAML + capacity report + helm chart)`,
    onclick: () => {
      try {
        const zip = _zipStore(allFiles);
        _triggerDownload(zip, `${slugName}-export-${_todayStamp()}.zip`);
      } catch (e) {
        console.error("zip failed", e);
        alert("ZIP 생성 실패: " + e.message);
      }
    },
  }, [`⬇ Download everything (.zip)`]);

  wrap.appendChild(el("div", {
    style: { display: "flex", alignItems: "center", gap: "12px", marginBottom: "12px", flexWrap: "wrap" },
  }, [
    el("h2", { style: { fontSize: "16px", fontWeight: 600, margin: 0 } }, [
      "Export", helpIcon("view.export"),
    ]),
    el("span", { style: { fontSize: "11px", color: "var(--text3)", fontStyle: "italic" } }, [
      "K8s manifests · Helm chart · Docker Compose · Project report",
    ]),
    el("span", { style: { flex: 1 } }, []),
    dlAllBtn,
  ]));

  // Tab strip
  const tabRow = el("div", {
    style: { display: "flex", gap: "4px", marginBottom: "10px", borderBottom: "1px solid var(--border)" },
  });
  for (const t of tabs) {
    const active = t.id === cur.id;
    tabRow.appendChild(el("button", {
      style: {
        background: active ? "var(--surface2)" : "transparent",
        border: "1px solid " + (active ? "var(--border)" : "transparent"),
        borderBottom: active ? "1px solid var(--surface2)" : "1px solid transparent",
        marginBottom: "-1px",
        color: active ? "var(--text)" : "var(--text2)",
        padding: "6px 14px", borderRadius: "4px 4px 0 0",
        cursor: "pointer", fontSize: "12px", fontFamily: "inherit",
        fontWeight: active ? "600" : "400",
      },
      onclick: () => {
        state.ui.exportTab = t.id;
        state.ui.exportSelectedFile = null;
        emit(); saveSoon();
      },
    }, [t.name]));
  }
  wrap.appendChild(tabRow);

  if (cur.kind === "single") {
    if (cur.id === "report") wrap.appendChild(_renderReportSectionSelector(btnStyle));
    _renderExportSingle(wrap, cur, btnStyle);
  } else {

  }

  root.appendChild(wrap);
}

// Per-section include/exclude checkboxes for the Project Report. Stores the *deselected* ids in
// state.ui.reportHiddenSections; toggling re-renders so the preview/download reflect the choice.
function _renderReportSectionSelector(btnStyle) {
  const hidden = new Set(state.ui.reportHiddenSections || []);
  const setHidden = h => { state.ui.reportHiddenSections = [...h]; emit(); saveSoon(); };

  const chips = REPORT_SECTIONS.map(sec => {
    const on = !hidden.has(sec.id);
    return el("label", {
      style: {
        display: "flex", alignItems: "center", gap: "5px", margin: 0,
        fontSize: "11px", textTransform: "none", letterSpacing: 0,
        padding: "3px 8px", borderRadius: "4px", cursor: "pointer",
        background: on ? "var(--surface2)" : "transparent",
        border: "1px solid " + (on ? "var(--border)" : "transparent"),
        color: on ? "var(--text)" : "var(--text3)",
      },
    }, [
      el("input", {
        type: "checkbox", checked: on ? "" : null,
        onchange: e => {
          const h = new Set(state.ui.reportHiddenSections || []);
          if (e.target.checked) h.delete(sec.id); else h.add(sec.id);
          setHidden(h);
        },
      }),
      sec.label,
    ]);
  });

  const quick = (label, fn) => el("button", {
    style: { ...btnStyle, padding: "3px 10px", fontSize: "11px" },
    onclick: fn,
  }, [label]);

  return el("div", {
    style: { display: "flex", alignItems: "center", gap: "6px", flexWrap: "wrap", marginBottom: "10px",
             padding: "8px 10px", background: "var(--surface1)", border: "1px solid var(--border)", borderRadius: "6px" },
  }, [
    el("span", { style: { fontSize: "11px", color: "var(--text2)", fontWeight: 600, marginRight: "2px" } }, ["Sections:"]),
    ...chips,
    el("span", { style: { flex: 1 } }, []),
    quick("All", () => setHidden(new Set())),
    quick("None", () => setHidden(new Set(REPORT_SECTIONS.map(s => s.id)))),
  ]);
}

function _renderExportSingle(wrap, t, btnStyle) {
  const content = t.content;
  const fname = t.filename;
  // Action row
  const actions = el("div", {
    style: { display: "flex", gap: "8px", marginBottom: "8px", alignItems: "center", flexWrap: "wrap" },
  });
  const lines = content.split("\n").length;
  const bytes = new Blob([content]).size;
  actions.appendChild(el("span", {
    style: { fontSize: "11px", color: "var(--text3)", fontFamily: "JetBrains Mono" },
  }, [`${lines.toLocaleString()} lines · ${(bytes / 1024).toFixed(1)} KB`]));
  actions.appendChild(el("span", { style: { flex: 1 } }, []));
  let copyBtn;
  copyBtn = el("button", {
    style: btnStyle,
    onclick: async () => {
      try {
        await navigator.clipboard.writeText(content);
        copyBtn.textContent = "✓ Copied";
        setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
      } catch (e) {
        copyBtn.textContent = "✗ Failed";
        setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
      }
    },
  }, ["Copy"]);
  actions.appendChild(copyBtn);
  actions.appendChild(el("button", {
    style: btnStyle,
    onclick: () => {
      const blob = new Blob([content], { type: t.mime });
      _triggerDownload(blob, fname);
    },
  }, [`⬇ Download ${fname}`]));
  wrap.appendChild(actions);

  wrap.appendChild(el("pre", {
    style: {
      background: "var(--surface2)", border: "1px solid var(--border)",
      borderRadius: "6px", padding: "12px", overflow: "auto",
      maxHeight: "70vh", fontSize: "11px", lineHeight: "1.5",
      fontFamily: "JetBrains Mono, monospace", margin: 0,
      whiteSpace: "pre", color: "var(--text)",
    },
  }, [content]));
}

function _renderExportMulti(wrap, t, btnStyle, btnPrimary) {
  const files = t.files;
  const totalBytes = files.reduce((s, f) =>
    s + (typeof f.content === "string" ? new Blob([f.content]).size : f.content.length), 0);
  // Header actions
  const actions = el("div", {
    style: { display: "flex", gap: "8px", marginBottom: "10px", alignItems: "center", flexWrap: "wrap" },
  });
  actions.appendChild(el("span", {
    style: { fontSize: "11px", color: "var(--text3)", fontFamily: "JetBrains Mono" },
  }, [`${files.length} files · ${(totalBytes / 1024).toFixed(1)} KB total`]));
  actions.appendChild(el("span", { style: { flex: 1 } }, []));
  actions.appendChild(el("button", {
    style: btnPrimary,
    onclick: () => {
      try {
        const zip = _zipStore(files);
        _triggerDownload(zip, t.filename);
      } catch (e) {
        console.error(e); alert("ZIP 생성 실패: " + e.message);
      }
    },
  }, [`⬇ Download chart (.zip)`]));
  wrap.appendChild(actions);

  // Two-pane layout
  const pane = el("div", {
    style: { display: "grid", gridTemplateColumns: "minmax(220px, 280px) 1fr", gap: "10px" },
  });

  // File list
  const fileList = el("div", {
    style: {
      background: "var(--surface2)", border: "1px solid var(--border)",
      borderRadius: "6px", padding: "8px", overflow: "auto", maxHeight: "70vh",
      fontFamily: "JetBrains Mono, monospace", fontSize: "11px",
    },
  });

  if (!state.ui.exportSelectedFile && files.length) {
    state.ui.exportSelectedFile = files[0].path;
  }
  const selPath = state.ui.exportSelectedFile;

  for (const f of files) {
    const size = typeof f.content === "string" ? new Blob([f.content]).size : f.content.length;
    const active = f.path === selPath;
    const indent = (f.path.match(/\//g) || []).length;
    const shortName = f.path.split("/").pop();
    const row = el("div", {
      style: {
        display: "flex", alignItems: "center", gap: "6px",
        padding: "4px 6px", paddingLeft: `${4 + indent * 12}px`,
        background: active ? "var(--accent-glow)" : "transparent",
        borderRadius: "3px", cursor: "pointer",
        color: active ? "var(--accent)" : "var(--text2)",
        marginBottom: "1px",
      },
      onclick: () => {
        state.ui.exportSelectedFile = f.path;
        emit();
      },
    });
    row.appendChild(el("span", { style: { flex: 1, minWidth: 0,
                                            overflow: "hidden", textOverflow: "ellipsis",
                                            whiteSpace: "nowrap" } },
      [shortName]));
    row.appendChild(el("span", { style: { color: "var(--text3)", fontSize: "9.5px" } },
      [`${(size / 1024).toFixed(1)}K`]));
    const dl = el("button", {
      style: {
        background: "transparent", border: "none", color: "var(--text3)",
        cursor: "pointer", padding: "0 4px", fontSize: "11px",
      },
      title: "Download this file",
      onclick: (e) => {
        e.stopPropagation();
        const blob = new Blob([f.content], { type: "text/plain;charset=utf-8" });
        _triggerDownload(blob, shortName);
      },
    }, ["⬇"]);
    row.appendChild(dl);
    fileList.appendChild(row);
  }
  pane.appendChild(fileList);

  // Preview pane
  const sel = files.find(x => x.path === selPath) || files[0];
  const previewWrap = el("div", { style: { display: "flex", flexDirection: "column", gap: "6px", minWidth: 0 } });

  const previewHdr = el("div", {
    style: { display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" },
  }, [
    el("span", {
      style: { fontSize: "11px", fontFamily: "JetBrains Mono", color: "var(--text)", fontWeight: "600" },
    }, [sel.path]),
    el("span", { style: { flex: 1 } }, []),
    (() => {
      let b;
      b = el("button", {
        style: btnStyle,
        onclick: async () => {
          try {
            await navigator.clipboard.writeText(sel.content);
            b.textContent = "✓ Copied";
            setTimeout(() => { b.textContent = "Copy"; }, 1500);
          } catch (e) {
            b.textContent = "✗ Failed";
            setTimeout(() => { b.textContent = "Copy"; }, 1500);
          }
        },
      }, ["Copy"]);
      return b;
    })(),
    el("button", {
      style: btnStyle,
      onclick: () => {
        const blob = new Blob([sel.content], { type: "text/plain;charset=utf-8" });
        _triggerDownload(blob, sel.path.split("/").pop());
      },
    }, ["⬇ Download"]),
  ]);
  previewWrap.appendChild(previewHdr);

  const lines = (sel.content || "").split("\n").length;
  const bytes = new Blob([sel.content || ""]).size;
  previewWrap.appendChild(el("div", {
    style: { fontSize: "10.5px", color: "var(--text3)", fontFamily: "JetBrains Mono" },
  }, [`${lines.toLocaleString()} lines · ${(bytes / 1024).toFixed(1)} KB`]));

  previewWrap.appendChild(el("pre", {
    style: {
      background: "var(--surface2)", border: "1px solid var(--border)",
      borderRadius: "6px", padding: "12px", overflow: "auto",
      maxHeight: "65vh", fontSize: "11px", lineHeight: "1.5",
      fontFamily: "JetBrains Mono, monospace", margin: 0,
      whiteSpace: "pre", color: "var(--text)",
    },
  }, [sel.content || ""]));
  pane.appendChild(previewWrap);

  wrap.appendChild(pane);
}

function renderFindings() {
  const findings = state.project ? runValidator(state.project) : [];
  state.ui.findings = findings;

  const counts = { error: 0, warn: 0, info: 0 };
  for (const f of findings) counts[f.sev] = (counts[f.sev] || 0) + 1;
  $("#cntErr").textContent = String(counts.error);
  $("#cntWarn").textContent = String(counts.warn);
  $("#cntInfo").textContent = String(counts.info);

  // Hide the "validator coming in Phase 2" placeholder (we're in Phase 2 now)
  const placeholder = document.querySelector(".findings-summary span[style*='Phase 2']");
  if (placeholder) placeholder.style.display = "none";

  // Reflect the active severity filter on the summary counts (highlight the selected one).
  const filter = state.ui.findingsFilter || null;
  for (const span of document.querySelectorAll(".findings-summary .count")) {
    span.dataset.active = String(span.dataset.sev === filter);
  }

  // Render expanded list if visible
  const list = $("#findingsList");
  if (list.style.display !== "none") {
    list.innerHTML = "";
    const sevLabel = { error: "errors", warn: "warnings", info: "info" };
    const shown = filter ? findings.filter(f => f.sev === filter) : findings;

    // Header: which subset is shown + a "전체 보기" link to clear the filter.
    list.appendChild(el("div", {
      style: { display: "flex", alignItems: "center", gap: "10px", padding: "6px 16px", borderBottom: "1px solid var(--border)", fontSize: "11px", color: "var(--text2)" },
    }, [
      el("span", { style: { fontWeight: 600 } }, [
        filter ? `${sevLabel[filter]} · ${shown.length}건` : `전체 findings · ${findings.length}건`,
      ]),
      filter ? el("button", {
        class: "toggle", style: { fontSize: "10px", padding: "2px 8px" },
        onclick: () => setFindingsOpen(true, null),
      }, ["전체 보기"]) : null,
      el("span", { style: { flex: 1 } }, []),
      el("span", { style: { color: "var(--text3)" } }, ["항목을 누르면 해당 대상으로 이동"]),
    ]));

    if (!shown.length) {
      const msg = !findings.length ? "✓ 모든 검증 통과"
        : `${filter ? sevLabel[filter] : ""} 항목이 없습니다`;
      list.appendChild(el("div", { style: { padding: "12px 16px", color: "var(--text2)", fontSize: "12px", textAlign: "center" } }, [msg]));
    } else {
      // Sort: error → warn → info
      const sevOrder = { error: 0, warn: 1, info: 2 };
      const sorted = [...shown].sort((a, b) => sevOrder[a.sev] - sevOrder[b.sev]);
      for (const f of sorted) {
        const icon = f.sev === "error" ? "⊗" : f.sev === "warn" ? "▲" : "ⓘ";
        const color = f.sev === "error" ? "var(--red)" : f.sev === "warn" ? "var(--yellow)" : "var(--accent)";
        const row = el("div", {
          class: "finding-row",
          onclick: () => {
            if (f.scope) selectEntity(f.scope.kind, f.scope.id);
          },
        }, [
          el("span", { class: "id", style: { color } }, [icon]),
          el("span", { class: "id" }, [f.id]),
          el("span", { class: "msg" }, [f.msg]),
        ]);
        if (f.helpId && HELP[f.helpId]) {
          const ic = helpIcon(f.helpId);
          ic.addEventListener("click", e => e.stopPropagation());
          row.appendChild(ic);
        }
        list.appendChild(row);
      }
    }
  }
}

// Save/restore focus across full re-renders so typing in inputs
// doesn't lose focus on every keystroke. Inputs that need preservation
// must carry a stable data-focus-key attribute.
function captureFocus() {
  const elFocused = document.activeElement;
  if (!elFocused || elFocused === document.body) return null;
  const key = elFocused.getAttribute && elFocused.getAttribute("data-focus-key");
  if (!key) return null;
  const sel = (elFocused.selectionStart != null)
    ? { start: elFocused.selectionStart, end: elFocused.selectionEnd, dir: elFocused.selectionDirection }
    : null;
  return { key, sel };
}
function restoreFocus(saved) {
  if (!saved) return;
  let target;
  try {
    target = document.querySelector(`[data-focus-key="${CSS.escape(saved.key)}"]`);
  } catch (e) { return; }
  if (!target) return;
  // Tell our auto-select-on-focus hook to skip — this is a programmatic restore,
  // not a user-initiated focus, so we want to preserve the saved selection.
  target._suppressNextSelectAll = true;
  target.focus();
  if (saved.sel && typeof target.setSelectionRange === "function") {
    try { target.setSelectionRange(saved.sel.start, saved.sel.end, saved.sel.dir || "none"); } catch (e) {}
  }
}

function renderAll() {
  const focus = captureFocus();
  renderTopbar();
  renderViewTabs();
  renderTree();
  renderInspector();
  renderViewBody();
  renderFindings();
  restoreFocus(focus);
}

//============ Add Node modal ============
function openAddNode() {
  if (!state.project) return;
  if (!state.project.sites.length) {
    alert("먼저 사이트를 추가하세요.");
    return;
  }

  const root = el("div");
  root.appendChild(el("h2", {}, ["Add Node"]));

  // Determine source filter based on mode
  const mode = state.project.mode;
  const allowedSources = mode === "hybrid" ? ["onprem", "cloud"] : [mode];
  const entries = state.catalog.entries.filter(e => allowedSources.includes(e.source));

  // Brand options
  const brands = [...new Set(entries.map(e => e.brand))].sort();
  let selectedBrand = brands[0];
  let selectedKey = entries.find(e => e.brand === selectedBrand)?.key;

  const brandSel = el("select", {
    onchange: e => { selectedBrand = e.target.value;
      const first = entries.find(x => x.brand === selectedBrand);
      selectedKey = first?.key;
      rerenderModel();
    },
  }, brands.map(b => el("option", { value: b }, [b])));

  const modelWrap = el("div");

  const previewWrap = el("div");

  const qtyInput = el("input", { type: "number", min: "1", value: "1" });

  // Site
  const siteOpts = () => state.project.sites
    .filter(s => allowedSources.includes(s.kind) && (s.kind === entryFor(selectedKey)?.source))
    .map(s => el("option", { value: s.id }, [`${s.name} (${s.kind})`]));
  const siteSel = el("select", {});

  const nameInput = el("input", { placeholder: "(자동 생성)", value: "" });

  function entryFor(key) { return entries.find(e => e.key === key); }

  function rerenderModel() {
    modelWrap.innerHTML = "";
    const filtered = entries.filter(e => e.brand === selectedBrand);
    const sel = el("select", {
      onchange: e => { selectedKey = e.target.value; rerenderPreview(); },
    }, filtered.map(e =>
      el("option", { value: e.key, selected: e.key === selectedKey ? "" : null },
        [`${e.display_name} (${e.category})`])));
    modelWrap.appendChild(el("div", { class: "field" }, [
      el("label", {}, ["Model"]), sel,
    ]));

    // Update sites filter
    siteSel.innerHTML = "";
    siteOpts().forEach(o => siteSel.appendChild(o));

    rerenderPreview();
  }

  function rerenderPreview() {
    previewWrap.innerHTML = "";
    const e = entryFor(selectedKey);
    if (!e) return;
    const spec = e.spec;
    const chassis = spec.gpu_chassis || {};
    const gpus = spec.gpu || [];
    const power = computeNodePowerW({ spec }, state.catalog.gpuModels);

    previewWrap.appendChild(el("div", { class: "section-title" }, ["Preview"]));
    previewWrap.appendChild(el("div", { class: "compat-result" }, [
      el("div", {}, [`${spec.vcpu} vCPU · ${spec.memory_gb} GB RAM${spec.form_factor ? ` · ${spec.form_factor}` : ""}`]),
      e.source === "onprem" ? el("div", {}, [`Power ~${(power/1000).toFixed(1)} kW (TDP base ${spec.power?.typical_w_base || 0}W + GPUs)`]) : null,
      chassis.max_count
        ? el("div", {}, [`GPU chassis: max ${chassis.max_count} · ${(chassis.supported_form_factors||[]).join("/")} · ${chassis.nvlink_topology}`])
        : null,
      gpus.length
        ? el("div", { class: "ok" }, [`Pre-installed GPU: ${gpus.map(g => `${g.count}× ${g.model}`).join(", ")}`])
        : null,
      e.notes ? el("div", { style: { color: "var(--text2)", marginTop: "4px" } }, [`📝 ${e.notes}`]) : null,
    ]));

    // Compat check
    const issues = checkNodeCompatibility(spec, state.catalog.gpuModels);
    if (issues.length) {
      const list = el("div", { class: "compat-result" });
      for (const i of issues) list.appendChild(el("div", { class: i.sev === "err" ? "err" : "warn" }, [`${i.sev === "err" ? "⊗" : "▲"} ${i.msg}`]));
      previewWrap.appendChild(list);
    }
  }

  root.appendChild(el("div", { class: "field" }, [lbl("Brand", "catalog.brand"), brandSel]));
  root.appendChild(modelWrap);
  root.appendChild(previewWrap);
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [el("label", {}, ["Quantity"]), qtyInput]),
    el("div", { class: "field" }, [el("label", {}, ["Site"]), siteSel]),
  ]));
  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Name (optional)"]), nameInput]));

  rerenderModel();

  const actions = el("div", { class: "modal-actions" }, [

  ]));

      if (cluster && presetInput.checked) {
        applyClusterPreset(cluster.id);

      closeModal();

  ]);

//============ Add Workload modal ============
// Workloads are cluster-scoped: every workload belongs to exactly one cluster.
// When clusterId is null (e.g. from the global "+ Add Workload" in the tree footer),
// the modal exposes a cluster picker as the first field. With a single cluster the
// picker collapses to a read-only label.
function openAddWorkload(clusterId) {
  const clusters = state.project.clusters || [];
  if (clusters.length === 0) {
    alert("먼저 cluster를 추가하세요. 워크로드는 cluster에 소속됩니다.");
    return;
  }
  let c = clusters.find(x => x.id === clusterId) || clusters[0];

  const root = el("div");
  root.appendChild(el("h2", {}, ["Add Workload"]));

  // Namespace dropdown — refreshes when the target cluster changes (different
  // clusters have different namespaces).
  const nsSel = el("select", {});
  const refreshNamespaceOptions = () => {
    const names = (c.namespaces || []).map(n => n.name);
    if (!names.includes("default")) names.unshift("default");
    const cur = nsSel.value || "default";
    nsSel.innerHTML = "";
    for (const n of names) nsSel.appendChild(el("option", { value: n, selected: n === cur ? "" : null }, [n]));
    if (!names.includes(cur)) nsSel.value = names[0] || "default";
  };

  // Cluster picker / readonly label
  const clusterField = el("div", { class: "field" }, [lbl("Cluster", "workload.cluster")]);
  if (clusters.length === 1) {
    clusterField.appendChild(el("div", { class: "field-readonly" }, [c.name]));
  } else {
    const clusterSel = el("select", {
      onchange: e => {
        c = clusters.find(x => x.id === e.target.value) || clusters[0];
        refreshNamespaceOptions();
        // Reset auto-generated name with the new cluster's workload count.
        nameInput.value = `service-${(c.workloads?.length || 0) + 1}`;
      },
    }, clusters.map(cl => el("option", {
      value: cl.id, selected: cl.id === c.id ? "" : null,
    }, [`${cl.name}${cl.environment_tag ? ` · ${cl.environment_tag}` : ""}`])));
    clusterField.appendChild(clusterSel);
  }
  root.appendChild(clusterField);

  const nameInput = el("input", { value: `service-${(c.workloads?.length || 0) + 1}` });
  const catSel = el("select", {}, ["API","Frontend","WAS","DB","Cache","Queue","ML-Inference","ML-Training","Video","Batch","Other"].map(v => el("option", { value: v }, [v])));
  refreshNamespaceOptions();
  const replicasInput = el("input", { type: "number", min: "1", value: "2" });
  const cpuInput = el("input", { type: "number", min: "0", step: "0.1", value: "0.5" });
  const memInput = el("input", { type: "number", min: "0", step: "0.5", value: "1" });
  const gpuCountInput = el("input", { type: "number", min: "0", value: "0" });

  // Runtime preset
  const presets = state.catalog.runtime || {};
  const presetSel = el("select", {}, [
    el("option", { value: "" }, ["(none)"]),
    ...Object.keys(presets).map(k =>
      el("option", { value: k }, [`${k} — ${presets[k].framework || presets[k].language}`])),
  ]);

  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Name"]), nameInput]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("Category", "workload.category"), catSel]),
    el("div", { class: "field" }, [lbl("Replicas", "workload.replicas"), replicasInput]),
  ]));
  root.appendChild(el("div", { class: "field" }, [lbl("Namespace", "namespace.name"), nsSel]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("CPU per pod", "resources.cpu"), cpuInput]),
    el("div", { class: "field" }, [lbl("Memory (GB) per pod", "resources.memory"), memInput]),
  ]));
  root.appendChild(el("div", { class: "field" }, [
    lbl("GPU count per pod (선택)", "resources.gpu_count"), gpuCountInput,
  ]));
  root.appendChild(el("div", { class: "field" }, [
    lbl("Runtime preset (선택)", "workload.runtime_preset"), presetSel,
  ]));

  // Auto-suggest preset based on category
  catSel.addEventListener("change", () => {
    const map = {
      "API": "spring-boot-17",
      "WAS": "spring-boot-17",
      "Frontend": "node-fastify-20",
      "DB": "postgres-16",
      "Cache": "redis-7",
      "Queue": "kafka-3.7",
    };
    const suggest = map[catSel.value];
    if (suggest && presets[suggest]) presetSel.value = suggest;
  });
  catSel.dispatchEvent(new Event("change"));

  const actions = el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      addWorkload(c.id, {
        name: nameInput.value.trim() || "service",
        category: catSel.value,
        namespace: nsSel.value || "default",
        replicas: parseInt(replicasInput.value) || 1,
        cpu: parseFloat(cpuInput.value),
        memory_gb: parseFloat(memInput.value),
        gpu_count: parseInt(gpuCountInput.value) || 0,
        runtime_preset: presetSel.value || undefined,
      });
      closeModal();
    } }, ["Add Workload"]),
  ]);
  root.appendChild(actions);

  openModal(root);
}

//============ Edit Namespace (resource_quota) ============
function openEditNamespace(clusterId, name) {
  const c = state.project.clusters.find(x => x.id === clusterId);
  if (!c) return;
  const ns = (c.namespaces || []).find(n => n.name === name);
  if (!ns) return;
  if (!ns.resource_quota) ns.resource_quota = {};
  const rq = ns.resource_quota;
  const root = el("div");
  root.appendChild(el("h2", {}, [`Namespace: ${ns.name}`]));

  // Name (editable). Rename cascades to workloads + network policies; 'default' is locked.
  const isDefault = ns.name === "default";
  const nsNameInput = el("input", {
    type: "text",
    value: ns.name,
    pattern: "^[a-z0-9][a-z0-9-]*$",
    disabled: isDefault ? "" : null,
    title: isDefault ? "'default'는 K8s 기본 namespace라 이름을 바꿀 수 없습니다." : "",
  });
  root.appendChild(el("div", { class: "section-title" }, ["Name"]));
  root.appendChild(el("div", { class: "field" }, [
    nsNameInput,
    el("div", {
      style: { fontSize: "10px", color: "var(--text3)", marginTop: "4px", fontFamily: "JetBrains Mono" },
    }, [isDefault
      ? "'default'는 변경 불가."
      : "소문자·숫자·- 만 (DNS-1123). 변경 시 워크로드·NetworkPolicy의 참조도 자동 갱신됩니다."]),
  ]));

  root.appendChild(el("div", { class: "section-title" }, ["Resource Quota"]));

  const cpuInput = el("input", { type: "number", min: "0", value: rq.cpu || "", placeholder: "(no limit)" });
  const memInput = el("input", { type: "number", min: "0", value: rq.memory_gb || "", placeholder: "(no limit)" });
  const gpuInput = el("input", { type: "number", min: "0", value: rq.gpu || "", placeholder: "(no limit)" });
  const podsInput = el("input", { type: "number", min: "1", value: rq.max_pods || "", placeholder: "(no limit)" });

  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("CPU (cores)", "ns.quota.cpu"), cpuInput]),
    el("div", { class: "field" }, [lbl("Memory (GB)", "ns.quota.memory"), memInput]),
  ]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [lbl("GPU count", "ns.quota.gpu"), gpuInput]),
    el("div", { class: "field" }, [lbl("Max Pods", "ns.quota.pods"), podsInput]),
  ]));

  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
    el("button", { class: "btn", onclick: () => {
      // 1) Handle rename first (if requested). On failure, don't close the modal.
      let finalName = name;
      const requested = (nsNameInput.value || "").trim();
      if (!isDefault && requested && requested !== name) {
        const result = renameNamespace(clusterId, name, requested);
        if (!result.ok) {
          alert("이름 변경 실패: " + result.error);
          return;
        }
        finalName = requested;
      }
      // 2) Save quota under the (possibly new) name.
      const newRq = {};
      if (cpuInput.value) newRq.cpu = parseFloat(cpuInput.value);
      if (memInput.value) newRq.memory_gb = parseFloat(memInput.value);
      if (gpuInput.value) newRq.gpu = parseInt(gpuInput.value);
      if (podsInput.value) newRq.max_pods = parseInt(podsInput.value);
      if (Object.keys(newRq).length) {
        updateNamespaceField(clusterId, finalName, "resource_quota", newRq);
      } else {
        const updated = state.project.clusters.find(x => x.id === clusterId).namespaces.find(n => n.name === finalName);
        if (updated) delete updated.resource_quota;
        emit(); saveSoon();
      }
      closeModal();
    } }, ["Save"]),
  ]));
  openModal(root);
}

  kindSel.addEventListener("change", () => {
    if (protoMap[kindSel.value]) protoSel.value = protoMap[kindSel.value];
    if (csiMap[kindSel.value] && !csiInput.value) csiInput.value = csiMap[kindSel.value];

  protoSel.value = protoMap[kindSel.value] || "NFS";

  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Name"]), nameInput]));

    el("div", { class: "field" }, [el("label", {}, ["Vendor"]), vendorInput]),
    el("div", { class: "field" }, [lbl("Capacity (TB)", "storage.capacity"), capInput]),

    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),

      desc: "platform ns들에 적정 quota 자동 설정", default: true },
    { key: "backup", label: "Backup (Velero)",

//============ Architecture Templates ============
// Each template returns a complete project. Pre-includes platform
// workloads (nginx-ingress / cert-manager / metrics-server) so user
// gets a working setup without running applyClusterPreset.

function _mkPlatformWorkloads() {
  // Standard production preset workloads, returned as a flat array
  // for embedding in cluster.workloads
  const std = (name, ns, cat, replicas, cpu, mem, kind = "Deployment") => ({
    id: slug(name) + "-" + uid(),
    name, category: cat, namespace: ns,
    labels: { app: slug(name) },
    replicas, kind,
    resources: { requests: { cpu, memory_gb: mem } },
  });
  return [
    {
      ...std("ingress-nginx-controller", "ingress-nginx", "API", 2, 0.1, 0.25),
      network: { service: { type: "LoadBalancer", ports: [
        { name: "http", port: 80, target_port: 80, protocol: "TCP" },
        { name: "https", port: 443, target_port: 443, protocol: "TCP" },
      ] } },
    },
    std("cert-manager", "cert-manager", "Other", 1, 0.05, 0.128),
    {
      ...std("prometheus", "monitoring", "Other", 1, 0.5, 4, "StatefulSet"),
      persistent_volumes: [{ size_gb: 100, access_mode: "RWO", storage_class: "" }],
      network: { service: { type: "ClusterIP", ports: [{ name: "web", port: 9090, target_port: 9090, protocol: "TCP" }] } },
    },
    {
      ...std("grafana", "monitoring", "Frontend", 1, 0.1, 0.5),
      network: { service: { type: "ClusterIP", ports: [{ name: "http", port: 3000, target_port: 3000, protocol: "TCP" }] } },
    },
    {
      ...std("loki", "logging", "Other", 1, 0.5, 2, "StatefulSet"),
      persistent_volumes: [{ size_gb: 200, access_mode: "RWO", storage_class: "" }],
    },
    std("metrics-server", "kube-system", "Other", 1, 0.05, 0.128),
  ];
}

function _platformNamespaces() {
  return [
    { name: "ingress-nginx", labels: { "kubernetes.io/metadata.name": "ingress-nginx" } },
    { name: "cert-manager" },
    { name: "monitoring", default_deny: true, labels: { tier: "platform" }, resource_quota: { cpu: 8, memory_gb: 32, max_pods: 50 } },
    { name: "logging", default_deny: true, labels: { tier: "platform" }, resource_quota: { cpu: 8, memory_gb: 32, max_pods: 30 } },

function _platformNps() {

function applyTemplate(templateId, projectName) {
  const t = TEMPLATES.find(x => x.id === templateId);
  if (!t) return;
  state.project = t.apply(projectName || t.name);
  state.ui.selectedKind = state.ui.selectedId = null;
  state.ui.view = "topology";
  emit(); saveSoon();
}

function openTemplates() {
  const root = el("div");
  root.appendChild(el("h2", {}, ["Architecture Templates"]));
  root.appendChild(el("div", {
    style: { fontSize: "12px", color: "var(--text2)", marginBottom: "12px" },
  }, [
    "표준 인프라 패턴을 한 번에 생성. 기존 프로젝트는 덮어씌워집니다 — 필요시 먼저 Export 하세요.",
  ]));

  const nameInput = el("input", { value: "my-vk8s-project", placeholder: "프로젝트 이름" });
  root.appendChild(el("div", { class: "field" }, [el("label", {}, ["Project name"]), nameInput]));

  const grid = el("div", {
    style: { display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: "10px", marginTop: "10px" },
  });
  for (const t of TEMPLATES) {
    grid.appendChild(el("button", {
      style: {
        background: "var(--surface2)", border: "1px solid var(--border)",
        borderRadius: "8px", padding: "14px", cursor: "pointer",
        textAlign: "left", color: "var(--text)", fontFamily: "inherit",
        display: "flex", flexDirection: "column", gap: "6px",
      },
      onclick: () => {
        if (state.project) {
          if (!confirm("현재 프로젝트가 덮어씌워집니다. 진행?")) return;
        }
        applyTemplate(t.id, nameInput.value.trim() || t.name);
        closeModal();
      },
    }, [
      el("div", { style: { display: "flex", alignItems: "center", gap: "10px" } }, [
        el("span", { style: { fontSize: "22px" } }, [t.icon]),
        el("strong", { style: { fontSize: "14px" } }, [t.name]),
      ]),
      el("div", { style: { fontSize: "11px", color: "var(--text2)", lineHeight: "1.5" } }, [t.description]),
    ]));
  }
  root.appendChild(grid);

  root.appendChild(el("div", { class: "modal-actions" }, [
    el("button", { class: "btn-ghost", onclick: closeModal }, ["Cancel"]),
  ]));

  openModal(root);
  $("#modalContent").style.maxWidth = "720px";
}

//============ Splash ============
function renderSplash() {
  const splash = $("#splash");
  if (!state.project) splash.classList.remove("hidden");
  else                splash.classList.add("hidden");
}

function bindSplash() {
  let chosen = null;
  for (const btn of document.querySelectorAll(".mode-option")) {
    // Add ? help icon to title
    const titleEl = btn.querySelector(".title");
    if (titleEl) {
      const help = helpIcon("mode." + btn.dataset.mode);
      help.addEventListener("click", e => e.stopPropagation()); // don't toggle selection
      titleEl.appendChild(help);
    }
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-option").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      chosen = btn.dataset.mode;
      $("#btnSplashCreate").disabled = !chosen;
    });
  }
  $("#btnSplashCreate").addEventListener("click", () => {
    if (!chosen) return;
    createProject(chosen, $("#splashName").value);
  });
  $("#btnSplashImport").addEventListener("click", () => $("#fileImport").click());
  const btnTpl = $("#btnSplashTemplates");
  if (btnTpl) btnTpl.addEventListener("click", openTemplates);
}

//============ Import / Export ============
function exportProject() {
  if (!state.project) return;
  const blob = new Blob([JSON.stringify(state.project, null, 2)], { type: "application/json" });
  const a = el("a", {
    href: URL.createObjectURL(blob),
    download: `${slug(state.project.name) || "vk8s-project"}.json`,
  });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
function importProjectFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.version || !obj.mode) throw new Error("Not a vk8s project file");
      state.project = migrateProject(obj);
      state.ui.selectedKind = state.ui.selectedId = null;
      emit(); saveSoon();
    } catch (e) {
      alert("Import 실패: " + e.message);
    }
  };
  reader.readAsText(file);
}

//============ Findings strip toggle ============
// Open/close the findings panel. `filter` (null|'error'|'warn'|'info') scopes the list to one
// severity; null shows everything.
function setFindingsOpen(open, filter = null) {
  const btn = $("#btnFindings");
  const list = $("#findingsList");
  list.style.display = open ? "block" : "none";
  btn.textContent = open ? "Findings ▴" : "Findings ▾";
  document.getElementById("app").dataset.findingsExpanded = String(open);
  state.ui.findingsFilter = open ? filter : null;
  renderFindings();
}
function bindFindings() {
  const btn = $("#btnFindings");
  const list = $("#findingsList");
  const isOpen = () => list.style.display !== "none";
  // The "Findings ▾" button toggles the panel showing all severities.
  btn.addEventListener("click", () => setFindingsOpen(!isOpen(), null));
  // Clicking a severity count (errors / warnings / info) opens the panel filtered to that
  // severity — or closes it if it's already open on the same filter (a second click).
  for (const span of document.querySelectorAll(".findings-summary .count")) {
    const sev = span.dataset.sev; // 'error' | 'warn' | 'info'
    span.setAttribute("title", "클릭하면 해당 항목만 보기");
    span.addEventListener("click", () => {
      if (isOpen() && state.ui.findingsFilter === sev) setFindingsOpen(false);
      else setFindingsOpen(true, sev);
    });
  }
}

//============ Resizable left/right panels ============
// Drag the gutter at the tree↔canvas boundary to widen the tree (so long names fit), and the
// gutter at canvas↔inspector boundary for the inspector. Sizes persist to localStorage; a
// double-click on either gutter snaps that panel back to its default width.
function setupPanelResizers() {
  const root = document.documentElement;
  const DEFAULT_TREE_W = 260;
  const DEFAULT_INSP_W = 380;
  const KEY_L = "vk8s.treeW";
  const KEY_R = "vk8s.inspectorW";
  const MIN = 180;
  const minMargin = 360;  // keep the canvas at least this wide so the diagram stays usable

  // Restore persisted sizes (clamped to a sane range for the current window).
  const restore = (key, prop, def) => {
    const stored = parseInt(localStorage.getItem(key));
    const max = Math.max(MIN, window.innerWidth - minMargin - DEFAULT_INSP_W);
    const v = Number.isFinite(stored) ? Math.min(Math.max(MIN, stored), max) : def;
    root.style.setProperty(prop, v + "px");
  };
  restore(KEY_L, "--tree-w", DEFAULT_TREE_W);
  restore(KEY_R, "--inspector-w", DEFAULT_INSP_W);

  const wire = (gutter, prop, side, key, defaultW) => {
    if (!gutter) return;
    gutter.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      gutter.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      const startX = e.clientX;
      const startW = parseInt(getComputedStyle(root).getPropertyValue(prop));
      const onMove = (ev) => {
        // Left gutter grows the tree as the mouse moves right; right gutter grows the
        // inspector as the mouse moves left. `side` encodes that direction.
        const dx = (ev.clientX - startX) * (side === "left" ? 1 : -1);
        // Cap against the live window width so the canvas can't be squeezed to nothing.
        const otherW = parseInt(getComputedStyle(root).getPropertyValue(
          side === "left" ? "--inspector-w" : "--tree-w"));
        const max = Math.max(MIN, window.innerWidth - minMargin - (otherW || 0));
        const next = Math.max(MIN, Math.min(max, startW + dx));
        root.style.setProperty(prop, next + "px");
      };
      const onUp = () => {
        gutter.classList.remove("dragging");
        document.body.style.cursor = "";
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        const final = parseInt(getComputedStyle(root).getPropertyValue(prop));
        if (Number.isFinite(final)) localStorage.setItem(key, String(final));
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    // Double-click resets this panel to its default.
    gutter.addEventListener("dblclick", () => {
      root.style.setProperty(prop, defaultW + "px");
      localStorage.removeItem(key);
    });
  };
  wire($("#gutterL"), "--tree-w",      "left",  KEY_L, DEFAULT_TREE_W);
  wire($("#gutterR"), "--inspector-w", "right", KEY_R, DEFAULT_INSP_W);
}

//============ Init ============
async function init() {
  // Bind chrome events
  bindSplash();
  bindFindings();
  setupPanelResizers();
  $("#btnNewProject").addEventListener("click", () => {
    if (state.project && !confirm("현재 프로젝트를 닫고 새로 시작합니다. 계속?")) return;
    state.project = null;
    state.ui.selectedKind = state.ui.selectedId = null;
    localStorage.removeItem(STORAGE_KEY);
    emit();
  });
  $("#btnExport").addEventListener("click", exportProject);
  $("#btnImport").addEventListener("click", () => $("#fileImport").click());
  $("#btnGlossary").addEventListener("click", openGlossary);
  $("#btnTemplates").addEventListener("click", openTemplates);
  $("#fileImport").addEventListener("change", e => {
    const file = e.target.files[0];
    if (file) importProjectFromFile(file);
    e.target.value = "";
  });
  // Modal stays open until an explicit action (Close/Cancel/primary button) is clicked —
  // backdrop click and Escape do NOT close, so accidental mouse drifts during edits don't
  // discard input. Each modal's in-card buttons remain the only dismissal path.
  // Keyboard shortcuts (Escape removed deliberately)
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveSoon(); }
    if (e.key === "Delete" && state.ui.selectedId && document.activeElement.tagName !== "INPUT") {
      deleteEntity(state.ui.selectedKind, state.ui.selectedId);
    }
  });

  // Load catalog
  try {
    await loadCatalog();
  } catch (e) {
    const isFile = location.protocol === "file:";
    const hint = isFile
      ? "로컬 file:// 으로 열면 fetch가 차단됩니다. 정적 서버로 실행하세요 (예: python3 -m http.server). 또는 빌드된 dist/ 버전을 사용하세요 — dist는 카탈로그가 인라인되어 file://에서도 동작합니다."
      : "배포본에 카탈로그(data/*.json)가 포함되지 않았거나 네트워크 차단된 상태입니다. 새로고침(Ctrl+Shift+R)으로 캐시 무시 후 재시도해 보세요. 문제가 계속되면 빌드를 다시 배포하세요 (인라인 카탈로그 포함).";
    alert("Catalog 로드 실패: " + e.message + "\n\n" + hint);
    console.error(e);
    return;
  }

  // Restore project from localStorage
  const saved = loadProject();
  if (saved) state.project = saved;

  // Subscribe + initial render
  subscribe(renderAll);
  subscribe(renderSplash);
  emit();
}

init();
