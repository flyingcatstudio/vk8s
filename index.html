      const kwPct = usage.kw_max ? (usage.kw_used / usage.kw_max * 100) : 0;
      root.appendChild(el("div", { class: "section-title" }, ["Usage"]));
      root.appendChild(makeBarLine("Rack Units", `${usage.u_used} / ${usage.u_max} U`, uPct));
      root.appendChild(makeBarLine("Power",      `${usage.kw_used.toFixed(1)} / ${usage.kw_max} kW`, kwPct));
    }
  }

  root.appendChild(el("div", { class: "section-title" }, [`Nodes in this site (${s.node_ids.length})`]));
  if (!s.node_ids.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["노드가 없습니다."]));
  } else {
    for (const nid of s.node_ids) {
      const n = state.project.nodes.find(x => x.id === nid);
      if (!n) continue;
      root.appendChild(el("div", {
        class: "tree-item",
        onclick: () => selectEntity("node", nid),
      }, [
        el("span", { class: "icon" }, ["▣"]),
        el("span", { class: "label" }, [n.name]),
        el("span", { class: "meta" }, [n.spec?.form_factor || ""]),
      ]));
    }
  }

  // L4 Load Balancers
  const l4s = s.l4_balancers || [];
  const l4Title = el("div", { class: "section-title" }, [`L4 Load Balancers (${l4s.length})`]);
  l4Title.appendChild(helpIcon("l4.kind"));
  root.appendChild(l4Title);
  if (!l4s.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["L4 LB 없음"]));
  } else {
    for (const l4 of l4s) {
      root.appendChild(el("div", {
        class: "tree-item",
        onclick: () => selectEntity("l4", l4.id),
      }, [
        el("span", { class: "icon" }, ["⚖"]),
        el("span", { class: "label" }, [l4.name]),
        el("span", { class: "meta" }, [`${l4.vendor || l4.kind} ${l4.vip ? `· ${l4.vip}` : ""}`]),
      ]));
    }
  }
  root.appendChild(el("button", {
    class: "add-btn", style: { width: "100%", marginTop: "6px" },
    onclick: () => openAddL4(id),
  }, ["＋ Add L4 LB"]));

  // Storage
  const storages = s.storages || [];
  const stTitle = el("div", { class: "section-title" }, [`Storage (${storages.length})`]);
  stTitle.appendChild(helpIcon("storage.kind"));
  root.appendChild(stTitle);
  if (!storages.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["스토리지 없음"]));
  } else {
    for (const st of storages) {
      root.appendChild(el("div", {
        class: "tree-item",
        onclick: () => selectEntity("storage", st.id),
      }, [
        el("span", { class: "icon" }, ["💾"]),
        el("span", { class: "label" }, [st.name]),
        el("span", { class: "meta" }, [`${st.kind}/${st.protocol}${st.capacity_tb ? ` · ${st.capacity_tb}TB` : ""}`]),
      ]));
    }
  }
  root.appendChild(el("button", {
    class: "add-btn", style: { width: "100%", marginTop: "6px" },
    onclick: () => openAddStorage(id),
  }, ["＋ Add Storage"]));

  // Network Devices
  const ndIcon = { switch: "⇄", router: "⊞", firewall: "🛡", waf: "🛡", cdn: "🌍", vpn: "🔐", dns: "🌐", ddos: "⚠" };
  const nds = s.network_devices || [];
  root.appendChild(el("div", { class: "section-title" }, [`Network Devices (${nds.length})`]));
  if (!nds.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["네트워크 장비 없음 — 스위치/방화벽/WAF/CDN/VPN/DNS"]));
  } else {
    for (const d of nds) {
      root.appendChild(el("div", {
        class: "tree-item",
        onclick: () => selectEntity("netdev", d.id),
      }, [
        el("span", { class: "icon" }, [ndIcon[d.kind] || "▢"]),
        el("span", { class: "label" }, [d.name]),
        el("span", { class: "meta" }, [`${d.kind}${d.vendor ? ` · ${d.vendor}` : ""}`]),
      ]));
    }
  }
  root.appendChild(el("button", {
    class: "add-btn", style: { width: "100%", marginTop: "6px" },
    onclick: () => openAddNetworkDevice(id),
  }, ["＋ Add Network Device"]));

  // External Services
  const extIcon = { database: "🗄", cache: "⚡", queue: "📨", registry: "📦", backup: "💼", monitoring: "📊", logging: "📝", secret_store: "🔑", identity: "👤", object_store: "🪣", custom: "❓" };
  const exts = s.external_services || [];
  root.appendChild(el("div", { class: "section-title" }, [`External Services (${exts.length})`]));
  if (!exts.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["외부 서비스 없음 — 관리형 DB/Cache/Queue/Registry 등"]));
  } else {
    for (const e of exts) {
      root.appendChild(el("div", {
        class: "tree-item",
        onclick: () => selectEntity("extsvc", e.id),
      }, [
        el("span", { class: "icon" }, [extIcon[e.kind] || "❓"]),
        el("span", { class: "label" }, [e.name]),
        el("span", { class: "meta" }, [`${e.kind}${e.engine ? `/${e.engine}` : ""}`]),
      ]));
    }
  }
  root.appendChild(el("button", {
    class: "add-btn", style: { width: "100%", marginTop: "6px" },
    onclick: () => openAddExternalService(id),
  }, ["＋ Add External Service"]));
}

function makeBarLine(label, valueText, pct) {
  pct = Math.max(0, Math.min(100, pct));
  return el("div", { class: "field" }, [
    el("div", { class: "topo-bar-label" }, [
      el("span", {}, [label]),
      el("span", { class: "val" }, [`${pct.toFixed(0)}%  ${valueText}`]),
    ]),
    el("div", { class: "bar" }, [
      el("div", { class: "bar-fill", dataset: { level: clsLevel(pct) }, style: { width: pct + "%" } }),
    ]),
  ]);
}

function renderNodeInspector(root, id) {
  const n = state.project.nodes.find(x => x.id === id);
  if (!n) return;
  const spec = n.spec || {};
  const chassis = spec.gpu_chassis || {};
  const gpus = spec.gpu || [];
  const gpuModels = state.catalog.gpuModels;

  root.appendChild(el("div", { class: "insp-header" }, [
    el("span", { class: "kind" }, ["Node"]),
    el("span", { class: "name" }, [n.name]),
    el("button", {
      class: "delete", title: "Delete node",
      onclick: () => { if (confirm(`노드 '${n.name}' 삭제?`)) deleteEntity("node", id); },
    }, ["🗑"]),
  ]));

  root.appendChild(el("div", { class: "field" }, [
    el("label", {}, ["Name"]),
    el("input", {
      "data-focus-key": `node.${id}.name`,
      value: n.name,
      oninput: e => updateNodeField(id, "name", e.target.value),
    }),
  ]));

  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [
      el("label", {}, ["Brand · Model"]),
      el("div", { class: "field-readonly" }, [`${n.brand} · ${n.model}`]),
    ]),
    el("div", { class: "field" }, [
      el("label", {}, ["Source"]),
      el("div", { class: "field-readonly" }, [n.source]),
    ]),
  ]));

  // Site selector
  const siteOpts = state.project.sites.filter(s => s.kind === n.source).map(s =>
    el("option", { value: s.id, selected: s.id === n.site_id ? "" : null }, [s.name + (s.kind === "cloud" ? ` (${s.region || ""})` : "")]));
  root.appendChild(el("div", { class: "field" }, [
    el("label", {}, ["Site"]),
    el("select", {
      onchange: e => moveNodeToSite(id, e.target.value),
    }, siteOpts),
  ]));

  // Purpose
  root.appendChild(el("div", { class: "field" }, [
    lbl("Purpose", "node.purpose"),
    el("select", {
      onchange: e => updateNodeField(id, "purpose", e.target.value),
    }, ["compute", "bastion", "storage", "edge"].map(p =>
      el("option", { value: p, selected: p === (n.purpose || "compute") ? "" : null }, [p]))),
  ]));

  // Network IP
  const ipVal = n.network?.ip || "";
  root.appendChild(el("div", { class: "field" }, [
    lbl("Management IP", "node.ip"),
    el("input", {
      "data-focus-key": `node.${id}.ip`,
      value: ipVal,
      placeholder: "192.168.10.11 (cluster 할당 시 자동)",
      oninput: e => updateNodeField(id, "network.ip", e.target.value),
    }),
  ]));

  // Network interfaces (multi-NIC)
  const ifaces = n.network?.interfaces || [];
  root.appendChild(el("div", { class: "section-title" }, [`Network Interfaces (${ifaces.length})`]));
  for (let i = 0; i < ifaces.length; i++) {
    const ifc = ifaces[i];
    root.appendChild(el("div", {
      style: { background: "var(--surface2)", border: "1px solid var(--border)", borderRadius: "5px", padding: "8px 10px", marginBottom: "6px" },
    }, [
      el("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 70px auto", gap: "6px", alignItems: "end" } }, [
        el("div", { class: "field", style: { margin: 0 } }, [
          el("label", { style: { fontSize: "10px" } }, ["name"]),
          el("input", {
            "data-focus-key": `node.${id}.iface.${i}.name`,
            style: { padding: "4px 6px", fontSize: "11px" },
            value: ifc.name || "",
            oninput: e => {
              const ns = [...ifaces]; ns[i] = { ...ns[i], name: e.target.value };
              updateNodeField(id, "network.interfaces", ns);
            },
          }),
        ]),
        el("div", { class: "field", style: { margin: 0 } }, [
          el("label", { style: { fontSize: "10px" } }, ["IP"]),
          el("input", {
            "data-focus-key": `node.${id}.iface.${i}.ip`,
            style: { padding: "4px 6px", fontSize: "11px" },
            value: ifc.ip || "",
            oninput: e => {
              const ns = [...ifaces]; ns[i] = { ...ns[i], ip: e.target.value };
              updateNodeField(id, "network.interfaces", ns);
            },
          }),
        ]),
        el("div", { class: "field", style: { margin: 0 } }, [
          el("label", { style: { fontSize: "10px" } }, ["VLAN"]),
          el("input", {
            "data-focus-key": `node.${id}.iface.${i}.vlan`,
            type: "number", style: { padding: "4px 6px", fontSize: "11px" },
            value: ifc.vlan || "",
            oninput: e => {
              const ns = [...ifaces]; ns[i] = { ...ns[i], vlan: parseInt(e.target.value) || undefined };
              updateNodeField(id, "network.interfaces", ns);
            },
          }),
        ]),
        el("button", {
          class: "x", style: { padding: "4px 8px" },
          onclick: () => {
            const ns = ifaces.filter((_, j) => j !== i);
            updateNodeField(id, "network.interfaces", ns);
          },
        }, ["✕"]),
      ]),
      el("div", { class: "field", style: { margin: "4px 0 0", display: "flex", gap: "6px", alignItems: "center" } }, [
        el("label", { style: { fontSize: "10px", margin: 0 } }, ["purpose"]),
        el("select", {
          style: { padding: "3px 6px", fontSize: "11px", flex: 1 },
          onchange: e => {
            const ns = [...ifaces]; ns[i] = { ...ns[i], purpose: e.target.value || undefined };
            updateNodeField(id, "network.interfaces", ns);
          },
        }, [
          el("option", { value: "" }, ["(none)"]),
          ...["mgmt", "pod", "storage", "external"].map(p =>
            el("option", { value: p, selected: p === ifc.purpose ? "" : null }, [p])),
        ]),
      ]),
    ]));
  }
  root.appendChild(el("button", {
    class: "add-btn", style: { width: "100%", marginTop: "4px" },
    onclick: () => {
      const ns = [...ifaces, { name: `eth${ifaces.length}`, ip: "", purpose: "mgmt" }];
      updateNodeField(id, "network.interfaces", ns);
    },
  }, ["＋ Add Interface"]));

  // Cluster
  const myCluster = getNodeCluster(id);
  const clusters = state.project.clusters || [];
  root.appendChild(el("div", { class: "field" }, [
    el("label", {}, ["Cluster"]),
    el("select", {
      onchange: e => {
        const v = e.target.value;
        if (v === "__none__") {
          if (myCluster) removeNodeFromCluster(id, myCluster.id);
        } else {
          assignNodeToCluster(id, v);
        }
      },
    }, [
      el("option", { value: "__none__", selected: !myCluster ? "" : null }, ["(unassigned)"]),
      ...clusters.map(c =>
        el("option", { value: c.id, selected: myCluster && myCluster.id === c.id ? "" : null }, [c.name])),
    ]),
  ]));

  // Cluster roles (multi-select, only meaningful when assigned)
  const roles = Array.isArray(n.cluster_roles) ? n.cluster_roles : [];
  const rolesField = el("div", { class: "field" }, [
    lbl("Cluster Roles", "node.cluster_roles"),
    el("div", {
      style: { display: "flex", flexWrap: "wrap", gap: "8px", padding: "6px 0" },
    }, ["control-plane", "worker", "etcd"].map(r => {
      const checked = roles.includes(r);
      return el("label", {
        style: {
          display: "inline-flex", alignItems: "center", gap: "6px",
          padding: "4px 10px", borderRadius: "5px",
          background: checked ? "var(--accent-glow)" : "var(--surface2)",
          border: "1px solid " + (checked ? "var(--accent)" : "var(--border)"),
          fontSize: "12px", textTransform: "none", letterSpacing: 0,
          color: "var(--text)", cursor: myCluster ? "pointer" : "not-allowed",
          margin: 0, opacity: myCluster ? 1 : 0.5,
        },
      }, [
        el("input", {
          type: "checkbox",
          checked: checked ? "" : null,
          disabled: myCluster ? null : "",
          onchange: e => setNodeRoleEnabled(id, r, e.target.checked),
        }),
        r,
        helpIcon("role." + r),
      ]);
    })),
  ]);
  root.appendChild(rolesField);
  if (!myCluster) {
    root.appendChild(el("div", { class: "empty-hint" }, ["클러스터 할당 후 역할 지정 가능"]));
  } else if (roles.length === 0) {
    root.appendChild(el("div", { style: { fontSize: "11px", color: "var(--yellow)", padding: "4px 0" } }, [
      "▲ 역할이 없습니다. 클러스터에 속하지만 어떤 일도 안 합니다.",
    ]));
  } else if (roles.length > 1) {
    root.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text2)", padding: "4px 0", fontStyle: "italic" } }, [
      `💡 ${roles.join(" + ")} 겸용 — dev/단일노드 클러스터에서 일반적인 패턴`,
    ]));
  }

  // Spec
  root.appendChild(el("div", { class: "section-title" }, ["Spec"]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [
      el("label", {}, ["vCPU"]),
      el("div", { class: "field-readonly" }, [String(spec.vcpu || 0)]),
    ]),
    el("div", { class: "field" }, [
      el("label", {}, ["Memory (GB)"]),
      el("div", { class: "field-readonly" }, [String(spec.memory_gb || 0)]),
    ]),
  ]));
  if (spec.form_factor || spec.power) {
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Form factor", "node.form_factor"),
        el("div", { class: "field-readonly" }, [spec.form_factor || "—"]),
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Typical Power (W)"]),
        el("div", { class: "field-readonly" }, [
          String(computeNodePowerW(n, gpuModels)) + " W"
        ]),
      ]),
    ]));
  }

  // GPU
  if ((chassis.max_count || 0) > 0 || gpus.length) {
    const gpuTitle = el("div", { class: "section-title" }, ["GPU"]);
    gpuTitle.appendChild(helpIcon("gpu.chassis"));
    if (n.source === "onprem") gpuTitle.appendChild(helpIcon("node.gpu_install"));
    root.appendChild(gpuTitle);
    const chassisDesc = `Chassis: max ${chassis.max_count || 0} · ${(chassis.supported_form_factors || []).join("/") || "—"} · ${chassis.nvlink_topology || "none"}`;
    const supports = `Supports: ${(chassis.supported_models || []).join(", ") || "—"}`;
    const chassisInfo = el("div", { class: "chassis-info" }, [
      el("strong", {}, [chassisDesc]), el("br"), supports,
    ]);
    const topo = chassis.nvlink_topology || "none";
    if (topo !== "none") chassisInfo.appendChild(helpIcon("gpu.topology." + topo));
    root.appendChild(chassisInfo);

    // Slot + power budget bars (onprem only — cloud has fixed GPU)
    const totalGpu = gpus.reduce((a, g) => a + (g.count || 0), 0);
    const maxGpu = chassis.max_count || 0;
    const psuMax = n.spec.power?.psu_max_w || 0;
    const powerW = computeNodePowerW(n, gpuModels);
    if (n.source === "onprem" && (maxGpu > 0 || psuMax > 0)) {
      const bars = el("div", { class: "topo-site-bars", style: { marginTop: "8px" } }, [
        maxGpu > 0 ? makeBarLine("GPU slots", `${totalGpu}/${maxGpu}`, maxGpu > 0 ? totalGpu / maxGpu * 100 : 0) : null,
        psuMax > 0 ? makeBarLine("PSU", `${powerW}/${psuMax} W`, psuMax > 0 ? powerW / psuMax * 100 : 0) : null,
      ]);
      root.appendChild(bars);
    }

    if (n.source === "cloud") {
      // Cloud: read-only display
      for (let i = 0; i < gpus.length; i++) {
        const g = gpus[i];
        const ginfo = gpuModels[g.model] || {};
        root.appendChild(el("div", { class: "gpu-config" }, [
          el("div", { style: { fontSize: "12px", marginBottom: "6px" } }, [
            el("strong", {}, [g.model]),
            ` ×${g.count}  ${g.form_factor || ginfo.form_factor || ""}  ${ginfo.vram_gb ? `· ${ginfo.vram_gb}GB VRAM` : ""}`,
            g.nvlink_enabled ? el("span", { style: { color: "var(--purple)" } }, [" · NVLink"]) : null,
          ]),
          el("div", { style: { fontSize: "11px", color: "var(--text2)" } }, [
            ginfo.tdp_w ? `TDP ${ginfo.tdp_w}W × ${g.count} = ${(ginfo.tdp_w * g.count) / 1000}kW total` : "",
          ]),
        ]));
      }
      if (gpus.length) {
        root.appendChild(el("div", { class: "empty-hint" }, ["Cloud 인스턴스는 GPU 구성 고정 (인스턴스 타입에 묶임)"]));
      }
    } else {
      // Onprem: editable rows
      const supportedModels = (chassis.supported_models || []).filter(m =>
        !gpuModels[m] || (chassis.supported_form_factors || []).includes(gpuModels[m].form_factor)
      );
      for (let i = 0; i < gpus.length; i++) {
        root.appendChild(renderGpuRowEditable(n, i, supportedModels, gpuModels));
      }
      const remaining = maxGpu - totalGpu;
      if (gpus.length === 0 && maxGpu > 0) {
        root.appendChild(el("div", { class: "empty-hint" }, ["GPU 슬롯 비어있음"]));
      }
      if (remaining > 0 && supportedModels.length > 0) {
        root.appendChild(el("button", {
          class: "add-btn", style: { width: "100%", marginTop: "6px" },
          onclick: () => addNodeGpu(id),
        }, ["＋ Add GPU"]));
      } else if (remaining <= 0 && maxGpu > 0) {
        root.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text3)", padding: "4px", fontStyle: "italic", textAlign: "center" } }, [
          "모든 슬롯 사용 중. 추가하려면 기존 GPU 수를 줄이거나 큰 새시 사용",
        ]));
      }
    }
  }

  // Compatibility check
  const issues = checkNodeCompatibility(spec, gpuModels);
  if (issues.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Findings (this node)"]));
    const list = el("div", { class: "compat-result" });
    for (const i of issues) {
      const cls = i.sev === "err" ? "err" : (i.sev === "warn" ? "warn" : "ok");
      list.appendChild(el("div", { class: cls }, [`${i.sev === "err" ? "⊗" : "▲"} ${i.msg}`]));
    }
    root.appendChild(list);
  }
}

    class: "add-btn",
    style: { width: "100%", marginBottom: "12px" },
    onclick: () => openClusterPreset(id),
  }, ["⚙ Apply Production Preset…"]));

  // Network section
  const net = c.network || {};
  const netTitle = el("div", { class: "section-title" }, ["Network"]);
  netTitle.appendChild(helpIcon("cluster.network"));
  root.appendChild(netTitle);
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [
      lbl("Pod CIDR", "cluster.pod_cidr"),
      el("input", {
        "data-focus-key": `cluster.${id}.pod_cidr`,
        value: net.pod_cidr || "", placeholder: "10.244.0.0/16",
        oninput: e => updateClusterField(id, "network.pod_cidr", e.target.value),
      }),
    ]),
    el("div", { class: "field" }, [
      lbl("Service CIDR", "cluster.service_cidr"),
      el("input", {
        "data-focus-key": `cluster.${id}.service_cidr`,
        value: net.service_cidr || "", placeholder: "10.96.0.0/12",
        oninput: e => updateClusterField(id, "network.service_cidr", e.target.value),
      }),
    ]),
  ]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [
      lbl("Node Subnet", "cluster.node_subnet"),
      el("input", {
        "data-focus-key": `cluster.${id}.node_subnet`,
        value: net.node_subnet || "", placeholder: "192.168.10.0/24",
        oninput: e => updateClusterField(id, "network.node_subnet", e.target.value),
      }),
    ]),
    el("div", { class: "field" }, [
      lbl("DNS Domain", "cluster.dns_domain"),
      el("input", {
        "data-focus-key": `cluster.${id}.dns_domain`,
        value: net.dns_domain || "", placeholder: "cluster.local",
        oninput: e => updateClusterField(id, "network.dns_domain", e.target.value),
      }),
    ]),
  ]));
  root.appendChild(el("div", { class: "field" }, [
    lbl("LoadBalancer Pool (optional)", "cluster.lb_pool"),
    el("input", {
      "data-focus-key": `cluster.${id}.lb_pool`,
      value: net.lb_pool || "", placeholder: "192.168.20.0/24 (MetalLB 등 — onprem)",
      oninput: e => updateClusterField(id, "network.lb_pool", e.target.value),
    }),
  ]));

  // Ingress Rules section
  const irules = c.ingress_rules || [];
  const irTitle = el("div", { class: "section-title" }, [`Ingress Rules (${irules.length})`]);
  irTitle.appendChild(helpIcon("cluster.ingress_rules"));
  root.appendChild(irTitle);
  if (!irules.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["Ingress 룰 없음. 외부 HTTP(S) 라우팅이 필요하면 추가."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const r of irules) {
      const numPaths = (r.paths || []).length;
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, [r.tls ? "🔒" : "🌐"]),
        el("span", { class: "name", style: { fontSize: "12px", fontFamily: "JetBrains Mono" } }, [
          `${r.tls ? "https" : "http"}://${r.host}`,
        ]),
        el("span", { style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" } }, [`${numPaths} path${numPaths === 1 ? "" : "s"}`]),
        el("button", {
          class: "x", onclick: () => { if (confirm(`'${r.name}' 삭제?`)) deleteIngressRule(id, r.id); },
        }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }
  if ((c.workloads || []).length) {
    root.appendChild(el("button", {
      class: "add-btn", style: { width: "100%", marginTop: "6px" },
      onclick: () => openAddIngressRule(id),
    }, ["＋ Add Ingress Rule"]));
  } else {
    root.appendChild(el("div", { class: "empty-hint" }, ["워크로드 추가 후 ingress 룰 가능"]));
  }

  // Nodes assigned
  const assignedNodes = (c.node_ids || []).map(nid => state.project.nodes.find(n => n.id === nid)).filter(Boolean);
  root.appendChild(el("div", { class: "section-title" }, [`Nodes in cluster (${assignedNodes.length})`]));
  if (!assignedNodes.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["할당된 노드가 없습니다. 아래에서 추가하세요."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const n of assignedNodes) {
      const roles = Array.isArray(n.cluster_roles) ? n.cluster_roles : [];
      const roleChips = el("div", { style: { display: "flex", gap: "4px" } }, ["control-plane", "worker", "etcd"].map(r => {
        const checked = roles.includes(r);
        const label = r === "control-plane" ? "cp" : r === "worker" ? "w" : "etcd";
        return el("label", {
          title: r,
          style: {
            display: "inline-flex", alignItems: "center", gap: "3px",
            padding: "1px 5px", borderRadius: "3px",
            background: checked ? "var(--accent-glow)" : "var(--surface3)",
            border: "1px solid " + (checked ? "var(--accent)" : "var(--border)"),
            fontSize: "10px", color: checked ? "var(--accent)" : "var(--text2)",
            fontFamily: "JetBrains Mono", cursor: "pointer", margin: 0,
            textTransform: "none", letterSpacing: 0,
          },
        }, [
          el("input", {
            type: "checkbox",
            style: { width: "10px", height: "10px", margin: 0 },
            checked: checked ? "" : null,
            onchange: e => setNodeRoleEnabled(n.id, r, e.target.checked),
          }),
          label,
        ]);
      }));
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, ["▣"]),
        el("span", { class: "name", style: { cursor: "pointer" }, onclick: () => selectEntity("node", n.id) }, [n.name]),
        n.network?.ip ? el("span", {
          style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" },
        }, [n.network.ip]) : null,
        roleChips,
        el("button", { class: "x", title: "remove", onclick: () => removeNodeFromCluster(n.id, id) }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }

  // Available nodes (not in any cluster)
  const available = state.project.nodes.filter(n => !getNodeCluster(n.id));
  if (available.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Add nodes"]));
    const list = el("div", { class: "checkbox-list" });
    for (const n of available) {
      const site = state.project.sites.find(s => s.id === n.site_id);
      list.appendChild(el("label", {}, [
        el("input", {
          type: "checkbox",
          onchange: e => {
            if (e.target.checked) assignNodeToCluster(n.id, id);
          },
        }),
        el("span", {}, [n.name]),
        el("span", { class: "meta" }, [`${n.brand} · ${site?.name || ""}`]),
      ]));
    }
    root.appendChild(list);
  }

  // Quick stats
  const totals = assignedNodes.reduce((acc, n) => {
    acc.cpu += n.spec?.vcpu || 0;
    acc.mem += n.spec?.memory_gb || 0;
    acc.gpu += (n.spec?.gpu || []).reduce((a, g) => a + (g.count || 0), 0);
    return acc;
  }, { cpu: 0, mem: 0, gpu: 0 });
  if (assignedNodes.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Cluster totals"]));
    root.appendChild(el("div", { class: "compat-result" }, [
      el("div", {}, [`Total: ${totals.cpu} vCPU · ${totals.mem} GB RAM · ${totals.gpu} GPUs`]),
    ]));
  }

  // Namespaces
  const namespaces = c.namespaces || [];
  const nsTitle = el("div", { class: "section-title" }, [`Namespaces (${namespaces.length})`]);
  nsTitle.appendChild(helpIcon("namespace.name"));
  root.appendChild(nsTitle);
  if (!namespaces.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["네임스페이스 없음. 워크로드는 'default'에 배치됩니다."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const ns of namespaces) {
      const wlInNs = (c.workloads || []).filter(w => (w.namespace || "default") === ns.name).length;
      const rq = ns.resource_quota || {};
      const rqText = rq.cpu || rq.memory_gb ? `${rq.cpu || "—"}c/${rq.memory_gb || "—"}GB` : "no quota";
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, [ns.default_deny ? "🔒" : "▦"]),
        el("span", { class: "name" }, [ns.name]),
        el("span", { style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" } }, [`${wlInNs}w · ${rqText}`]),
        el("label", {
          style: { fontSize: "10px", color: ns.default_deny ? "var(--orange)" : "var(--text3)", display: "flex", alignItems: "center", gap: "3px", margin: 0, textTransform: "none", letterSpacing: 0, cursor: "pointer" },
        }, [
          el("input", {
            type: "checkbox",
            style: { width: "10px", height: "10px", margin: 0 },
            checked: ns.default_deny ? "" : null,
            onchange: e => updateNamespaceField(id, ns.name, "default_deny", e.target.checked),
          }),
          "deny",
        ]),
        el("button", {
          class: "x", title: "edit quota",
          style: { fontSize: "10px" },
          onclick: () => openEditNamespace(id, ns.name),
        }, ["⚙"]),
        el("button", {
          class: "x", onclick: () => { if (confirm(`'${ns.name}' 삭제? (워크로드는 default로 이동)`)) deleteNamespace(id, ns.name); },
        }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }
  root.appendChild(el("button", {
    class: "add-btn", style: { width: "100%", marginTop: "6px" },
    onclick: () => openAddNamespace(id),
  }, ["＋ Add Namespace"]));

  // Network Policies
  const nps = c.network_policies || [];
  const npTitle = el("div", { class: "section-title" }, [`Network Policies (${nps.length})`]);
  npTitle.appendChild(helpIcon("networkpolicy.preset"));
  root.appendChild(npTitle);
  if (!nps.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["NP 없음. 모든 ns 간 통신 자유."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const np of nps) {
      let presetDesc = "custom";
      if (np.preset === "default-deny") presetDesc = "🔒 deny all";
      else if (np.preset === "allow-from-same-ns") presetDesc = `same-ns →`;
      else if (np.preset === "allow-from-namespace") presetDesc = `${(np.ingress?.[0]?.from_namespaces || ["?"]).join(",")} →`;
      else if (np.preset === "allow-from-ingress") presetDesc = `🌐 ingress →`;
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, ["🔗"]),
        el("span", { class: "name", style: { fontSize: "11px" } }, [`${presetDesc} ${np.namespace}`]),
        el("button", {
          class: "x", onclick: () => { if (confirm(`'${np.name}' 삭제?`)) deleteNetworkPolicy(id, np.id); },
        }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }
  if (namespaces.length) {
    root.appendChild(el("button", {
      class: "add-btn", style: { width: "100%", marginTop: "6px" },
      onclick: () => openAddNetworkPolicy(id),
    }, ["＋ Add Network Policy"]));
  }

  // Workloads
  const workloads = c.workloads || [];
  root.appendChild(el("div", { class: "section-title" }, [`Workloads (${workloads.length})`]));
  if (workloads.length === 0) {
    root.appendChild(el("div", { class: "empty-hint" }, ["워크로드가 없습니다."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const w of workloads) {
      const reqs = w.resources?.requests || {};
      const totalCpu = (reqs.cpu || 0) * (w.replicas || 1);
      const totalMem = (reqs.memory_gb || 0) * (w.replicas || 1);
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, ["◇"]),
        el("span", { class: "name", style: { cursor: "pointer" }, onclick: () => selectEntity("workload", w.id) }, [w.name]),
        el("span", { style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" } }, [
          `×${w.replicas} ${totalCpu}c ${totalMem}G`,
        ]),
        el("button", { class: "x", title: "remove", onclick: () => { if (confirm(`'${w.name}' 삭제?`)) deleteWorkload(w.id); } }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }
  root.appendChild(el("button", {
    class: "add-btn",
    style: { marginTop: "8px", width: "100%" },
    onclick: () => openAddWorkload(c.id),
  }, ["＋ Add Workload"]));

  // Findings preview (basic checks)
  const cpCount = assignedNodes.filter(n => (n.cluster_roles || []).includes("control-plane")).length;
  const issues = [];
  if (assignedNodes.length && cpCount === 0) issues.push({ sev: "err", msg: "control plane 노드 없음" });
  if (c.ha_control_plane && cpCount > 0 && cpCount < 3) issues.push({ sev: "err", msg: `HA control plane은 ≥3 필요 (현재 ${cpCount})` });
  if (c.ha_control_plane && cpCount >= 3 && cpCount % 2 === 0) issues.push({ sev: "warn", msg: `control plane ${cpCount}개 (짝수). etcd 쿼럼은 홀수 권장` });
  const hasGpu = assignedNodes.some(n => (n.spec?.gpu || []).length > 0 || (n.spec?.gpu_chassis?.max_count || 0) > 0);
  if (hasGpu && !c.addons?.gpu_operator) issues.push({ sev: "warn", msg: "GPU 노드 있음 — GPU Operator 활성화 권장" });
  // mixed environments
  const sites = new Set(assignedNodes.map(n => state.project.sites.find(s => s.id === n.site_id)?.kind).filter(Boolean));
  if (sites.size > 1) issues.push({ sev: "warn", msg: "한 클러스터가 cloud+onprem 양쪽에 걸침" });

  if (issues.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Findings (this cluster)"]));
    const list = el("div", { class: "compat-result" });
    for (const i of issues) {
      const cls = i.sev === "err" ? "err" : "warn";
      list.appendChild(el("div", { class: cls }, [`${i.sev === "err" ? "⊗" : "▲"} ${i.msg}`]));
    }
    root.appendChild(list);
  }
}

      type: "checkbox", checked: l4.ha ? "" : null,

    el("span", {}, ["HA (active-active 또는 active-passive)"]),
    helpIcon("l4.ha"),

  // Target clusters multi-select
  const clusters = state.project.clusters || [];
  if (clusters.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Targets (clusters)"]));

    for (const c of clusters) {
      const sel = (l4.target_cluster_ids || []).includes(c.id);
      list.appendChild(el("label", {}, [
        el("input", {
          type: "checkbox", checked: sel ? "" : null,
          onchange: e => {
            const cur = new Set(l4.target_cluster_ids || []);

            updateL4Field(id, "target_cluster_ids", Array.from(cur));
          },
        }),
        el("span", {}, [c.name]),
        el("span", { class: "meta" }, [`${(c.node_ids || []).length}n`]),
      ]));
    }
    root.appendChild(list);
  }

  root.appendChild(el("div", { class: "section-title" }, ["Site"]));
  root.appendChild(el("div", { class: "field-readonly" }, [site.name]));
}

function renderWorkloadInspector(root, id) {
  const found = findWorkload(id);
  if (!found) return;
  const { workload: w, cluster } = found;
  const totalCpu = (w.resources?.requests?.cpu || 0) * (w.replicas || 1);
  const totalMem = (w.resources?.requests?.memory_gb || 0) * (w.replicas || 1);
  const gpuReq = w.resources?.requests?.gpu;

  root.appendChild(el("div", { class: "insp-header" }, [
    el("span", { class: "kind" }, ["Workload"]),
    el("span", { class: "name" }, [w.name]),
    el("button", {
      class: "delete", title: "Delete workload",
      onclick: () => { if (confirm(`'${w.name}' 삭제?`)) deleteWorkload(id); },
    }, ["🗑"]),
  ]));

  // Tabs
  if (!state.ui.workloadTab) state.ui.workloadTab = "basic";
  const tabs = ["basic", "resources", "runtime", "network", "deps"];
  const tabBar = el("div", {
    style: { display: "flex", gap: "2px", borderBottom: "1px solid var(--border)", marginBottom: "12px" },
  }, tabs.map(t =>
    el("button", {
      class: "view-tab" + (state.ui.workloadTab === t ? " active" : ""),
      style: { padding: "6px 12px", fontSize: "11px" },
      onclick: () => { state.ui.workloadTab = t; emit(); },
    }, [t.charAt(0).toUpperCase() + t.slice(1)])
  ));
  root.appendChild(tabBar);

  if (state.ui.workloadTab === "basic") {
    root.appendChild(el("div", { class: "field" }, [
      el("label", {}, ["Name"]),
      el("input", {
        "data-focus-key": `workload.${id}.name`,
        value: w.name,
        oninput: e => updateWorkloadField(id, "name", e.target.value),
      }),
    ]));
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Category", "workload.category"),
        el("select", { onchange: e => updateWorkloadField(id, "category", e.target.value) },
          ["Frontend","API","WAS","DB","Cache","Queue","ML-Inference","ML-Training","Video","Batch","Other"].map(v =>
            el("option", { value: v, selected: v === w.category ? "" : null }, [v]))),
      ]),
      el("div", { class: "field" }, [
        lbl("Kind", "workload.kind"),
        el("select", { onchange: e => updateWorkloadField(id, "kind", e.target.value) },
          ["Deployment","StatefulSet","DaemonSet","Job","CronJob"].map(v =>
            el("option", { value: v, selected: v === (w.kind || "Deployment") ? "" : null }, [v]))),
      ]),
    ]));
    // Namespace dropdown — based on cluster's namespaces
    const cnsNames = (cluster.namespaces || []).map(n => n.name);
    if (!cnsNames.includes("default")) cnsNames.unshift("default");
    const currentNs = w.namespace || "default";
    if (!cnsNames.includes(currentNs)) cnsNames.push(currentNs);
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Replicas", "workload.replicas"),
        el("input", {
          "data-focus-key": `workload.${id}.replicas`,
          type: "number", min: "1", value: w.replicas || 1,
          oninput: e => updateWorkloadField(id, "replicas", parseInt(e.target.value) || 1),
        }),
      ]),
      el("div", { class: "field" }, [
        lbl("Namespace", "namespace.name"),
        el("select", {
          "data-focus-key": `workload.${id}.namespace`,
          onchange: e => updateWorkloadField(id, "namespace", e.target.value),
        }, cnsNames.map(n => el("option", { value: n, selected: n === currentNs ? "" : null }, [n]))),
      ]),
    ]));
    root.appendChild(el("div", { class: "field" }, [
      el("label", {}, ["Cluster"]),
      el("div", { class: "field-readonly" }, [cluster.name]),
    ]));
  }
  else if (state.ui.workloadTab === "resources") {
    const reqs = w.resources?.requests || {};
    root.appendChild(el("div", { class: "section-title" }, ["Per-pod requests"]));
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("CPU (cores)", "resources.cpu"),
        el("input", {
          "data-focus-key": `workload.${id}.cpu`,
          type: "number", min: "0", step: "0.1", value: reqs.cpu || 0,
          oninput: e => updateWorkloadField(id, "resources.requests.cpu", parseFloat(e.target.value) || 0),
        }),
      ]),
      el("div", { class: "field" }, [
        lbl("Memory (GB)", "resources.memory"),
        el("input", {
          "data-focus-key": `workload.${id}.memory`,
          type: "number", min: "0", step: "0.5", value: reqs.memory_gb || 0,
          oninput: e => updateWorkloadField(id, "resources.requests.memory_gb", parseFloat(e.target.value) || 0),
        }),
      ]),
    ]));

    // GPU section
    root.appendChild(el("div", { class: "section-title" }, ["GPU (선택)"]));
    const gpuModels = state.catalog.gpuModels;
    const gpuReq = reqs.gpu || {};
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("GPU count", "resources.gpu_count"),
        el("input", {
          "data-focus-key": `workload.${id}.gpu_count`,
          type: "number", min: "0", value: gpuReq.count || 0,
          oninput: e => {
            const cnt = parseInt(e.target.value) || 0;
            if (cnt > 0) updateWorkloadField(id, "resources.requests.gpu", { ...gpuReq, count: cnt });
            else updateWorkloadField(id, "resources.requests.gpu", undefined);
          },
        }),
      ]),
      el("div", { class: "field" }, [
        lbl("GPU model (선택)", "resources.gpu_model"),
        el("select", { onchange: e => {
          const model = e.target.value || undefined;
          if (gpuReq.count) updateWorkloadField(id, "resources.requests.gpu", { ...gpuReq, model });
        }}, [
          el("option", { value: "" }, ["(any)"]),
          ...Object.keys(gpuModels).map(k =>
            el("option", { value: k, selected: gpuReq.model === k ? "" : null }, [k])),
        ]),
      ]),
    ]));

    root.appendChild(el("div", { class: "section-title" }, ["Cluster total"]));
    root.appendChild(el("div", { class: "compat-result" }, [
      el("div", {}, [`${totalCpu} vCPU · ${totalMem} GB RAM · ${gpuReq.count ? `${gpuReq.count * (w.replicas || 1)} GPUs` : "no GPU"}`]),
      el("div", { style: { color: "var(--text2)" } }, [`(per pod × ${w.replicas} replicas)`]),
    ]));

    // Persistent Volumes
    const pvs = w.persistent_volumes || [];
    root.appendChild(el("div", { class: "section-title" }, [`Persistent Volumes (${pvs.length})`, helpIcon("workload.pvc")]));
    for (let i = 0; i < pvs.length; i++) {
      const pv = pvs[i];
      root.appendChild(el("div", {
        style: { background: "var(--surface2)", border: "1px solid var(--border)", borderRadius: "5px", padding: "8px 10px", marginBottom: "6px" },
      }, [
        el("div", { style: { display: "grid", gridTemplateColumns: "70px 1fr 90px auto", gap: "6px", alignItems: "end" } }, [
          el("div", { class: "field", style: { margin: 0 } }, [
            el("label", { style: { fontSize: "10px" } }, ["size GB"]),
            el("input", {
              "data-focus-key": `workload.${id}.pvc.${i}.size`,
              type: "number", min: "0", style: { padding: "4px 6px", fontSize: "11px" },
              value: pv.size_gb || 0,
              oninput: e => {
                const ns = [...pvs]; ns[i] = { ...ns[i], size_gb: parseFloat(e.target.value) || 0 };
                updateWorkloadField(id, "persistent_volumes", ns);
              },
            }),
          ]),
          el("div", { class: "field", style: { margin: 0 } }, [
            el("label", { style: { fontSize: "10px" } }, ["storage_class"]),
            el("input", {
              "data-focus-key": `workload.${id}.pvc.${i}.sc`,
              style: { padding: "4px 6px", fontSize: "11px" },
              value: pv.storage_class || "",
              placeholder: "gp3 / nfs-csi",
              oninput: e => {
                const ns = [...pvs]; ns[i] = { ...ns[i], storage_class: e.target.value };
                updateWorkloadField(id, "persistent_volumes", ns);
              },
            }),
          ]),
          el("div", { class: "field", style: { margin: 0 } }, [
            el("label", { style: { fontSize: "10px" } }, ["access"]),
            el("select", {
              style: { padding: "3px 4px", fontSize: "11px" },
              onchange: e => {
                const ns = [...pvs]; ns[i] = { ...ns[i], access_mode: e.target.value };
                updateWorkloadField(id, "persistent_volumes", ns);
              },
            }, ["RWO", "ROX", "RWX"].map(am =>
              el("option", { value: am, selected: am === (pv.access_mode || "RWO") ? "" : null }, [am]))),
          ]),
          el("button", {
            class: "x", style: { padding: "4px 8px" },
            onclick: () => {
              const ns = pvs.filter((_, j) => j !== i);
              updateWorkloadField(id, "persistent_volumes", ns);
            },
          }, ["✕"]),
        ]),
      ]));
    }
    root.appendChild(el("button", {
      class: "add-btn", style: { width: "100%", marginTop: "4px" },
      onclick: () => {
        const ns = [...pvs, { size_gb: 10, access_mode: "RWO", storage_class: "" }];
        updateWorkloadField(id, "persistent_volumes", ns);
      },
    }, ["＋ Add PVC"]));
  }
  else if (state.ui.workloadTab === "runtime") {
    const r = w.runtime || {};
    const presets = state.catalog.runtime || {};
    root.appendChild(el("div", { class: "field" }, [
      lbl("Apply preset", "workload.runtime_preset"),
      el("select", {
        onchange: e => {
          const k = e.target.value;
          if (!k) return;
          const p = presets[k];
          if (!p) return;
          const newRt = JSON.parse(JSON.stringify(p));
          delete newRt.notes;
          updateWorkloadField(id, "runtime", newRt);
        }}, [
          el("option", { value: "" }, ["(preset 선택…)"]),
          ...Object.keys(presets).map(k =>
            el("option", { value: k }, [`${k} — ${presets[k].framework || presets[k].language}`])),

    root.appendChild(el("div", { class: "field-row" }, [

        el("label", {}, ["Framework"]),

          "data-focus-key": `workload.${id}.runtime.framework`,
          value: r.framework || "",
          oninput: e => updateWorkloadField(id, "runtime.framework", e.target.value),
        }),
      ]),
    ]));

    const conc = r.concurrency || {};
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Concurrency model", "runtime.concurrency_model"),
        el("select", { onchange: e => updateWorkloadField(id, "runtime.concurrency.model", e.target.value || undefined) }, [
          el("option", { value: "" }, ["(none)"]),

function renderGpuRowEditable(n, idx, supportedModels, gpuModels) {
  const g = n.spec.gpu[idx];
  const ginfo = gpuModels[g.model] || {};
  const chassis = n.spec.gpu_chassis || {};
  // Max for THIS row = total max - other rows total
  const otherCount = (n.spec.gpu || []).reduce((a, gg, i) => a + (i === idx ? 0 : (gg.count || 0)), 0);
  const myMax = Math.max(1, (chassis.max_count || 0) - otherCount);
  const showNvlink = chassis.nvlink_topology !== "none" && (ginfo.nvlink_capable !== false);

  const modelSel = el("select", {
    style: { padding: "5px 8px", background: "var(--surface3)", border: "1px solid var(--border)", color: "var(--text)", borderRadius: "4px", fontSize: "12px" },
    onchange: e => updateNodeGpu(n.id, idx, { model: e.target.value }),
  }, supportedModels.length
    ? supportedModels.map(m => el("option", { value: m, selected: m === g.model ? "" : null }, [m]))
    : [el("option", { value: g.model, selected: "" }, [g.model])]
  );

  const countInput = el("input", {
    "data-focus-key": `node.${n.id}.gpu.${idx}.count`,
    type: "number", min: "1", max: String(myMax), value: g.count,
    style: { padding: "5px 6px", background: "var(--surface3)", border: "1px solid var(--border)", color: "var(--text)", borderRadius: "4px", fontSize: "12px", width: "60px", textAlign: "center" },
    oninput: e => {
      let v = parseInt(e.target.value) || 1;
      if (v < 1) v = 1;
      if (v > myMax) { v = myMax; e.target.value = String(myMax); }
      updateNodeGpu(n.id, idx, { count: v });
    },
  });

  const nvlinkToggle = showNvlink
    ? el("label", {
        style: { display: "flex", alignItems: "center", gap: "4px", margin: 0, fontSize: "11px", textTransform: "none", letterSpacing: 0, color: g.nvlink_enabled ? "var(--purple)" : "var(--text3)", padding: "0 6px" },
      }, [
        el("input", {
          type: "checkbox",
          checked: g.nvlink_enabled ? "" : null,
          onchange: e => updateNodeGpu(n.id, idx, { nvlink_enabled: e.target.checked }),
        }),
        "NVLink",
      ])
    : el("span", { style: { fontSize: "10px", color: "var(--text3)", padding: "0 6px" } }, [""]);

  const headRow = el("div", {
    style: { display: "grid", gridTemplateColumns: "1fr 70px auto auto", gap: "6px", alignItems: "center" },
  }, [
    modelSel,
    countInput,
    nvlinkToggle,
    el("button", {
      class: "x", title: "remove",
      style: { background: "transparent", border: "none", color: "var(--text3)", cursor: "pointer", padding: "4px 8px" },
      onclick: () => removeNodeGpu(n.id, idx),
    }, ["✕"]),
  ]);

  const tdp = ginfo.tdp_w || 0;
  const totalKw = tdp * g.count / 1000;
  const tdpLine = el("div", {
    style: { fontSize: "10px", color: "var(--text3)", marginTop: "4px", fontFamily: "JetBrains Mono" },
  }, [
    `${ginfo.form_factor || g.form_factor || "?"}`,
    tdp ? `  ·  ${g.count}×${tdp}W = ${totalKw.toFixed(1)}kW` : "",
    ginfo.vram_gb ? `  ·  ${g.count * ginfo.vram_gb}GB VRAM total` : "",
  ]);

  return el("div", {
    style: { background: "var(--surface2)", border: "1px solid var(--border)", borderRadius: "5px", padding: "8px 10px", marginBottom: "6px" },
  }, [headRow, tdpLine]);
}

function moveNodeToSite(nodeId, newSiteId) {
  const n = state.project.nodes.find(x => x.id === nodeId);
  if (!n || n.site_id === newSiteId) return;
  // remove from old
  state.project.sites.forEach(s => s.node_ids = s.node_ids.filter(id => id !== nodeId));
  n.site_id = newSiteId;
  const news = state.project.sites.find(s => s.id === newSiteId);
  if (news) news.node_ids.push(nodeId);
  emit(); saveSoon();
}

  const toolbar = el("div", {
    style: { display: "flex", gap: "6px", marginBottom: "10px", alignItems: "center", flexWrap: "wrap" },
  }, [
    el("span", { style: { fontSize: "11px", color: "var(--text2)", marginRight: "4px" } }, ["View:"]),
    el("button", {
      class: "view-tab" + (mode === "grid" ? " active" : ""),

      onclick: () => { state.ui.topologyMode = "grid"; emit(); },

    el("button", {
      class: "view-tab" + (mode === "diagram" ? " active" : ""),

    el("span", { style: { flex: 1 } }, []),
    el("span", { style: { fontSize: "10px", color: "var(--text3)", fontStyle: "italic" } }, [
      mode === "diagram" ? "여러 연결 레이어를 켜고 끌 수 있습니다" : "사이트별 카드 + 노드 그리드",
    ]),
  ]);
  root.appendChild(toolbar);

  // Layer toggles (Diagram only)
  if (mode === "diagram") {
    if (!state.ui.topologyLayers) {
      state.ui.topologyLayers = { compute: true, network: false, services: false, ingress: false, sites: true };
    }
    const layers = state.ui.topologyLayers;
    const layerInfo = [
      { key: "compute",  label: "Compute",  desc: "L4→Worker · Storage→Node", color: "var(--accent)" },
      { key: "network",  label: "Network",  desc: "Firewall→L4 · Switch↔Node", color: "var(--orange)" },
      { key: "services", label: "Services", desc: "External Service → Cluster", color: "var(--purple)" },
      { key: "ingress",  label: "Ingress",  desc: "외부 호스트 → 클러스터", color: "var(--green)" },
      { key: "sites",    label: "Sites",    desc: "Site Link 연결", color: "var(--accent)" },
    ];
    const layersBar = el("div", {
      style: { display: "flex", gap: "8px", marginBottom: "16px", alignItems: "center", flexWrap: "wrap" },
    }, [
      el("span", { style: { fontSize: "11px", color: "var(--text2)" } }, ["Show:"]),
      ...layerInfo.map(l => {
        const active = !!layers[l.key];
        return el("label", {
          title: l.desc,
          style: {
            display: "inline-flex", alignItems: "center", gap: "5px",
            padding: "4px 10px", borderRadius: "5px", margin: 0,
            background: active ? "var(--accent-glow)" : "var(--surface2)",
            border: "1px solid " + (active ? l.color : "var(--border)"),
            color: active ? l.color : "var(--text2)",
            cursor: "pointer", fontSize: "11px",
            textTransform: "none", letterSpacing: 0,

        }, [
          el("input", {
            type: "checkbox",
            style: { width: "12px", height: "12px", margin: 0 },

          l.label,
        ]);
      }),
    ]);
    root.appendChild(layersBar);
  }

  if (mode === "diagram") return renderTopologyDiagram(root, p);
  return renderTopologyGrid(root, p);
