  emit(); saveSoon();
}

// Edit a numeric spec field (vcpu/memory_gb); marks node as custom when changed from template.
// Ignores in-progress input ("", "1.", "-") so the user can type decimals without the re-render
// snapping them back to a partial value.
function updateNodeSpecNumber(id, key, raw) {
  const n = state.project.nodes.find(x => x.id === id);
  if (!n) return;
  const s = String(raw).trim();
  if (s === "") return;
  let num;
  if (key === "vcpu") {
    if (!/^\d+$/.test(s)) return;
    num = parseInt(s, 10);
    if (!Number.isFinite(num) || num < 1) return;
  } else {
    if (!/^\d+(\.\d+)?$/.test(s)) return; // reject "1.", ".5", "1e2" — let the user finish typing
    num = parseFloat(s);
    if (!Number.isFinite(num) || num <= 0) return;
  }
  if (!n.spec) n.spec = {};
  if (n.spec[key] === num) return;
  n.spec[key] = num;
  if (!isNodeSpecMatchingCatalog(n)) n.custom = true;
  emit(); saveSoon();
}

// Compare node.spec.vcpu and memory_gb against catalog template. Returns true if both match.
function isNodeSpecMatchingCatalog(n) {
  const tmpl = state.catalog.entries.find(e => e.key === n.model);
  if (!tmpl) return false;
  return (n.spec?.vcpu === tmpl.spec.vcpu) && (n.spec?.memory_gb === tmpl.spec.memory_gb);
}

function resetNodeSpecToCatalog(id) {
  const n = state.project.nodes.find(x => x.id === id);
  if (!n) return;
  const tmpl = state.catalog.entries.find(e => e.key === n.model);
  if (!tmpl) return;
  // Preserve GPU edits — only reset vcpu/memory_gb (the user-editable scalars).
  n.spec.vcpu = tmpl.spec.vcpu;
  n.spec.memory_gb = tmpl.spec.memory_gb;
  if (isNodeSpecMatchingCatalog(n)) n.custom = false;
  emit(); saveSoon();
}

function updateSiteField(id, path, value) {
  const s = state.project.sites.find(x => x.id === id);
  if (!s) return;
  const parts = path.split(".");
  let obj = s;
  while (parts.length > 1) {
    const p = parts.shift();
    if (obj[p] == null) obj[p] = {};
    obj = obj[p];
  }
  obj[parts[0]] = value;
  emit(); saveSoon();
}

//============ Validator ============
// Returns array of findings: { id, sev:'error'|'warn'|'info', msg, scope:{kind,id}, helpId? }
function runValidator(project) {
  if (!project) return [];
  const findings = [];
  const gpuModels = state.catalog.gpuModels;
  const F = (id, sev, msg, scope, helpId) => findings.push({ id, sev, msg, scope, helpId });

  // 1. Project: mode vs site kind
  for (const s of project.sites || []) {
    if (project.mode === "onprem" && s.kind !== "onprem")
      F("MODE_SITE_KIND_CONFLICT", "error", `Site '${s.name}': onprem 모드인데 cloud Site`, { kind: "site", id: s.id });
    if (project.mode === "cloud" && s.kind !== "cloud")
      F("MODE_SITE_KIND_CONFLICT", "error", `Site '${s.name}': cloud 모드인데 onprem Site`, { kind: "site", id: s.id });
  }

  // 2. Node GPU compatibility (chassis vs installed) + power
  for (const n of project.nodes || []) {
    const chassis = n.spec?.gpu_chassis || {};
    const gpus = n.spec?.gpu || [];
    const total = gpus.reduce((a, g) => a + (g.count || 0), 0);
    if (total > 0 && (chassis.max_count || 0) === 0) {
      F("GPU_CHASSIS_NOT_SUPPORTED", "error", `${n.name}: 이 새시는 GPU 미지원`, { kind: "node", id: n.id });
    }
    if (total > (chassis.max_count || 0) && (chassis.max_count || 0) > 0) {
      F("GPU_COUNT_EXCEEDS_CHASSIS", "error",
        `${n.name}: GPU ${total}장 > 새시 max ${chassis.max_count}`, { kind: "node", id: n.id });
    }
    for (const g of gpus) {
      if (g.form_factor && !(chassis.supported_form_factors || []).includes(g.form_factor)) {
        F("GPU_FORM_FACTOR_MISMATCH", "error",
          `${n.name}: ${g.model} 폼팩터(${g.form_factor}) 미지원`, { kind: "node", id: n.id });
      }
      if (g.model && (chassis.supported_models || []).length && !(chassis.supported_models || []).includes(g.model)) {
        F("GPU_MODEL_NOT_IN_CHASSIS_LIST", "error",
          `${n.name}: ${g.model}이 새시 목록에 없음`, { kind: "node", id: n.id });
      }
      if (g.nvlink_enabled && chassis.nvlink_topology === "none") {
        F("NVLINK_ON_NONE_TOPOLOGY", "error",
          `${n.name}: NVLink 미지원 새시인데 NVLink 활성`, { kind: "node", id: n.id });
      }
      // NVLink Bridge: 2장 페어링만 가능
      if (g.nvlink_enabled && chassis.nvlink_topology === "bridge-pair" && (g.count > 2 || g.count % 2 !== 0)) {
        F("NVLINK_BRIDGE_PAIR_LIMIT", "warn",
          `${n.name}: NVLink Bridge는 2장 페어링만 (${g.model} ×${g.count})`, { kind: "node", id: n.id });
      }
    }
    // SXM/NVSwitch는 보통 fully populated 권장
    if (chassis.nvlink_topology === "nvswitch-mesh" && total > 0 && total < (chassis.max_count || 0)) {
      F("NVLINK_SXM_NOT_FULLY_POPULATED", "warn",
        `${n.name}: SXM/NVSwitch 새시는 보통 ${chassis.max_count}장 fully populated 권장 (현재 ${total})`, { kind: "node", id: n.id });
    }
    // Node-level PSU power check (onprem only)
    if (n.source === "onprem") {
      const psu = n.spec?.power?.psu_max_w || 0;
      const used = computeNodePowerW(n, gpuModels);
      if (psu > 0 && used > psu) {
        F("NODE_POWER_EXCEEDS_PSU", "error",
          `${n.name}: ${used}W 요구 > PSU 정격 ${psu}W`, { kind: "node", id: n.id }, "node.gpu_power_budget");
      } else if (psu > 0 && used > psu * 0.9) {
        F("NODE_POWER_NEAR_PSU", "warn",
          `${n.name}: ${used}W (PSU ${(used / psu * 100).toFixed(0)}%) — 헤드룸 부족`, { kind: "node", id: n.id }, "node.gpu_power_budget");
      }
    }
  }

  // 3. Site capacity (onprem)
  for (const s of project.sites || []) {
    if (s.kind !== "onprem") continue;
    const usage = siteUsage(s, project, gpuModels);
    if (!usage) continue;
    if (usage.u_max && usage.u_used > usage.u_max) {
      F("SITE_RACK_UNITS_EXCEEDED", "error",
        `${s.name}: ${usage.u_used}U 요구, ${usage.u_max}U 가용`, { kind: "site", id: s.id }, "site.rack_units");
    }
    if (usage.kw_max && usage.kw_used > usage.kw_max) {
      F("SITE_POWER_EXCEEDED", "error",
        `${s.name}: ${usage.kw_used.toFixed(1)}kW 요구, ${usage.kw_max}kW 예산`, { kind: "site", id: s.id }, "site.power_kw");
    } else if (usage.kw_max && usage.kw_used / usage.kw_max >= 0.9) {
      F("SITE_POWER_HIGH_UTILIZATION", "warn",
        `${s.name}: 전력 ${(usage.kw_used / usage.kw_max * 100).toFixed(0)}% — 헤드룸 부족`, { kind: "site", id: s.id });
    }
  }

  // 4. Cluster checks
  for (const c of project.clusters || []) {
    const nodes = (c.node_ids || []).map(id => project.nodes.find(n => n.id === id)).filter(Boolean);
    if (!nodes.length) {
      // A cluster with workloads but zero nodes can't schedule anything — surface it in the
      // findings bar instead of silently skipping (otherwise it only shows in the Capacity view).
      if ((c.workloads || []).length) {
        F("CLUSTER_NO_NODES", "error",
          `${c.name}: 노드가 없음 — 워크로드 ${c.workloads.length}개 전부 스케줄 불가 (노드를 할당하세요)`,
          { kind: "cluster", id: c.id }, "node.cluster_roles");
      }
      continue;
    }
    const roleOf = n => Array.isArray(n.cluster_roles) ? n.cluster_roles : [];
    const cp = nodes.filter(n => roleOf(n).includes("control-plane")).length;
    if (cp === 0) {
      F("CLUSTER_NO_CONTROL_PLANE", "error",
        `${c.name}: control plane 노드 없음`, { kind: "cluster", id: c.id });
    }
    if (c.ha_control_plane && cp > 0 && cp < 3) {
      F("HA_CONTROL_PLANE_NOT_ENOUGH", "error",
        `${c.name}: HA control plane은 ≥3 필요 (현재 ${cp})`, { kind: "cluster", id: c.id }, "cluster.ha_control_plane");
    }
    if (c.ha_control_plane && cp >= 3 && cp % 2 === 0) {
      F("HA_CONTROL_PLANE_EVEN_NUMBER", "warn",
        `${c.name}: control plane ${cp}개 (짝수). etcd 쿼럼은 홀수 권장`, { kind: "cluster", id: c.id });
    }
    // GPU node + no operator
    const hasGpu = nodes.some(n => (n.spec?.gpu || []).length > 0 || (n.spec?.gpu_chassis?.max_count || 0) > 0);
    if (hasGpu && !c.addons?.gpu_operator) {
      F("GPU_NODE_NO_GPU_OPERATOR", "warn",
        `${c.name}: GPU 노드 보유 — GPU Operator 권장`, { kind: "cluster", id: c.id }, "cluster.gpu_operator");
    }
    // Mixed environments
    const sites = new Set(nodes.map(n => project.sites.find(s => s.id === n.site_id)?.kind).filter(Boolean));
    if (sites.size > 1) {
      F("CLUSTER_SPANS_ENVIRONMENTS", "warn",
        `${c.name}: cloud+onprem 양쪽에 걸침`, { kind: "cluster", id: c.id });
    }
    // No CNI
    if (!c.addons?.cni || c.addons.cni === "None") {
      F("NO_CNI_SELECTED", "warn",
        `${c.name}: CNI 미선택 — Pod 네트워킹 불가`, { kind: "cluster", id: c.id }, "cluster.cni");
    }

    // 5. Workload checks (per cluster)
    // Worker capacity: nodes with 'worker' role (so control-plane+worker dual-role contributes)
    const wls = c.workloads || [];
    const workerNodes = nodes.filter(n => roleOf(n).includes("worker"));
    const totalCpu = workerNodes.reduce((a, n) => a + (n.spec?.vcpu || 0), 0);
    const totalMem = workerNodes.reduce((a, n) => a + (n.spec?.memory_gb || 0), 0);
    const wlCpu = wls.reduce((a, w) => a + (w.resources?.requests?.cpu || 0) * (w.replicas ?? 1), 0);
    const wlMem = wls.reduce((a, w) => a + (w.resources?.requests?.memory_gb || 0) * (w.replicas ?? 1), 0);
    if (wls.length && totalCpu > 0 && wlCpu > totalCpu) {
      F("WORKLOAD_CPU_NOT_SCHEDULABLE", "error",
        `${c.name}: 워크로드 CPU ${wlCpu.toFixed(1)}c > 가용 ${totalCpu}c`, { kind: "cluster", id: c.id });
    }
    if (wls.length && totalMem > 0 && wlMem > totalMem) {
      F("WORKLOAD_MEM_NOT_SCHEDULABLE", "error",
        `${c.name}: 워크로드 RAM ${wlMem.toFixed(0)}GB > 가용 ${totalMem}GB`, { kind: "cluster", id: c.id });
    }

    // No worker capacity at all but workloads exist
    if (wls.length && workerNodes.length === 0) {
      F("CLUSTER_NO_WORKER", "error",
        `${c.name}: worker 역할 노드가 없음 — 워크로드 스케줄 불가`, { kind: "cluster", id: c.id }, "node.cluster_roles");
    }

    // GPU workload but no GPU node (VRAM-aware: VRAM mode if gpu.vram_gb is set, else legacy count)
    for (const w of wls) {
      const gReq = w.resources?.requests?.gpu;
      if (!gReq) continue;
      const vramReq = gReq.vram_gb || 0;
      const vramMode = vramReq > 0;
      const totalAvailGpu = workerNodes.reduce((a, n) =>
        a + (n.spec?.gpu || []).reduce((aa, g) => aa + (g.count || 0), 0), 0);
      const totalAvailVram = workerNodes.reduce((a, n) =>
        a + (n.spec?.gpu || []).reduce((aa, g) =>
          aa + (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0), 0), 0);

      if (vramMode) {
        const totalNeededVram = vramReq * (w.replicas ?? 1);
        if (totalAvailGpu === 0) {
          F("WORKLOAD_GPU_NO_NODE", "error",
            `${w.name}: GPU 요구하나 클러스터에 GPU 없음`, { kind: "workload", id: w.id });
        } else if (totalNeededVram > totalAvailVram) {
          F("WORKLOAD_GPU_VRAM_INSUFFICIENT", "error",
            `${w.name}: VRAM ${totalNeededVram}GB 요구, ${totalAvailVram}GB 가용`, { kind: "workload", id: w.id });
        }
      } else {
        const totalNeeded = (gReq.count || 0) * (w.replicas ?? 1);
        if (totalNeeded > 0 && totalAvailGpu === 0) {
          F("WORKLOAD_GPU_NO_NODE", "error",
            `${w.name}: GPU 요구하나 클러스터에 GPU 없음`, { kind: "workload", id: w.id });
        }
        if (totalNeeded > totalAvailGpu && totalAvailGpu > 0) {
          F("WORKLOAD_GPU_INSUFFICIENT", "error",
            `${w.name}: GPU ${totalNeeded}장 요구, ${totalAvailGpu}장 가용`, { kind: "workload", id: w.id });
        }
      }
      if (gReq.model) {
        const have = workerNodes.some(n => (n.spec?.gpu || []).some(g => g.model === gReq.model));
        if (!have) {
          F("WORKLOAD_GPU_MODEL_NOT_AVAILABLE", "error",
            `${w.name}: ${gReq.model} 요구, worker 노드에 없음`, { kind: "workload", id: w.id });
        } else if (vramMode) {
          const modelVramAvail = workerNodes.reduce((a, n) =>
            a + (n.spec?.gpu || []).reduce((aa, g) =>
              aa + (g.model === gReq.model ? (g.count || 0) * (gpuModels[g.model]?.vram_gb || 0) : 0), 0), 0);
          const modelVramNeeded = vramReq * (w.replicas ?? 1);
          if (modelVramNeeded > modelVramAvail) {
            F("WORKLOAD_GPU_MODEL_VRAM_INSUFFICIENT", "error",
              `${w.name}: ${gReq.model} VRAM ${modelVramNeeded}GB 요구, ${modelVramAvail}GB 가용`, { kind: "workload", id: w.id });
          }
        }
      }
    }

    // Workload-level rules
    for (const w of wls) {
      // SPOF
      if ((w.replicas ?? 1) === 1 && ["API", "WAS", "DB", "Cache", "Queue"].includes(w.category)) {
        F("SPOF_RISK", "warn",
          `${w.name}: replicas=1, ${w.category} (SPOF 위험)`, { kind: "workload", id: w.id });
      }

      // ---- HA topology checks (stateful workloads only) ----
      if (HA_STATEFUL_CATS.has(w.category)) {
        const haMode = w.ha?.mode || "none";
        // Stateful workload with no HA topology at all → suggest setting one.
        if (haMode === "none" && (w.replicas ?? 1) === 1) {
          F("WORKLOAD_STATEFUL_NO_HA", "warn",
            `${w.name}: stateful 워크로드인데 HA topology 미설정 — Primary-Replica/Sentinel/Sharded 검토`,
            { kind: "workload", id: w.id }, "workload.ha.mode");
        }
        // HA topology set but anti-affinity missing — pods can still land on the same node.
        if (haMode !== "none" && (w.scheduling?.anti_affinity || "none") === "none") {
          F("WORKLOAD_STATEFUL_NO_ANTI_AFFINITY", "warn",
            `${w.name}: HA mode=${haMode}인데 anti-affinity 없음 — 같은 노드에 몰리면 HA 효과 없음`,
            { kind: "workload", id: w.id }, "workload.scheduling.anti_affinity");
        }
        // Sentinel needs an odd quorum ≥ 3 (typical: 3 or 5).
        if (haMode === "sentinel") {
          const q = w.ha?.quorum_count ?? 0;
          if (q < 3) {
            F("WORKLOAD_SENTINEL_QUORUM_LOW", "error",
              `${w.name}: Sentinel quorum=${q} — 홀수 ≥3 필요 (3 또는 5 권장)`,
              { kind: "workload", id: w.id }, "workload.ha.quorum_count");
          } else if (q % 2 === 0) {
            F("WORKLOAD_SENTINEL_QUORUM_EVEN", "warn",
              `${w.name}: Sentinel quorum=${q}이 짝수 — split-brain 방지를 위해 홀수 권장`,
              { kind: "workload", id: w.id }, "workload.ha.quorum_count");
          }
        }
        // Sharded cluster typical minimum is 3 shards.
        if (haMode === "sharded-cluster") {
          const p = w.ha?.primaries ?? 0;
          if (p < 3) {
            F("WORKLOAD_SHARDED_TOO_SMALL", "warn",
              `${w.name}: Sharded cluster shards=${p} — 권장 최소 3 shard`,
              { kind: "workload", id: w.id }, "workload.ha.primaries");
          }
        }
        // HA DB must have persistent storage — otherwise replicated data has nowhere to live.
        if (haMode !== "none" && w.category === "DB" && !(w.persistent_volumes || []).length) {
          F("WORKLOAD_HA_NO_STORAGE", "warn",
            `${w.name}: HA DB는 공유/분산 PV 필요 — persistent_volumes 비어있음`,
            { kind: "workload", id: w.id }, "workload.persistent_volumes");
        }
      }
      // replicas_max sanity:
      //   - max cannot be 0 (schema enforces minimum=1, but check defensively).
      //   - max must be ≥ replicas when both are explicit (min may legitimately be 0).
      const _minRep = w.replicas ?? 1;
      if (w.replicas_max != null && w.replicas_max < 1) {
        F("WORKLOAD_REPLICAS_MAX_INVALID", "error",
          `${w.name}: replicas_max(${w.replicas_max})는 0일 수 없습니다`,
          { kind: "workload", id: w.id }, "workload.replicas");
      } else if (w.replicas_max != null && w.replicas_max < _minRep) {
        F("WORKLOAD_REPLICAS_MAX_LT_MIN", "error",
          `${w.name}: replicas_max(${w.replicas_max}) < replicas(${_minRep}) — max는 min 이상이어야 합니다`,
          { kind: "workload", id: w.id }, "workload.replicas");
      }
      // JVM heap > memory request → OOM 보장
      const heap = w.runtime?.concurrency?.heap_gb;
      const mem = w.resources?.requests?.memory_gb;
      if (heap && mem && heap > mem) {
        F("JVM_HEAP_GT_REQUEST", "error",
          `${w.name}: heap ${heap}GB > memory ${mem}GB → OOMKilled 보장`, { kind: "workload", id: w.id }, "runtime.heap_gb");
      } else if (heap && mem && heap < mem * 0.5) {
        F("JVM_HEAP_TOO_SMALL", "warn",
          `${w.name}: heap ${heap}GB가 memory ${mem}GB의 절반 미만`, { kind: "workload", id: w.id }, "runtime.heap_gb");
      }
    }

    // Node not in any cluster but has cluster_role (shouldn't normally happen)
  }

  // 6. Node integrity
  for (const n of project.nodes || []) {
    const inCluster = (project.clusters || []).filter(c => (c.node_ids || []).includes(n.id));
    if (inCluster.length > 1) {
      F("NODE_IN_MULTIPLE_CLUSTERS", "error",
        `${n.name}: ${inCluster.length}개 클러스터에 속함`, { kind: "node", id: n.id });
    }
  }

  // 7a. Cluster network: CIDR overlap + node IP integrity
  for (const c of project.clusters || []) {
    const net = c.network || {};
    const cidrs = ["pod_cidr", "service_cidr", "node_subnet"]
      .map(k => ({ name: k, val: net[k], parsed: parseCidr(net[k]) }))
      .filter(x => x.parsed);
    for (let i = 0; i < cidrs.length; i++) {
      for (let j = i + 1; j < cidrs.length; j++) {
        const a = cidrs[i], b = cidrs[j];
        // overlap if ranges intersect
        const aEnd = a.parsed.network + a.parsed.size - 1;
        const bEnd = b.parsed.network + b.parsed.size - 1;
        if (a.parsed.network <= bEnd && b.parsed.network <= aEnd) {
          F("CLUSTER_CIDR_OVERLAP", "error",
            `${c.name}: ${a.name} (${a.val})와 ${b.name} (${b.val}) 범위 겹침`,
            { kind: "cluster", id: c.id }, "cluster.network");
        }
      }
    }
    // Node IP checks
    const nodeIps = new Map(); // ip → nodeName
    for (const nid of c.node_ids || []) {
      const n = project.nodes.find(x => x.id === nid);
      if (!n?.network?.ip) continue;
      const ip = n.network.ip;
      // Duplicate
      if (nodeIps.has(ip)) {
        F("NODE_IP_DUPLICATE", "error",
          `${n.name}: IP ${ip} 중복 (다른 노드: ${nodeIps.get(ip)})`,
          { kind: "node", id: n.id }, "node.ip");
      } else {
        nodeIps.set(ip, n.name);
      }
      // Out of node_subnet
      if (net.node_subnet && !ipInCidr(ip, net.node_subnet)) {
        F("NODE_IP_OUT_OF_SUBNET", "warn",
          `${n.name}: IP ${ip}가 ${net.node_subnet} 밖`,
          { kind: "node", id: n.id }, "node.ip");
      }
    }

    // 7b. Workload service + NodePort
    const nodePortsUsed = new Map();
    for (const w of c.workloads || []) {
      const svc = w.network?.service;
      if (!svc) continue;
      // ClusterIP within service_cidr
      if (svc.cluster_ip && net.service_cidr && !ipInCidr(svc.cluster_ip, net.service_cidr)) {
        F("SERVICE_IP_OUT_OF_CIDR", "warn",
          `${w.name}: cluster_ip ${svc.cluster_ip}가 service_cidr ${net.service_cidr} 밖`,
          { kind: "workload", id: w.id }, "service.cluster_ip");
      }
      // NodePort range + duplicates
      for (const p of svc.ports || []) {
        if (p.node_port == null) continue;
        if (p.node_port < 30000 || p.node_port > 32767) {
          F("NODE_PORT_OUT_OF_RANGE", "warn",
            `${w.name}: node_port ${p.node_port}는 30000-32767 권장 범위 밖`,
            { kind: "workload", id: w.id }, "service.node_port");
        }
        if (nodePortsUsed.has(p.node_port)) {
          F("NODE_PORT_DUPLICATE", "error",
            `${w.name}: node_port ${p.node_port} 중복 (${nodePortsUsed.get(p.node_port)})`,
            { kind: "workload", id: w.id });
        } else {
          nodePortsUsed.set(p.node_port, w.name);
        }
      }
      // LoadBalancer in onprem without lb_pool
      if (svc.type === "LoadBalancer" && !net.lb_pool) {
        const onpremNode = (c.node_ids || []).some(nid => {
          const n = project.nodes.find(x => x.id === nid);
          return n?.source === "onprem";
        });
        if (onpremNode) {
          F("LB_ONPREM_NO_POOL", "warn",
            `${w.name}: onprem LoadBalancer인데 cluster.network.lb_pool 미설정 (MetalLB 등 필요)`,
            { kind: "workload", id: w.id }, "cluster.lb_pool");
        }
      }
    }

    // 7c. Ingress rules validation
    const seenHosts = new Map();
    for (const r of c.ingress_rules || []) {
      if (seenHosts.has(r.host)) {
        F("INGRESS_HOST_DUPLICATE", "warn",
          `Ingress: host '${r.host}' 중복 (${seenHosts.get(r.host)})`,
          { kind: "cluster", id: c.id });
      } else {
        seenHosts.set(r.host, r.name);
      }
      for (const p of r.paths || []) {
        const target = (c.workloads || []).find(w => w.id === p.workload_id);
        if (!target) {
          F("INGRESS_TARGET_NOT_FOUND", "error",
            `Ingress '${r.host}${p.path}': 대상 workload 없음`,
            { kind: "cluster", id: c.id });
          continue;
        }
        const svc = target.network?.service;
        if (!svc || svc.type === "None") {
          F("INGRESS_TARGET_NO_SERVICE", "error",
            `Ingress '${r.host}${p.path}': '${target.name}'에 Service 미설정 (Network 탭)`,
            { kind: "workload", id: target.id }, "service.type");
        } else {
          const portMatch = (svc.ports || []).some(sp => sp.port === p.port);
          if (!portMatch) {
            F("INGRESS_PORT_MISMATCH", "warn",
              `Ingress '${r.host}${p.path}': port ${p.port}이 '${target.name}' service ports에 없음`,
              { kind: "workload", id: target.id });
          }
        }
      }
    }
  }

  // 7. Namespace + NetworkPolicy
  for (const c of project.clusters || []) {
    const declared = new Set((c.namespaces || []).map(n => n.name));
    declared.add("default"); // implicit
    // Workload namespace declared?
    for (const w of c.workloads || []) {
      const ns = w.namespace || "default";
      if (!declared.has(ns)) {
        F("WORKLOAD_NAMESPACE_NOT_DECLARED", "warn",
          `${w.name}: namespace '${ns}' 미선언 — cluster.namespaces에 추가 권장`,
          { kind: "workload", id: w.id }, "namespace.name");
      }
    }
    // default_deny without any allow rules
    for (const ns of c.namespaces || []) {
      if (!ns.default_deny) continue;
      const nsNps = (c.network_policies || []).filter(np => np.namespace === ns.name);
      const hasAllow = nsNps.some(np =>
        np.preset === "allow-from-same-ns" ||
        np.preset === "allow-from-namespace" ||
        np.preset === "allow-from-ingress" ||
        (Array.isArray(np.ingress) && np.ingress.length)
      );
      if (!hasAllow) {
        F("NS_DEFAULT_DENY_NO_ALLOW", "warn",
          `${c.name}/${ns.name}: default-deny인데 allow 룰 없음 — 모든 트래픽 차단됨`,
          { kind: "cluster", id: c.id }, "namespace.default_deny");
      }
    }
    // NetworkPolicy referencing nonexistent namespace
    for (const np of c.network_policies || []) {
      if (!declared.has(np.namespace)) {
        F("NETPOL_TARGET_NS_NOT_FOUND", "warn",
          `NP '${np.name}': 대상 namespace '${np.namespace}' 없음`,
          { kind: "cluster", id: c.id });
      }
      const fromNs = (np.ingress || []).flatMap(r => r.from_namespaces || []);
      for (const fns of fromNs) {
        if (!declared.has(fns) && fns !== "ingress-nginx") {
          F("NETPOL_FROM_NS_NOT_FOUND", "warn",
            `NP '${np.name}': from-ns '${fns}' 없음`,
            { kind: "cluster", id: c.id });
        }
      }
    }
  }

  return findings;
}

//============ Compatibility check (subset for Add Node preview) ============
function checkNodeCompatibility(spec, gpuModels) {
  const issues = [];
  const chassis = spec.gpu_chassis || {};
  const installed = spec.gpu || [];
  const totalGpu = installed.reduce((a, g) => a + (g.count || 0), 0);

  if (totalGpu > 0 && (chassis.max_count || 0) === 0) {
    issues.push({ sev: "err", msg: "이 새시는 GPU 미지원" });
  }
  if (totalGpu > (chassis.max_count || 0)) {
    issues.push({ sev: "err", msg: `GPU ${totalGpu}장 > 새시 max_count ${chassis.max_count || 0}` });
  }
  for (const g of installed) {
    if (g.form_factor && !(chassis.supported_form_factors || []).includes(g.form_factor)) {
      issues.push({ sev: "err", msg: `${g.model}: 폼팩터 ${g.form_factor} 미지원 (${(chassis.supported_form_factors||[]).join(",") || "none"})` });
    }
    if (g.model && !(chassis.supported_models || []).includes(g.model)) {
      issues.push({ sev: "err", msg: `${g.model}: 새시 supported_models에 없음` });
    }
    if (g.nvlink_enabled && chassis.nvlink_topology === "none") {
      issues.push({ sev: "err", msg: `${g.model}: NVLink 미지원 새시` });
    }
    if (g.nvlink_enabled && chassis.nvlink_topology === "bridge-pair" && (g.count > 2 || g.count % 2 !== 0)) {
      issues.push({ sev: "warn", msg: `NVLink Bridge는 2장 페어링만` });
    }
  }
  return issues;
}

//============ Power calc ============
function computeNodePowerW(node, gpuModels) {
  const spec = node.spec || {};
  const base = (spec.power && spec.power.typical_w_base) || 0;
  let gpuW = 0;
  for (const g of (spec.gpu || [])) {
    const ginfo = gpuModels[g.model];
    if (ginfo) gpuW += (g.count || 0) * (ginfo.tdp_w || 0);
  }
  const diskCount = (spec.disks || []).reduce((a, d) => a + (d.count || 1), 0);
  return base + gpuW + diskCount * 10;
}
function siteFormFactorU(formFactor) {
  if (!formFactor || formFactor === "Tower") return 0;
  const m = String(formFactor).match(/^(\d+)U$/);
  return m ? parseInt(m[1]) : 0;
}
function siteUsage(site, project, gpuModels) {
  if (site.kind !== "onprem") return null;
  const nodes = (site.node_ids || []).map(id => project.nodes.find(n => n.id === id)).filter(Boolean);
  const u = nodes.reduce((a, n) => a + siteFormFactorU(n.spec?.form_factor), 0);
  const w = nodes.reduce((a, n) => a + computeNodePowerW(n, gpuModels), 0);
  return {
    u_used: u,
    u_max: site.capacity?.rack_units || 0,
    kw_used: w / 1000,
    kw_max: site.capacity?.power_kw || 0,
  };
}

  if (k === "site") renderSiteInspector(root, id);
  else if (k === "node") renderNodeInspector(root, id);

}

function makeBarLine(label, valueText, pct) {
  pct = Math.max(0, Math.min(100, pct));
  return el("div", { class: "field" }, [
    el("div", { class: "topo-bar-label" }, [
      el("span", {}, [label]),
      el("span", { class: "val" }, [`${pct.toFixed(0)}%  ${valueText}`]),
    ]),
    el("div", { class: "bar" }, [
      el("div", { class: "bar-fill", dataset: { level: clsLevel(pct) }, style: { width: pct + "%" } }),
    ]),
  ]);
}

// Two-tone bar: shows both REQUEST and LIMIT(max) usage on the same track.
//   - Lighter underlay extends to pctMax (worst-case headroom check).
//   - Solid overlay extends to pctReq (baseline guaranteed allocation).
// Bar severity color is driven by pctMax (the limit-based overflow check),
// so anything that bursts past capacity goes red even when requests still fit.
function makeBarLineDual(label, valueText, pctReq, pctMax) {
  const pReq = Math.max(0, Math.min(100, pctReq));
  const pMax = Math.max(0, Math.min(100, pctMax));
  return el("div", { class: "field" }, [
    el("div", { class: "topo-bar-label" }, [
      el("span", {}, [label]),
      el("span", { class: "val" }, [valueText]),
    ]),
    el("div", { class: "bar", style: { position: "relative" } }, [
      // Max layer — underlay, lighter
      el("div", {
        class: "bar-fill",
        dataset: { level: clsLevel(pMax) },
        style: { width: pMax + "%", opacity: 0.45 },
      }),
      // Request layer — full opacity, anchored at left
      el("div", {
        class: "bar-fill",
        dataset: { level: clsLevel(pReq) },
        style: { width: pReq + "%", position: "absolute", top: 0, left: 0 },
      }),
    ]),
  ]);
}

// Resolve a workload's effective limit for cpu / memory_gb.
// Convention (matches workload Resources tab placeholder): empty limit → 2× request.
function workloadLimit(w, key) {
  const reqs = w.resources?.requests || {};
  const lims = w.resources?.limits || {};
  if (lims[key] != null) return lims[key];
  return (reqs[key] || 0) * 2;
}

// Replica count helpers. `replicas` is the baseline (= min) and may be **0** —
// scale-to-zero is valid for on-demand workloads (e.g. GitLab Runner, KEDA jobs).
// `replicas_max` is the upper bound; it cannot be 0. When unset, the effective max
// is max(min, 1). HPA.max also acts as an implicit cap when set.
function replicasMin(w) {
  const r = w.replicas;
  return Math.max(0, typeof r === "number" ? r : 1);
}
function replicasMax(w) {
  const min = replicasMin(w);
  const explicit = w.replicas_max || 0;
  const hpaMax = w.hpa?.max || 0;
  // Max must be ≥ 1 (cannot be zero) AND ≥ min.
  return Math.max(1, min, explicit, hpaMax);
}

      el("label", {}, [
        "vCPU",
        tmplSpec ? el("span", { style: { color: "var(--text3)", fontWeight: "400", marginLeft: "4px" } },
          [`(default ${tmplSpec.vcpu})`]) : null,
      ]),
      el("input", {
        "data-focus-key": `node.${id}.vcpu`,
        // text+inputmode instead of type=number: number inputs don't support selectionStart,
        // so per-keystroke re-render lost cursor position and reversed digits ("64" → "46").
        type: "text", inputmode: "numeric", pattern: "[0-9]*",
        value: String(spec.vcpu || 0),
        onfocus: focusSelectAll,
        oninput: e => updateNodeSpecNumber(id, "vcpu", e.target.value),
      }),
    ]),
    el("div", { class: "field" }, [
      el("label", {}, [
        "Memory (GB)",
        tmplSpec ? el("span", { style: { color: "var(--text3)", fontWeight: "400", marginLeft: "4px" } },
          [`(default ${tmplSpec.memory_gb})`]) : null,
      ]),
      el("input", {
        "data-focus-key": `node.${id}.memory_gb`,
        type: "text", inputmode: "decimal", pattern: "[0-9]*\\.?[0-9]*",
        value: String(spec.memory_gb || 0),
        onfocus: focusSelectAll,
        oninput: e => updateNodeSpecNumber(id, "memory_gb", e.target.value),
      }),
    ]),
  ]));
  if (spec.form_factor || spec.power) {
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Form factor", "node.form_factor"),
        el("div", { class: "field-readonly" }, [spec.form_factor || "—"]),
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Typical Power (W)"]),
        el("div", { class: "field-readonly" }, [
          String(computeNodePowerW(n, gpuModels)) + " W"
        ]),
      ]),
    ]));
  }

  // Disks (storage capacity — editable for onprem, read-only for cloud)
  {
    const disks = Array.isArray(spec.disks) ? spec.disks : [];
    const totalGb = disks.reduce((a, d) => a + (Number(d.size_gb) || 0) * (parseInt(d.count) || 1), 0);
    const totalUsableGb = disks.reduce((a, d) => a + raidUsable(d).usable_gb, 0);
    const anyRaid = disks.some(d => (d.raid || "none") !== "none");
    root.appendChild(el("div", { class: "section-title" }, [`Disks (${disks.length})`]));
    if (disks.length === 0) {
      root.appendChild(el("div", { class: "empty-hint" }, ["디스크 없음"]));
    } else {
      root.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text2)", marginBottom: "6px", fontFamily: "JetBrains Mono" } }, [
        `Total raw: ${totalGb.toLocaleString()} GB (${(totalGb / 1024).toFixed(1)} TB)`,
        anyRaid ? `  ·  usable: ${totalUsableGb.toLocaleString()} GB (${(totalUsableGb / 1024).toFixed(1)} TB)` : "",
      ]));
      for (let i = 0; i < disks.length; i++) {
        root.appendChild(renderDiskRowEditable(n, i));
      }
    }
    if (n.source === "onprem") {
      root.appendChild(el("button", {
        class: "add-btn", style: { width: "100%", marginTop: "6px" },
        onclick: () => addNodeDisk(id),
      }, ["＋ Add Disk"]));
    } else if (disks.length) {
      root.appendChild(el("div", { class: "empty-hint" }, ["Cloud 인스턴스는 디스크 구성 고정 (인스턴스 타입에 묶임)"]));
    }
  }

  // GPU
  if ((chassis.max_count || 0) > 0 || gpus.length) {
    const gpuTitle = el("div", { class: "section-title" }, ["GPU"]);
    gpuTitle.appendChild(helpIcon("gpu.chassis"));
    if (n.source === "onprem") gpuTitle.appendChild(helpIcon("node.gpu_install"));
    root.appendChild(gpuTitle);
    const chassisDesc = `Chassis: max ${chassis.max_count || 0} · ${(chassis.supported_form_factors || []).join("/") || "—"} · ${chassis.nvlink_topology || "none"}`;
    const supports = `Supports: ${(chassis.supported_models || []).join(", ") || "—"}`;
    const chassisInfo = el("div", { class: "chassis-info" }, [
      el("strong", {}, [chassisDesc]), el("br"), supports,
    ]);
    const topo = chassis.nvlink_topology || "none";
    if (topo !== "none") chassisInfo.appendChild(helpIcon("gpu.topology." + topo));
    root.appendChild(chassisInfo);

    // Slot + power budget bars (onprem only — cloud has fixed GPU)
    const totalGpu = gpus.reduce((a, g) => a + (g.count || 0), 0);
    const maxGpu = chassis.max_count || 0;
    const psuMax = n.spec.power?.psu_max_w || 0;
    const powerW = computeNodePowerW(n, gpuModels);
    if (n.source === "onprem" && (maxGpu > 0 || psuMax > 0)) {
      const bars = el("div", { class: "topo-site-bars", style: { marginTop: "8px" } }, [
        maxGpu > 0 ? makeBarLine("GPU slots", `${totalGpu}/${maxGpu}`, maxGpu > 0 ? totalGpu / maxGpu * 100 : 0) : null,
        psuMax > 0 ? makeBarLine("PSU", `${powerW}/${psuMax} W`, psuMax > 0 ? powerW / psuMax * 100 : 0) : null,
      ]);
      root.appendChild(bars);
    }

    if (n.source === "cloud") {
      // Cloud: read-only display
      for (let i = 0; i < gpus.length; i++) {
        const g = gpus[i];
        const ginfo = gpuModels[g.model] || {};
        root.appendChild(el("div", { class: "gpu-config" }, [
          el("div", { style: { fontSize: "12px", marginBottom: "6px" } }, [
            el("strong", {}, [g.model]),
            ` ×${g.count}  ${g.form_factor || ginfo.form_factor || ""}  ${ginfo.vram_gb ? `· ${ginfo.vram_gb}GB VRAM` : ""}`,
            g.nvlink_enabled ? el("span", { style: { color: "var(--purple)" } }, [" · NVLink"]) : null,
          ]),
          el("div", { style: { fontSize: "11px", color: "var(--text2)" } }, [
            ginfo.tdp_w ? `TDP ${ginfo.tdp_w}W × ${g.count} = ${(ginfo.tdp_w * g.count) / 1000}kW total` : "",
          ]),
          // GPU model/count is fixed by the instance type, but MIG is still selectable.
          renderMigRow(n, i, gpuModels),
        ]));
      }
      if (gpus.length) {
        root.appendChild(el("div", { class: "empty-hint" }, ["Cloud 인스턴스는 GPU 구성 고정 (인스턴스 타입에 묶임)"]));
      }
    } else {
      // Onprem: editable rows
      const supportedModels = (chassis.supported_models || []).filter(m =>
        !gpuModels[m] || (chassis.supported_form_factors || []).includes(gpuModels[m].form_factor)
      );
      for (let i = 0; i < gpus.length; i++) {
        root.appendChild(renderGpuRowEditable(n, i, supportedModels, gpuModels));
      }
      const remaining = maxGpu - totalGpu;
      if (gpus.length === 0 && maxGpu > 0) {
        root.appendChild(el("div", { class: "empty-hint" }, ["GPU 슬롯 비어있음"]));
      }
      if (remaining > 0 && supportedModels.length > 0) {
        root.appendChild(el("button", {
          class: "add-btn", style: { width: "100%", marginTop: "6px" },
          onclick: () => addNodeGpu(id),
        }, ["＋ Add GPU"]));
      } else if (remaining <= 0 && maxGpu > 0) {
        root.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text3)", padding: "4px", fontStyle: "italic", textAlign: "center" } }, [
          "모든 슬롯 사용 중. 추가하려면 기존 GPU 수를 줄이거나 큰 새시 사용",
        ]));
      }
    }
  }

  // Compatibility check
  const issues = checkNodeCompatibility(spec, gpuModels);
  if (issues.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Findings (this node)"]));
    const list = el("div", { class: "compat-result" });
    for (const i of issues) {
      const cls = i.sev === "err" ? "err" : (i.sev === "warn" ? "warn" : "ok");
      list.appendChild(el("div", { class: cls }, [`${i.sev === "err" ? "⊗" : "▲"} ${i.msg}`]));
    }
    root.appendChild(list);
  }
}

function renderClusterInspector(root, id) {
  const c = state.project.clusters.find(x => x.id === id);
  if (!c) return;

  const cLocked = isClusterLocked(c);
  if (cLocked) root.classList.add("inspector-locked");
  root.appendChild(el("div", { class: "insp-header" }, [
    el("span", { class: "kind" }, [cLocked ? "🔒 Cluster" : "Cluster"]),
    el("span", { class: "name" }, [c.name]),
    el("button", {
      class: "duplicate", title: cLocked ? "Unlock cluster" : "Lock cluster (편집/삭제 보호)",
      onclick: () => toggleClusterLock(id),
    }, [cLocked ? "🔒" : "🔓"]),
    el("button", {
      class: "duplicate", title: "클러스터 복사 (워크로드 + 노드 포함)",
      onclick: () => copyEntityToClipboard("cluster", id),
    }, ["📋"]),
    el("button", {
      class: "delete", title: "Delete cluster",
      onclick: () => {
        if (cLocked && !confirm(`'${c.name}'은 잠긴 클러스터입니다. 정말 삭제?`)) return;
        if (!cLocked && !confirm(`클러스터 '${c.name}' 삭제? (노드는 unassigned로 돌아갑니다)`)) return;
        deleteEntity("cluster", id);
      },
    }, ["🗑"]),
  ]));
  if (cLocked) {
    root.appendChild(el("div", { class: "lock-banner" }, [
      "🔒 이 클러스터는 잠겨있습니다. 편집하려면 헤더의 🔒 아이콘을 클릭해 해제하세요.",
    ]));
  }

  root.appendChild(el("div", { class: "field" }, [
    el("label", {}, ["Name"]),
    el("input", {
      "data-focus-key": `cluster.${id}.name`,
      value: c.name,
      oninput: e => updateClusterField(id, "name", e.target.value),
    }),
  ]));

  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [
      lbl("k8s version", "cluster.k8s_version"),
      el("input", {
        "data-focus-key": `cluster.${id}.k8s_version`,
        value: c.k8s_version || "", placeholder: "1.30",
        oninput: e => updateClusterField(id, "k8s_version", e.target.value),
      }),
    ]),
    el("div", { class: "field" }, [
      lbl("Environment tag", "cluster.environment_tag"),
      el("input", {
        "data-focus-key": `cluster.${id}.env_tag`,
        value: c.environment_tag || "", placeholder: "prod",
        oninput: e => updateClusterField(id, "environment_tag", e.target.value),
      }),
    ]),
  ]));

  // HA control plane
  const haInput = el("input", {
    type: "checkbox",
    checked: c.ha_control_plane ? "" : null,
    onchange: e => updateClusterField(id, "ha_control_plane", e.target.checked),
  });
  root.appendChild(el("label", { style: { display: "flex", alignItems: "center", gap: "8px", margin: "8px 0", fontSize: "12px", textTransform: "none", letterSpacing: 0 } }, [
    haInput,
    el("span", {}, ["HA control plane (≥3 control-plane 노드 권장)"]),
    helpIcon("cluster.ha_control_plane"),
  ]));

  // Addons
  root.appendChild(el("div", { class: "section-title" }, ["Add-ons"]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [
      lbl("CNI", "cluster.cni"),
      el("select", {
        onchange: e => updateClusterField(id, "addons.cni", e.target.value),
      }, ["Calico", "Cilium", "Flannel", "AWS-VPC-CNI", "Azure-CNI", "None"].map(v =>
        el("option", { value: v, selected: (c.addons?.cni || "Calico") === v ? "" : null }, [v]))),
    ]),
    el("div", { class: "field" }, [
      lbl("Ingress", "cluster.ingress"),
      el("select", {
        onchange: e => updateClusterField(id, "addons.ingress", e.target.value),
      }, ["NGINX", "Traefik", "AWS-ALB", "Istio-Gateway", "None"].map(v =>
        el("option", { value: v, selected: (c.addons?.ingress || "NGINX") === v ? "" : null }, [v]))),
    ]),
  ]));
  const gpuOpInput = el("input", {
    type: "checkbox",
    checked: c.addons?.gpu_operator ? "" : null,
    onchange: e => updateClusterField(id, "addons.gpu_operator", e.target.checked),
  });
  root.appendChild(el("label", { style: { display: "flex", alignItems: "center", gap: "8px", margin: "8px 0", fontSize: "12px", textTransform: "none", letterSpacing: 0 } }, [
    gpuOpInput,
    el("span", {}, ["NVIDIA GPU Operator (GPU 노드 있을 때 권장)"]),
    helpIcon("cluster.gpu_operator"),
  ]));

  // Local PV provisioner (app-replicated stateful 워크로드용)
  root.appendChild(el("div", { class: "field" }, [
    el("label", {}, ["Local PV Provisioner"]),
    el("select", {
      onchange: e => updateClusterField(id, "addons.local_pv", e.target.value),
      title: "노드 로컬 디스크 기반 PV. Patroni/MongoDB replica set/Kafka 등 app-replicated 워크로드용",
    }, ["None", "OpenEBS-LocalPV", "Longhorn-Local", "Local-Path-Provisioner"].map(v =>
      el("option", { value: v, selected: (c.addons?.local_pv || "None") === v ? "" : null }, [v]))),
  ]));

  // Production preset CTA
  const presetTitle = el("div", { class: "section-title" }, ["Production Preset"]);
  presetTitle.appendChild(helpIcon("cluster.preset"));
  root.appendChild(presetTitle);
  root.appendChild(el("div", {
    style: { fontSize: "11px", color: "var(--text2)", marginBottom: "8px" },
  }, [
    "ingress-nginx · cert-manager · prometheus + grafana · loki · metrics-server · default-deny NP · ResourceQuota · HA control plane을 한 번에 설정.",
  ]));
  root.appendChild(el("button", {
    class: "add-btn",
    style: { width: "100%", marginBottom: "12px" },
    onclick: () => openClusterPreset(id),
  }, ["⚙ Apply Production Preset…"]));

  // Network section
  const net = c.network || {};
  const netTitle = el("div", { class: "section-title" }, ["Network"]);
  netTitle.appendChild(helpIcon("cluster.network"));
  root.appendChild(netTitle);
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [
      lbl("Pod CIDR", "cluster.pod_cidr"),
      el("input", {
        "data-focus-key": `cluster.${id}.pod_cidr`,
        value: net.pod_cidr || "", placeholder: "10.244.0.0/16",
        oninput: e => updateClusterField(id, "network.pod_cidr", e.target.value),
      }),
    ]),
    el("div", { class: "field" }, [
      lbl("Service CIDR", "cluster.service_cidr"),
      el("input", {
        "data-focus-key": `cluster.${id}.service_cidr`,
        value: net.service_cidr || "", placeholder: "10.96.0.0/12",
        oninput: e => updateClusterField(id, "network.service_cidr", e.target.value),
      }),
    ]),
  ]));
  root.appendChild(el("div", { class: "field-row" }, [
    el("div", { class: "field" }, [
      lbl("Node Subnet", "cluster.node_subnet"),
      el("input", {
        "data-focus-key": `cluster.${id}.node_subnet`,
        value: net.node_subnet || "", placeholder: "192.168.10.0/24",
        oninput: e => updateClusterField(id, "network.node_subnet", e.target.value),
      }),
    ]),
    el("div", { class: "field" }, [
      lbl("DNS Domain", "cluster.dns_domain"),
      el("input", {
        "data-focus-key": `cluster.${id}.dns_domain`,
        value: net.dns_domain || "", placeholder: "cluster.local",
        oninput: e => updateClusterField(id, "network.dns_domain", e.target.value),
      }),
    ]),
  ]));
  root.appendChild(el("div", { class: "field" }, [
    lbl("LoadBalancer Pool (optional)", "cluster.lb_pool"),
    el("input", {
      "data-focus-key": `cluster.${id}.lb_pool`,
      value: net.lb_pool || "", placeholder: "192.168.20.0/24 (MetalLB 등 — onprem)",
      oninput: e => updateClusterField(id, "network.lb_pool", e.target.value),
    }),
  ]));

  // Ingress Rules section
  const irules = c.ingress_rules || [];
  const irTitle = el("div", { class: "section-title" }, [`Ingress Rules (${irules.length})`]);
  irTitle.appendChild(helpIcon("cluster.ingress_rules"));
  root.appendChild(irTitle);
  if (!irules.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["Ingress 룰 없음. 외부 HTTP(S) 라우팅이 필요하면 추가."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const r of irules) {
      const numPaths = (r.paths || []).length;
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, [r.tls ? "🔒" : "🌐"]),
        el("span", { class: "name", style: { fontSize: "12px", fontFamily: "JetBrains Mono" } }, [
          `${r.tls ? "https" : "http"}://${r.host}`,
        ]),
        el("span", { style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" } }, [`${numPaths} path${numPaths === 1 ? "" : "s"}`]),
        el("button", {
          class: "x", onclick: () => { if (confirm(`'${r.name}' 삭제?`)) deleteIngressRule(id, r.id); },
        }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }
  if ((c.workloads || []).length) {
    root.appendChild(el("button", {
      class: "add-btn", style: { width: "100%", marginTop: "6px" },
      onclick: () => openAddIngressRule(id),
    }, ["＋ Add Ingress Rule"]));
  } else {
    root.appendChild(el("div", { class: "empty-hint" }, ["워크로드 추가 후 ingress 룰 가능"]));
  }

  // Nodes assigned
  const assignedNodes = (c.node_ids || []).map(nid => state.project.nodes.find(n => n.id === nid)).filter(Boolean);
  root.appendChild(el("div", { class: "section-title" }, [`Nodes in cluster (${assignedNodes.length})`]));
  if (!assignedNodes.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["할당된 노드가 없습니다. 아래에서 추가하세요."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const n of assignedNodes) {
      const roles = Array.isArray(n.cluster_roles) ? n.cluster_roles : [];
      const roleChips = el("div", { style: { display: "flex", gap: "4px" } }, ["control-plane", "worker", "etcd"].map(r => {
        const checked = roles.includes(r);
        const label = r === "control-plane" ? "cp" : r === "worker" ? "w" : "etcd";
        return el("label", {
          title: r,
          style: {
            display: "inline-flex", alignItems: "center", gap: "3px",
            padding: "1px 5px", borderRadius: "3px",
            background: checked ? "var(--accent-glow)" : "var(--surface3)",
            border: "1px solid " + (checked ? "var(--accent)" : "var(--border)"),
            fontSize: "10px", color: checked ? "var(--accent)" : "var(--text2)",
            fontFamily: "JetBrains Mono", cursor: "pointer", margin: 0,
            textTransform: "none", letterSpacing: 0,
          },
        }, [
          el("input", {
            type: "checkbox",
            style: { width: "10px", height: "10px", margin: 0 },
            checked: checked ? "" : null,
            onchange: e => setNodeRoleEnabled(n.id, r, e.target.checked),
          }),
          label,
        ]);
      }));
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, ["▣"]),
        el("span", { class: "name", style: { cursor: "pointer" }, onclick: () => selectEntity("node", n.id) }, [n.name]),
        n.network?.ip ? el("span", {
          style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" },
        }, [n.network.ip]) : null,
        roleChips,
        el("button", { class: "x", title: "remove", onclick: () => removeNodeFromCluster(n.id, id) }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }

  // Available nodes (not in any cluster)
  const available = state.project.nodes.filter(n => !getNodeCluster(n.id));
  if (available.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Add nodes"]));
    const list = el("div", { class: "checkbox-list" });
    for (const n of available) {
      const site = state.project.sites.find(s => s.id === n.site_id);
      list.appendChild(el("label", {}, [
        el("input", {
          type: "checkbox",
          onchange: e => {
            if (e.target.checked) assignNodeToCluster(n.id, id);
          },
        }),
        el("span", {}, [n.name]),
        el("span", { class: "meta" }, [`${n.brand} · ${site?.name || ""}`]),
      ]));
    }
    root.appendChild(list);
  }

  // Quick stats
  const totals = assignedNodes.reduce((acc, n) => {
    acc.cpu += n.spec?.vcpu || 0;
    acc.mem += n.spec?.memory_gb || 0;
    acc.gpu += (n.spec?.gpu || []).reduce((a, g) => a + (g.count || 0), 0);
    return acc;
  }, { cpu: 0, mem: 0, gpu: 0 });
  if (assignedNodes.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Cluster totals"]));
    root.appendChild(el("div", { class: "compat-result" }, [
      el("div", {}, [`Total: ${totals.cpu} vCPU · ${totals.mem} GB RAM · ${totals.gpu} GPUs`]),
    ]));
  }

  // Namespaces
  const namespaces = c.namespaces || [];
  const nsTitle = el("div", { class: "section-title" }, [`Namespaces (${namespaces.length})`]);
  nsTitle.appendChild(helpIcon("namespace.name"));
  root.appendChild(nsTitle);
  if (!namespaces.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["네임스페이스 없음. 워크로드는 'default'에 배치됩니다."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const ns of namespaces) {
      const wlInNs = (c.workloads || []).filter(w => (w.namespace || "default") === ns.name).length;
      const rq = ns.resource_quota || {};
      const rqText = rq.cpu || rq.memory_gb ? `${rq.cpu || "—"}c/${rq.memory_gb || "—"}GB` : "no quota";
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, [ns.default_deny ? "🔒" : "▦"]),
        el("span", { class: "name" }, [ns.name]),
        el("span", { style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" } }, [`${wlInNs}w · ${rqText}`]),
        el("label", {
          style: { fontSize: "10px", color: ns.default_deny ? "var(--orange)" : "var(--text3)", display: "flex", alignItems: "center", gap: "3px", margin: 0, textTransform: "none", letterSpacing: 0, cursor: "pointer" },
        }, [
          el("input", {
            type: "checkbox",
            style: { width: "10px", height: "10px", margin: 0 },
            checked: ns.default_deny ? "" : null,
            onchange: e => updateNamespaceField(id, ns.name, "default_deny", e.target.checked),
          }),
          "deny",
        ]),
        el("button", {
          class: "x", title: "edit quota",
          style: { fontSize: "10px" },
          onclick: () => openEditNamespace(id, ns.name),
        }, ["⚙"]),
        el("button", {
          class: "x", onclick: () => { if (confirm(`'${ns.name}' 삭제? (워크로드는 default로 이동)`)) deleteNamespace(id, ns.name); },
        }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }
  root.appendChild(el("button", {
    class: "add-btn", style: { width: "100%", marginTop: "6px" },
    onclick: () => openAddNamespace(id),
  }, ["＋ Add Namespace"]));

  // Network Policies
  const nps = c.network_policies || [];
  const npTitle = el("div", { class: "section-title" }, [`Network Policies (${nps.length})`]);
  npTitle.appendChild(helpIcon("networkpolicy.preset"));
  root.appendChild(npTitle);
  if (!nps.length) {
    root.appendChild(el("div", { class: "empty-hint" }, ["NP 없음. 모든 ns 간 통신 자유."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const np of nps) {
      let presetDesc = "custom";
      if (np.preset === "default-deny") presetDesc = "🔒 deny all";
      else if (np.preset === "allow-from-same-ns") presetDesc = `same-ns →`;
      else if (np.preset === "allow-from-namespace") presetDesc = `${(np.ingress?.[0]?.from_namespaces || ["?"]).join(",")} →`;
      else if (np.preset === "allow-from-ingress") presetDesc = `🌐 ingress →`;
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, ["🔗"]),
        el("span", { class: "name", style: { fontSize: "11px" } }, [`${presetDesc} ${np.namespace}`]),
        el("button", {
          class: "x", onclick: () => { if (confirm(`'${np.name}' 삭제?`)) deleteNetworkPolicy(id, np.id); },
        }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }
  if (namespaces.length) {
    root.appendChild(el("button", {
      class: "add-btn", style: { width: "100%", marginTop: "6px" },
      onclick: () => openAddNetworkPolicy(id),
    }, ["＋ Add Network Policy"]));
  }

  // Workloads
  const workloads = c.workloads || [];
  root.appendChild(el("div", { class: "section-title" }, [`Workloads (${workloads.length})`]));
  if (workloads.length === 0) {
    root.appendChild(el("div", { class: "empty-hint" }, ["워크로드가 없습니다."]));
  } else {
    const list = el("div", { class: "row-list" });
    for (const w of workloads) {
      const reqs = w.resources?.requests || {};
      const totalCpu = (reqs.cpu || 0) * (w.replicas ?? 1);
      const totalMem = (reqs.memory_gb || 0) * (w.replicas ?? 1);
      list.appendChild(el("div", { class: "row" }, [
        el("span", { class: "icon" }, ["◇"]),
        el("span", { class: "name", style: { cursor: "pointer" }, onclick: () => selectEntity("workload", w.id) }, [w.name]),
        el("span", { style: { fontSize: "10px", color: "var(--text3)", fontFamily: "JetBrains Mono" } }, [
          `×${w.replicas} ${totalCpu}c ${totalMem}G`,
        ]),
        el("button", { class: "x", title: "remove", onclick: () => { if (confirm(`'${w.name}' 삭제?`)) deleteWorkload(w.id); } }, ["✕"]),
      ]));
    }
    root.appendChild(list);
  }
  root.appendChild(el("div", { style: { display: "grid", gridTemplateColumns: "1fr auto", gap: "6px", marginTop: "8px" } }, [
    el("button", {
      class: "add-btn",
      onclick: () => openAddWorkload(c.id),
    }, ["＋ Add Workload"]),
    el("button", {
      class: "add-btn",
      title: "Paste workload from clipboard",
      style: { padding: "0 12px" },
      onclick: () => pasteWorkloadIntoCluster(c.id),
    }, ["📥 Paste"]),
  ]));

  // Quick deploy — pre-configured framework/product templates with optional HA mode
  if (state.ui.quickDeployHA == null) state.ui.quickDeployHA = false;
  const haOn = !!state.ui.quickDeployHA;
  const sectionHeader = el("div", {
    style: { marginTop: "10px", display: "flex", alignItems: "center", justifyContent: "space-between" },
  }, [
    el("span", {
      style: { fontSize: "10px", color: "var(--text3)", textTransform: "uppercase", letterSpacing: "0.05em", fontFamily: "JetBrains Mono" },
    }, ["✨ Quick deploy"]),
    el("label", {
      style: { fontSize: "10px", display: "inline-flex", alignItems: "center", gap: "4px", cursor: "pointer", color: haOn ? "var(--accent)" : "var(--text3)" },
      title: "HA 모드 ON: 가능한 템플릿은 HA 권장 replicas + anti-affinity 적용",
    }, [
      el("input", {
        type: "checkbox",
        checked: haOn ? "" : null,
        onchange: e => { state.ui.quickDeployHA = !!e.target.checked; emit(); },
        style: { margin: 0 },
      }),
      "HA mode",
    ]),
  ]);
  root.appendChild(sectionHeader);

  const quickGrid = el("div", {
    style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px", marginTop: "6px" },
  });
  for (const [key, tmpl] of Object.entries(QUICK_DEPLOY_TEMPLATES)) {
    const willUseHA = (haOn && tmpl.haCapable) || tmpl.alwaysHA;
    const replicas = willUseHA && tmpl.haReplicas ? tmpl.haReplicas : tmpl.seed.replicas;
    const haBadge = willUseHA ? ` HA×${replicas}` : "";
    const tooltipExtra = tmpl.pvc ? ` · PVC ${tmpl.pvc.size_gb}G` : "";
    const gpuExtra = tmpl.seed.gpu_count ? ` · ${tmpl.seed.gpu_count} GPU` : "";
    quickGrid.appendChild(el("button", {
      class: "btn-ghost",
      style: {
        padding: "6px 8px", fontSize: "11px", textAlign: "left",
        background: willUseHA ? "var(--accent-glow)" : "var(--surface2)",
        border: "1px solid " + (willUseHA ? "var(--accent)" : "var(--border)"),
        borderRadius: "4px", color: "var(--text)", cursor: "pointer",
      },
      title: `${tmpl.label} · replicas ${replicas} · ${tmpl.seed.cpu}c · ${tmpl.seed.memory_gb}G${gpuExtra}${tooltipExtra}`,
      onclick: () => quickDeployWorkload(c.id, key, haOn),
    }, [`${tmpl.icon} ${tmpl.label}${haBadge}`]));
  }
  root.appendChild(quickGrid);

  // Findings preview (basic checks)
  const cpCount = assignedNodes.filter(n => (n.cluster_roles || []).includes("control-plane")).length;
  const issues = [];
  if (assignedNodes.length && cpCount === 0) issues.push({ sev: "err", msg: "control plane 노드 없음" });
  if (c.ha_control_plane && cpCount > 0 && cpCount < 3) issues.push({ sev: "err", msg: `HA control plane은 ≥3 필요 (현재 ${cpCount})` });
  if (c.ha_control_plane && cpCount >= 3 && cpCount % 2 === 0) issues.push({ sev: "warn", msg: `control plane ${cpCount}개 (짝수). etcd 쿼럼은 홀수 권장` });
  const hasGpu = assignedNodes.some(n => (n.spec?.gpu || []).length > 0 || (n.spec?.gpu_chassis?.max_count || 0) > 0);
  if (hasGpu && !c.addons?.gpu_operator) issues.push({ sev: "warn", msg: "GPU 노드 있음 — GPU Operator 활성화 권장" });
  // mixed environments
  const sites = new Set(assignedNodes.map(n => state.project.sites.find(s => s.id === n.site_id)?.kind).filter(Boolean));
  if (sites.size > 1) issues.push({ sev: "warn", msg: "한 클러스터가 cloud+onprem 양쪽에 걸침" });

  if (issues.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Findings (this cluster)"]));
    const list = el("div", { class: "compat-result" });
    for (const i of issues) {
      const cls = i.sev === "err" ? "err" : "warn";
      list.appendChild(el("div", { class: cls }, [`${i.sev === "err" ? "⊗" : "▲"} ${i.msg}`]));
    }
    root.appendChild(list);
  }
}

        oninput: ev => {
          const v = parseDecimalInput(ev.target.value);
          if (v != null && v >= 0) updateExternalServiceField(id, "capacity_gb", v);
        },
      }),
    ]),
    el("div", { class: "field" }, [
      el("label", {}, ["Region"]),
      el("input", {
        "data-focus-key": `extsvc.${id}.region`,
        value: e.region || "",
        oninput: ev => updateExternalServiceField(id, "region", ev.target.value),
      }),
    ]),
  ]));

  // Target clusters
  const clusters = state.project.clusters || [];
  if (clusters.length) {
    root.appendChild(el("div", { class: "section-title" }, ["Used by clusters"]));
    const list = el("div", { class: "checkbox-list" });
    for (const c of clusters) {
      const sel = (e.target_cluster_ids || []).includes(c.id);
      list.appendChild(el("label", {}, [
        el("input", {
          type: "checkbox", checked: sel ? "" : null,
          onchange: ev => {
            const cur = new Set(e.target_cluster_ids || []);
            if (ev.target.checked) cur.add(c.id); else cur.delete(c.id);
            updateExternalServiceField(id, "target_cluster_ids", Array.from(cur));
          },
        }),
        el("span", {}, [c.name]),
      ]));
    }
    root.appendChild(list);
  }
  root.appendChild(el("div", { class: "section-title" }, ["Site"]));
  root.appendChild(el("div", { class: "field-readonly" }, [site.name]));
}

function renderWorkloadInspector(root, id) {
  const found = findWorkload(id);
  if (!found) return;
  const { workload: w, cluster } = found;
  const _rMin = replicasMin(w);
  const _rMax = replicasMax(w);
  const totalCpu = (w.resources?.requests?.cpu || 0) * _rMin;
  const totalCpuMax = workloadLimit(w, "cpu") * _rMax;
  const totalMem = (w.resources?.requests?.memory_gb || 0) * _rMin;
  const totalMemMax = workloadLimit(w, "memory_gb") * _rMax;
  const gpuReq = w.resources?.requests?.gpu;

  const wlLocked = isWorkloadLocked(w);
  if (wlLocked) root.classList.add("inspector-locked");
  root.appendChild(el("div", { class: "insp-header" }, [
    el("span", { class: "kind" }, [wlLocked ? "🔒 Workload" : "Workload"]),
    el("span", { class: "name" }, [w.name]),
    el("button", {
      class: "duplicate", title: wlLocked ? "Unlock workload" : "Lock workload (편집/삭제 보호)",
      onclick: () => toggleWorkloadLock(id),
    }, [wlLocked ? "🔒" : "🔓"]),
    el("button", {
      class: "duplicate", title: "Copy workload to clipboard",
      onclick: () => copyEntityToClipboard("workload", id),
    }, ["📋"]),
    el("button", {
      class: "delete", title: "Delete workload",
      onclick: () => {
        if (wlLocked && !confirm(`'${w.name}'은 잠긴 워크로드입니다. 정말 삭제?`)) return;
        if (!wlLocked && !confirm(`'${w.name}' 삭제?`)) return;
        deleteWorkload(id);
      },
    }, ["🗑"]),
  ]));
  if (wlLocked) {
    root.appendChild(el("div", { class: "lock-banner" }, [
      "🔒 이 워크로드는 잠겨있습니다. 편집하려면 헤더의 🔒 아이콘을 클릭해 해제하세요.",
    ]));
  }

  // Tabs
  if (!state.ui.workloadTab) state.ui.workloadTab = "basic";
  const tabs = ["basic", "resources", "runtime", "network", "deps"];
  const tabBar = el("div", {
    style: { display: "flex", gap: "2px", borderBottom: "1px solid var(--border)", marginBottom: "12px" },
  }, tabs.map(t =>
    el("button", {
      class: "view-tab" + (state.ui.workloadTab === t ? " active" : ""),
      style: { padding: "6px 12px", fontSize: "11px" },
      onclick: () => { state.ui.workloadTab = t; emit(); },
    }, [t.charAt(0).toUpperCase() + t.slice(1)])
  ));
  root.appendChild(tabBar);

  if (state.ui.workloadTab === "basic") {
    root.appendChild(el("div", { class: "field" }, [
      el("label", {}, ["Name"]),
      el("input", {
        "data-focus-key": `workload.${id}.name`,
        value: w.name,
        oninput: e => updateWorkloadField(id, "name", e.target.value),
      }),
    ]));
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Category", "workload.category"),
        el("select", { onchange: e => updateWorkloadField(id, "category", e.target.value) },
          ["Frontend","API","WAS","DB","Cache","Queue","ML-Inference","ML-Training","Video","Batch","Other"].map(v =>
            el("option", { value: v, selected: v === w.category ? "" : null }, [v]))),
      ]),
      el("div", { class: "field" }, [
        lbl("Kind", "workload.kind"),
        el("select", { onchange: e => updateWorkloadField(id, "kind", e.target.value) },
          ["Deployment","StatefulSet","DaemonSet","Job","CronJob"].map(v =>
            el("option", { value: v, selected: v === (w.kind || "Deployment") ? "" : null }, [v]))),
      ]),
    ]));
    // Namespace dropdown — based on cluster's namespaces
    const cnsNames = (cluster.namespaces || []).map(n => n.name);
    if (!cnsNames.includes("default")) cnsNames.unshift("default");
    const currentNs = w.namespace || "default";
    if (!cnsNames.includes(currentNs)) cnsNames.push(currentNs);
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Replicas (min)", "workload.replicas"),
        el("input", {
          "data-focus-key": `workload.${id}.replicas`,
          type: "text", inputmode: "numeric", pattern: "[0-9]*",
          value: w.replicas != null ? w.replicas : 1,
          // min may be 0 (scale-to-zero workloads like GitLab Runner / KEDA jobs).
          oninput: e => {
            const v = parseIntInput(e.target.value);
            if (v != null && v >= 0) updateWorkloadField(id, "replicas", v);
          },
        }),
      ]),
      el("div", { class: "field" }, [
        lbl("Replicas (max)", "workload.replicas"),
        el("input", {
          "data-focus-key": `workload.${id}.replicas_max`,
          type: "text", inputmode: "numeric", pattern: "[0-9]*",
          value: w.replicas_max != null ? w.replicas_max : "",
          placeholder: `(default: ${Math.max(1, w.replicas != null ? w.replicas : 1)})`,
          // max must be ≥ 1 — cannot be zero (a workload with a defined upper bound must
          // be able to run at least one pod when triggered).
          oninput: e => {
            const raw = e.target.value;
            if (raw === "") return updateWorkloadField(id, "replicas_max", undefined);
            const v = parseIntInput(raw);
            if (v != null && v >= 1) updateWorkloadField(id, "replicas_max", v);
          },
        }),
      ]),
      el("div", { class: "field" }, [
        lbl("Namespace", "namespace.name"),
        el("select", {
          "data-focus-key": `workload.${id}.namespace`,
          onchange: e => updateWorkloadField(id, "namespace", e.target.value),
        }, cnsNames.map(n => el("option", { value: n, selected: n === currentNs ? "" : null }, [n]))),
      ]),
    ]));
    root.appendChild(el("div", { class: "field" }, [
      el("label", {}, ["Cluster"]),
      el("div", { class: "field-readonly" }, [cluster.name]),
    ]));
    // Visibility toggle — exclude this workload (and its edges) from the Dependency graph view.
    const hideInput = el("input", {
      type: "checkbox",
      checked: w.hide_from_dep_graph ? "" : null,
      onchange: e => updateWorkloadField(id, "hide_from_dep_graph", e.target.checked || undefined),
    });
    root.appendChild(el("label", {
      style: { display: "flex", alignItems: "center", gap: "8px", margin: "8px 0", fontSize: "12px", textTransform: "none", letterSpacing: 0 },
    }, [
      hideInput,
      el("span", {}, ["Dependency 그래프에서 숨기기"]),
      el("span", { style: { color: "var(--text3)", fontSize: "11px" } }, ["(이 워크로드 노드와 연결된 edge가 그래프에서 제외)"]),
    ]));

    // ===================== HA topology (stateful workloads only) =====================
    // Captures the operational HA shape (mode + primaries + replicas-per-primary + quorum) so
    // the capacity sim, validator, and YAML/Helm export all see one consistent picture instead
    // of guessing from `replicas` alone. Only shown for stateful categories (DB / Cache / Queue).
    if (HA_STATEFUL_CATS.has(w.category)) {
      const ha = w.ha || { mode: "none" };
      const haMode = ha.mode || "none";
      const haPrimaries = ha.primaries ?? HA_DEFAULTS[haMode].primaries;
      const haReplicas = ha.replicas_per_primary ?? HA_DEFAULTS[haMode].replicas_per_primary;
      const haQuorum = ha.quorum_count ?? HA_DEFAULTS[haMode].quorum_count;
      const dataPods = haPrimaries * (1 + haReplicas);
      const totalPods = dataPods + haQuorum;
      const setHa = patch => {
        w.ha = { ...(w.ha || {}), ...patch };
        emit(); saveSoon();
      };

      root.appendChild(el("div", {
        style: {
          marginTop: "18px", paddingTop: "10px", borderTop: "1px solid var(--border)",
          fontSize: "11px", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em",
          color: "var(--text3)",
        },
      }, ["HA topology"]));

      root.appendChild(el("div", { class: "section-title", style: { marginTop: "8px" } }, ["HA mode"]));
      root.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text2)", marginBottom: "6px" } }, [
        "Stateful 워크로드(DB/Cache/Queue)의 운영 토폴로지. ",
        "Capacity 시뮬레이션(quorum vs data pod 구분)과 K8s/Helm export 주석에 반영됩니다.",
      ]));
      root.appendChild(el("div", { class: "field", style: { margin: 0 } }, [
        el("select", {
          style: { fontSize: "12px" },
          onchange: e => {
            const m = e.target.value;
            const defs = HA_DEFAULTS[m];
            w.ha = { ...(w.ha || {}), mode: m, ...defs };
            const dp = defs.primaries * (1 + defs.replicas_per_primary);
            if (m !== "none" && dp > 0) w.replicas = dp;
            emit(); saveSoon();
          },
        }, HA_MODES.map(m =>
          el("option", { value: m.v, selected: haMode === m.v ? "" : null }, [m.label]))),
      ]));

      if (haMode !== "none") {
        const isSharded = haMode === "sharded-cluster";
        root.appendChild(el("div", {
          style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", marginTop: "8px" },
        }, [
          el("div", { class: "field", style: { margin: 0 } }, [
            el("label", { style: { fontSize: "10px" } }, [isSharded ? "Shards" : "Primaries"]),
            el("input", {
              "data-focus-key": `workload.${id}.ha.primaries`,
              type: "text", inputmode: "numeric", pattern: "[0-9]*",
              value: haPrimaries,
              oninput: e => {
                const v = parseInt(e.target.value);
                if (Number.isFinite(v) && v >= 1) {
                  w.ha = { ...(w.ha || {}), primaries: v };
                  w.replicas = v * (1 + (w.ha.replicas_per_primary ?? 0));
                  emit(); saveSoon();
                }
              },
            }),
          ]),
          el("div", { class: "field", style: { margin: 0 } }, [
            el("label", { style: { fontSize: "10px" } }, ["Replicas / primary"]),
            el("input", {
              "data-focus-key": `workload.${id}.ha.replicas_per_primary`,
              type: "text", inputmode: "numeric", pattern: "[0-9]*",
              value: haReplicas,
              oninput: e => {
                const v = parseInt(e.target.value);
                if (Number.isFinite(v) && v >= 0) {
                  w.ha = { ...(w.ha || {}), replicas_per_primary: v };
                  w.replicas = (w.ha.primaries ?? 1) * (1 + v);
                  emit(); saveSoon();
                }
              },
            }),
          ]),
          el("div", { class: "field", style: { margin: 0 } }, [
            el("label", { style: { fontSize: "10px" } }, ["Quorum / Sentinel"]),
            el("input", {
              "data-focus-key": `workload.${id}.ha.quorum_count`,
              type: "text", inputmode: "numeric", pattern: "[0-9]*",
              value: haQuorum,
              oninput: e => {
                const v = parseInt(e.target.value);
                if (Number.isFinite(v) && v >= 0) setHa({ quorum_count: v });
              },
            }),
          ]),
        ]));

        root.appendChild(el("div", {
          style: { marginTop: "8px", fontSize: "11px", color: "var(--text2)", fontFamily: "JetBrains Mono" },
        }, [
          `▸ data pods: ${haPrimaries} × (1+${haReplicas}) = ${dataPods}`,
          haQuorum > 0 ? ` · quorum: ${haQuorum}` : "",
          ` · 총 ${totalPods}대`,
        ]));

        root.appendChild(el("div", { class: "section-title", style: { marginTop: "12px" } }, ["Operator / Chart"]));
        root.appendChild(el("div", { class: "field", style: { margin: 0 } }, [
          el("input", {
            "data-focus-key": `workload.${id}.ha.operator`,
            type: "text", list: `ha-ops-${id}`,
            value: ha.operator || "",
            placeholder: "예: cloudnative-pg, bitnami-redis, strimzi-kafka-operator (선택)",
            oninput: e => setHa({ operator: e.target.value }),
          }),
          el("datalist", { id: `ha-ops-${id}` },
            HA_OPERATORS.map(op => el("option", { value: op }, []))),
        ]));
      }
    }

    // ===================== Scheduling =====================
    // First-class UI for fields the data model + sim + YAML/Helm export already read:
    // anti_affinity (None/spread-by-node/spread-by-zone), node_selector, tolerations.
    // Lives inside Basic so users see it next to replicas/category without an extra tab.
    {
      const sched = w.scheduling || {};
      const aa = sched.anti_affinity || "none";
      const ns = sched.node_selector || {};
      const tols = sched.tolerations || [];

      // Cluster-derived context for feasibility hints.
      const clusterNodes = (cluster.node_ids || [])
        .map(nid => (state.project.nodes || []).find(n => n.id === nid))
        .filter(Boolean);
      const workerNodes = clusterNodes.filter(n => (n.cluster_roles || []).includes("worker"));
      const workerCount = workerNodes.length;
      const zoneSet = new Set();
      for (const n of workerNodes) {
        const z = n.labels?.["topology.kubernetes.io/zone"] || n.site_id;
        if (z) zoneSet.add(z);
      }
      const zoneCount = zoneSet.size;
      const replicas = w.replicas ?? 1;

      // Group header to visually separate scheduling from the fields above.
      root.appendChild(el("div", {
        style: {
          marginTop: "18px", paddingTop: "10px", borderTop: "1px solid var(--border)",
          fontSize: "11px", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em",
          color: "var(--text3)",
        },
      }, ["Scheduling"]));

      // ---- Anti-affinity ----
      root.appendChild(el("div", { class: "section-title", style: { marginTop: "8px" } }, ["Anti-affinity (pod 분산)"]));
      root.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text2)", marginBottom: "6px" } }, [
        "동일 워크로드의 replica를 같은 노드(또는 zone)에 묶지 않도록 K8s 스케줄러에 힌트. ",
        "Capacity 시뮬레이션과 K8s YAML/Helm export에 동일하게 반영됩니다.",
      ]));
      root.appendChild(el("div", { class: "field", style: { margin: 0 } }, [
        el("select", {
          style: { fontSize: "12px" },
          onchange: e => updateWorkloadField(id, "scheduling.anti_affinity", e.target.value),
        }, [
          { v: "none",           label: "None — 분산 강제 없음 (replica가 한 노드에 몰릴 수 있음)" },
          { v: "spread-by-node", label: "Spread by node — 노드 간 분산 (단일 노드 장애 견딤, topologyKey=hostname)" },
          { v: "spread-by-zone", label: "Spread by zone — zone 간 분산 (AZ 장애 견딤, topologyKey=zone)" },
        ].map(o => el("option", { value: o.v, selected: aa === o.v ? "" : null }, [o.label]))),
      ]));

      // Feasibility hints (warn when the setting can't actually fan out as advertised).
      const hints = [];
      if (aa === "spread-by-node" && workerCount > 0 && replicas > workerCount) {
        hints.push({ sev: "warn", msg: `replicas ${replicas} > worker 노드 ${workerCount}: 일부 pod가 같은 노드에 묶이거나 unschedulable이 됩니다` });
      }
      if (aa === "spread-by-zone") {
        if (zoneCount < 2) {
          hints.push({ sev: "warn", msg: `이 클러스터의 zone은 ${zoneCount}개 — by-zone 효과 없음 (노드에 topology.kubernetes.io/zone 라벨 또는 다중 site 필요)` });
        } else if (replicas > zoneCount) {
          hints.push({ sev: "info", msg: `replicas ${replicas} > zone ${zoneCount}: zone당 평균 ${Math.ceil(replicas / zoneCount)}개 pod` });
        }
      }
      for (const h of hints) {
        root.appendChild(el("div", {
          style: { fontSize: "11px", marginTop: "4px", color: h.sev === "warn" ? "var(--yellow)" : "var(--text3)" },
        }, [(h.sev === "warn" ? "▲ " : "ℹ ") + h.msg]));
      }

      // ---- Node selector ----
      const nsEntries = Object.entries(ns);
      root.appendChild(el("div", { class: "section-title", style: { marginTop: "16px" } }, [`Node selector (${nsEntries.length})`]));
      root.appendChild(el("div", { style: { fontSize: "11px", color: "var(--text2)", marginBottom: "6px" } }, [
        "워크로드가 들어갈 수 있는 노드를 라벨로 한정 (예: disktype=ssd, gpu=true)",
      ]));
      if (!nsEntries.length) {
        root.appendChild(el("div", { class: "empty-hint" }, ["없음 — 모든 worker 노드에 스케줄 가능"]));
      }
      nsEntries.forEach(([k, v], idx) => {
        root.appendChild(el("div", {
          style: { display: "grid", gridTemplateColumns: "1fr 1fr 32px", gap: "6px", marginBottom: "4px", alignItems: "center" },
        }, [
          el("div", { class: "field", style: { margin: 0 } }, [
            el("input", {
              "data-focus-key": `workload.${id}.ns.${idx}.key`,
              style: { padding: "5px 8px", fontSize: "11px" },
              value: k, placeholder: "key",
              oninput: e => {
                const newKey = e.target.value;
                const newNs = {};
                for (const [k2, v2] of nsEntries) newNs[k2 === k ? newKey : k2] = v2;
                updateWorkloadField(id, "scheduling.node_selector", newNs);
              },
            }),
          ]),
          el("div", { class: "field", style: { margin: 0 } }, [
            el("input", {
              "data-focus-key": `workload.${id}.ns.${idx}.value`,
              style: { padding: "5px 8px", fontSize: "11px" },
              value: v, placeholder: "value",
              oninput: e => updateWorkloadField(id, "scheduling.node_selector", { ...ns, [k]: e.target.value }),
            }),
          ]),
          el("button", {
            title: "삭제",
            style: {
              padding: "4px 8px", fontSize: "11px", lineHeight: "1",
              color: "var(--red)", border: "1px solid var(--border)",
              borderRadius: "4px", background: "var(--surface)",
              cursor: "pointer",
            },

    // GPU section — VRAM-based: workload은 node GPU의 VRAM을 소비하는 주체 (개수가 아닌 메모리).
    root.appendChild(el("div", { class: "section-title" }, ["GPU (선택) — VRAM 소비량 기준"]));
    const gpuModels = state.catalog.gpuModels;
    const gpuReq = reqs.gpu || {};
    // Models actually installed in this cluster's worker nodes.

    for (const nid of (cluster.node_ids || [])) {

          el("div", { class: "field", style: { margin: 0 } }, [

                  cur.target_storage_id = sid;

              el("option", { value: "custom", selected: currentValue === "custom" ? "" : null }, ["✎ (custom — edit storage_class manually)"]),

  else if (state.ui.workloadTab === "runtime") {
    const r = w.runtime || {};
    const presets = state.catalog.runtime || {};
    root.appendChild(el("div", { class: "field" }, [

      el("select", {
        onchange: e => {

          el("option", { value: "" }, ["(preset 선택…)"]),
          ...Object.keys(presets).map(k =>
            el("option", { value: k }, [`${k} — ${presets[k].framework || presets[k].language}`])),
        ]),
    ]));

    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        el("label", {}, ["Language"]),
        el("input", {
          "data-focus-key": `workload.${id}.runtime.language`,
          value: r.language || "",
          oninput: e => updateWorkloadField(id, "runtime.language", e.target.value),
        }),
      ]),
      el("div", { class: "field" }, [
        el("label", {}, ["Framework"]),
        el("input", {
          "data-focus-key": `workload.${id}.runtime.framework`,
          value: r.framework || "",
          oninput: e => updateWorkloadField(id, "runtime.framework", e.target.value),
        }),
      ]),
    ]));

    const conc = r.concurrency || {};
    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Concurrency model", "runtime.concurrency_model"),
        el("select", { onchange: e => updateWorkloadField(id, "runtime.concurrency.model", e.target.value || undefined) }, [
          el("option", { value: "" }, ["(none)"]),
          ...["thread-pool", "event-loop", "goroutine", "process-pool", "async-await"].map(v =>
            el("option", { value: v, selected: v === conc.model ? "" : null }, [v])),
        ]),
      ]),
      el("div", { class: "field" }, [
        lbl("Max threads / workers", "runtime.max_threads"),
        el("input", {
          "data-focus-key": `workload.${id}.runtime.threads`,
          type: "text", inputmode: "numeric", pattern: "[0-9]*",
          value: conc.max_threads != null ? conc.max_threads : (conc.workers != null ? conc.workers : ""),
          oninput: e => {
            const raw = e.target.value;
            const key = conc.model === "process-pool" ? "workers" : "max_threads";
            if (raw === "") return updateWorkloadField(id, `runtime.concurrency.${key}`, undefined);
            const v = parseIntInput(raw);
            if (v != null && v >= 1) updateWorkloadField(id, `runtime.concurrency.${key}`, v);
          },
        }),
      ]),
    ]));

    root.appendChild(el("div", { class: "field-row" }, [
      el("div", { class: "field" }, [
        lbl("Heap (GB)", "runtime.heap_gb"),
        el("input", {
          "data-focus-key": `workload.${id}.runtime.heap_gb`,
          type: "text", inputmode: "decimal", pattern: "[0-9]*\\.?[0-9]*",
          value: conc.heap_gb != null ? conc.heap_gb : "",
          oninput: e => {
            const raw = e.target.value;
            if (raw === "") return updateWorkloadField(id, "runtime.concurrency.heap_gb", undefined);
            const v = parseDecimalInput(raw);
            if (v != null && v > 0) updateWorkloadField(id, "runtime.concurrency.heap_gb", v);
          },
        }),
      ]),
      el("div", { class: "field" }, [
        lbl("DB max_connections", "runtime.max_connections"),
        el("input", {
          "data-focus-key": `workload.${id}.runtime.max_connections`,
          type: "text", inputmode: "numeric", pattern: "[0-9]*",
          value: r.max_connections != null ? r.max_connections : "",
          oninput: e => {
            const raw = e.target.value;
            if (raw === "") return updateWorkloadField(id, "runtime.max_connections", undefined);
